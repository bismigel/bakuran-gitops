# CI on the estate's own hardware (ADR 0015: Forgejo is the origin, GitHub is a push mirror).
#
# runs-on is a fact about the cluster, not a preference: the label is what the in-cluster runner registered with
# (manifests/base/forgejo-runner/runner.yaml). A label nobody hosts is a job that waits forever.
#
# WHAT IS NOT HERE, and why - silence about a missing check is how a check stops existing:
#   scan (trivy)      trivy is not in Alpine's repositories and the runner image has no download path pinned; ticket 14.3
#   renovate          needs a Forgejo platform token and a schedule; not a PR gate, and a job that pushes branches from
#                     inside CI is a different argument than a job that checks one
# The runner pod's toolset is declared in the Deployment, so a check that needs a new tool needs a manifest change too.
name: checks

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: in-cluster
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: yamllint every manifest
        run: python3 -m yamllint -c .yamllint manifests clusters

      - name: Image digests are pinned and current
        run: |
          bash scripts/check-image-digests.sh .

  layout:
    runs-on: in-cluster
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The rule lives in homelab-context as Go (ADR 0016). It is *cloned*, not copied: a second copy in this repository is
      # the shape ADR 0011 forbids, and the copy would drift from the one the rest of the estate runs. `http://forgejo:3000`
      # is the in-cluster Service - `git.bismigel.dev` is behind Cloudflare Access, so a pod cloning over the public name would
      # be handed the Access login page instead of a repository.
      # A token, because homelab-context is private: an anonymous clone answers 401 (measured from the runner pod with
      # `curl .../info/refs?service=git-upload-pack`, and the per-run token is scoped to *this* repository). `CONTEXT_READ_TOKEN`
      # is a read-only token for that one repository, stored as a repository secret so it never reaches a log or this file.
      - name: Check out the checks (executable code is Go, ADR 0016)
        run: git clone --depth=1 "http://oauth2:${{ secrets.CONTEXT_READ_TOKEN }}@forgejo:3000/bismigel/homelab-context.git" /tmp/ctx
      - name: Every Application points into the one manifest layout
        run: cd /tmp/ctx && CGO_ENABLED=0 go run ./cmd/check-manifest-layout --root "$GITHUB_WORKSPACE"
      - name: No object is defined twice
        run: bash scripts/check-duplicate-objects.sh
      # No server-side dry-run here, deliberately. The runner is a pod with the default service account and no RBAC -
      # that is a security property worth keeping, not a gap to close - so `kubectl apply --dry-run=server` answers
      # "Forbidden" and the job fails for a reason that has nothing to do with the manifests being wrong. The templates
      # are still validated server-side, on the workstation, before the PR: that is where cluster credentials live.
