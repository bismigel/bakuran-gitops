# The image scan: the check whose absence had the sharpest edge in the migration, because policy/scan-baseline.json
# holds 218 CRITICAL findings across 34 images as a ratchet and the only thing enforcing it was a GitHub workflow that
# can no longer run.
#
# Runs on PRs that can change an image reference, not on every PR: scanning 48 images pulls every manifest and takes
# minutes, and a documentation change cannot move a digest.
name: scan

on:
  # Deliberately NOT path-filtered, and this cost a blocked PR to learn: `scan / images` is one of the required checks on
  # main, and a required check that does not run is a PR that can never merge. A README-only change sat with three
  # successes and one context that would never arrive.
  #
  # The filter was there to save time. The trivy database and image layers persist in the runner pod, so a warm scan is
  # ~60 s against a cold 500 s - cheap enough that correctness wins.
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    # The run token may read the repository and nothing else. A check that needed to write would be a check whose
    # failure mode is a commit.
    permissions:
      contents: read
    # The artefact this job runs (story 15.11). One line, bumped in a pull request.
    env:
      CHECKS_REF: sha-00ce83f15ebf
    runs-on: in-cluster
    timeout-minutes: 30
    steps:
      # Pinned by commit, not by tag: a tag is a pointer the action's owner can move, and this step runs on every PR.
      # `persist-credentials: false` because the run token is otherwise left in .git/config for the next step to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - name: trivy is present and pinned
        run: trivy --version
      # Exits 1 on a finding that is not in the baseline, and also on a baseline entry for an image no longer deployed,
      # so the recorded debt can only go down. Any exception still needs an owner and an expiry in scan-policy.yaml.
      # The ratchet is Go (ADR 0016) and lives in homelab-context; `trivy` is the only external tool, and it is the runner's.
      - name: Fetch the checks image (pinned by commit tag)
        env:
          READ_TOKEN: ${{ secrets.CHECKS_READ_TOKEN }}
          REF: ${{ env.CHECKS_REF }}
        run: |
          set -eu
          D="/tmp/checks-${GITHUB_RUN_ID:-0}-${GITHUB_JOB:-job}"
          rm -rf "$D"; mkdir -p "$D"
          R="forgejo:3000"
          # Bearer grant -> manifest -> its single layer -> extract. curl and tar are the whole toolchain: the runner has
          # no docker/podman/skopeo, and `set -eu` makes a 401 a failed job rather than a green one over an empty dir.
          tok=$(curl -sf -u "bismigel:$READ_TOKEN" \
            "http://$R/v2/token?service=container_registry&scope=repository:bismigel/checks:pull" \
            | sed 's/.*"token":"\([^"]*\)".*/\1/')
          [ -n "$tok" ] || { echo "no registry token: is CHECKS_READ_TOKEN set for this repository?"; exit 1; }
          layer=$(curl -sf -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "http://$R/v2/bismigel/checks/manifests/$REF" \
            | sed 's/.*"digest":"\(sha256:[a-f0-9]*\)".*/\1/')
          [ -n "$layer" ] || { echo "no layer in the manifest for $REF"; exit 1; }
          curl -sf -H "Authorization: Bearer $tok" \
            "http://$R/v2/bismigel/checks/blobs/$layer" -o "$D/layer.tar"
          tar -xf "$D/layer.tar" -C "$D" && rm -f "$D/layer.tar"
          cat "$D/bin/BUILD"
      - name: Every image is no worse than it was on 2026-11-15
        run: |
          D="/tmp/checks-${GITHUB_RUN_ID:-0}-${GITHUB_JOB:-job}"
          "$D/bin/scan-images" \
            --root "$GITHUB_WORKSPACE" \
            --policy "$GITHUB_WORKSPACE/policy/scan-policy.yaml" \
            --baseline "$GITHUB_WORKSPACE/policy/scan-baseline.json"
