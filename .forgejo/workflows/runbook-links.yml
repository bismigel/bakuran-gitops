# Every alert's runbook_url must point at a page and an anchor that exist. The pages live in another repository, so
# this job checks out both - which is exactly why the check cannot run in a single-repo GitHub runner either.
name: runbook-links

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    # The run token may read the repository and nothing else.
    permissions:
      contents: read
    # The artefact this job runs (story 15.11). One line, bumped in a pull request.
    env:
      CHECKS_REF: sha256:10ef515f5bce06605158c5389d2e3025326e60dd79d075a4fd75b7976a8e4761
    runs-on: in-cluster
    timeout-minutes: 10
    steps:
      # Pinned by commit, not by tag: a tag is a pointer the action's owner can move, and this step runs on every PR.
      # `persist-credentials: false` because the run token is otherwise left in .git/config for the next step to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      # The pages live in another repository, and `actions/checkout` with `repository:` needs a token scoped to *that*
      # repo - the runner's own token is scoped to this one, so it fails with "The target couldn't be found". An
      # anonymous clone does not work either: this instance sets REQUIRE_SIGNIN_VIEW = true, so the clone hangs waiting
      # for credentials until the job times out. Hence a read:repository token, stored as SITE_TOKEN.
      # Pinned by commit, not by tag: a tag is a pointer the action's owner can move, and this step runs on every PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          repository: bismigel/bismigel-site
          token: ${{ secrets.SITE_TOKEN }}
          path: site
          # The token for *this* repository is not this step's business, so it is not persisted.
          persist-credentials: false
      # The check itself is Go, in homelab-context (ADR 0016), and cloned rather than copied: this file used to be a copy
      # with a comment saying "change both", which is the arrangement ADR 0011 exists to prevent. The copy is why its header
      # claimed bismigel-site was public and needed no token while this workflow was using SITE_TOKEN above.
      - name: Fetch the checks image (pinned by digest)
        env:
          READ_TOKEN: ${{ secrets.CHECKS_READ_TOKEN }}
          REF: ${{ env.CHECKS_REF }}
        run: |
          set -eu
          D="/tmp/checks-${GITHUB_RUN_ID:-0}-${GITHUB_JOB:-job}"
          rm -rf "$D"; mkdir -p "$D"
          R="forgejo:3000"
          # Bearer grant -> manifest -> its single layer -> extract. curl and tar are the whole toolchain: the runner has
          # no docker/podman/skopeo, and `set -eu` makes a 401 a failed job rather than a green one over an empty dir.
          tok=$(curl -sf -u "bismigel:$READ_TOKEN" \
            "http://$R/v2/token?service=container_registry&scope=repository:bismigel/checks:pull" \
            | sed 's/.*"token":"\([^"]*\)".*/\1/')
          [ -n "$tok" ] || { echo "no registry token: is CHECKS_READ_TOKEN set for this repository?"; exit 1; }
          layer=$(curl -sf -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "http://$R/v2/bismigel/checks/manifests/$REF" \
            | sed 's/.*"digest":"\(sha256:[a-f0-9]*\)".*/\1/')
          [ -n "$layer" ] || { echo "no layer in the manifest for $REF"; exit 1; }
          curl -sf -H "Authorization: Bearer $tok" \
            "http://$R/v2/bismigel/checks/blobs/$layer" -o "$D/layer.tar"
          tar -xf "$D/layer.tar" -C "$D" && rm -f "$D/layer.tar"
          cat "$D/bin/BUILD"
      - name: Check the alert -> runbook links
        run: |
          D="/tmp/checks-${GITHUB_RUN_ID:-0}-${GITHUB_JOB:-job}"
          "$D/bin/check-runbook-links" --gitops "$GITHUB_WORKSPACE" --site "$GITHUB_WORKSPACE/site"
