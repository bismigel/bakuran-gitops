# Every alert's runbook_url must point at a page and an anchor that exist. The pages live in another repository, so
# this job checks out both - which is exactly why the check cannot run in a single-repo GitHub runner either.
name: runbook-links

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    runs-on: in-cluster
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The pages live in another repository, and `actions/checkout` with `repository:` needs a token scoped to *that*
      # repo - the runner's own token is scoped to this one, so it fails with "The target couldn't be found". An
      # anonymous clone does not work either: this instance sets REQUIRE_SIGNIN_VIEW = true, so the clone hangs waiting
      # for credentials until the job times out. Hence a read:repository token, stored as SITE_TOKEN.
      - uses: actions/checkout@v4
        with:
          repository: bismigel/bismigel-site
          token: ${{ secrets.SITE_TOKEN }}
          path: site
      # The check itself is Go, in homelab-context (ADR 0016), and cloned rather than copied: this file used to be a copy
      # with a comment saying "change both", which is the arrangement ADR 0011 exists to prevent. The copy is why its header
      # claimed bismigel-site was public and needed no token while this workflow was using SITE_TOKEN above.
      - name: Check out the checks (executable code is Go, ADR 0016)
        run: |
          CTX="/tmp/ctx-${GITHUB_RUN_ID:-0}-${GITHUB_JOB:-job}"
          rm -rf "$CTX"
          git clone --depth=1 "http://oauth2:${{ secrets.CONTEXT_READ_TOKEN }}@forgejo:3000/bismigel/homelab-context.git" "$CTX"
      - name: Check the alert -> runbook links
        run: |
          CTX="/tmp/ctx-${GITHUB_RUN_ID:-0}-${GITHUB_JOB:-job}"
          cd "$CTX" && CGO_ENABLED=0 go run ./cmd/check-runbook-links --gitops "$GITHUB_WORKSPACE" --site "$GITHUB_WORKSPACE/site"
