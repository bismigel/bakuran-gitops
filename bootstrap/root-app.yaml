apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:bismigel/bakuran-gitops.git
    targetRevision: main
    path: applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # ArgoCD adds `pre-delete-finalizer.argocd.argoproj.io[/cleanup]` finalizers to
  # any child Application whose manifests contain a PreDelete hook (e.g. longhorn).
  # Those finalizers can't be removed by a sync, so without this the app-of-apps
  # sees the child as perpetually OutOfSync and re-syncs it in a loop.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
