# ArgoCD manages itself — the safe version of #108.
#
# What actually broke in #108/#109:
#   The Application carried `resources-finalizer.argocd.argoproj.io`. The root
#   app-of-apps runs with prune:true, so merging the revert deleted THIS
#   Application, and the finalizer cascaded that deletion onto every resource it
#   owned — including the ArgoCD Services. The controller and pods kept running,
#   but `argocd-repo-server` lost its endpoints, so no component could compare
#   against git. All 30 Applications went Sync=Unknown and GitOps stopped.
#
# The four rules this file encodes:
#   1. NO resources-finalizer. Deleting this Application must never delete ArgoCD.
#   2. prune:false. If a future chart version drops or renames an object, ArgoCD
#      reports it OutOfSync instead of deleting a live control-plane object.
#      selfHeal:true still reverts drift on the objects the chart does render.
#   3. configs.cm / configs.secret are not created by the chart (bootstrap owns
#      them) so admin credentials, SSO and repo creds are never touched.
#   4. sync-wave 5: converges after namespaces and any CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.5
    helm:
      releaseName: argocd
      values: |
        global:
          domain: argocd.bismigel.dev
        configs:
          cm:
            create: false
          secret:
            createSecret: false
          params:
            server.insecure: true
        controller:
          replicas: 2
        server:
          replicas: 2
          ingress:
            enabled: true
            ingressClassName: nginx-admin
            hostname: argocd.bismigel.dev
            path: /
            tls: false
        repoServer:
          replicas: 2
        applicationSet:
          replicas: 2
        redis-ha:
          enabled: true
          redis:
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
          haproxy:
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Intentionally no finalizer block. See rule 1 above.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
