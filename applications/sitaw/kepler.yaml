apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kepler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://sustainable-computing-io.github.io/kepler-helm-chart
    chart: kepler
    targetRevision: 0.6.2
    helm:
      values: |
        # NixOS has no /usr/src (the chart mounts it with type: Directory).
        canMount:
          usrSrc: false
        extraEnvVars:
          ENABLE_GPU: "false"            # no CUDA GPU here (QSV iGPU only)
          EXPOSE_HW_COUNTER_METRICS: "true"
          ENABLE_EBPF_CGROUPID: "false"  # avoid eBPF/BTF dependency
  destination:
    server: https://kubernetes.default.svc
    namespace: kepler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
