apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.20.3
    helm:
      releaseName: cilium
      values: |
        k8sServiceHost: 192.168.2.82
        k8sServicePort: "6443"
        kubeProxyReplacement: "false"
        routingMode: tunnel
        tunnelProtocol: vxlan
        ipv4:
          enabled: true
        ipv6:
          enabled: false
        ipam:
          mode: kubernetes
        cni:
          customConf: true
          configMap: cilium-cni-config
          confPath: /etc/cni/net.d
          binPath: /opt/cni/bin
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: false
        operator:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
