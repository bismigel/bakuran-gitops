apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.13.0
    helm:
      values: |
        # Requests only, sized from observed usage (2026-10-28).
        longhornManager: { resources: { requests: { cpu: 20m, memory: 128Mi } } }
        longhornUI: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
        defaultSettings:
          # Two replicas so a volume survives losing one node.
          defaultReplicaCount: 2
        # The chart's pre-upgrade Job is a Helm hook that ArgoCD runs on first
        # install before longhorn-service-account exists -> disable it.
        preUpgradeChecker:
          jobEnabled: false
        persistence:
          # Don't make Longhorn the cluster default; existing PVCs pin
          # storageClassName explicitly and we migrate deliberately.
          defaultClass: false
          # StorageClass replica count (chart defaults to 3; we have 2
          # schedulable nodes, so 2 avoids a permanently-degraded replica).
          defaultClassReplicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      # Longhorn mutates its own Setting/ConfigMap resources at runtime;
      # self-heal fights that (API conflicts). Sync on git changes only.
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      # Longhorn CRDs exceed the 262144-byte annotation limit; use SSA.
      - ServerSideApply=true
