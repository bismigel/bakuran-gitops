apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-admin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          # Separate trust zone for admin/browser surfaces. The Cloudflare
          # tunnel will point admin hostnames at this loopback NodePort.
          # REQUIRED, not preferred. With a soft rule both replicas landed on
          # sitaw-amd, so 'two replicas' protected against a pod crash and not
          # against losing that node - and the connector on the other host had
          # no endpoint left to reach (found 2026-10-28).
          # maxSurge/maxUnavailable 1 so a rollout still progresses when only
          # two nodes are schedulable: the old pod leaves and frees its node.
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 1
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ingress-nginx
                      app.kubernetes.io/component: controller
          config:
            # The origin is loopback-only; cloudflared is the only client.
            use-forwarded-headers: "true"
          service:
            type: NodePort
            enableHttps: false
            nodePorts:
              http: 32081
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx-admin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
