apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.5
    helm:
      releaseName: argocd
      values: |
        global:
          domain: argocd.bismigel.dev
        configs:
          cm:
            create: false
          secret:
            createSecret: false
          params:
            server.insecure: true
        controller:
          replicas: 2
        server:
          replicas: 2
          ingress:
            enabled: true
            ingressClassName: nginx-admin
            hostname: argocd.bismigel.dev
            path: /
            tls: false
        repoServer:
          replicas: 2
        applicationSet:
          replicas: 2
        redis-ha:
          enabled: true
          redis:
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
          haproxy:
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
