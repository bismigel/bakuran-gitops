apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          # Two replicas, spread across nodes, so the edge survives losing a node
          # (matches the two cloudflared connectors).
          replicaCount: 2
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: ingress-nginx
                        app.kubernetes.io/component: controller
          config:
            proxy-set-headers: "ingress-nginx/headers"
            # Trust the real client IP that cloudflared forwards (the ingress is
            # loopback-only, so only cloudflared reaches it). Lets Jellyfin see
            # remote clients as remote instead of as the ingress pod IP.
            use-forwarded-headers: "true"
          service:
            type: NodePort
            # TLS terminates at Cloudflare; the origin leg is HTTP and no Ingress
            # uses tls:, so the https port is disabled (drop the dead 32443).
            enableHttps: false
            nodePorts:
              http: 32080
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
