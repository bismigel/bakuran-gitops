apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-headers-media
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:bismigel/bakuran-gitops.git
    targetRevision: main
    path: manifests/ingress-headers
  destination:
    name: calamansi-intel
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
