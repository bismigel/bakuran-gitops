apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-media
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          # Same NodePort as the hosting cluster so each box can serve the tunnel
          # via its own ingress (127.0.0.1:32080). This makes the edge HA: either
          # node can serve ingress-originated traffic.
          config:
            proxy-set-headers: "ingress-nginx/headers"
          service:
            type: NodePort
            nodePorts:
              http: 32080
              https: 32443
  destination:
    name: calamansi-intel
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
