# Staging's books stack: the same five manifests production runs, minus
# production's workarounds and minus work that has no meaning here.
#
# What differs, and why:
#   * no `bakuran.dev/rollout` annotation — that exists to unstick a ReplicaSet in
#     production, it is not part of the workload's definition;
#   * the nightly Kavita rescan CronJob is SUSPENDED — staging's library is a
#     fixture, so a rescan proves nothing and burns the guest's CPU.
#
# What deliberately does NOT differ: images, probes, env, volumes, replicas (the
# base already runs one of each). If staging passed with different images it would
# prove nothing about production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/books
patches:
  - target:
      kind: CronJob
      name: kavita-scan
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
