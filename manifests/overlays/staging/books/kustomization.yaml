# Staging's books stack: the same five manifests production runs, minus
# production's assumptions, plus the two things this cluster does not have.
#
# What differs, and why:
#   * no `bakuran.dev/rollout` annotation — that exists to unstick a ReplicaSet in
#     production; it is not part of the workload's definition;
#   * the nightly Kavita rescan CronJob is SUSPENDED — staging's library is a
#     fixture, so a rescan proves nothing and burns the guest's CPU;
#   * storage class `local-path` (production uses Longhorn);
#   * the media pool. The base mounts /mnt/media/books, /mnt/media/audiobooks and
#     /mnt/media with hostPath `type: Directory`, which fails closed — correct in
#     production, useless where there is no pool. Those volumes become emptyDir.
#
# What deliberately does NOT differ: images (same digests as production), probes,
# env, replicas. If staging passed with different ones it would prove nothing.
#
# Volume indices are explicit because JSON patches address arrays by position:
#   audiobookshelf  [0]=config(PVC) [1]=audiobooks(hostPath)
#   kavita          [0]=config(PVC) [1]=books(hostPath)
#   lazylibrarian   [0]=config(PVC) [1]=patched-app(emptyDir) [2]=books [3]=downloads
#
# Each replacement is preceded by a `test` of that slot's volume *name*, so a
# reordering in the base FAILS THE BUILD ("testing value ... failed: test failed")
# instead of silently emptying the wrong volume — e.g. dropping the `config` PVC and
# booting a workload with no state. Kustomize's in-element `$patch: replace` was tried
# first and rejected: on a list it leaves the original field in place (hostPath) and
# only reorders, which is a worse trap than an index because it looks like it worked.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/books
patches:
  - target:
      kind: CronJob
      name: kavita-scan
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: Deployment
      name: audiobookshelf
    patch: |-
      # The libraries are one NFS volume in the base now (ADR 0011); staging has no .82 to mount, so the single
      # `media` volume becomes an emptyDir. One substitution, not three per app.
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: media
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: media
          emptyDir: {}
  - target:
      kind: Deployment
      name: kavita
    patch: |-
      # The libraries are one NFS volume in the base now (ADR 0011); staging has no .82 to mount, so the single
      # `media` volume becomes an emptyDir. One substitution, not three per app.
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: media
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: media
          emptyDir: {}
  - target:
      kind: Deployment
      name: lazylibrarian
    patch: |-
      # The libraries are one NFS volume in the base now (ADR 0011); staging has no .82 to mount, so the single
      # `media` volume becomes an emptyDir. One substitution, not three per app.
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: media
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: media
          emptyDir: {}
      # The libraries are one NFS volume in the base now (ADR 0011); staging has no .82 to mount, so the single
      # `media` volume becomes an emptyDir. One substitution, not three per app.
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: media
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: media
          emptyDir: {}
