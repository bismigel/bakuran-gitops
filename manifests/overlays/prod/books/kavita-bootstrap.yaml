# Kavita's first-run, declaratively.
#
# Why this exists: Kavita's admin account lives only in its SQLite database, so a
# fresh config volume means the UI asks for a new admin account and every API call
# answers 401 — including `kavita-scan`, which nightly leaves a failed Job behind
# and marks the whole Application Degraded. On 2026-10-29 that is exactly what
# happened, and the account had to be re-created by hand.
#
# Idempotent by construction:
#   1. log in with the credentials that already exist in `kavita-secrets`
#   2. if that works, do nothing
#   3. if it does not, register the first user (which Kavita treats as the admin)
#   4. verify the login afterwards, and fail loudly if it still does not work
#
# Step 4 matters: if the account exists with a *different* password, register
# returns 400 ("username taken") and this Job fails — which is correct, because
# that is a credential mismatch a human has to resolve, not something to paper over.
#
# Runs as an ordinary Job at sync-wave 5, after the ExternalSecrets have reconciled.
#
# It was a PreSync hook until 2026-11-25, and that became a deadlock the day
# `kavita-secrets` stopped being a hand-applied Secret and became an ExternalSecret:
# hooks run *before* any wave is applied, so the Job waited on a Secret that only the
# sync it was blocking could create. The Application sat at
#
#   Running: waiting for completion of hook batch/Job/kavita-bootstrap
#
# while the pod failed with `secret "kavita-secrets" not found` - nothing in the books
# namespace was applied at all, for as long as nobody looked.
#
# A wave Job solves both problems: it runs after the Secret exists (wave 5 vs the
# ExternalSecrets at wave 0), and unlike a PostSync hook it is applied even when
# another resource in the app is Degraded - which was the original reason for choosing
# PreSync (a CronJob with a failed last run used to block PostSync).
#
# Lives in the *overlay*, not the base: it depends on this environment's credential,
# and staging deliberately has no `kavita-secrets`.
apiVersion: batch/v1
kind: Job
metadata:
  name: kavita-bootstrap
  namespace: books
  annotations:
    # Wave 5: after the ExternalSecrets (wave 0) have written `kavita-secrets`, so the
    # pod's secretKeyRef resolves on a fresh cluster too. Not a hook - see the header.
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      # Same placement as the scan Job: this is a client of Kavita, not the app.
      nodeSelector:
        homelab.io/media-pool: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: KAVITA_URL
              value: http://kavita.books.svc.cluster.local:5000
            - name: KAVITA_USER
              value: gio
            - name: KAVITA_PASSWORD
              valueFrom:
                secretKeyRef: { name: kavita-secrets, key: kavita-admin-password }
            # Ciceley's password comes from the ExternalSecret next to this file.
            # `optional: true` on purpose: until the Bitwarden key exists the Secret
            # is absent, and a missing optional env must NOT fail the hook (it
            # already blocked a sync once when it failed for a benign reason).
            - name: CICELEY_USER
              value: ciceley
            - name: CICELEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kavita-ciceley-secrets
                  key: kavita-ciceley-password
                  optional: true
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              body() {
                printf '{"username":"%s","password":"%s"}' "$KAVITA_USER" "$KAVITA_PASSWORD"
              }
              login() {
                curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                  -X POST "$KAVITA_URL/api/Account/login" \
                  -H 'Content-Type: application/json' -d "$(body)"
              }

              token() {
                curl -sS --max-time 20 -X POST "$KAVITA_URL/api/Account/login" \
                  -H 'Content-Type: application/json' -d "$(body)" \
                | sed -n 's/.*"token":"\([^"]*\)".*/\1/p'
              }

              # A wiped config volume takes the library with it: the DB is the only
              # place it exists. `kavita-scan` scans libraryId=1, so the library has
              # to exist for the nightly job to mean anything.
              #
              # The payload is not guesswork - it is UpdateLibraryDto from Kavita
              # v0.9.1.4: type 2 = Book, fileGroupTypes [1,2,3] = Archive/Epub/Pdf,
              # and metadataProvider 2 (Hardcover) because a Book library rejects an
              # empty provider with "The field MetadataProvider is invalid".
              ensure_library() {
                tok=$(token)
                # Do NOT gate on GET /api/Library: on v0.9.1.4 it answers 204 with an
                # empty body even when a library exists, so trusting it made this
                # hook retry the create and fail with 400 "library-name-exists".
                # The create response itself is the reliable signal.
                echo "attempting library create (idempotent)"
                payload='{"name":"Books","type":2,"folders":["/books"],"fileGroupTypes":[1,2,3],"excludePatterns":[],"folderWatching":true,"includeInDashboard":true,"manageCollections":true,"manageReadingLists":true,"allowScrobbling":true,"allowMetadataMatching":true,"enableMetadata":true,"metadataProvider":2,"removePrefixForSortName":false,"inheritWebLinksFromFirstChapter":false}'
                resp=$(curl -sS -w '\nHTTP:%{http_code}' --max-time 30 \
                  -X POST "$KAVITA_URL/api/Library/create" \
                  -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' -d "$payload")
                code=$(printf '%s' "$resp" | sed -n 's/.*HTTP:\([0-9]*\)$/\1/p')
                case "$code" in
                  200) echo "library created" ;;
                  400)
                    # Kavita returns the *localised message*, not the resource key:
                    #   "Library name already exists. Please choose a unique name to the server."
                    # Match both shapes; a PreSync hook that fails on a benign clash
                    # blocks the very sync it is meant to unblock.
                    case "$resp" in
                      *"already exists"*|*library-name-exists*) echo "library already present; nothing to do" ;;
                      *) echo "ERROR: library create rejected (400), but not for a name clash:"; printf '%s\n' "$resp" | head -c 300; exit 1 ;;
                    esac ;;
                  *) echo "ERROR: library create returned ${code:-nothing}"; printf '%s\n' "$resp" | head -c 300; exit 1 ;;
                esac
              }

              # Her account is not created here when it is missing: this runs with
              # `optional: true` credentials, and an account created from an absent
              # password is worse than a loud failure. What this *does* guarantee is
              # that the password in Bitwarden is the password Kavita accepts — both
              # for the account restored from backup and for one an admin made by
              # hand. Reset is the admin endpoint `POST /api/Account/reset-password`.
              ensure_ciceley() {
                if [ -z "${CICELEY_PASSWORD:-}" ]; then
                  echo "ciceley: no password in Bitwarden (kavita-ciceley-password); skipping"
                  return 0
                fi
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                  -X POST "$KAVITA_URL/api/Account/login" \
                  -H 'Content-Type: application/json' \
                  -d "$(printf '{"username":"%s","password":"%s"}' "$CICELEY_USER" "$CICELEY_PASSWORD")")
                if [ "$code" = "200" ]; then
                  echo "ciceley: password already matches Bitwarden"
                  return 0
                fi
                echo "ciceley: login is $code; resetting to the Bitwarden password"
                tok=$(token)
                payload=$(printf '{"userName":"%s","password":"%s"}' "$CICELEY_USER" "$CICELEY_PASSWORD")
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                  -X POST "$KAVITA_URL/api/Account/reset-password" \
                  -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' -d "$payload")
                echo "ciceley: reset HTTP $code"
                [ "$code" = "200" ] || { echo "ERROR: reset failed"; exit 1; }
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                  -X POST "$KAVITA_URL/api/Account/login" \
                  -H 'Content-Type: application/json' \
                  -d "$(printf '{"username":"%s","password":"%s"}' "$CICELEY_USER" "$CICELEY_PASSWORD")")
                [ "$code" = "200" ] || { echo "ERROR: login still $code after reset"; exit 1; }
                echo "ciceley: password set and verified"
              }

              # Kavita can take a moment to answer after a restart; wait for it
              # rather than failing the sync on a race.
              i=0
              until [ "$(login)" = "401" ] || [ "$(login)" = "200" ]; do
                i=$((i + 1)); [ "$i" -ge 30 ] && { echo "ERROR: Kavita never answered at $KAVITA_URL"; exit 1; }
                sleep 2
              done

              if [ "$(login)" = "200" ]; then
                echo "admin account already works"
                ensure_library
                ensure_ciceley
                exit 0
              fi

              echo "no working login; registering the first (admin) user $KAVITA_USER"
              code=$(curl -sS -o /tmp/reg -w '%{http_code}' --max-time 20 \
                -X POST "$KAVITA_URL/api/Account/register" \
                -H 'Content-Type: application/json' -d "$(body)")
              echo "register HTTP $code"
              if [ "$code" != "200" ]; then
                echo "ERROR: register failed; the account may exist with a different password"
                head -c 300 /tmp/reg || true
                exit 1
              fi

              if [ "$(login)" != "200" ]; then
                echo "ERROR: registered but login still fails"
                exit 1
              fi
              echo "admin account created and verified"
              ensure_library
              ensure_ciceley
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
