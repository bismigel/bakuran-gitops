# Ciceley's Kavita password, from Bitwarden.
#
# Why a separate Secret rather than extending `kavita-secrets`: that one is
# hand-applied today, and pointing an ExternalSecret at the same name would let a
# failed ESO sync blank the *admin* credential. A separate object fails on its own.
#
# The Bitwarden key it reads is `kavita-ciceley-password` (BWS project the
# ClusterSecretStore already uses). Until that key exists, ESO reports an error on
# this object and `kavita-ciceley-secrets` does not appear — the bootstrap hook
# then skips her account (its env is `optional: true`) instead of failing the sync.
#
# Created 2026-10-29 after a wiped Kavita config volume: her account was restored
# from backup metadata, so this exists to *set a known password*, not to recreate
# the account — and to keep it set if the volume is ever lost again.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kavita-ciceley-password
  namespace: books
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: kavita-ciceley-secrets
    creationPolicy: Owner
  data:
    - secretKey: kavita-ciceley-password
      remoteRef:
        key: kavita-ciceley-password
