# The Kavita admin password, from Bitwarden.
#
# This was the last Secret in the cluster that nothing reconciled: it was written by
# `bakuran-infra/scripts/lazylibrarian-secrets.sh`, which pulled
# `kavita-admin-password` from Bitwarden and `kubectl apply`-ed it by hand. The
# Kavita config volume was recreated on 2026-10-28 and restored from backup on
# 2026-10-29, and the only reason the credential still matched was that nobody had
# re-run the script since. A hand-written Secret has no state anyone can check, which
# is how the same class of rot went unnoticed in `kavita-ciceley-password`.
#
# Consumers: the nightly `kavita-scan` CronJob and the `kavita-bootstrap` PreSync
# hook, both via secretKeyRef `kavita-secrets` / `kavita-admin-password`.
#
# `creationPolicy: Owner` deliberately ADOPTS the existing Secret rather than
# replacing it: ESO updates the value in place and adds its ownerRef, so no consumer
# ever observes the Secret missing. Verified 2026-10-29 that the value ESO writes is
# byte-identical to the hand-applied one (sha256 prefix 0ac1bb6ae6da1667) — if that
# stops being true, the Bitwarden key and the cluster have diverged and logins break.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kavita-secrets
  namespace: books
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: kavita-secrets
    creationPolicy: Owner
  data:
    - secretKey: kavita-admin-password
      remoteRef:
        key: kavita-admin-password
