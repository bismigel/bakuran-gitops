# The LazyLibrarian credentials, from Bitwarden.
#
# Same story as `kavita-secrets`, and the last of it: this Secret was written by
# `bakuran-infra/scripts/lazylibrarian-secrets.sh`, which pulled four keys from
# Bitwarden and `kubectl apply`-ed them by hand. That script's own header claimed
# "the books namespace has NO External Secrets operator, so this is applied out of
# band" - which stopped being true the moment the `bitwarden` ClusterSecretStore
# existed, since a ClusterSecretStore is available in every namespace.
#
# Keys and their consumers:
#   prowlarr-api-key        the [Newznab_*] host/api pairs the init container writes
#                           into /config/config.ini on every pod start (LazyLibrarian
#                           searches through Prowlarr because NZBGeek's Cloudflare
#                           rejects its python-requests signature with HTTP 403 1010)
#   qbt-password            required by that same init container for the torrent path
#   lazylibrarian-api-key   LazyLibrarian's own API, used by the media tooling
#   sabnzbd-api-key         the Usenet download client
#
# `creationPolicy: Owner` adopts the existing Secret in place, so the init container
# on a running pod can never observe it missing. Verified 2026-10-29 that all four
# values are unchanged after ESO took ownership.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lazylibrarian-secrets
  namespace: books
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: lazylibrarian-secrets
    creationPolicy: Owner
  data:
    - secretKey: prowlarr-api-key
      remoteRef:
        key: prowlarr-api-key
    - secretKey: qbt-password
      remoteRef:
        key: qbittorrent-password
    - secretKey: lazylibrarian-api-key
      remoteRef:
        key: lazylibrarian-api-key
    - secretKey: sabnzbd-api-key
      remoteRef:
        key: sabnzbd-api-key
