# Production placement for the media stack.
#
# This is the ONLY thing that differs between clusters: where the pods may run.
# Everything else comes from ../../../base/media untouched.
#
# Placement is by *capability*, not hostname:
#   homelab.io/media-pool = /mnt/media exists on this node
#   homelab.io/qsv        = Intel QuickSync available for transcoding
# so moving the pool is a label flip, not a manifest rewrite.
#
# Only the pods that touch the pool or the GPU are pinned. flaresolverr,
# media-mcp and recyclarr touch neither, so they may run anywhere (a blanket rule
# pinned every media pod to .81 until 2026-10-28).
#
# This does not make the stack survive losing .81: with hostPath type=Directory a
# pool pod scheduled elsewhere fails to start rather than serving an empty
# library. See HIGH-AVAILABILITY.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/media
patches:
  - target:
      kind: Deployment
      name: (sonarr|radarr|prowlarr|bazarr|qbittorrent|sabnzbd)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          homelab.io/media-pool: "true"
  # `homelab.io/qsv` restored (the rehearsal commit is reverted). The rehearsal found that the QuickSync label was
  # never the blocker: `homelab.io/media-pool` exists **only on `.81`**, so with `.81` cordoned the pod is unschedulable
  # no matter what else is dropped — "0/3 nodes are available: 1 unschedulable, 2 didn't match". Jellyfin becomes
  # movable when a second node mounts `/mnt/media` and carries that label (story 8.3's remaining prerequisite, in
  # bakuran-infra), not by changing this pin.
  - target:
      kind: Deployment
      name: jellyfin
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          # `media-pool` dropped on 2026-11-05 (story 8.3). It meant "this node has /mnt/media", and that stopped being
          # what Jellyfin needs when its media volume became an in-pod NFS mount (`nfs: 192.168.2.82:/mnt/media`): the
          # pod mounts the export itself and does not care which node it lands on.
          #
          # It was also the last thing keeping Jellyfin single-node — `media-pool` exists only on `.81`, so with `.81`
          # cordoned the pod sat Pending: "0/3 nodes are available: 2 didn't match Pod's node affinity/selector". The
          # GPU capability is the real requirement, and it now exists on two nodes.
          homelab.io/qsv: "true"
