# Immich's database as a CloudNativePG cluster — story 8.2, the one app where losing data is not
# acceptable.
#
# Deliberately NOT wired yet. The order is the same one that worked for Forgejo (8.5), and it matters
# more here because the verify is asset-count equality rather than "it serves":
#   1. this cluster comes up empty and healthy, two instances, replication streaming;
#   2. the old database is dumped and restored into it;
#   3. the asset count is compared with the live one;
#   4. only then immich-server's DB_HOSTNAME points at `immich-pg-rw`;
#   5. the old StatefulSet is removed from git, last.
#
# Three constraints measured 2026-11-05 that make this a different job from Forgejo's:
#
#   * Immich needs `vchord` and `vector` (pgvector) — the schema has `vector` and `vector(512)`
#     columns — so the image must be Immich's own build, not a CNPG community one;
#   * the app role is a **superuser** in the current setup (`rolsuper = t`) because Immich creates its
#     extensions at startup, and a CNPG bootstrap owner is not a superuser. The extensions therefore
#     have to exist *before* Immich first connects, created here as superuser via
#     `postInitApplicationSQL`. Without this, Immich's migrations die on `CREATE EXTENSION`.
#   * Postgres **14**, not 16: the image tags and the data directory agree, and a major-version jump
#     is not part of making it HA.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
spec:
  instances: 2
  # Immich's own Postgres build, pinned by the digest already in use, so the extensions exist.
  imageName: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
  primaryUpdateStrategy: unsupervised

  storage:
    storageClass: longhorn
    size: 10Gi

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db
      # Created as superuser, before the app owner can be asked to. An extension is database-scoped and
      # `CREATE EXTENSION` normally needs superuser, which the bootstrap owner deliberately is not.
      # `vector` is the name Immich's image registers for pgvector; both are in this image.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE;
        - CREATE EXTENSION IF NOT EXISTS unaccent CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp" CASCADE;

  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "192MB"

  monitoring:
    enablePodMonitor: true

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
