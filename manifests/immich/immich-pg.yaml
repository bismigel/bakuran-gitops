# Immich's database as a CloudNativePG cluster — story 8.2, the one app where losing data is not
# acceptable. Retried 2026-11-05 after `network-policies/allow-apiserver-egress.yaml` solved the bootstrap's
# inability to reach the API server from a default-deny namespace.
#
# Still NOT wired: the order that worked for Forgejo (8.5), and it matters more here because the verify is
# asset-count equality rather than "it serves". Cluster healthy and empty, then the data, then the count,
# then the app's DB_HOSTNAME, then the old StatefulSet last.
#
# Three constraints measured 2026-11-05:
#   * Immich needs `vchord` and `vector` — the schema has `vector` and `vector(512)` columns — so this uses
#     Immich's own Postgres build, pinned by the digest already in use, not a CNPG community image;
#   * the app role is a **superuser** today (`rolsuper = t`) because Immich creates its extensions at
#     startup, and a CNPG bootstrap owner is not. The extensions are therefore created here as superuser,
#     before the app can ask; without it, Immich's first migration dies on `CREATE EXTENSION`;
#   * Postgres **14**, not 16 — a major-version jump is not part of making it HA.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
spec:
  instances: 2
  imageName: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
  primaryUpdateStrategy: unsupervised

  storage:
    storageClass: longhorn
    size: 10Gi

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE;
        - CREATE EXTENSION IF NOT EXISTS unaccent CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp" CASCADE;

  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "192MB"

  monitoring:
    enablePodMonitor: true

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
