# ---- Valkey (Redis) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      affinity:
        # Required, matching Forgejo and Vaultwarden: two replicas on one node is a replica that does not survive the
        # node it duplicates.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: immich-server
      # No hostname pin (story 9.9, 2026-11-06). Both were pinned to `.80`, which made the *application* single-node
      # while its database had become genuinely HA — so losing `.80` meant "wait for a human to edit a manifest", not a
      # failover. The RTO/RPO table made that gap visible; this closes it.
      #
      # Nothing here demanded a pin (ADR 0008): the library is a Longhorn ReadWriteOnce volume that follows the pod,
      # and the Deployment is `strategy: Recreate` precisely because of it. The tolerations stay — every node is
      # control-plane, and a toleration costs nothing.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: immich
spec:
  selector:
    app: immich-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ---- Machine learning ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      # ML is the CPU-bound part -> run it on the Ryzen (.82). Storage + DB moved
      # to patola-thinkcentre (.84) when the MacBook was retired.
      nodeSelector:
        kubernetes.io/hostname: sitaw-amd
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.4@sha256:1ab8674e7cec41009abb3812de62a16cc1917e73d486233a5471b048d26fc14d
          env:
            - name: TRANSFORMERS_CACHE
              value: /cache
            - name: HF_XET_CACHE
              value: /cache/huggingface-xet
            - name: MPLCONFIGDIR
              value: /cache/matplotlib-config
          volumeMounts:
            - name: cache
              mountPath: /cache
          ports:
            - containerPort: 3003
              name: http
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 4Gi
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
---
# Model cache for the ML service (avoids re-downloading models on restart).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app: immich-machine-learning
  ports:
    - port: 3003
      targetPort: 3003
---
# ---- Server (API + web) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  # Two replicas, because the library is ReadWriteMany now (2026-11-10). The database has been a two-instance cluster
  # since story 8.2, so with this the application is HA end to end: any node can die and Immich keeps serving.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # No hostname pin (story 9.9, 2026-11-06). Both were pinned to `.80`, which made the *application* single-node
      # while its database had become genuinely HA — so losing `.80` meant "wait for a human to edit a manifest", not a
      # failover. The RTO/RPO table made that gap visible; this closes it.
      #
      # Nothing here demanded a pin (ADR 0008): the library is a Longhorn ReadWriteOnce volume that follows the pod,
      # and the Deployment is `strategy: Recreate` precisely because of it. The tolerations stay — every node is
      # control-plane, and a toleration costs nothing.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.4@sha256:f6475c58b07a8d89ec845aa8782731d36656c3c17d943e0a101dc6ed99a2e53f
          env:
            - name: DB_HOSTNAME
              # The CNPG `-rw` service (story 8.2). Promotion is a DNS-level change the app never sees, so failover
              # needs no restart here — the same reason Forgejo points at `forgejo-pg-rw` (8.5).
              value: immich-pg-rw
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            - name: TZ
              value: America/Toronto
          ports:
            - containerPort: 2283
              name: http
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 4Gi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-rwx
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - port: 2283
      targetPort: 2283
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    # Large uploads — remove the body-size limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: immich.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: immich-server
  namespace: immich
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: immich-server
