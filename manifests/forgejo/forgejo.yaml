# Forgejo — a local mirror of the GitHub repositories.
#
# PULL MIRRORS ONLY. GitHub stays the system of record (issues, PRs, Actions);
# Forgejo holds a browsable, offline copy of the git refs + LFS objects.
# Mirrors are created through the API after the first sync — see
# homelab-context NETWORK.md / ROUTER.md notes and the runbook entry.
#
# Secrets are NOT in git. `forgejo-secrets` is rendered by External Secrets from
# Bitwarden Secrets Manager (keys `forgejo-secret-key`, `forgejo-admin`,
# `forgejo-api-token`). The GitHub mirror credential is NOT here either — it lives
# in Forgejo's own database, encrypted with the secret key below.
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: forgejo-secrets
    creationPolicy: Owner
    template:
      data:
        GITEA__security__SECRET_KEY: "{{ .secret_key }}"
        FORGEJO_ADMIN_PASSWORD: "{{ .admin_password }}"
        # A scoped API token (write:issue, read:repository) for tooling that must not hold the
        # admin password: `homelab-context/scripts/board-sync.sh` collects `/approve` decisions
        # from the issue board into the ticket store. Until 2026-11-04 that script minted a
        # token from the admin password on every run and revoked it afterwards, because
        # Bitwarden was locked and the token had nowhere to live. It lives here now.
        FORGEJO_API_TOKEN: "{{ .api_token }}"
  data:
    - { secretKey: secret_key, remoteRef: { key: forgejo-secret-key } }
    - { secretKey: admin_password, remoteRef: { key: forgejo-admin } }
    - { secretKey: api_token, remoteRef: { key: forgejo-api-token } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  replicas: 1
  # SQLite on a Longhorn volume: one writer, so never two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: forgejo
          # Pinned by digest: CI fails on a floating tag.
          image: codeberg.org/forgejo/forgejo@sha256:946243edbab116d5bb78b73ea68af6f3d69229ba1b1ed958dd82c3481167f3e0
          ports:
            - name: http
              containerPort: 3000
          env:
            # --- identity ---
            - { name: GITEA__server__DOMAIN, value: git.bismigel.dev }
            - { name: GITEA__server__ROOT_URL, value: "https://git.bismigel.dev/" }
            - { name: GITEA__server__HTTP_PORT, value: "3000" }
            - { name: GITEA__server__PROTOCOL, value: http }
            # --- no SSH listener: git over HTTPS only, so nothing new to expose ---
            - { name: GITEA__server__DISABLE_SSH, value: "true" }
            - { name: GITEA__server__START_SSH_SERVER, value: "false" }
            # --- storage: SQLite is deliberate; the estate's rule is small
            #     critical data on Longhorn, and 36 repos of git objects are small ---
            - { name: GITEA__database__DB_TYPE, value: sqlite3 }
            - { name: GITEA__database__PATH, value: /data/gitea/gitea.db }
            # --- closed by default ---
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__service__REQUIRE_SIGNIN_VIEW, value: "true" }
            - { name: GITEA__actions__ENABLED, value: "false" }
            # --- mirrors ---
            - { name: GITEA__mirror__DEFAULT_INTERVAL, value: 24h0m0s }
            - { name: GITEA__mirror__MIN_INTERVAL, value: 10m0s }
            - { name: GITEA__repository__DEFAULT_PRIVATE, value: private }
            - { name: GITEA__log__LEVEL, value: Info }
          envFrom:
            - secretRef:
                name: forgejo-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
spec:
  ingressClassName: nginx
  rules:
    - host: git.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 3000
