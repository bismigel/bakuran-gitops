# Forgejo — a local mirror of the GitHub repositories.
#
# PULL MIRRORS ONLY. GitHub stays the system of record (issues, PRs, Actions);
# Forgejo holds a browsable, offline copy of the git refs + LFS objects.
# Mirrors are created through the API after the first sync — see
# homelab-context NETWORK.md / ROUTER.md notes and the runbook entry.
#
# Secrets are NOT in git: the Deployment reads `forgejo-secrets`, which holds
#   GITEA__security__SECRET_KEY  — random, encrypts mirror credentials at rest
#   GITEA__database__PASSWD      — unused with sqlite, kept for a future switch
# The GitHub mirror credential lives in Forgejo's own database (encrypted),
# never here.
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  replicas: 1
  # SQLite on a Longhorn volume: one writer, so never two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      # Forgejo refuses to run its CLI as root ("Forgejo is not supposed to be run
      # as root"), and there is no reason for the server to have uid 0. Run as the
      # image's own `git` user; the volume is chowned to match.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          # Pinned by digest: CI fails on a floating tag.
          image: codeberg.org/forgejo/forgejo@sha256:946243edbab116d5bb78b73ea68af6f3d69229ba1b1ed958dd82c3481167f3e0
          ports:
            - name: http
              containerPort: 3000
          env:
            # --- identity ---
            - { name: GITEA__server__DOMAIN, value: git.bismigel.dev }
            - { name: GITEA__server__ROOT_URL, value: "https://git.bismigel.dev/" }
            - { name: GITEA__server__HTTP_PORT, value: "3000" }
            - { name: GITEA__server__PROTOCOL, value: http }
            # --- no SSH listener: git over HTTPS only, so nothing new to expose ---
            - { name: GITEA__server__DISABLE_SSH, value: "true" }
            - { name: GITEA__server__START_SSH_SERVER, value: "false" }
            # --- storage: SQLite is deliberate; the estate's rule is small
            #     critical data on Longhorn, and 36 repos of git objects are small ---
            - { name: GITEA__database__DB_TYPE, value: sqlite3 }
            - { name: GITEA__database__PATH, value: /data/gitea/gitea.db }
            # --- closed by default ---
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__service__REQUIRE_SIGNIN_VIEW, value: "true" }
            - { name: GITEA__actions__ENABLED, value: "false" }
            # --- mirrors ---
            - { name: GITEA__mirror__DEFAULT_INTERVAL, value: 24h0m0s }
            - { name: GITEA__mirror__MIN_INTERVAL, value: 10m0s }
            - { name: GITEA__repository__DEFAULT_PRIVATE, value: private }
            - { name: GITEA__log__LEVEL, value: Info }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - secretRef:
                name: forgejo-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
spec:
  ingressClassName: nginx
  rules:
    - host: git.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 3000
