# Postgres for Forgejo — the first half of story 8.1 (homelab-context epic 8).
#
# Why: Forgejo runs sqlite3 at /data/gitea/gitea.db, so it can only ever have one writer. A second
# replica would corrupt the file, which makes the database — not the replica count — the blocker for
# HA. This adds the database ahead of the cutover so the risky step later is a dump/restore onto
# something already running, not a "create a database and migrate" performed in one breath.
#
# Deliberately NOT referenced by the forgejo Deployment yet: the app still points at sqlite, and
# nothing consumes this. The cutover is its own reviewable change, with the dump already proven
# (2026-11-05: 110 MB zip containing DB, repos and attachments, and the sqlite file itself is 4.7 MB).
#
# Sizing: the database is 4.7 MB. 5 GiB is not a capacity estimate, it is the smallest request that
# leaves room for years of history plus vacuum headroom without anyone thinking about it again.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: forgejo-db
    creationPolicy: Owner
    template:
      data:
        # Two consumers, one password, and they disagree about the key names:
        #   * the old StatefulSet reads `POSTGRES_PASSWORD` (postgres image convention)
        #   * CloudNativePG's bootstrap reads `username` + `password` (its own convention)
        # Rendering all three from one Bitwarden value keeps a single source of truth for the
        # credential while the cutover is in progress. Once the StatefulSet is gone,
        # POSTGRES_PASSWORD stops being read by anything.
        POSTGRES_PASSWORD: "{{ .password }}"
        username: "forgejo"
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: forgejo-db-password } }

# The single-instance Postgres that used to live here is gone as of 2026-11-05:
#   * CloudNativePG runs the database instead (`forgejo-pg.yaml`, two instances, streaming
#     replication), and Forgejo connects to its `-rw` service;
#   * the data was migrated with a dump/restore and verified identical on both sides
#     (39 issues, 36 repos, 1 user, 3 tokens);
#   * a killed primary failed over to the replica with 74/74 requests served — zero failures.
#
# The ExternalSecret above stays: it is now CNPG's `bootstrap.initdb.secret`, so the credential has
# one source (Bitwarden) rather than two. `POSTGRES_PASSWORD` in its template is a leftover the old
# StatefulSet read; it is harmless and will be removed when the StatefulSet's PVC is.
#
# The old StatefulSet's PVC (`data-forgejo-postgres-0`) is intentionally NOT deleted: it holds the
# pre-cutover copy of the database and costs nothing while it sits detached. It is the rollback, and
# deleting it is a separate decision with its own evidence.
