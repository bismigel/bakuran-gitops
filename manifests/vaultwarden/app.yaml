# Vaultwarden — two replicas, a replicated database, and one shared data volume (2026-11-10).
#
# Why HA here and not later: this holds every password in the household. Everything else in the estate can be rebuilt
# from git; this cannot be rebuilt from anything.
#
# The shape mirrors Forgejo's (story 8.1) because the failure modes are identical:
#   * the database is a CloudNativePG cluster, so `-rw` is a DNS name that follows a promotion;
#   * `/data` is Longhorn **RWX**, because Vaultwarden keeps attachments, sends and an icon cache on disk and two pods
#     must see the same ones;
#   * two replicas with a PDB and required anti-affinity, so a node drain never takes both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: vaultwarden-secret
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: vaultwarden-admin-token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  # RWX on purpose: two replicas, one attachment store. Longhorn serves it through its share-manager, the same mechanism
  # Forgejo's data volume already uses.
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: vaultwarden }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vaultwarden }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: vaultwarden }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: vaultwarden
          image: docker.io/vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
          env:
            - name: DOMAIN
              value: "https://vault.bismigel.dev"
            # Postgres, not SQLite. A single sqlite file on a shared volume has one writer and is the failure mode this
            # deployment exists to avoid.
            # Composed in the ExternalSecret template (db.yaml): the `-rw` service means a promotion is a DNS change the
            # app never sees. Kubernetes cannot build this string from three separate env vars.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: vaultwarden-db, key: DATABASE_URL }
            - name: SIGNUPS_ALLOWED
              # Closed. The first account is created by the owner with the ingress briefly set to allow signups; leaving
              # this true on a public hostname is how a password manager becomes someone else's account.
              value: "false"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: vaultwarden-secret, key: ADMIN_TOKEN }
            - name: WEB_VAULT_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: "warn"
          ports:
            - { name: http, containerPort: 80 }
          volumeMounts:
            - { name: data, mountPath: /data }
          # Vaultwarden answers /alive as soon as it can serve; readiness additionally proves the database is reachable.
          startupProbe:
            httpGet: { path: /alive, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: vaultwarden-data }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: vaultwarden }
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  # NodePort, because that is how the Cloudflare tunnel reaches a service in this estate: both connectors run with
  # `nodeport-addresses=127.0.0.1/32` (the edge lock), so a hostname's target is always `http://127.0.0.1:<nodePort>` —
  # never a node IP, which the firewall refuses (learned the hard way on jellyfin, 2026-11-11).
  #
  # 30090 verified free across the cluster before choosing it. The LAN Ingress below stays for local access.
  type: NodePort
  selector: { app.kubernetes.io/name: vaultwarden }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30090 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  ingressClassName: nginx
  rules:
    - host: vault.bismigel.dev
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: vaultwarden, port: { name: http } } } }
