apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx-admin
spec:
  # Ingress ownership is decided by controller-class, not by --ingress-class:
  # both releases must declare *different* --controller-class values, and each
  # IngressClass must name its own controller. Setting both to the chart default
  # made each controller claim the other release's ingresses.
  controller: k8s.io/ingress-nginx-admin
