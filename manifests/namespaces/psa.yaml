# Pod Security Admission for application namespaces.
#
# `apps` already enforces baseline in apps.yaml. These namespaces run
# non-privileged workloads, so baseline is safe to enforce. `monitoring` is
# limited to audit/warn because node-exporter and etcd-metrics-proxy need
# hostNetwork; Longhorn is privileged and remains intentionally exempt.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
