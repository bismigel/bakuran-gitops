apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO config PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      initContainers:
        - name: disable-auth
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              f=/config/config/config.yaml
              [ -f "$f" ] || exit 0
              awk '/^authentication:/{a=1} a&&/^  type:/{$0="  type: null"} /^[^ ]/&&!/^authentication:/{a=0} {print}' "$f" > "$f.t" && mv "$f.t" "$f"
              chown 1000:1000 "$f" 2>/dev/null || true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: bazarr
          image: linuxserver/bazarr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6767
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Manila"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /movies
            - name: tv
              mountPath: /tv
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: movies
          hostPath:
            path: /mnt/media/movies
            type: Directory
        - name: tv
          hostPath:
            path: /mnt/media/tv
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: media
spec:
  type: NodePort
  selector:
    app: bazarr
  ports:
    - port: 6767
      targetPort: 6767
      nodePort: 30067
---
# Exposed via the Cloudflare tunnel (behind Access); LAN NodePorts are
# loopback-only now.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media
spec:
  ingressClassName: nginx
  rules:
    - host: sonarr.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8989
---
