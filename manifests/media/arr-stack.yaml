apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO config PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      initContainers:
        - name: disable-auth
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              f=/config/config.xml
              [ -f "$f" ] || exit 0
              # No app-level auth: these sit behind Cloudflare Access. (The
              # current builds accept AuthenticationMethod=None.)
              sed -i \
                -e 's#<AuthenticationMethod>[^<]*</AuthenticationMethod>#<AuthenticationMethod>None</AuthenticationMethod>#' \
                -e 's#<AuthenticationRequired>[^<]*</AuthenticationRequired>#<AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>#' \
                -e 's#<AllowedHosts>[^<]*</AllowedHosts>#<AllowedHosts>192.168.2.81,127.0.0.1,localhost,sonarr,radarr,prowlarr,bazarr,sonarr.media.svc,sonarr.media.svc.cluster.local,radarr.media.svc,radarr.media.svc.cluster.local,prowlarr.media.svc,prowlarr.media.svc.cluster.local,sonarr.bismigel.dev,radarr.bismigel.dev,prowlarr.bismigel.dev,bazarr.bismigel.dev</AllowedHosts>#' \
                "$f"
              chown 1000:1000 "$f" 2>/dev/null || true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: prowlarr
          image: linuxserver/prowlarr:develop
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9696
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Manila"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  type: NodePort
  selector:
    app: prowlarr
  ports:
    - port: 9696
      targetPort: 9696
      nodePort: 30069
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO config PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      initContainers:
        - name: disable-auth
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              f=/config/config.xml
              [ -f "$f" ] || exit 0
              # No app-level auth: these sit behind Cloudflare Access. (The
              # current builds accept AuthenticationMethod=None.)
              sed -i \
                -e 's#<AuthenticationMethod>[^<]*</AuthenticationMethod>#<AuthenticationMethod>None</AuthenticationMethod>#' \
                -e 's#<AuthenticationRequired>[^<]*</AuthenticationRequired>#<AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>#' \
                -e 's#<AllowedHosts>[^<]*</AllowedHosts>#<AllowedHosts>192.168.2.81,127.0.0.1,localhost,sonarr,radarr,prowlarr,bazarr,sonarr.media.svc,sonarr.media.svc.cluster.local,radarr.media.svc,radarr.media.svc.cluster.local,prowlarr.media.svc,prowlarr.media.svc.cluster.local,sonarr.bismigel.dev,radarr.bismigel.dev,prowlarr.bismigel.dev,bazarr.bismigel.dev</AllowedHosts>#' \
                "$f"
              chown 1000:1000 "$f" 2>/dev/null || true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: sonarr
          image: linuxserver/sonarr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8989
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Manila"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tv
              mountPath: /tv
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: tv
          hostPath:
            path: /mnt/media/tv
            type: Directory
        - name: downloads
          hostPath:
            path: /mnt/media
            type: Directory
