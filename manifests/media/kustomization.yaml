apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - arr-auth.yaml
  - arr-stack.yaml
  - jellyfin.yaml
  - qbittorrent.yaml
  - sabnzbd.yaml
  - media-mcp.yaml
  - flaresolverr.yaml
  - recyclarr.yaml
  - prowlarr-definitions.yaml
  - ghcr-secret.yaml
# The media stack uses hostPath /mnt/media and /dev/dri (QuickSync), which exist
# only on calamansi-intel (.81). Pin every media pod to that node.
# Pin by *capability*, not by hostname:
#   homelab.io/media-pool = /mnt/media exists on this node
#   homelab.io/qsv        = Intel QuickSync available for transcoding
#
# Only the pods that mount the pool are pinned. flaresolverr, media-mcp and
# recyclarr touch neither the pool nor the GPU, so they may run anywhere (a
# blanket rule pinned every media pod to .81 until 2026-10-28).
#
# This does not make the media stack survive losing .81: with hostPath
# type=Directory a pool pod scheduled elsewhere fails to start rather than
# serving an empty library. See HIGH-AVAILABILITY.md.
patches:
  - target:
      kind: Deployment
      name: (sonarr|radarr|prowlarr|bazarr|qbittorrent|sabnzbd)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          homelab.io/media-pool: "true"
  - target:
      kind: Deployment
      name: jellyfin
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          homelab.io/media-pool: "true"
          homelab.io/qsv: "true"
