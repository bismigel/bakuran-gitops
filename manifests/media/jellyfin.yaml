apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: default
  labels:
    app: jellyfin
spec:
  replicas: 1
  # hostPort 8096 (+ RWO config PVC) can't overlap during a rollout, so a
  # RollingUpdate deadlocks (old pod holds the port) — stop old, then start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
      # No prometheus.io/* annotations: Jellyfin exposes no /metrics endpoint
      # (needs a plugin), so scraping it only produced a false TargetDown.
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        supplementalGroups:
          - 303
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.9.10
          securityContext:
            privileged: true
          ports:
            # hostPort: LAN access for TV clients (they can't do Cloudflare
            # Access). Jellyfin is pinned to .81, so this binds there.
            - containerPort: 8096
              hostPort: 8096
              name: http
            - containerPort: 8920
              name: https
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "http://192.168.2.81:30096"
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          # Transcode temp lives here. Must be LOCAL disk: the old /mnt/media
          # is the mergerfs pool, and mergerfs placed transcodes on .82 over
          # NFS — so every transcode read/wrote its segments across the network.
          hostPath:
            path: /var/cache/jellyfin
            type: DirectoryOrCreate
        - name: media
          hostPath:
            path: /mnt/media
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: default
spec:
  type: NodePort
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      nodePort: 30096
      name: http
    - port: 8920
      targetPort: 8920
      nodePort: 30920
      name: https
---
# Serve Jellyfin via the media cluster's own ingress-nginx (NodePort 32080) so
# the Cloudflare tunnel can reach it at http://127.0.0.1:32080 instead of the
# raw LAN NodePort 30096. Pairs with the tunnel routing change (Phase 2).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: jellyfin.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
