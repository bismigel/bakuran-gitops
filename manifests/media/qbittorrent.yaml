apiVersion: v1
kind: Namespace
metadata:
  name: downloads
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-pvc
  namespace: downloads
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  type: NodePort
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      nodePort: 30081
  selector:
    app: qbittorrent
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  ingressClassName: nginx-admin
  rules:
    - host: qbittorrent.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  replicas: 0
  # hostPort 8081 + RWO config PVC: a RollingUpdate would deadlock on the port.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
        - name: init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /config/qBittorrent
              conf=/config/qBittorrent/qBittorrent.conf
              if [ ! -f "$conf" ]; then
                printf '[Preferences]\nWebUI\\LocalHostAuth=false\nWebUI\\HostHeaderValidation=false\nSession\\DefaultSavePath=/downloads\n' > "$conf"
                printf '[Logging]\nLogging\\Enabled=true\nLogging\\Rotate=true\nLogging\\MaxSizeBytes=10485760\n' >> "$conf"
                printf '[Legal]\nLegal\\NoNotices=true\n' >> "$conf"
              fi
              # Keep this client out of the router's state.
              #
              # qBittorrent defaults Connection\UPnP to TRUE, so every session it
              # asks the router for port mappings. On 2026-10-25 the media node lost
              # all WAN egress for 61 minutes starting ~11 min after a torrent swarm
              # peaked: LAN fine, the router answered a hairpin ping for .82 in 0.3ms
              # but dropped .81's, and it self-healed when the router state cleared.
              # UPnP buys nothing here anyway - all traffic leaves through the
              # WireGuard tunnel - so disable it and cap the connection counts that
              # generate that state.
              #
              # Idempotent: drop our keys, then re-add them under [Preferences], so
              # repeated starts cannot duplicate or drift.
              sed -i \
                -e '/^Connection\\UPnP=/d' \
                -e '/^Connection\\MaxConnections=/d' \
                -e '/^Connection\\MaxConnectionsPerTorrent=/d' \
                -e '/^Connection\\MaxUploadsPerTorrent=/d' \
                "$conf"
              if grep -q '^\[Preferences\]' "$conf"; then
                awk '/^\[Preferences\]$/ && !done {
                       print;
                       print "Connection\\UPnP=false";
                       print "Connection\\MaxConnections=200";
                       print "Connection\\MaxConnectionsPerTorrent=50";
                       print "Connection\\MaxUploadsPerTorrent=20";
                       done=1; next } { print }' "$conf" > "$conf.tmp"
                mv "$conf.tmp" "$conf"
              fi
              # the rewrite above runs as root; hand it back to the app user or
              # qBittorrent (abc) can read our settings but cannot save any,
              # which silently reverts preferences to defaults on the next start
              chown 1000:1000 "$conf" 2>/dev/null || true   # PUID/PGID of the app container
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:4.6.7-r0-ls353
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Manila"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              hostPort: 8081
              name: webui
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config-pvc
        - name: downloads
          hostPath:
            path: /mnt/media
            type: Directory
