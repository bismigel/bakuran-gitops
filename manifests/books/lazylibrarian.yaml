# LazyLibrarian — book manager: Usenet via SABnzbd (category "books"), indexers
# via Prowlarr/NZBGeek. Post-processes finished books into /books for Kavita.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lazylibrarian-config
  namespace: books
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazylibrarian
  namespace: books
  labels:
    app: lazylibrarian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lazylibrarian
  template:
    metadata:
      labels:
        app: lazylibrarian
    spec:
      nodeSelector:
        kubernetes.io/hostname: calamansi-intel
      initContainers:
        # The provider lives in config.ini on the config PVC, so this is
        # the only place it can be declared. Runs before the app starts, only
        # writes when something differs, keeps a one-time .init.bak, and never
        # fails the pod: a wrong setting is a bug, a pod that will not start is
        # an outage.
        - name: provider-config
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["/bin/sh", "-c"]
          args:
            - |
              python - <<'PY'
              import configparser, os, pathlib, shutil, sqlite3

              INI = pathlib.Path("/config/config.ini")
              # LazyLibrarian writes /config/config.ini. This used to point at
              # lazylibrarian.ini, which never exists, so the whole provider step
              # was a silent no-op -- categories and the Prowlarr switch never
              # applied. Keep a fallback for older PVCs.
              if not INI.exists() and pathlib.Path("/config/lazylibrarian.ini").exists():
                  INI = pathlib.Path("/config/lazylibrarian.ini")

              def log(*a):
                  print("provider-config:", *a)

              try:
                  if not INI.exists():
                      log("no config.ini yet, nothing to do")
                  else:
                      cp = configparser.RawConfigParser()
                      cp.optionxform = str  # keep case: top-level CONFIG keys are UPPERCASE
                      cp.read(INI, encoding="utf-8")

                      secs = sorted((s for s in cp.sections() if s.lower().startswith("newznab")),
                                    key=lambda s: (len(s), s))
                      if secs:
                          target = secs[0]
                      else:
                          target = "Newznab0"
                          cp.add_section(target)

                      host = os.environ.get("PROWLARR_NEWZNAB", "").strip()
                      key = os.environ.get("PROWLARR_API_KEY", "").strip()
                      wanted = {
                          "enabled": "1",
                          "generalsearch": os.environ.get("GENERALSEARCH", "search"),
                          "booksearch": os.environ.get("BOOKSEARCH", "search"),
                          # explicit so magazines do not depend on the
                          # GENERALSEARCH fallback, which is deliberately empty
                          "magsearch": os.environ.get("MAGSEARCH", "search"),
                          "bookcat": os.environ.get("BOOKCAT", "7000,7020"),
                          "magcat": os.environ.get("MAGCAT", "7010"),
                          "audiocat": os.environ.get("AUDIOCAT", "3030"),
                          "extended": os.environ.get("EXTENDED", "1"),
                      }
                      if host and key:
                          wanted["host"] = host
                          wanted["api"] = key
                      else:
                          log("PROWLARR_API_KEY absent, leaving host/api as they are")

                      changed = []
                      for k, v in wanted.items():
                          cur = cp.get(target, k, fallback=None)
                          if cur != v:
                              cp.set(target, k, v)
                              changed.append(k if k == "api" else "%s: %r -> %r" % (k, cur, v))

                      # -- audiobooks: destination + torrent client -----------------
                      # Without these two blocks LazyLibrarian can *find* an
                      # audiobook in Prowlarr and still never fetch it: ABB hands
                      # out magnets (see prowlarr-definitions.yaml), so a torrent
                      # client is required, and AUDIO_DIR is where the
                      # postprocessor puts what it downloads. Empty AUDIO_DIR was
                      # why every book kept AudioFile = NULL.
                      extra_cfg = {
                          "GENERAL": {
                              "AUDIO_DIR": os.environ.get("AUDIO_DIR", "").strip(),
                              # Without these two LL cannot file anything it
                              # downloads: get_directory('eBook'/'Download') return
                              # '' and every postprocess falls back to /config.
                              #  -> "WARNING: eBook dir [''] not found, using /config"
                              #  -> "WARNING: Download dir [''] not found, using /config"
                              # i.e. a snatch succeeds, SAB completes, and the file
                              # is never imported into the library.
                              # OL_URL defaults to https://www.openlibrary.org, which
                              # answers 301. ol.py builds every OpenLibrary request from
                              # it and the redirect is not followed, so the UI's "add a
                              # book" search returns nothing for any term (e.g. "kafka"
                              # -> 0 while openlibrary.org/search.json reports 7062).
                              "OL_URL": os.environ.get("OL_URL", "https://openlibrary.org").strip(),
                              # MAX_PAGES defaults to 0 = unlimited: ol.find_results()
                              # paginates until numFound, so a broad term like "kafka"
                              # (6914 hits) fetches ~70 pages and the UI just sits on
                              # "searching". 10 pages is ~1000 results, plenty to pick
                              # from, and returns in seconds.
                              "MAX_PAGES": os.environ.get("MAX_PAGES", "10").strip(),
                              "EBOOK_DIR": os.environ.get("EBOOK_DIR", "/books").strip(),
                              "DOWNLOAD_DIR": os.environ.get("DOWNLOAD_DIR", "/downloads").strip(),
                          },
                          "TORRENT": {
                              "TOR_DOWNLOADER_QBITTORRENT": "1",
                          },
                          # LL's own ABB scraper is ON, with the URL join patched
                          # by the abb-url-patcher init container below. Unpatched
                          # it builds
                          # f"{host}/{href}" while ABB's hrefs already start with
                          # "/", so every details page is requested as
                          # //abss/<slug>/ and Cloudflare answers HTTP 425 with an
                          # empty body. Verified: 0 results for any query, while
                          # the same URL with a single slash returns the info
                          # hash. Audiobooks come from Prowlarr's Torznab feed
                          # instead (block below), which is the same index and is
                          # fetched correctly.
                          # Usenet client for ebooks/magazines. Without it every
                          # search result LL accepts fails at the download step
                          # ("No NZB download method is enabled"), which reads as
                          # "search does not work".
                          # Enable the SABnzbd downloader. [SABNZBD] alone is not
                          # enough: downloadmethods.py checks NZB_DOWNLOADER_SABNZBD
                          # in [USENET], which is why a found book still failed with
                          # "No NZB download method is enabled".
                          "USENET": {
                              "nzb_downloader_sabnzbd": "1",
                          },
                          "SABNZBD": {
                              "sab_host": os.environ.get("SAB_HOST", "").strip(),
                              "sab_port": os.environ.get("SAB_PORT", "8080").strip(),
                              "sab_cat": os.environ.get("SAB_CAT", "books").strip(),
                              "sab_api": os.environ.get("SAB_API", "").strip(),
                          },
                          "ABB": {
                              "ABB": "0",
                              "ABB_HOST": os.environ.get("ABB_HOST", "audiobookbay.lu").strip(),
                              "ABB_DLTYPES": "A",
                          },
                          "QBITTORRENT": {
                              "QBITTORRENT_HOST": os.environ.get("QBT_HOST", "").strip(),
                              "QBITTORRENT_PORT": os.environ.get("QBT_PORT", "8080").strip(),
                              "QBITTORRENT_USER": os.environ.get("QBT_USER", "").strip(),
                              "QBITTORRENT_LABEL": os.environ.get("QBT_LABEL", "").strip(),
                              # qBittorrent's WebUI skips auth only for localhost,
                              # and LL connects from a pod IP, so the password is
                              # mandatory. No secret = leave the section out rather
                              # than write a client that cannot log in.
                              "QBITTORRENT_PASS": os.environ.get("QBT_PASS", "").strip(),
                          },
                      }
                      # LL's own API: media/media-mcp already carries a key for it
                      # and every call was returning 501 because API_ENABLED was
                      # never set (it went missing with the rest of config.ini).
                      # LL rejects a key that is not exactly 32 chars, so a bad
                      # secret leaves the API off instead of half-configured.
                      # -- audiobooks: no Torznab provider ----------------------
                      # The Torznab feed was tried and abandoned (Prowlarr's ABB
                      # indexer ignores title/author and answers with the whole
                      # catalogue). It must also be REMOVED, not just disabled:
                      # its extra keys are not in LL's TORZNAB schema, and the
                      # resulting "Unknown option TORZNAB_0.DLTTYPES in config"
                      # rejected the whole config load at startup - provider
                      # arrays came up with defaults (host '', bookcat '') and
                      # every ebook search then queried Prowlarr with an empty
                      # category. Audiobooks come from the ABB provider instead.
                      for _sec in [x for x in cp.sections() if x.lower().startswith("torznab")]:
                          cp.remove_section(_sec)
                          changed.append("removed obsolete section [%s]" % _sec)

                      _api = os.environ.get("LL_API_KEY", "").strip()
                      extra_cfg["API"] = {
                          "API_ENABLED": "1" if len(_api) == 32 else "",
                          "API_KEY": _api if len(_api) == 32 else "",
                          # Enable the OpenLibrary metadata source. search_for()
                          # returns [] immediately when CONFIG['OL_API'] is false,
                          # and the default is 0 - so the UI's "add a book" search
                          # ("kafka") returned nothing for every term. OpenLibrary
                          # needs no API key (unlike GoogleBooks/GoodReads).
                          "OL_API": "1",
                      }
                      for sec, keys in extra_cfg.items():
                          if not cp.has_section(sec) and not any(keys.values()):
                              continue
                          if not cp.has_section(sec):
                              cp.add_section(sec)
                          for k, v in keys.items():
                              if not v:
                                  continue
                              # LL stores and reads option names LOWERCASE. Writing
                              # AUDIO_DIR next to LL's own audio_dir makes the file
                              # unreadable (DuplicateOptionError) and LL refuses to
                              # start, so always key by the lowercase spelling.
                              k = k.lower()
                              cur = cp.get(sec, k, fallback=None)
                              if cur != v:
                                  cp.set(sec, k, v)
                                  # never log secrets (password, api key)
                                  shown = "(changed)" if any(x in k for x in ("pass", "key")) else repr(v)
                                  changed.append("[%s] %s=%s" % (sec, k, shown))

                      # Repair any case-duplicate an earlier revision of this script
                      # left behind: keep the lowercase spelling, drop the duplicate.
                      for sec in cp.sections():
                          names = cp.options(sec)
                          for n in list(names):
                              low = n.lower()
                              if n == low:
                                  continue
                              if low in names:
                                  cp.remove_option(sec, n)
                                  changed.append("[%s] removed duplicate %s" % (sec, n))
                              else:
                                  cp.set(sec, low, cp.get(sec, n))
                                  cp.remove_option(sec, n)
                                  changed.append("[%s] %s -> %s" % (sec, n, low))

                      if changed:
                          bak = pathlib.Path(str(INI) + ".init.bak")
                          if not bak.exists():
                              shutil.copy2(INI, bak)
                          with INI.open("w", encoding="utf-8") as fh:
                              cp.write(fh)
                          log("updated:", ", ".join(changed))
                      else:
                          log("config already correct")

                      for extra in secs[1:]:
                          log("additional provider [%s] enabled=%s host=%s" % (
                              extra, cp.get(extra, "enabled", fallback="?"),
                              cp.get(extra, "host", fallback="?")))
              except Exception as e:
                  log("ini step failed, config left untouched:", repr(e))

              try:
                  if os.environ.get("ACTIVATE_PAUSED_AUTHORS", "false").lower() == "true":
                      db = pathlib.Path("/config/lazylibrarian.db")
                      if db.exists():
                          con = sqlite3.connect(str(db))
                          cur = con.cursor()
                          cur.execute("UPDATE authors SET Status='Active' WHERE Status='Paused'")
                          n = cur.rowcount
                          con.commit()
                          con.close()
                          log("authors set Active:", n)
                      else:
                          log("no database yet, skipping author activation")
              except Exception as e:
                  log("author activation skipped:", repr(e))
              PY
              chown 1000:1000 /config/config.ini /config/lazylibrarian.db 2>/dev/null || true
          volumeMounts:
            - name: config
              mountPath: /config
          envFrom:
            - configMapRef:
                name: lazylibrarian-provider
          env:
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lazylibrarian-secrets
                  key: prowlarr-api-key
                  optional: true
            # Same credential media/media-mcp uses for qBittorrent; seeded into
            # this namespace by bakuran-infra scripts/lazylibrarian-secrets.sh.
            - name: QBT_PASS
              valueFrom:
                secretKeyRef:
                  name: lazylibrarian-secrets
                  key: qbt-password
                  optional: true
            # LazyLibrarian's own API key (32 chars). Same value media-mcp uses
            # as LAZYLIBRARIAN_API_KEY.
            # SABnzbd API key; seeded by bakuran-infra scripts/lazylibrarian-secrets.sh
            - name: SAB_API
              valueFrom:
                secretKeyRef:
                  name: lazylibrarian-secrets
                  key: sabnzbd-api-key
                  optional: true
            - name: LL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lazylibrarian-secrets
                  key: lazylibrarian-api-key
                  optional: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        # Upstream bug: torrentparser.torrent_abb() builds f"{host}/{href}" while
        # ABB's hrefs already start with "/", so every details page is requested
        # as //abss/<slug>/ and Cloudflare answers HTTP 425 with an empty body -
        # torrent_abb() then returns 0 results for every query. Patch one line in
        # a copy of the package (never the image), so an upstream fix simply makes
        # this a no-op. The copy is from the same image, so nothing else drifts.
        - name: abb-url-patcher
          image: linuxserver/lazylibrarian:version-754d0eb6   # same as the app container
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # copy the whole app dir, not just the package: the emptyDir is
              # mounted AT /app/lazylibrarian, so the entrypoint and lib/ must be
              # in it too
              rm -rf /patched/* 
              cp -a /app/lazylibrarian/. /patched/
              python - /patched/lazylibrarian/torrentparser.py <<'PATCH'
              import sys
              path = sys.argv[1]
              src = open(path, encoding="utf-8").read()
              # triple-quoted so the needles can contain both ' and "
              needle = """.postTitle > h2 > a')['href']}"""
              repl = """.postTitle > h2 > a')['href'].lstrip('/')}"""
              if repl in src:
                  print("abb-url-patcher: already fixed upstream, nothing to do")
              elif needle in src:
                  open(path, "w", encoding="utf-8").write(src.replace(needle, repl, 1))
                  print("abb-url-patcher: applied (host + '/' + href -> href.lstrip('/'))")
              else:
                  print("abb-url-patcher: WARNING pattern not found - ABB downloads are"
                        " probably broken again, check torrentparser.torrent_abb()")
              PATCH
              # Second upstream annoyance: for a Newznab *book* search LL sends
              # q="<author> <title>", and indexers AND every term. A release name
              # that omits the subtitle or spells the author differently then
              # matches nothing:
              #   q="Ichiro Kishimi The Courage to be Happy - True Contentment..." -> 0
              #   q="The Courage to be Happy"                                      -> 1
              # The author is still used by LL's own scoring, so dropping it from
              # the query keeps results correct while making them findable.
              python - /patched/lazylibrarian/providers.py <<'PATCH2'
              import sys
              path = sys.argv[1]
              lines = open(path, encoding="utf-8").read().split("\n")
              changed = False
              for i, line in enumerate(lines):
                  # the book-search branch: q="<author> <title>" followed by BOOKCAT
                  if 'f"{authorname} {bookname}"' in line and i + 1 < len(lines) and "BOOKCAT" in lines[i + 1]:
                      lines[i] = line.replace('f"{authorname} {bookname}"', "bookname")
                      changed = True
                      break
              if changed:
                  open(path, "w", encoding="utf-8").write("\n".join(lines))
                  print("book-query-patcher: book search queries by title only")
              else:
                  print("book-query-patcher: already patched or upstream changed - check providers.py")
              PATCH2
              # Third upstream quirk: the UI's interactive search drops every
              # result. manualbook.search_item() picks the provider with
              #   if 'dispname' in item:  provider = item['dispname']
              # and Prowlarr returns dispname='' (the real value is in nzbprov),
              # so provider stays empty and the result fails the
              # `if title and provider and mode and url` gate -> the manual
              # search page is always empty even though the same query works
              # from the automated search. Test for truthiness, not key presence.
              python - /patched/lazylibrarian/manualbook.py <<'PATCH3'
              import sys
              path = sys.argv[1]
              src = open(path, encoding="utf-8").read()
              pairs = [("if 'dispname' in item:", "if item.get('dispname'):"),
                       ("elif 'nzbprov' in item:", "elif item.get('nzbprov'):"),
                       ("elif 'tor_prov' in item:", "elif item.get('tor_prov'):"),
                       ("elif 'rss_prov' in item:", "elif item.get('rss_prov'):")]
              changed = [old for old, new in pairs if old in src]
              if not changed:
                  print("manual-result-patcher: already patched or upstream changed")
              else:
                  for old, new in pairs:
                      src = src.replace(old, new)
                  open(path, "w", encoding="utf-8").write(src)
                  print("manual-result-patcher: provider detection now truthiness-based (%d sites)" % len(changed))
              PATCH3
              chown -R 1000:1000 /patched
          volumeMounts:
            - name: patched-app
              mountPath: /patched
            - name: config
              mountPath: /config
      containers:
        - name: lazylibrarian
          image: linuxserver/lazylibrarian:version-754d0eb6
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: America/Toronto }
          ports:
            - { name: http, containerPort: 5299 }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: books, mountPath: /books }
            - { name: downloads, mountPath: /downloads }
            # patched package copy (see the abb-url-patcher init container)
            - { name: patched-app, mountPath: /app/lazylibrarian }
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lazylibrarian-config
        - name: patched-app
          emptyDir:
            sizeLimit: 64Mi
        - name: books
          hostPath:
            path: /mnt/media/books
            type: Directory
        - name: downloads
          # Same host tree as SABnzbd (which mounts /mnt/media at /downloads and
          # completes into /downloads/complete/<category>), so the paths SAB
          # reports back resolve inside LazyLibrarian.
          hostPath:
            path: /mnt/media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: lazylibrarian
  namespace: books
  labels:
    app: lazylibrarian
spec:
  selector:
    app: lazylibrarian
  ports:
    - { name: http, port: 5299, targetPort: 5299 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lazylibrarian
  namespace: books
  annotations:
    # LazyLibrarian emits absolute http:// redirects; rewrite them to https so
    # browsers don't bounce through Cloudflare's http->https (and re-hit Access).
    nginx.ingress.kubernetes.io/proxy-redirect-from: "http://lazylibrarian.bismigel.dev"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "https://lazylibrarian.bismigel.dev"
spec:
  ingressClassName: nginx-admin
  rules:
    - host: lazylibrarian.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lazylibrarian
                port:
                  number: 5299
