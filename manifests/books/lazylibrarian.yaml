# LazyLibrarian — book manager: Usenet via SABnzbd (category "books"), indexers
# via Prowlarr/NZBGeek. Post-processes finished books into /books for Kavita.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lazylibrarian-config
  namespace: books
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazylibrarian
  namespace: books
  labels:
    app: lazylibrarian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lazylibrarian
  template:
    metadata:
      labels:
        app: lazylibrarian
    spec:
      nodeSelector:
        kubernetes.io/hostname: calamansi-intel
      initContainers:
        # The provider lives in config.ini on the config PVC, so this is
        # the only place it can be declared. Runs before the app starts, only
        # writes when something differs, keeps a one-time .init.bak, and never
        # fails the pod: a wrong setting is a bug, a pod that will not start is
        # an outage.
        - name: provider-config
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["/bin/sh", "-c"]
          args:
            - |
              python - <<'PY'
              import configparser, os, pathlib, shutil, sqlite3

              INI = pathlib.Path("/config/config.ini")
              # LazyLibrarian writes /config/config.ini. This used to point at
              # lazylibrarian.ini, which never exists, so the whole provider step
              # was a silent no-op -- categories and the Prowlarr switch never
              # applied. Keep a fallback for older PVCs.
              if not INI.exists() and pathlib.Path("/config/lazylibrarian.ini").exists():
                  INI = pathlib.Path("/config/lazylibrarian.ini")

              def log(*a):
                  print("provider-config:", *a)

              try:
                  if not INI.exists():
                      log("no config.ini yet, nothing to do")
                  else:
                      cp = configparser.RawConfigParser()
                      cp.optionxform = str  # keep case: top-level CONFIG keys are UPPERCASE
                      cp.read(INI, encoding="utf-8")

                      secs = sorted((s for s in cp.sections() if s.lower().startswith("newznab")),
                                    key=lambda s: (len(s), s))
                      if secs:
                          target = secs[0]
                      else:
                          target = "Newznab0"
                          cp.add_section(target)

                      host = os.environ.get("PROWLARR_NEWZNAB", "").strip()
                      key = os.environ.get("PROWLARR_API_KEY", "").strip()
                      wanted = {
                          "enabled": "1",
                          "generalsearch": os.environ.get("GENERALSEARCH", "search"),
                          "booksearch": os.environ.get("BOOKSEARCH", "search"),
                          "bookcat": os.environ.get("BOOKCAT", "7000,7020"),
                          "magcat": os.environ.get("MAGCAT", "7010"),
                          "audiocat": os.environ.get("AUDIOCAT", "3030"),
                          "extended": os.environ.get("EXTENDED", "1"),
                      }
                      if host and key:
                          wanted["host"] = host
                          wanted["api"] = key
                      else:
                          log("PROWLARR_API_KEY absent, leaving host/api as they are")

                      changed = []
                      for k, v in wanted.items():
                          cur = cp.get(target, k, fallback=None)
                          if cur != v:
                              cp.set(target, k, v)
                              changed.append(k if k == "api" else "%s: %r -> %r" % (k, cur, v))

                      # -- audiobooks: destination + torrent client -----------------
                      # Without these two blocks LazyLibrarian can *find* an
                      # audiobook in Prowlarr and still never fetch it: ABB hands
                      # out magnets (see prowlarr-definitions.yaml), so a torrent
                      # client is required, and AUDIO_DIR is where the
                      # postprocessor puts what it downloads. Empty AUDIO_DIR was
                      # why every book kept AudioFile = NULL.
                      extra_cfg = {
                          "GENERAL": {
                              "AUDIO_DIR": os.environ.get("AUDIO_DIR", "").strip(),
                          },
                          "TORRENT": {
                              "TOR_DOWNLOADER_QBITTORRENT": "1",
                          },
                          # LL's own AudioBookBay scraper. It is what makes the
                          # audiobook results *downloadable*: results from the
                          # Newznab/Prowlarr provider are routed to the Usenet
                          # client ('No NZB download method is enabled'), so a
                          # Prowlarr magnet can be found and never grabbed. ABB's
                          # results are torrents and go to qBittorrent above.
                          "ABB": {
                              "ABB": "1",
                              "ABB_HOST": os.environ.get("ABB_HOST", "audiobookbay.lu").strip(),
                              "ABB_DLTYPES": "A",
                              "ABB_DLPRIORITY": "0",
                              "ABB_SEEDERS": "0",
                          },
                          "QBITTORRENT": {
                              "QBITTORRENT_HOST": os.environ.get("QBT_HOST", "").strip(),
                              "QBITTORRENT_PORT": os.environ.get("QBT_PORT", "8080").strip(),
                              "QBITTORRENT_USER": os.environ.get("QBT_USER", "").strip(),
                              "QBITTORRENT_LABEL": os.environ.get("QBT_LABEL", "").strip(),
                              # qBittorrent's WebUI skips auth only for localhost,
                              # and LL connects from a pod IP, so the password is
                              # mandatory. No secret = leave the section out rather
                              # than write a client that cannot log in.
                              "QBITTORRENT_PASS": os.environ.get("QBT_PASS", "").strip(),
                          },
                      }
                      # LL's own API: media/media-mcp already carries a key for it
                      # and every call was returning 501 because API_ENABLED was
                      # never set (it went missing with the rest of config.ini).
                      # LL rejects a key that is not exactly 32 chars, so a bad
                      # secret leaves the API off instead of half-configured.
                      _api = os.environ.get("LL_API_KEY", "").strip()
                      extra_cfg["API"] = {
                          "API_ENABLED": "1" if len(_api) == 32 else "",
                          "API_KEY": _api if len(_api) == 32 else "",
                      }
                      for sec, keys in extra_cfg.items():
                          if not cp.has_section(sec) and not any(keys.values()):
                              continue
                          if not cp.has_section(sec):
                              cp.add_section(sec)
                          for k, v in keys.items():
                              if not v:
                                  continue
                              # LL stores and reads option names LOWERCASE. Writing
                              # AUDIO_DIR next to LL's own audio_dir makes the file
                              # unreadable (DuplicateOptionError) and LL refuses to
                              # start, so always key by the lowercase spelling.
                              k = k.lower()
                              cur = cp.get(sec, k, fallback=None)
                              if cur != v:
                                  cp.set(sec, k, v)
                                  # never log secrets (password, api key)
                                  shown = "(changed)" if any(x in k for x in ("pass", "key")) else repr(v)
                                  changed.append("[%s] %s=%s" % (sec, k, shown))

                      # Repair any case-duplicate an earlier revision of this script
                      # left behind: keep the lowercase spelling, drop the duplicate.
                      for sec in cp.sections():
                          names = cp.options(sec)
                          for n in list(names):
                              low = n.lower()
                              if n == low:
                                  continue
                              if low in names:
                                  cp.remove_option(sec, n)
                                  changed.append("[%s] removed duplicate %s" % (sec, n))
                              else:
                                  cp.set(sec, low, cp.get(sec, n))
                                  cp.remove_option(sec, n)
                                  changed.append("[%s] %s -> %s" % (sec, n, low))

                      if changed:
                          bak = pathlib.Path(str(INI) + ".init.bak")
                          if not bak.exists():
                              shutil.copy2(INI, bak)
                          with INI.open("w", encoding="utf-8") as fh:
                              cp.write(fh)
                          log("updated:", ", ".join(changed))
                      else:
                          log("config already correct")

                      for extra in secs[1:]:
                          log("additional provider [%s] enabled=%s host=%s" % (
                              extra, cp.get(extra, "enabled", fallback="?"),
                              cp.get(extra, "host", fallback="?")))
              except Exception as e:
                  log("ini step failed, config left untouched:", repr(e))

              try:
                  if os.environ.get("ACTIVATE_PAUSED_AUTHORS", "false").lower() == "true":
                      db = pathlib.Path("/config/lazylibrarian.db")
                      if db.exists():
                          con = sqlite3.connect(str(db))
                          cur = con.cursor()
                          cur.execute("UPDATE authors SET Status='Active' WHERE Status='Paused'")
                          n = cur.rowcount
                          con.commit()
                          con.close()
                          log("authors set Active:", n)
                      else:
                          log("no database yet, skipping author activation")
              except Exception as e:
                  log("author activation skipped:", repr(e))
              PY
              chown 1000:1000 /config/config.ini /config/lazylibrarian.db 2>/dev/null || true
          envFrom:
            - configMapRef:
                name: lazylibrarian-provider
          env:
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lazylibrarian-secrets
                  key: prowlarr-api-key
                  optional: true
            # Same credential media/media-mcp uses for qBittorrent; seeded into
            # this namespace by bakuran-infra scripts/lazylibrarian-secrets.sh.
            - name: QBT_PASS
              valueFrom:
                secretKeyRef:
                  name: lazylibrarian-secrets
                  key: qbt-password
                  optional: true
            # LazyLibrarian's own API key (32 chars). Same value media-mcp uses
            # as LAZYLIBRARIAN_API_KEY.
            - name: LL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lazylibrarian-secrets
                  key: lazylibrarian-api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: lazylibrarian
          image: linuxserver/lazylibrarian:version-754d0eb6
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: America/Toronto }
          ports:
            - { name: http, containerPort: 5299 }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: books, mountPath: /books }
            - { name: downloads, mountPath: /downloads }
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lazylibrarian-config
        - name: books
          hostPath:
            path: /mnt/media/books
            type: Directory
        - name: downloads
          # Same host tree as SABnzbd (which mounts /mnt/media at /downloads and
          # completes into /downloads/complete/<category>), so the paths SAB
          # reports back resolve inside LazyLibrarian.
          hostPath:
            path: /mnt/media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: lazylibrarian
  namespace: books
  labels:
    app: lazylibrarian
spec:
  selector:
    app: lazylibrarian
  ports:
    - { name: http, port: 5299, targetPort: 5299 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lazylibrarian
  namespace: books
  annotations:
    # LazyLibrarian emits absolute http:// redirects; rewrite them to https so
    # browsers don't bounce through Cloudflare's http->https (and re-hit Access).
    nginx.ingress.kubernetes.io/proxy-redirect-from: "http://lazylibrarian.bismigel.dev"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "https://lazylibrarian.bismigel.dev"
spec:
  ingressClassName: nginx-admin
  rules:
    - host: lazylibrarian.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lazylibrarian
                port:
                  number: 5299
