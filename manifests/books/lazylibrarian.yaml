# LazyLibrarian — book manager: Usenet via SABnzbd (category "books"), indexers
# via Prowlarr/NZBGeek. Post-processes finished books into /books for Kavita.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lazylibrarian-config
  namespace: books
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazylibrarian
  namespace: books
  labels:
    app: lazylibrarian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lazylibrarian
  template:
    metadata:
      labels:
        app: lazylibrarian
    spec:
      nodeSelector:
        kubernetes.io/hostname: calamansi-intel
      initContainers:
        # Settings that live on the config PVC cannot be declared in Kubernetes
        # fields, so they are applied here before the app reads them. The script
        # is in the lazylibrarian-provider-script ConfigMap; it is idempotent and
        # never exits non-zero.
        - name: provider-config
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "/scripts/provider-config.py"]
          envFrom:
            - configMapRef:
                name: lazylibrarian-provider
          env:
            # Optional: until this Secret exists the script leaves host/api as
            # they are and only normalises categories and search type.
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lazylibrarian-secrets
                  key: prowlarr-api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: lazylibrarian
          image: linuxserver/lazylibrarian:version-754d0eb6
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: America/Toronto }
          ports:
            - { name: http, containerPort: 5299 }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: books, mountPath: /books }
            - { name: downloads, mountPath: /downloads }
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lazylibrarian-config
        - name: scripts
          configMap:
            name: lazylibrarian-provider-script
        - name: books
          hostPath:
            path: /mnt/media/books
            type: Directory
        - name: downloads
          # Same host tree as SABnzbd (which mounts /mnt/media at /downloads and
          # completes into /downloads/complete/<category>), so the paths SAB
          # reports back resolve inside LazyLibrarian.
          hostPath:
            path: /mnt/media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: lazylibrarian
  namespace: books
  labels:
    app: lazylibrarian
spec:
  selector:
    app: lazylibrarian
  ports:
    - { name: http, port: 5299, targetPort: 5299 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lazylibrarian
  namespace: books
  annotations:
    # LazyLibrarian emits absolute http:// redirects; rewrite them to https so
    # browsers don't bounce through Cloudflare's http->https (and re-hit Access).
    nginx.ingress.kubernetes.io/proxy-redirect-from: "http://lazylibrarian.bismigel.dev"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "https://lazylibrarian.bismigel.dev"
spec:
  ingressClassName: nginx-admin
  rules:
    - host: lazylibrarian.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lazylibrarian
                port:
                  number: 5299
