# LazyLibrarian's indexer settings are not Kubernetes fields. They live in
# /config/lazylibrarian.ini on the lazylibrarian-config PVC, which is why the
# broken provider survived every audit of this repo: nothing here described it.
#
# Two things are declared in this file so the provider stops being invisible:
#   - the settings the init container applies on every pod start,
#   - the Prowlarr API key it needs to reach the indexer path that works.
#
# Why Prowlarr and not the provider LazyLibrarian had: the same query, run two
# ways against the same indexer, gives different answers.
#
#   LazyLibrarian provider  -> "Danielle Steel The Ring" -> nearest match 44%,
#                              "The Legacy Series", no result
#   Prowlarr /2/api + cats  -> "Danielle Steel The Ring" ->
#                              "Danielle Steel - The Ring (retail) (epub)" x3
#
# So the books exist at NZBgeek and are reachable; the query path LazyLibrarian
# used returned unrelated ebook releases and rejected them on similarity. This
# points it at the endpoint that resolves the title, with the ebook categories
# spelled out instead of left to the provider default.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-provider
  namespace: books
data:
  # Prowlarr exposes each indexer as its own Newznab endpoint: /2/api is NZBgeek.
  PROWLARR_NEWZNAB: "http://prowlarr.media.svc.cluster.local:9696/2"
  # 7000/7020 = Books/Ebooks at both newznab and nZEDb sites. The default was
  # letting book searches run against whatever the indexer returned instead.
  BOOKCAT: "7000,7020"
  MAGCAT: "7010"
  AUDIOCAT: "3030"
  GENERALSEARCH: "search"
  BOOKSEARCH: "search"
  EXTENDED: "1"
  # Every Kubernetes/platform author in the library is currently 'Paused', so
  # none of them has ever been searched. Set to "false" to leave them alone.
  ACTIVATE_PAUSED_AUTHORS: "true"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lazylibrarian-secrets
  namespace: books
spec:
  refreshInterval: 1h
  secretStoreRef:
    # Secrets are namespace-scoped, so the Prowlarr key that media/ uses cannot
    # be referenced from here; it is pulled into this namespace instead.
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: lazylibrarian-secrets
  data:
    - secretKey: prowlarr-api-key
      remoteRef:
        key: prowlarr-api-key
