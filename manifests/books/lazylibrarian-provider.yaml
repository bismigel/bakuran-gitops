# LazyLibrarian's indexer settings are not Kubernetes fields. They live in
# /config/config.ini on the lazylibrarian-config PVC, which is why the
# broken provider survived every audit of this repo: nothing here described it.
#
# The init container in lazylibrarian.yaml applies these on every pod start.
#
# Why the categories matter: the search that fails returns unrelated ebooks and
# rejects them on similarity rather than returning nothing.
#
#   provider: "Danielle Steel The Ring" -> nearest match 44%,
#             "The Legacy Series", no result
#   Prowlarr /2/api + cat 7000,7020 ->
#             "Danielle Steel - The Ring (retail) (epub)" x3
#
# The books exist at the indexer and are reachable. Spelling the ebook
# categories out instead of leaving them to the provider default is the part
# that can be fixed without touching a credential.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-provider
  namespace: books
data:
  # Prowlarr exposes each indexer as its own Newznab endpoint: /2/api is NZBgeek.
  # Only applied when the Prowlarr key is present as a Secret; see below.
  PROWLARR_NEWZNAB: "http://prowlarr.media.svc.cluster.local:9696/2"
  # 7000/7020 = Books/Ebooks at both newznab and nZEDb sites.
  BOOKCAT: "7000,7020"
  MAGCAT: "7010"
  # AudioBookBay (torrent) is the audiobook source; Prowlarr stays ebook/magazine
  # only. When Prowlarr also answered audio searches, LL preferred its copy of the
  # release on match score and then failed to download it, because a Newznab result
  # always goes to the Usenet client ("No NZB download method is enabled").
  #
  # MUST stay "search": providers.py sends `t = GENERALSEARCH` for *book*
  # searches, so blanking it (which an earlier change did, to keep Prowlarr out
  # of audio queries) made every ebook search send `t=` and Prowlarr returned
  # nothing. That looked exactly like "search is broken".
  # Trade-off: the audio branch falls back to the same key, so Prowlarr is also
  # asked for audiobooks, where it ignores title/author and returns the whole
  # catalogue. Results are junk but they are rejected by LL's match threshold;
  # audiobooks are meant to come from the ABB provider anyway.
  GENERALSEARCH: "search"
  BOOKSEARCH: "search"
  MAGSEARCH: "search"
  AUDIOCAT: "3030"
  AUDIOSEARCH: "search"
  # Prowlarr's per-indexer Torznab feed for the AudioBookBay indexer (id 4).
  # Re-check the id if the indexer is ever re-created: kubectl -n media exec
  # deploy/prowlarr -- curl -s -H "X-Api-Key: $KEY" .../api/v1/indexer
  PROWLARR_TORZNAB: "http://prowlarr.media.svc.cluster.local:9696/4"
  # Usenet client. Without it every ebook LL finds dies with "No NZB download
  # method is enabled" - the [SABnzbd] section had gone missing with the rest of
  # config.ini, which is why "search" looked broken: it found things it could
  # never fetch. SAB has a books category.
  SAB_HOST: "sabnzbd.downloads.svc.cluster.local"
  SAB_PORT: "8080"
  SAB_CAT: "books"
  EXTENDED: "1"
  # Where the audiobook postprocessor drops finished downloads: the same mergerfs
  # pool Audiobookshelf scans at /mnt/media/audiobooks, so ABS picks the file up
  # with no copy and no second path convention.
  AUDIO_DIR: "/books/audiobooks"
  # ABB only ever hands out magnets, so an audiobook cannot be fetched without a
  # torrent client. qBittorrent is the one the arr stack already uses.
  QBT_HOST: "qbittorrent.downloads.svc.cluster.local"
  QBT_PORT: "8080"
  QBT_USER: "admin"
  QBT_LABEL: "books"
  # Every Kubernetes/platform author in the library is 'Paused', so none of them
  # has ever been searched. Set to "false" to leave them alone.
  ACTIVATE_PAUSED_AUTHORS: "true"
# The host/api switch to Prowlarr needs its API key in this namespace. Secrets
# do not cross namespaces and the key that media/ uses lives in a Secret called
# media-setup which nothing in Git describes, so its Bitwarden item name is not
# recorded anywhere I can read. The init container takes it from an OPTIONAL
# Secret named lazylibrarian-secrets:
#
#   kubectl -n books create secret generic lazylibrarian-secrets \
#     --from-literal=prowlarr-api-key=<key>
#
# Until that exists the init container keeps the existing host/api and applies
# the categories and search type only.
