# LazyLibrarian's indexer settings are not Kubernetes fields. They live in
# /config/lazylibrarian.ini on the lazylibrarian-config PVC, which is why the
# broken provider survived every audit of this repo: nothing here described it.
#
# The init container in lazylibrarian.yaml applies these on every pod start.
#
# Why the categories matter: the search that fails returns unrelated ebooks and
# rejects them on similarity rather than returning nothing.
#
#   provider: "Danielle Steel The Ring" -> nearest match 44%,
#             "The Legacy Series", no result
#   Prowlarr /2/api + cat 7000,7020 ->
#             "Danielle Steel - The Ring (retail) (epub)" x3
#
# The books exist at the indexer and are reachable. Spelling the ebook
# categories out instead of leaving them to the provider default is the part
# that can be fixed without touching a credential.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-provider
  namespace: books
data:
  # Prowlarr exposes each indexer as its own Newznab endpoint: /2/api is NZBgeek.
  # Only applied when the Prowlarr key is present as a Secret; see below.
  PROWLARR_NEWZNAB: "http://prowlarr.media.svc.cluster.local:9696/2"
  # 7000/7020 = Books/Ebooks at both newznab and nZEDb sites.
  BOOKCAT: "7000,7020"
  MAGCAT: "7010"
  AUDIOCAT: "3030"
  GENERALSEARCH: "search"
  BOOKSEARCH: "search"
  EXTENDED: "1"
  # Every Kubernetes/platform author in the library is 'Paused', so none of them
  # has ever been searched. Set to "false" to leave them alone.
  ACTIVATE_PAUSED_AUTHORS: "true"
# The host/api switch to Prowlarr needs its API key in this namespace. Secrets
# do not cross namespaces and the key that media/ uses lives in a Secret called
# media-setup which nothing in Git describes, so its Bitwarden item name is not
# recorded anywhere I can read. The init container takes it from an OPTIONAL
# Secret named lazylibrarian-secrets:
#
#   kubectl -n books create secret generic lazylibrarian-secrets \
#     --from-literal=prowlarr-api-key=<key>
#
# Until that exists the init container keeps the existing host/api and applies
# the categories and search type only.
