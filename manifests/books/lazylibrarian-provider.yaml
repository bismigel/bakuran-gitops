# LazyLibrarian's indexer settings are not Kubernetes fields. They live in
# /config/config.ini on the lazylibrarian-config PVC, which is why the broken
# provider survived every audit of this repo: nothing here described it.
#
# config.ini, not lazylibrarian.ini — the first version of this job looked for
# the latter, logged "no lazylibrarian.ini yet, nothing to do", and applied
# nothing while the pod came up healthy. Silent no-ops are the failure mode this
# whole change is trying to remove, so the file is discovered rather than
# assumed, and the name it picked is logged.
#
# Why the categories matter: the failing search did not return nothing, it
# returned unrelated ebooks that then failed the similarity threshold.
#
#   before: "Danielle Steel The Ring" -> nearest match 44%
#   after:  "Danielle Steel - Friends Forever" -> best match 100.0%, sent to SAB
#
# The script lives in a ConfigMap so changing it is a small diff in a small
# file, not a rewrite of an 8 KB Deployment.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-provider
  namespace: books
data:
  # Prowlarr exposes each indexer as its own Newznab endpoint: /2/api is NZBgeek.
  # Only applied when the Prowlarr key is present as a Secret; see below.
  PROWLARR_NEWZNAB: "http://prowlarr.media.svc.cluster.local:9696/2"
  # 7000/7020 = Books/Ebooks at both newznab and nZEDb sites.
  BOOKCAT: "7000,7020"
  MAGCAT: "7010"
  AUDIOCAT: "3030"
  GENERALSEARCH: "search"
  BOOKSEARCH: "search"
  AUDIOSEARCH: "search"
  EXTENDED: "1"
  # Every Kubernetes/platform author in the library was 'Paused', so none of
  # them had ever been searched. Set to "false" to leave them alone.
  ACTIVATE_PAUSED_AUTHORS: "true"
  # Audiobooks: LazyLibrarian tracks eBook and audio status separately per book.
  # Everything except the excluded authors moves from 'Skipped' to 'Wanted',
  # which is the state the backlog search looks for
  # (books.Status="Wanted" OR AudioStatus="Wanted").
  AUDIO_WANTED: "true"
  AUDIO_EXCLUDE_AUTHORS: "Danielle Steel"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-provider-script
  namespace: books
data:
  provider-config.py: |
    """Apply LazyLibrarian's indexer and library settings on every pod start.

    Idempotent: writes only when a value differs, keeps a one-time backup,
    never prints the API key, and never raises — a wrong setting is a bug,
    a pod that will not start is an outage.
    """
    import configparser
    import os
    import pathlib
    import shutil
    import sqlite3

    CONFIG_DIR = pathlib.Path("/config")
    OWNER = 1000


    def log(*args):
        print("provider-config:", *args)


    def chown(path):
        for candidate in (path, path.with_name(path.name + "-wal"),
                          path.with_name(path.name + "-shm")):
            if not candidate.exists():
                continue
            try:
                os.chown(candidate, OWNER, OWNER)
            except OSError:
                pass


    def find_ini():
        """Return the config file LazyLibrarian actually uses."""
        direct = CONFIG_DIR / "config.ini"
        if direct.exists():
            return direct
        for candidate in sorted(CONFIG_DIR.glob("*.ini")):
            try:
                text = candidate.read_text(errors="ignore").lower()
            except OSError:
                continue
            if "[newznab" in text or "[general]" in text:
                return candidate
        return None


    def apply_provider(ini):
        parser = configparser.RawConfigParser()
        parser.optionxform = str  # keep case: CONFIG keys are UPPERCASE
        parser.read(ini, encoding="utf-8")

        sections = sorted(
            (s for s in parser.sections() if s.lower().startswith("newznab")),
            key=lambda s: (len(s), s),
        )
        if sections:
            target = sections[0]
        else:
            target = "Newznab0"
            parser.add_section(target)

        host = os.environ.get("PROWLARR_NEWZNAB", "").strip()
        key = os.environ.get("PROWLARR_API_KEY", "").strip()

        wanted = {
            "enabled": "1",
            "generalsearch": os.environ.get("GENERALSEARCH", "search"),
            "booksearch": os.environ.get("BOOKSEARCH", "search"),
            "audiosearch": os.environ.get("AUDIOSEARCH", "search"),
            "bookcat": os.environ.get("BOOKCAT", "7000,7020"),
            "magcat": os.environ.get("MAGCAT", "7010"),
            "audiocat": os.environ.get("AUDIOCAT", "3030"),
            "extended": os.environ.get("EXTENDED", "1"),
        }
        if host and key:
            wanted["host"] = host
            wanted["api"] = key
        else:
            log("PROWLARR_API_KEY absent, leaving host/api as they are")

        changed = []
        for name, value in wanted.items():
            current = parser.get(target, name, fallback=None)
            if current == value:
                continue
            parser.set(target, name, value)
            changed.append(name if name == "api"
                           else "%s: %r -> %r" % (name, current, value))

        if not changed:
            log("[%s] already correct in %s" % (target, ini))
            return

        backup = ini.with_name(ini.name + ".init.bak")
        if not backup.exists():
            shutil.copy2(ini, backup)
        with ini.open("w", encoding="utf-8") as handle:
            parser.write(handle)
        chown(ini)
        chown(backup)
        log("[%s] updated in %s:" % (target, ini), ", ".join(changed))


    def open_db():
        db = CONFIG_DIR / "lazylibrarian.db"
        if not db.exists():
            return None
        return db


    def activate_authors():
        if os.environ.get("ACTIVATE_PAUSED_AUTHORS", "false").lower() != "true":
            return
        db = open_db()
        if db is None:
            log("no database yet, skipping author activation")
            return
        con = sqlite3.connect(str(db))
        try:
            cur = con.execute("UPDATE authors SET Status='Active' WHERE Status='Paused'")
            con.commit()
            log("authors set Active:", cur.rowcount)
        finally:
            con.close()
        chown(db)


    def want_audiobooks():
        """Mark every book audio-Wanted except the excluded authors.

        LazyLibrarian keeps two statuses per book. The backlog search looks for
        books.Status="Wanted" OR AudioStatus="Wanted", so flipping AudioStatus
        is all it takes to ask for the audiobook as well as the eBook.
        """
        if os.environ.get("AUDIO_WANTED", "false").lower() != "true":
            return
        db = open_db()
        if db is None:
            log("no database yet, skipping audiobook flags")
            return
        excluded = [a.strip() for a in
                    os.environ.get("AUDIO_EXCLUDE_AUTHORS", "").split(",") if a.strip()]
        sql = "UPDATE books SET AudioStatus='Wanted' WHERE AudioStatus='Skipped'"
        params = ()
        if excluded:
            placeholders = ",".join("?" for _ in excluded)
            sql += (" AND AuthorID NOT IN "
                    "(SELECT AuthorID FROM authors WHERE AuthorName IN (%s))" % placeholders)
            params = tuple(excluded)
        con = sqlite3.connect(str(db))
        try:
            cur = con.execute(sql, params)
            con.commit()
            log("audiobooks marked Wanted:", cur.rowcount,
                "excluding:", ", ".join(excluded) or "none")
        finally:
            con.close()
        chown(db)


    def main():
        try:
            ini = find_ini()
            if ini is None:
                log("no config.ini found in /config, nothing to do")
            else:
                apply_provider(ini)
        except Exception as exc:  # never block the app
            log("ini step failed, config left untouched:", repr(exc))

        for step in (activate_authors, want_audiobooks):
            try:
                step()
            except Exception as exc:
                log("%s skipped:" % step.__name__, repr(exc))


    main()
