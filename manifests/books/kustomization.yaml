apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kavita.yaml
  - lazylibrarian-provider.yaml
  - lazylibrarian.yaml
patches:
  # A pod-template annotation, not a setting: any change to it makes Kubernetes
  # build a new ReplicaSet. Bumping this value is the declarative equivalent of
  # `kubectl rollout restart`, and it is how this workload picks up changes to
  # the provider ConfigMap.
  - target:
      kind: Deployment
      name: lazylibrarian
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          bakuran.dev/rollout: "2026-10-24T20:15:00Z"
