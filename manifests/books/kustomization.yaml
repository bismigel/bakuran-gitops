apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kavita.yaml
  - lazylibrarian-provider.yaml
  - lazylibrarian.yaml
patches:
  # A pod-template annotation, not a setting: any change to it makes Kubernetes
  # build a new ReplicaSet. This workload has now needed a forced rollout twice:
  # once because a ReplicaSet sat in FailedCreate backoff, once because the init
  # container had to be re-pointed at the right config file. Bumping this value
  # is the declarative equivalent of `kubectl rollout restart`.
  - target:
      kind: Deployment
      name: lazylibrarian
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          bakuran.dev/rollout: "2026-10-24T18:32:00Z"
