apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kavita.yaml
  - lazylibrarian-provider.yaml
  - lazylibrarian.yaml
  # One-shot inventory of the book library. Read-only; exists to explain the gap
  # between LazyLibrarian's book counts and what Kavita actually indexes.
  - books-inventory.yaml
patches:
  - target:
      kind: Deployment
      name: lazylibrarian
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          bakuran.dev/rollout: "2026-10-24T20:15:00Z"
