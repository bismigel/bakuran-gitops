# Ingress-only default deny, the same pilot as karakeep's.
#
# Artifact Server needs same-namespace traffic (nothing else runs here), ingress-nginx for its two
# hostnames, and the CNPG operator and monitoring to reach the database pods. Egress stays open until the
# ingress policy has been stable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: artifact-server
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: artifact-server
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: artifact-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artifact-server
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8787 }
---
# The CNPG operator polls each instance's status endpoint (8000), talks to its plugins over gRPC (9090),
# and the instances replicate on 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-system
  namespace: artifact-server
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: artifact-server-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 9090 }
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: artifact-server
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: artifact-server-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9187 }
