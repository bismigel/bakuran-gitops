# R2 credentials for CloudNativePG's Barman Cloud Plugin — WAL archiving and base backups for Artifact
# Server's database. Same R2 keys every other backup uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifact-server-pg-backup
  namespace: artifact-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: artifact-server-pg-backup
    creationPolicy: Owner
    template:
      data:
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        ACCESS_SECRET_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: r2-access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: r2-secret-access-key
