# Everything Artifact Server reads at run time, composed here so the values never exist in git.
#
# Same shape as the other applications' ExternalSecrets: one Bitwarden entry per credential, and the
# strings Kubernetes cannot build from several env vars (the DATABASE_URL) composed in the template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifact-server-runtime
  namespace: artifact-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: artifact-server-runtime
    creationPolicy: Owner
    template:
      data:
        api-token: "{{ .api_token }}"
        # The `-rw` service means a promotion is a DNS change the app never sees.
        database-url: "postgresql://artifact_server:{{ .db_password }}@artifact-server-pg-rw.artifact-server.svc.cluster.local:5432/artifact_server"
        s3-access-key-id: "{{ .r2_access_key_id }}"
        s3-secret-access-key: "{{ .r2_secret_access_key }}"
        oidc-client-id: "{{ .oidc_client_id }}"
        oidc-issuer: "https://bakuran.cloudflareaccess.com/cdn-cgi/access/sso/oidc/{{ .oidc_client_id }}"
        oidc-client-secret: "{{ .oidc_client_secret }}"
  data:
    - secretKey: api_token
      remoteRef:
        key: artifact-server-api-token
    - secretKey: db_password
      remoteRef:
        key: artifact-server-db-password
    - secretKey: r2_access_key_id
      remoteRef:
        key: r2-access-key-id
    - secretKey: r2_secret_access_key
      remoteRef:
        key: r2-secret-access-key
    - secretKey: oidc_client_id
      remoteRef:
        key: artifact-server-oidc-client-id
    - secretKey: oidc_client_secret
      remoteRef:
        key: artifact-server-oidc-client-secret
