# Loki, as a COMPARISON OBSERVER beside VictoriaLogs (2026-11-21).
#
# The same collector dual-ships identical logs to both, so memory, disk and query latency compare like for like.
# Loki is the one component here that was declared without ever being measured against the incumbent; this makes
# the choice evidence rather than preference.
#
# Single binary, filesystem storage, tsdb schema, replication 1: the homelab shape, not the scalable one. If the
# numbers say VictoriaLogs, this file is deleted and nothing else changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    limits_config:
      # match the incumbent's retention so the disk comparison is meaningful
      retention_period: 720h
      # Required for the OTLP ingest path (structured metadata) - without it the exporter's push is rejected.
      allow_structured_metadata: true
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  # SCALED TO ZERO 2026-11-21, and this file is now a tombstone: its own header said "if the numbers say
  # VictoriaLogs, this file is deleted and nothing else changes" - the decision came from the owner rather than
  # the numbers, but it is the same decision. Kept rather than deleted because the file also declares
  # `loki-data`, and deleting a manifest is how a PVC gets pruned (ADR 0002). Nothing writes here any more: the
  # collector's `otlphttp/loki` exporter is gone in the same change.
  replicas: 0
  # RWO volume: a RollingUpdate deadlocks with both pods Pending (measured in staging on 2026-11-20).
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      # The image runs as uid 10001; a Longhorn volume arrives owned by root, so without fsGroup Loki dies at
      # "mkdir /loki/rules: permission denied" (measured 2026-11-21 on the first start).
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: loki
          image: grafana/loki:3.2.1@sha256:09a53b4a4ff81ffcd8f13886df19d33fac7a8d3aaf952e3c7e66cbade5b2fc31
          args: ['-config.file=/etc/loki/loki.yml']
          ports: [{ containerPort: 3100, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector: { app: loki }
  ports: [{ port: 3100, name: http }]
