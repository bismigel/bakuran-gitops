# VictoriaLogs, single node, fed over OTLP by the collector beside it.
#
# Why VictoriaLogs and not Loki: at this estate's size (160 pods, one cluster) a single binary with filesystem
# storage and a retention flag is the whole deployment. Loki needs an object store or a filesystem layout plus a
# compactor to get the same thing. Both would work; this one has fewer moving parts to explain at 03:00.
#
# Why OTLP and not a vendor-specific protocol: VictoriaLogs accepts native OTLP logs at
# /insert/opentelemetry/v1/logs (documented), so the collector uses the standard otlphttp exporter and no part of
# this pipeline is VictoriaMetrics-specific except the URL.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victorialogs-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  namespace: observability
  labels: {app.kubernetes.io/name: victorialogs}
spec:
  replicas: 1
  strategy: {type: Recreate}   # single-writer TSDB: never two pods on the same volume
  selector:
    matchLabels: {app.kubernetes.io/name: victorialogs}
  template:
    metadata:
      labels: {app.kubernetes.io/name: victorialogs}
    spec:
      nodeSelector:
        kubernetes.io/hostname: patola-thinkcentre   # the node with room on local-path
      securityContext:
        # victoria-logs writes as its own uid in the image; a read-only root would need an emptyDir for /tmp
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.26.0@sha256:f44e20c260bd939833cf41083a830abb908d948461dd92e031ecc158f91b728f
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=30d
            - -httpListenAddr=:9428
            # The collector is the only writer; keep the ingest endpoint on the pod network.
            - -envflag.enable=true
          ports:
            - {name: http, containerPort: 9428}
          volumeMounts:
            - {name: data, mountPath: /storage}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victorialogs-data
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: observability
spec:
  selector: {app.kubernetes.io/name: victorialogs}
  ports:
    - {name: http, port: 9428, targetPort: http}
