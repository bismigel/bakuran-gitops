# Pull secret for the estate's own registry (git.bismigel.dev), so CNPG can pull the immich-pg image from
# there instead of ghcr.io. Sourced from Bitwarden like every other credential; the same user the push used.
#
# Why a separate secret and not reuse ghcr-secret: a dockerconfigjson pull secret is per-registry, and
# pointing it at the wrong host silently falls back to anonymous and 401s.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry-secret
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-registry-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"git.bismigel.dev":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: registry-scanner-user
    - secretKey: password
      remoteRef:
        key: registry-scanner-password
