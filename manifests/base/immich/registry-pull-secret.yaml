# Pull secret for the estate's **Forgejo package registry** (git.bismigel.dev), so CNPG can pull the
# immich-pg image from there instead of ghcr.io.
#
# The user is `registry-reader` with a read:package token — NOT the zot `scanner` htpasswd user. Those are
# two different registries: zot (registry.bismigel.dev) mirrors docker.io for the scan, while git.bismigel.dev
# is Forgejo's own package registry. Using the zot credential here returned 401, which is how this was found.
#
# Why a separate secret and not reuse ghcr-secret: a dockerconfigjson pull secret is per-registry, and
# pointing it at the wrong host silently falls back to anonymous and 401s.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry-secret
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-registry-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"git.bismigel.dev":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: forgejo-registry-reader-user
    - secretKey: password
      remoteRef:
        key: forgejo-registry-reader-token
