apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ---- Storage ----
# The library lives on `immich-library-rwx-v2` (immich-library-v2.yaml); the database is the CloudNativePG cluster
# in immich-postgres.yaml. Three older PVCs declared here - `immich-library` (30Gi RWO), `immich-library-rwx` (100Gi)
# and `immich-postgres` (the pre-CNPG database) - were kept as rollback copies under ADR 0002. The 2026-11-24 rebuild
# recreated them empty (Longhorn actualSize 0 on 2026-11-25), so they held no rollback anymore; they were removed
# from git and deleted by name with the annotation (runbook 17), at the owner's request on 2026-11-25.
# ---- Postgres (with the vector extension Immich needs) ----
apiVersion: external-secrets.io/v1
# The StatefulSet `immich-postgres` and its Service lived here until 2026-11-05 (story 8.2). The database is now
# the CloudNativePG cluster in `immich-postgres.yaml`, reachable at `immich-postgres-rw`. Removed deliberately and *after* the
# app had served from the new cluster for a round trip — not before.

kind: ExternalSecret
metadata:
  name: immich-db
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-db
    # CloudNativePG's bootstrap reads `username` + `password`; the app reads `password` alone. Render
    # both from the one Bitwarden value rather than copying the credential into a second Secret — the
    # same fix Forgejo needed at 8.5, and the reason is the same: one password, two conventions.
    template:
      data:
        password: "{{ .password }}"
        username: "immich"
  data:
    - secretKey: password
      remoteRef:
        key: immich-db-password
