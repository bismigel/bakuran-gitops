apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ---- Storage: Longhorn, so losing a node is a restart, not a restore ----
# These were hostPath PVs pinned to one node (previously the MacBook, then
# patola-thinkcentre). The data is ~1.8G, so the requests are right-sized: a
# 90Gi volume with 2 replicas needs 180G and Longhorn has 168G free in total.
# Growing a Longhorn volume is one `kubectl patch` when the library needs it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
# The library, three times larger and **ReadWriteMany** (2026-11-10).
#
# Two requests in one object, because both need a new volume: Longhorn can grow a volume but cannot change its access
# mode, and `ReadWriteOnce` is what keeps `immich-server` at one replica — a second pod would fail to attach, so the
# database being HA (story 8.2) never made the *application* HA.
#
# 100 GiB is not arbitrary: the smallest Longhorn disk is `patola-thinkcentre`'s dedicated one at 120 G free, and a
# three-replica volume must fit on every node it lands on. Larger than this and the third replica has nowhere to go.
#
# `immich-library` (30 GiB, RWO) stays in place as the rollback copy — ADR 0002 makes deleting it a separate, human
# decision with its own evidence, not a side effect of a migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-rwx
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# ---- Postgres (with the vector extension Immich needs) ----
apiVersion: external-secrets.io/v1
# The StatefulSet `immich-postgres` and its Service lived here until 2026-11-05 (story 8.2). The database is now
# the CloudNativePG cluster in `immich-pg.yaml`, reachable at `immich-pg-rw`. Removed deliberately and *after* the
# app had served from the new cluster for a round trip — not before.
#
# **The PVC `immich-postgres` below stays.** ADR 0002 is not a preference: it is the only complete copy of the
# pre-migration database, and it is what a rollback would read. Deleting it is a separate decision with its own
# evidence, made by a human, with the annotation.
kind: ExternalSecret
metadata:
  name: immich-db
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-db
    # CloudNativePG's bootstrap reads `username` + `password`; the app reads `password` alone. Render
    # both from the one Bitwarden value rather than copying the credential into a second Secret — the
    # same fix Forgejo needed at 8.5, and the reason is the same: one password, two conventions.
    template:
      data:
        password: "{{ .password }}"
        username: "immich"
  data:
    - secretKey: password
      remoteRef:
        key: immich-db-password
