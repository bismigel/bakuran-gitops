# The Immich library, right-sized (story 10.11).
#
# `immich-library-rwx` asks for 100 GiB and stores 3.6 GiB. That request was not a guess: Longhorn cannot shrink a volume,
# so it was chosen as *the largest that would still fit a third replica on the smallest disk* — a workaround for the
# scheduling alerts wearing the shape of a capacity decision. The alerts have fired ever since (`.80/data`: 220 GiB
# promised against 134 GiB of disk, ratio 2.02), and they are right: the promise is what makes a rebuild unplaceable.
#
# Measured 2026-11-13: 29 volumes promise 276 GiB and hold 18 GiB, i.e. 774 GiB of air once replicas are counted. This
# one volume is 300 GiB of that air for 3.6 GiB of photos.
#
# 20 GiB is 5.5x current usage. Growing is one patch (`spec.resources.requests.storage`); shrinking needs this copy-and-
# switch dance again, which is the whole reason to size from measurement rather than from hope.
#
# The old claim stays until this one is proven, and then it is reduced to one replica rather than deleted (ADR 0002).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-rwx-v2
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    # 35 GiB (2026-11-19), up from 20: the web UI showed 1.5 GiB of 19.5 GiB used, i.e. 18 GiB of headroom, which is a
    # few thousand photos. 35 is the largest bump that keeps this volume's promise inside story 10.11's warning line:
    # patola/data's scheduled/free ratio goes 1.43 -> 1.57 (warn 1.6, critical 1.8, measured 2026-11-19). Anything above
    # ~39 GiB crosses 1.6, and 100 GiB - which this volume used to ask for - crossed 2.19.
    #
    # Longhorn expands online: spec.resources.requests.storage is the whole patch, no move and no downtime. This is a
    # stopgap for a phone-sized library; a library of tens of thousands of photos belongs on the 1.9 TB media pool
    # through a dynamic NFS provisioner (see the immich ticket), because a three-replica Longhorn volume is capped at the
    # smallest node's free space - ~105 GiB here.
    requests:
      storage: 35Gi
