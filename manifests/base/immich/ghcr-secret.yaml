# GHCR pull secret, sourced from Bitwarden Secrets Manager instead of a SealedSecret. ESO builds the
# kubernetes.io/dockerconfigjson from the two Bitwarden secrets (ghcr-user, ghcr-token).
#
# Needed because `ghcr.io/bismigel/immich-pg` is private: the CNPG cluster pulls Immich's Postgres from there
# (ADR 0010) instead of upstream. Same file as `apps/` and `media/` carry, because a pull secret is namespaced
# and the cluster has no cluster-wide one — a duplication the estate already accepts twice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: ghcr-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: ghcr-user
    - secretKey: token
      remoteRef:
        key: ghcr-token
