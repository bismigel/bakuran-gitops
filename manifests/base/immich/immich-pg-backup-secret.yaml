# Credentials for CloudNativePG's barman object store — WAL archiving and base backups for Immich's database.
#
# Until 2026-11-05 the only copy of Immich's database outside the cluster was a nightly `pg_dump` executed into a pod
# by `homelab-backup-apps`. That dump has no point-in-time recovery, and it silently reported SKIP for a night after
# story 8.2 replaced the StatefulSet it execs into — which is exactly the class of failure that only shows up when you
# need it. CNPG can stream WAL and take base backups itself, so the durability stops depending on a shell script
# remembering a pod name.
#
# Same R2 keys the other backups use (`homelab-backup.env` on `.82` is built from the same pair). A dedicated,
# bucket-scoped token would be better and is noted as follow-up rather than pretended.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-pg-backup
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-pg-backup
    creationPolicy: Owner
    template:
      data:
        # Key names are CNPG's, not Bitwarden's: `s3Credentials` below binds them explicitly.
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        ACCESS_SECRET_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: r2-access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: r2-secret-access-key
