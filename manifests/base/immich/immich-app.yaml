# ---- Valkey (Redis) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      affinity:
        # Required, matching Forgejo and Vaultwarden: two replicas on one node is a replica that does not survive the
        # node it duplicates.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: immich-server
      # No hostname pin (story 9.9, 2026-11-06). Both were pinned to `.80`, which made the *application* single-node
      # while its database had become genuinely HA — so losing `.80` meant "wait for a human to edit a manifest", not a
      # failover. The RTO/RPO table made that gap visible; this closes it.
      #
      # Nothing here demanded a pin (ADR 0008): the library is a Longhorn ReadWriteOnce volume that follows the pod,
      # and the Deployment is `strategy: Recreate` precisely because of it. The tolerations stay — every node is
      # control-plane, and a toleration costs nothing.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: immich
spec:
  selector:
    app: immich-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ---- Machine learning ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      # ML is the CPU-bound part -> run it on the Ryzen (.82). Storage + DB moved
      # to patola-thinkcentre (.84) when the MacBook was retired.
      nodeSelector:
        kubernetes.io/hostname: sitaw-amd
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.4@sha256:1ab8674e7cec41009abb3812de62a16cc1917e73d486233a5471b048d26fc14d
          env:
            - name: TRANSFORMERS_CACHE
              value: /cache
            - name: HF_XET_CACHE
              value: /cache/huggingface-xet
            - name: MPLCONFIGDIR
              value: /cache/matplotlib-config
          volumeMounts:
            - name: cache
              mountPath: /cache
          ports:
            - containerPort: 3003
              name: http
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 4Gi
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
---
# Model cache for the ML service (avoids re-downloading models on restart).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app: immich-machine-learning
  ports:
    - port: 3003
      targetPort: 3003
---
# ---- Server (API + web) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  # Two replicas, because the library is ReadWriteMany now (2026-11-10). The database has been a two-instance cluster
  # since story 8.2, so with this the application is HA end to end: any node can die and Immich keeps serving.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # No hostname pin (story 9.9, 2026-11-06). Both were pinned to `.80`, which made the *application* single-node
      # while its database had become genuinely HA — so losing `.80` meant "wait for a human to edit a manifest", not a
      # failover. The RTO/RPO table made that gap visible; this closes it.
      #
      # Nothing here demanded a pin (ADR 0008): the library is a Longhorn ReadWriteOnce volume that follows the pod,
      # and the Deployment is `strategy: Recreate` precisely because of it. The tolerations stay — every node is
      # control-plane, and a toleration costs nothing.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.4@sha256:f6475c58b07a8d89ec845aa8782731d36656c3c17d943e0a101dc6ed99a2e53f
          env:
            - name: DB_HOSTNAME
              # The CNPG `-rw` service (story 8.2). Promotion is a DNS-level change the app never sees, so failover
              # needs no restart here — the same reason Forgejo points at `forgejo-pg-rw` (8.5).
              value: immich-pg-rw
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            - name: TZ
              value: America/Toronto
          ports:
            - containerPort: 2283
              name: http
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 4Gi
      volumes:
        # The photo library lives on the media pool from 2026-11-19, as a plain `nfs:` pod volume.
        #
        # WHY NOT LONGHORN: a replicated volume is bounded by the *smallest* node's free space - patola had 105 GiB on
        # 2026-11-19 - so ~105 GiB is the ceiling for a replicated photo library here, and asking for 100 GiB is what made
        # story 10.11's over-commit alert fire (scheduled/free 1.34 at 20 GiB, 2.19 at 100 GiB, critical 1.8). A photo
        # library outgrows that, and it is the one dataset here that cannot be re-downloaded. The pool has 1.5 TB free.
        #
        # WHY A POD VOLUME AND NOT A PV/PVC: a `PersistentVolume` is cluster-scoped, and the `prod` AppProject refuses one
        # in an app manifest - correctly, since it can name any volume in the cluster. The alternative was a dynamic NFS
        # provisioner, and the two candidates are both 2021-era images with CRITICAL CVEs in their base (the subdir
        # provisioner ships Go 1.15: five stdlib CVEs; the CSI driver ships a full Debian userspace). None of that machinery
        # buys anything here: nothing else claims this storage, so the indirection would exist only to satisfy a pattern.
        # A pod volume is mounted by the kubelet directly, needs no cluster-scoped authority, and adds no image to scan.
        #
        # THE TRADE, stated rather than implied: this has no replication. One disk holds the photos; durability is the
        # pool's btrfs snapshots (`/mnt/media-snapshots`) plus whatever backup is declared for `/mnt/media/immich`. The
        # pool's local mirror is a 938 GB SD card already 412 GB full of re-downloadable media, so photos must not lean on
        # it - that is the open decision this change makes explicit rather than hides.
        #
        # POD SECURITY: `nfs` is not in the `restricted` profile's allowed volume types, and `immich` enforces
        # `baseline` (it only warns on restricted, measured 2026-11-19). So this is legal here and would be rejected in a
        # namespace that enforces restricted - stated because it is the one place in the estate where that is true, and a
        # future tightening of this namespace must move the library onto a CSI/PVC volume rather than silently fail.
        #
        # `hard` and a 60s timeout: a soft mount turns a slow NFS moment into silent data loss; blocking is visible.
        - name: library
          nfs:
            server: 192.168.2.82
            path: /mnt/media/immich
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - port: 2283
      targetPort: 2283
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    # Large uploads — remove the body-size limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: immich.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: immich-server
  namespace: immich
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: immich-server
