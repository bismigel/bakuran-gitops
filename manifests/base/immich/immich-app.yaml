# ---- Valkey (Redis) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      affinity:
        # Required, matching Forgejo and Vaultwarden: two replicas on one node is a replica that does not survive the
        # node it duplicates.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: immich-server
      # No hostname pin (story 9.9, 2026-11-06). Both were pinned to `.80`, which made the *application* single-node
      # while its database had become genuinely HA — so losing `.80` meant "wait for a human to edit a manifest", not a
      # failover. The RTO/RPO table made that gap visible; this closes it.
      #
      # Nothing here demanded a pin (ADR 0008): the library is a Longhorn ReadWriteOnce volume that follows the pod,
      # and the Deployment is `strategy: Recreate` precisely because of it. The tolerations stay — every node is
      # control-plane, and a toleration costs nothing.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: immich
spec:
  selector:
    app: immich-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ---- Machine learning ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      # ML is the CPU-bound part, so it PREFERS the Ryzen (.82) - but it is a preference, not a pin. It was a
      # `nodeSelector` until 2026-11-18, which meant the one workload with no storage or device requirement was the one
      # workload that could not move: if .82 was cordoned or full, ML sat Pending and every upload's thumbnail stalled
      # while two other nodes idled.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: ["sitaw-amd"] }
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
          env:
            - name: TRANSFORMERS_CACHE
              value: /cache
            - name: HF_XET_CACHE
              value: /cache/huggingface-xet
            - name: MPLCONFIGDIR
              value: /cache/matplotlib-config
          volumeMounts:
            - name: cache
              mountPath: /cache
          ports:
            - containerPort: 3003
              name: http
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 4Gi
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
---
# Model cache for the ML service (avoids re-downloading models on restart).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app: immich-machine-learning
  ports:
    - port: 3003
      targetPort: 3003
---
# ---- Server (API + web) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  # Two replicas, because the library is ReadWriteMany now (2026-11-10). The database has been a two-instance cluster
  # since story 8.2, so with this the application is HA end to end: any node can die and Immich keeps serving.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # No hostname pin (story 9.9, 2026-11-06). Both were pinned to `.80`, which made the *application* single-node
      # while its database had become genuinely HA — so losing `.80` meant "wait for a human to edit a manifest", not a
      # failover. The RTO/RPO table made that gap visible; this closes it.
      #
      # Nothing here demanded a pin (ADR 0008): the library is a Longhorn ReadWriteOnce volume that follows the pod,
      # and the Deployment is `strategy: Recreate` precisely because of it. The tolerations stay — every node is
      # control-plane, and a toleration costs nothing.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: immich-server
          # v3.3.4 -> v3.4.2 (2026-11-21). Patch-level by Immich's own numbering and the release notes
          # say so: web/iOS fixes (duplicate combobox keys, slideshow controls, filename alignment,
          # integrity-report downloads, hashed CSP styles) plus a FUTO Backups version bump. **No
          # database or extension change is mentioned**, which is what decides whether `immich-pg`
          # moves too - it does not, and it must not move by accident: that image is our own build
          # pinned to vector 0.8.1 + vchord 0.4.3, the pairing Immich wrote its indexes with (ADR 0010).
          #
          # The upgrade is verified by the app, not by the tag: the migration runs on first boot, so
          # after the rollout the check is `immich-server` logs ("Migrations", no error) and the asset
          # count against the pre-upgrade number.
          #
          # Digests read from the registry header for the tags (ADR 0007), not typed.
          image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
          env:
            - name: DB_HOSTNAME
              # The CNPG `-rw` service (story 8.2). Promotion is a DNS-level change the app never sees, so failover
              # needs no restart here — the same reason Forgejo points at `forgejo-pg-rw` (8.5).
              value: immich-pg-rw
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            - name: TZ
              value: America/Toronto
          ports:
            - containerPort: 2283
              name: http
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 4Gi
      volumes:
        # Photos are on a REPLICATED Longhorn volume (2026-11-19): they are the one dataset in this estate that cannot be
        # re-downloaded, and the 1.9 TB pool - which holds the re-downloadable media - is a single disk with no
        # replication. A three-replica volume survives losing a node; 60 GiB is what this cluster's binding disk can
        # promise without crossing story 10.11's warning line (arithmetic in immich-library-v2.yaml).
        #
        # The pool still holds a copy: the CronJob beside this file rsyncs the volume to /mnt/media/immich nightly, which
        # is what keeps the existing R2 backup (modules/backup-local.nix, homelab-backup-books) uploading from a path it
        # can reach. Three copies, three different failure domains: the replica set, the pool, R2.
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-rwx-v2

---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - port: 2283
      targetPort: 2283
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    # Large uploads — remove the body-size limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: immich.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: immich-server
  namespace: immich
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: immich-server
