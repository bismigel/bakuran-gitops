# Daily base backup of Immich's database, on top of continuous WAL archiving.
#
# Both matter and they do different jobs: WAL archiving gives point-in-time recovery *within* the retention window,
# base backups give a restore point that does not replay a day of WAL. A `pg_dump` gives neither.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  # spec.cluster is immutable after creation, so the name changed with the cluster rename
  # (2026-11-25; the old object pointed at immich-pg and failed every sync).
  name: immich-postgres-daily
  namespace: immich
spec:
  # Six fields, not five: CNPG uses a second-precision cron. The API warned rather than failed, which is why the
  # first version of this line was accepted and wrong.
  schedule: "0 17 3 * * *"
  backupOwnerReference: self
  cluster:
    name: immich-postgres
  # `plugin`, not the default `barmanObjectStore`: the native method needs a binary Immich's image does not have.
  method: plugin
  # And `method: plugin` **requires** this — the API rejects a plugin backup without it:
  #
  #   spec.pluginConfiguration: cannot be empty when the backup method is plugin
  #
  # Caught by trying a one-off backup first. Without that, this file would have looked correct, synced clean, and failed
  # every night at 03:17 with a validation error — the `pg_dump`-reports-SKIP shape again, one day later.
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: immich-r2
  # The cluster has no base backup yet, so the first one is taken at creation instead of waiting for 03:17.
  immediate: true
