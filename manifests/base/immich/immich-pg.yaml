# Immich's database as a CloudNativePG cluster — story 8.2, the one app where losing data is not acceptable.
#
# Still NOT wired to the app. The order is the point: healthy empty cluster, then the data, then the asset count
# compared, then `DB_HOSTNAME`, then the old StatefulSet removed last.
#
# The image is ours, not upstream's, and that is deliberate (ADR 0010): CloudNativePG's `initdb` runs as uid 26
# and resolves that uid through `/etc/passwd`, while Immich's image defines `postgres` at 999. The `Cluster` CRD
# exposes no `securityContext`/`runAsUser` (`kubectl explain cluster.postgresql.cnpg.io.spec` has neither), so
# the uid has to come from the image: `bismigel/immich-pg` is Immich's pinned build plus that one line, so every
# extension (`vchord` 0.4.3, `vector` 0.8.1) stays exactly the pairing Immich wrote its indexes with. Rebuilding
# Postgres with the extensions ourselves was rejected for exactly that reason — a wrong pairing corrupts vectors
# silently, and this is the application where a lost photo is not acceptable.
#
# Two other constraints measured the hard way on 2026-11-05:
#   * `network-policies/allow-apiserver-egress.yaml` must exist, or the instance manager cannot read its own
#     `Cluster` object from this default-deny namespace (`dial tcp 10.43.0.1:443: i/o timeout`);
#   * Postgres **14**, not 16 — a major-version jump is not part of making it HA.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
spec:
  instances: 2
  # `tag@digest`, never a bare digest: CNPG reads the tag to decide whether a change stays within one major
  # version, and rejects a sha ("Can't use just the image sha as we can't detect upgrades") as well as a commit
  # tag ("invalid version tag"). `14.19` is the server version of the pinned base; the digest decides what runs.
  # The image is built by Forgejo Actions and pushed to the estate's own registry (git.bismigel.dev),
  # not ghcr.io: the build no longer depends on GitHub's runners or a GHCR credential. Same tag (`14.19`,
  # which CNPG parses for major-version upgrades) and the digest decides what runs (ADR 0007).
  #
  # Re-pinned 2026-11-25 after the rebuild: zot's storage lived in the cluster that was wiped, so this
  # digest resolved to nothing and the bootstrap sat in ImagePullBackOff. Rebuilt from the public
  # `github.com/bismigel/immich-pg` Dockerfile (unchanged) and pushed to zot with skopeo from inside the
  # cluster - the registry is not reachable from the workstation, and the workstation build is the same
  # Dockerfile, so the digest differs from CI's while the image content does not. The tag still tells
  # CNPG this is Postgres 14; the digest decides what runs.
  imageName: registry.bismigel.dev/bismigel/immich-pg:14.19@sha256:7d67c7f70ccb10647efd5160c2904f8eb1d1457f75b92505480e40f5053a6135
  imagePullSecrets:
    # zot, the estate's one registry for its own images - the same `registry-cred` shape media-mcp uses, so
    # there is a single pattern rather than two. ghcr-secret stays because the owner wants the GHCR
    # credential for one-off work against GitHub (and upstream.yml still talks to ghcr.io); it is not needed
    # for this pod to start.
    - name: registry-cred
    - name: ghcr-secret
  primaryUpdateStrategy: unsupervised

  storage:
    storageClass: longhorn
    size: 10Gi

  # A FRESH cluster, with the data loaded from the nightly logical dump - not the barman plugin.
  #
  # The intent on 2026-11-25 was `bootstrap.recovery` from the plugin, and it looks right on paper.
  # It does not work on this pair (plugin v0.16.0 sidecar, operator 1.30.1): the instance manager
  # runs an initdb-shaped bootstrap, writes `.check-empty-wal-archive`, sets `Initialized=True`
  # against an empty data directory, and never asks the plugin for a restore. The plugin logs no
  # restore request at all. The Application then sits at "Waiting for the instances to become
  # active" forever, which is indistinguishable from a slow restore.
  #
  # So Immich is restored the boring way, which is also the way that was rehearsed on 2026-11-21
  # (1565/1565 files, tables identical but for `kysely_migrations`): initdb with Immich's
  # extensions, then `psql` the nightly `pg_dump` into it. The dump comes out of the appdata
  # archive in R2 and has been extracted to /root/immich-db.sql.gz on the control-plane node.
  #
  # The initdb branch is therefore live again. When the plugin path is fixed, the shape to restore
  # is recorded in HANDOFF.md.
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE;
        - CREATE EXTENSION IF NOT EXISTS unaccent CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp" CASCADE;

  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }

  # Durability that does not depend on a nightly script: WAL continuously and a base backup daily, through the
  # Barman Cloud Plugin (`immich-pg-objectstore.yaml` explains the choice and why the native stanza cannot work with
  # Immich's image).
  #
  # `isWALArchiver: true` is what makes this plugin responsible for archiving rather than only for backups — without
  # it the cluster has base backups and no point-in-time recovery, which is the half that matters.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-r2

  postgresql:
    # The Immich image ships this at `/etc/postgresql/postgresql.conf` line 3, but CloudNativePG generates the
    # configuration itself, so the file is not consulted. Without it the bootstrap dies at
    # `ERROR: vchord must be loaded via shared_preload_libraries. (SQLSTATE XX000)`.
    #
    # This is a **dedicated field**, not a `parameters` entry: `parameters.shared_preload_libraries` is refused as
    # "Can't set fixed configuration parameter" in this operator version, and the field's own description is
    # "Lists of shared preload libraries to add to the default ones".
    shared_preload_libraries:
      - vchord
      - vectors

    parameters:
      max_connections: "100"
      shared_buffers: "192MB"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
