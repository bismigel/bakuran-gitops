# Daily base backup of Forgejo's database, on top of continuous WAL archiving (see forgejo-pg-objectstore.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: forgejo-pg-daily
  namespace: forgejo
spec:
  # 03:33 UTC, staggered from Immich (03:17) so the three CNPG base backups do not run at once.
  schedule: "0 33 3 * * *"
  backupOwnerReference: self
  cluster:
    name: forgejo-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: forgejo-r2
      # serverName (2026-11-25): the cluster rebuilt on 2026-11-24 has a new system ID, and the plugin refuses to archive
      # into a folder that holds another system's WAL (ContinuousArchiving=False, 'Expected empty archive'). The old
      # folder <name>/ keeps the pre-loss backups and WAL - it is how Forgejo's database was recovered to 2026-11-24 17:58
      # on 2026-11-25 - so it is left alone, and this cluster writes to its own. Change it only together with a rebuild.
      serverName: forgejo-pg-2026-11-24
  immediate: false
