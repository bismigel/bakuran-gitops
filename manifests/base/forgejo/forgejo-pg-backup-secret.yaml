# R2 credentials for CloudNativePG's Barman Cloud Plugin — WAL archiving and base backups for Forgejo's database.
#
# Until 2026-11-19 Forgejo's database had **no backup at all**: its repositories live in `appdata` (nightly tar.age to
# R2), but the database that holds users, issues, PRs and tokens existed in one place. This closes that gap with the same
# mechanism Immich has used since story 8.2 — CNPG streams WAL continuously and takes a base backup daily, so the
# durability no longer depends on a nightly script remembering a pod name.
#
# Same R2 keys every other backup uses (`homelab-backup.env` on `.82` is built from the same pair). A dedicated,
# bucket-scoped token would be better and remains a follow-up rather than a pretence (same note as Immich's file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-pg-backup
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-pg-backup
    creationPolicy: Owner
    template:
      data:
        # Key names are CNPG's, not Bitwarden's: `s3Credentials` below binds them explicitly.
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        ACCESS_SECRET_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: r2-access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: r2-secret-access-key
