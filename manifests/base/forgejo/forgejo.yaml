# Forgejo — the estate's origin, mirrored to GitHub (ADR 0015).
#
# Since ADR 0015 this instance is the system of record: pushes land here and are push-mirrored out to
# GitHub, while the older pull mirrors from GitHub are kept for the repositories that still live there.
# Either direction needs a GitHub credential, and it is held here rather than in Forgejo's own database
# (it used to be configured only in the UI, so a volume rebuild silently broke every mirror).
#
# Secrets are NOT in git. `forgejo-secrets` is rendered by External Secrets from Bitwarden Secrets
# Manager (keys `forgejo-secret-key`, `forgejo-admin`, `forgejo-board-token`, `github-pat`).
# `GITHUB_MIRROR_TOKEN` (Bitwarden `github-pat`) is projected into that Secret and wired into git's
# `url.*.insteadOf` by the `git-mirror-auth` initContainer below, so no repository's git config is
# hand-edited and a rebuild reproduces the working mirror authentication.
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: forgejo-secrets
    creationPolicy: Owner
    template:
      data:
        GITEA__security__SECRET_KEY: "{{ .secret_key }}"
        FORGEJO_ADMIN_PASSWORD: "{{ .admin_password }}"
        # A scoped API token for tooling that must not hold the admin password:
        # `homelab-context/scripts/board-sync.sh` collects `/approve` decisions from the issue
        # board into the ticket store. Until 2026-11-04 that script minted a token from the
        # admin password on every run and revoked it, because the token had nowhere to live.
        #
        # `forgejo-board-token`, not `forgejo-api-token`: the latter already exists and is scoped
        # for something else (no `read:issue`), and rotating a credential to suit a new consumer
        # is how two things break at once.
        FORGEJO_API_TOKEN: "{{ .api_token }}"
        # The GitHub mirror credential. Declared here because it has to exist in Forgejo's environment
        # for the initContainer to write it into git's config: a credential that lives only in the web
        # UI is a credential a rebuild loses, and mirroring then fails quietly once a day.
        GITHUB_MIRROR_TOKEN: "{{ .github_pat }}"
  data:
    - { secretKey: secret_key, remoteRef: { key: forgejo-secret-key } }
    - { secretKey: admin_password, remoteRef: { key: forgejo-admin } }
    - { secretKey: api_token, remoteRef: { key: forgejo-board-token } }
    - { secretKey: github_pat, remoteRef: { key: github-pat } }
---
# `forgejo-data` (ReadWriteOnce, the sqlite era's volume) is no longer declared: `/data` moved to
# `forgejo-data-rwx` when the second replica landed on 2026-11-05, and the sqlite database it held was
# superseded by Postgres. Leaving the declaration here is what made ArgoCD *recreate* the volume after
# it was deleted by hand — a GitOps system does exactly what the repository says, so removing a live
# object without removing its declaration is a rename, not a deletion.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  # Two replicas, and every blocker is now cleared and was cleared separately: the database is
  # Postgres with sessions in it (2026-11-05), and `/data` is ReadWriteMany so a second pod on a
  # second node can mount it (Longhorn RWX mounted only after the FHS mount helpers landed on the
  # nodes — see modules/base.nix in bakuran-infra).
  replicas: 2
  # SQLite on a Longhorn volume: one writer, so never two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      # Pod level, not container level: `terminationGracePeriodSeconds` is a PodSpec field, and at
      # container level the API server prunes it while kubeconform rejects it. CI caught exactly that
      # (``additional properties 'terminationGracePeriodSeconds' not allowed``) — and I merged the red
      # check, because the poll loop in my own command fell through to `gh pr merge` instead of gating
      # on it. Both mistakes are in this commit's history rather than tidied away.
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      # Required, not preferred: homelab-context ADR 0008 — placement is a preference unless
      # correctness demands a pin, and two Forgejo pods on one node is one pod with extra steps.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
      initContainers:
        # Mirror authentication, declared instead of hand-configured.
        #
        # WHY `url.*.insteadOf` + `include.path` and NOT `credential.helper`: Forgejo invokes
        # `git -c credential.helper= fetch` on every pull mirror (HOME=/data/gitea/home), and that
        # explicit empty `-c` clears any helper configured behind the scenes. `url.*.insteadOf` is
        # applied when git rewrites the remote URL - before HTTP authentication, and without touching
        # any repository's `config` file - so the credentialed form of the URL is what git asks the
        # server for. The rewrite rules live in a separate 0600 file (`.git-mirror-auth`) so the token
        # is not copied into every repository config, and both git config locations Forgejo may read
        # (`/data/gitea/home/.gitconfig` for the server, `/data/git/.gitconfig` for maintenance git)
        # include it by path.
        #
        # The token is never echoed: `set -x` is not used anywhere here, and the script is `-e` only so
        # a failure stops the pod rather than leaving half a credential behind.
        - name: git-mirror-auth
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: GITHUB_MIRROR_TOKEN
              valueFrom:
                secretKeyRef: { name: forgejo-secrets, key: GITHUB_MIRROR_TOKEN }
          volumeMounts:
            - { name: data, mountPath: /data }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /data/gitea/home /data/git
              umask 077
              cat > /data/gitea/home/.git-mirror-auth <<EOF
              [url "https://bismigel:${GITHUB_MIRROR_TOKEN}@github.com/"]
              	insteadOf = https://bismigel@github.com/
              [url "https://oauth2:${GITHUB_MIRROR_TOKEN}@github.com/"]
              	insteadOf = https://oauth2@github.com/
              EOF
              printf 'https://bismigel:%s@github.com\n' "$GITHUB_MIRROR_TOKEN" > /data/gitea/home/.git-credentials
              chmod 600 /data/gitea/home/.git-mirror-auth /data/gitea/home/.git-credentials
              umask 022
              for cfg in /data/gitea/home/.gitconfig /data/git/.gitconfig; do
                touch "$cfg"
                grep -qF 'path = /data/gitea/home/.git-mirror-auth' "$cfg" || printf '\n[include]\n\tpath = /data/gitea/home/.git-mirror-auth\n' >> "$cfg"
              done
      containers:
        - name: forgejo
          # Pinned by digest: CI fails on a floating tag.
          image: codeberg.org/forgejo/forgejo@sha256:946243edbab116d5bb78b73ea68af6f3d69229ba1b1ed958dd82c3481167f3e0
          ports:
            - name: http
              containerPort: 3000
          env:
            # --- identity ---
            - { name: GITEA__server__DOMAIN, value: git.bismigel.dev }
            - { name: GITEA__server__ROOT_URL, value: "https://git.bismigel.dev/" }
            - { name: GITEA__server__HTTP_PORT, value: "3000" }
            - { name: GITEA__server__PROTOCOL, value: http }
            # --- no SSH listener: git over HTTPS only, so nothing new to expose ---
            - { name: GITEA__server__DISABLE_SSH, value: "true" }
            - { name: GITEA__server__START_SSH_SERVER, value: "false" }
            # --- database: Postgres, since 2026-11-05 (epic 8, story 8.1) ---
            #
            # It was SQLite deliberately: small, critical data on Longhorn, 36 repos of git objects
            # are small. That reasoning was about *durability*, and it still holds — Longhorn gives
            # the file three replicas. What it could never give was a second writer, so Forgejo could
            # not have a second replica, and a single Deployment is not HA whatever its storage does.
            #
            # The cutover kept the data: `forgejo dump -d postgres` emitted a 3.97 MB Postgres-dialect
            # SQL dump, which was imported into `forgejo-postgres` **before** this change, and the
            # counts matched exactly (34 issues, 36 repos, 1 user, 3 tokens). The SQLite file is still
            # at /data/gitea/gitea.db on the PVC — untouched, as the fallback, not deleted.
            - { name: GITEA__database__DB_TYPE, value: postgres }
            # The CNPG cluster's read-write service, not the single StatefulSet: the service always
            # points at whichever instance is primary, so a promotion is a DNS-level change Forgejo
            # does not have to know about. Cut over 2026-11-05 after a dump/restore verified identical
            # counts (39 issues, 36 repos, 1 user, 3 tokens) on both sides.
            - { name: GITEA__database__HOST, value: "forgejo-pg-rw:5432" }
            - { name: GITEA__database__NAME, value: forgejo }
            - { name: GITEA__database__USER, value: forgejo }
            - { name: GITEA__database__SSL_MODE, value: disable }
            # Sessions go to the database, not to files. This is not needed at one replica and is
            # exactly what breaks at two: file-based sessions are per-pod, so a second replica would
            # log users out alternately depending on which pod answered.
            - { name: GITEA__session__PROVIDER, value: db }
            # Queues and cache go to Valkey: the default queue backend is a LevelDB directory under
            # /data, which is single-writer even on ReadWriteMany storage — the second replica died on
            # `unable to lock level db … resource temporarily unavailable`. A file lock is not solved
            # by a shared filesystem; it is solved by not using a file.
            - { name: GITEA__queue__TYPE, value: redis }
            - { name: GITEA__queue__CONN_STR, value: "redis://forgejo-redis:6379/0" }
            - { name: GITEA__cache__ADAPTER, value: redis }
            - { name: GITEA__cache__HOST, value: "redis://forgejo-redis:6379/1" }
            # --- closed by default ---
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__service__REQUIRE_SIGNIN_VIEW, value: "true" }
            # Actions on (2026-11-15): GitHub Actions hit its monthly minute ceiling, and this instance is the
            # estate's own hardware. The runner is a separate workload; this is what lets it register.
            - { name: GITEA__actions__ENABLED, value: "true" }
            # --- mirrors ---
            - { name: GITEA__mirror__DEFAULT_INTERVAL, value: 24h0m0s }
            - { name: GITEA__mirror__MIN_INTERVAL, value: 10m0s }
            - { name: GITEA__repository__DEFAULT_PRIVATE, value: private }
            - { name: GITEA__log__LEVEL, value: Info }
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef: { name: forgejo-db, key: POSTGRES_PASSWORD }
          envFrom:
            - secretRef:
                name: forgejo-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          # A killed replica took the *surviving* one down with it for 17 seconds (measured
          # 2026-11-05, 45 one-second probes: 200,200,…,000 ×17,…,200). The cause was the default
          # `timeoutSeconds: 1` on a probe that touches `/api/healthz` while `/data` is an NFS mount:
          # when the dead pod's mount was torn down, the live pod's probe timed out once, the kubelet
          # killed it, and both replicas restarted together — a two-replica service with a
          # one-replica failure mode.
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            # Five seconds, not one: a liveness probe is for "this process is wedged", not for
            # "the network blipped for a moment". Being killed by a transient is worse than being
            # restarted late.
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the endpoint be removed before the process exits, so in-flight requests go to
              # the other replica instead of a socket that is closing.
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-rwx



---
# Two replicas are not HA if one drain takes both. `minAvailable: 1` over two pods is satisfiable —
# unlike the earlier attempt, where it was applied to a one-pod Deployment and pinned ALLOWED
# DISRUPTIONS to 0, blocking every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: forgejo
  namespace: forgejo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo

---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
spec:
  ingressClassName: nginx
  rules:
    - host: git.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 3000
---
# Two Forgejo replicas share `forgejo-data-rwx`, and git maintenance is not safe to interrupt: a
# maintenance run that is killed (pod eviction, node drain, a second replica racing the same repository)
# can leave a 0-byte `commit-graph-chain.lock` behind, and git refuses to run maintenance on that
# repository again until the lock is gone — permanently, because nothing else ever removes it. The
# symptom is not an error, it is a repository whose mirrors simply stop being updated.
#
# So this sweeps locks nobody can still be holding: 0 bytes (the lock file is created empty and written
# to only by the process that holds it) and older than 60 minutes (well past any maintenance run on
# repositories this size). A lock with content, or a fresh one, is left alone.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-lock-gc
  namespace: forgejo
spec:
  schedule: "17 * * * *"
  # One sweep at a time: two pods racing the same `find -delete` is another way to lose a lock.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: gc
              image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 64Mi }
              volumeMounts:
                - name: data
                  mountPath: /data
              command:
                - /bin/sh
                - -ec
                - find /data/git/repositories -name 'commit-graph-chain.lock' -size 0 -mmin +60 -print -delete
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: forgejo-data-rwx
