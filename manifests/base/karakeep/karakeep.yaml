# Karakeep — self-hosted "bookmark everything" with AI auto-tagging.
# Self-hosted stack per upstream compose: karakeep (web+jobs, SQLite), a headless
# Chrome for archiving, and Meilisearch for full-text search.
# AI: LOCAL Ollama only (no OPENAI_API_KEY): qwen3:8b for text, qwen3-vl:8b for images.
#
# Cluster-agnostic on purpose. The public hostname, the NextAuth URL it must
# generate links with, and the Ollama endpoint are environment facts, so they live
# in manifests/overlays/<env>/karakeep — not here. Storage class stays in the base
# for the same reason it does in manifests/base/books: every cluster can name one,
# and an overlay that needs a different one patches it.
apiVersion: v1
kind: Namespace
metadata:
  name: karakeep
  labels:
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-secrets
  namespace: karakeep
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: karakeep-secrets
    template:
      data:
        meili-master-key: "{{ .meili }}"
        nextauth-secret: "{{ .auth }}"
  data:
    - { secretKey: meili, remoteRef: { key: karakeep-meili-key } }
    - { secretKey: auth, remoteRef: { key: karakeep-nextauth-secret } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data
  namespace: karakeep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-data
  namespace: karakeep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
  labels: { app: karakeep }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: karakeep } }
  template:
    metadata: { labels: { app: karakeep } }
    spec:
      containers:
        - name: karakeep
          # 0.34.1 -> 0.35.0 (2026-11-21). The parts that matter to this manifest:
          #
          #   * **no data-dir migration.** The images gained `no_new_privs` and dropped almost all
          #     capabilities (#3276) but still start as root, and upstream says so explicitly: "moving
          #     away from root altogether isn't a backward compatible change". So `/data` keeps its
          #     ownership and there is nothing to chown. Going unprivileged is a deliberate future
          #     change with its own PR, not a side effect of a tag bump.
          #   * the release is mostly **security** (open redirect on /signup GHSA-xcgp-hwgr-q92j, SSRF
          #     guard for NAT64/IPv4-translated addresses GHSA-r2p4-9phf-453g, and a batch of
          #     authorisation fixes on shared lists) plus a web/mobile redesign. That is the reason to
          #     take it in a week when nothing else is moving.
          #   * no env changes: `NEXTAUTH_*`, `AUTH_TRUSTED_ORIGINS` and `DATA_DIR` are untouched
          #     upstream, so the env block below stays as the 0.34 migration left it.
          #
          # Digest read from the registry header for the tag, not typed (ADR 0007):
          #   ghcr.io/v2/karakeep-app/karakeep/manifests/0.35.0 -> Docker-Content-Digest
          #
          # 0.33.2 -> 0.34.1 (2026-11-06). The release notes are unusually specific about this one:
          #
          #   * auth moved from next-auth to **better-auth**; web sessions become database sessions instead of JWTs, so
          #     **everyone is signed out once** and must sign in again. Not a bug — it is the migration;
          #   * `NEXTAUTH_URL` and `NEXTAUTH_SECRET` keep their names and are still required (both are set below), and a
          #     new `AUTH_TRUSTED_ORIGINS` defaults to `*`;
          #   * the schema migration runs automatically on first boot, which is why a copy of `/data` was taken before
          #     the rollout (57 bookmarks / 78 assets) and compared after;
          #   * emails are lowercased in the database as part of the auth move.
          #
          # Digest taken from the registry header, not typed (ADR 0007).
          image: ghcr.io/karakeep-app/karakeep:0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
          env:
            - { name: DATA_DIR, value: /data }
            # Public registration closed (no invite UI exists; open it briefly to
            # add someone, then set this back to "true").
            - { name: DISABLE_SIGNUPS, value: "true" }
            - { name: MEILI_ADDR, value: "http://meilisearch:7700" }
            - { name: BROWSER_WEB_URL, value: "http://chrome:9222" }
            - name: MEILI_MASTER_KEY
              valueFrom: { secretKeyRef: { name: karakeep-secrets, key: meili-master-key } }
            - name: NEXTAUTH_SECRET
              valueFrom: { secretKeyRef: { name: karakeep-secrets, key: nextauth-secret } }
            # --- AI: local Ollama (qwen) only ---
            - { name: INFERENCE_TEXT_MODEL, value: "qwen3:8b" }
            - { name: INFERENCE_IMAGE_MODEL, value: "qwen3-vl:8b" }
            - { name: INFERENCE_ENABLE_AUTO_TAGGING, value: "true" }
            - { name: INFERENCE_ENABLE_AUTO_SUMMARIZATION, value: "true" }
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: karakeep-data }
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
  labels: { app: karakeep }
spec:
  selector: { app: karakeep }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: karakeep
  labels: { app: chrome }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: chrome } }
  template:
    metadata: { labels: { app: chrome } }
    spec:
      containers:
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:49b5eaf63cac3b6ad6a28b2ce0cd421486f440a49db41221af6c1b3229d139bd
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
          ports:
            - { name: debug, containerPort: 9222 }
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: chrome
  namespace: karakeep
  labels: { app: chrome }
spec:
  selector: { app: chrome }
  ports:
    - { name: debug, port: 9222, targetPort: 9222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: karakeep
  labels: { app: meilisearch }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: meilisearch } }
  template:
    metadata: { labels: { app: meilisearch } }
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
          env:
            - { name: MEILI_NO_ANALYTICS, value: "true" }
            - name: MEILI_MASTER_KEY
              valueFrom: { secretKeyRef: { name: karakeep-secrets, key: meili-master-key } }
          ports:
            - { name: http, containerPort: 7700 }
          volumeMounts:
            - { name: data, mountPath: /meili_data }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: meilisearch-data }
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: karakeep
  labels: { app: meilisearch }
spec:
  selector: { app: meilisearch }
  ports:
    - { name: http, port: 7700, targetPort: 7700 }
