# Karakeep — self-hosted "bookmark everything" with AI auto-tagging.
# Self-hosted stack per upstream compose: karakeep (web+jobs, SQLite), a headless
# Chrome for archiving, and Meilisearch for full-text search.
# AI: LOCAL Ollama only (no OPENAI_API_KEY): qwen3:8b for text, qwen3-vl:8b for images.
#
# Cluster-agnostic on purpose. The public hostname, the NextAuth URL it must
# generate links with, and the Ollama endpoint are environment facts, so they live
# in manifests/overlays/<env>/karakeep — not here. Storage class stays in the base
# for the same reason it does in manifests/base/books: every cluster can name one,
# and an overlay that needs a different one patches it.
apiVersion: v1
kind: Namespace
metadata:
  name: karakeep
  labels:
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-secrets
  namespace: karakeep
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: karakeep-secrets
    template:
      data:
        meili-master-key: "{{ .meili }}"
        nextauth-secret: "{{ .auth }}"
  data:
    - { secretKey: meili, remoteRef: { key: karakeep-meili-key } }
    - { secretKey: auth, remoteRef: { key: karakeep-nextauth-secret } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data
  namespace: karakeep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-data
  namespace: karakeep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
  labels: { app: karakeep }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: karakeep } }
  template:
    metadata: { labels: { app: karakeep } }
    spec:
      containers:
        - name: karakeep
          # 0.34.1 -> 0.35.0 (2026-11-20). Upstream's own heading for this one is "security and polish", and the
          # list is long: a high-severity path traversal in avatar cleanup that let a signed-in user delete files
          # outside their asset directory (GHSA-qh82-x2c9-f2x7), webhook bearer tokens and bodies following a
          # redirect to another origin, rate limits that trusted client-supplied IPs, an open redirect on /signup,
          # and the November 2026 Node.js advisory set (24.22.3, seven high) baked into the image.
          #
          # The image also drops privileges: it starts with no_new_privs and almost no capabilities instead of
          # root-with-defaults. If the data dir turns out to be unwritable after this bump, the documented escape
          # hatch is KARAKEEP_DISABLE_PRIVILEGE_DROP=true - but read the `WARNING: couldn't ...` line in the log
          # first; the flag hides a real permission problem rather than fixing it.
          #
          # Digest taken from the registry header, not typed (ADR 0007).
          image: ghcr.io/karakeep-app/karakeep:0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
          env:
            - { name: DATA_DIR, value: /data }
            # Public registration closed (no invite UI exists; open it briefly to
            # add someone, then set this back to "true").
            - { name: DISABLE_SIGNUPS, value: "true" }
            - { name: MEILI_ADDR, value: "http://meilisearch:7700" }
            - { name: BROWSER_WEB_URL, value: "http://chrome:9222" }
            - name: MEILI_MASTER_KEY
              valueFrom: { secretKeyRef: { name: karakeep-secrets, key: meili-master-key } }
            - name: NEXTAUTH_SECRET
              valueFrom: { secretKeyRef: { name: karakeep-secrets, key: nextauth-secret } }
            # --- AI: local Ollama (qwen) only ---
            - { name: INFERENCE_TEXT_MODEL, value: "qwen3:8b" }
            - { name: INFERENCE_IMAGE_MODEL, value: "qwen3-vl:8b" }
            - { name: INFERENCE_ENABLE_AUTO_TAGGING, value: "true" }
            - { name: INFERENCE_ENABLE_AUTO_SUMMARIZATION, value: "true" }
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: karakeep-data }
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
  labels: { app: karakeep }
spec:
  selector: { app: karakeep }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: karakeep
  labels: { app: chrome }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: chrome } }
  template:
    metadata: { labels: { app: chrome } }
    spec:
      containers:
        - name: chrome
          # `release` is a floating tag, so the digest is the pin - and 0.35.0 rebuilt it: no setuid binaries,
          # no_new_privs, and the option of Chrome's own sandbox (KARAKEEP_CHROME_SANDBOX, not enabled here).
          image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:00fb4fa9c37aa74c58e74d0bdd16c4e3b81dddb5f264917c879f9579c3b3ad95
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
          ports:
            - { name: debug, containerPort: 9222 }
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: chrome
  namespace: karakeep
  labels: { app: chrome }
spec:
  selector: { app: chrome }
  ports:
    - { name: debug, port: 9222, targetPort: 9222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: karakeep
  labels: { app: meilisearch }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: meilisearch } }
  template:
    metadata: { labels: { app: meilisearch } }
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
          env:
            - { name: MEILI_NO_ANALYTICS, value: "true" }
            - name: MEILI_MASTER_KEY
              valueFrom: { secretKeyRef: { name: karakeep-secrets, key: meili-master-key } }
          ports:
            - { name: http, containerPort: 7700 }
          volumeMounts:
            - { name: data, mountPath: /meili_data }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: meilisearch-data }
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: karakeep
  labels: { app: meilisearch }
spec:
  selector: { app: meilisearch }
  ports:
    - { name: http, port: 7700, targetPort: 7700 }
