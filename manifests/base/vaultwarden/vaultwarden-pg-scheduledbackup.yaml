# Daily base backup of Vaultwarden's database, on top of continuous WAL archiving (see vaultwarden-pg-objectstore.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: vaultwarden-pg-daily
  namespace: vaultwarden
spec:
  # 03:47 UTC, staggered from Immich (03:17) and Forgejo (03:33).
  schedule: "0 47 3 * * *"
  backupOwnerReference: self
  cluster:
    name: vaultwarden-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: vaultwarden-r2
      # serverName (2026-11-25): the cluster rebuilt on 2026-11-24 has a new system ID, and the plugin refuses to archive
      # into a folder that holds another system's WAL (ContinuousArchiving=False, 'Expected empty archive'). The old
      # folder <name>/ keeps the pre-loss backups and WAL (Forgejo's was recovered from its own
      # on 2026-11-25) - so it is left alone, and this cluster writes to its own. Change it only together with a rebuild.
      serverName: vaultwarden-pg-2026-11-24
  immediate: false
