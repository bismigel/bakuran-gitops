# R2 credentials for CloudNativePG's Barman Cloud Plugin — WAL archiving and base backups for Vaultwarden's database.
#
# Until 2026-11-19 the password vault's database had **no backup at all**: it is a two-instance CNPG cluster on Longhorn,
# which survives a node loss but not a bad write, a deleted volume or a bug. This closes that gap with the same mechanism
# Immich has used since story 8.2 — continuous WAL archiving plus a daily base backup.
#
# Same R2 keys every other backup uses. A dedicated, bucket-scoped token is a follow-up (same note as Immich's file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-pg-backup
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: vaultwarden-pg-backup
    creationPolicy: Owner
    template:
      data:
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        ACCESS_SECRET_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: r2-access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: r2-secret-access-key
