# The vault's two accounts - the owner's and Ciceley's - created by a declared Job rather than by a script somebody ran
# once (2026-11-12; Ciceley's added 2026-11-25).
#
# Why a Job and not a note in a runbook: everything else here is reproducible from git. If this database is ever
# restored to empty - as it was by the 2026-11-24 rebuild - the accounts must exist without anyone remembering how to
# make them.
#
# **How an account is made while sign-ups stay closed** (SIGNUPS_ALLOWED=false, app.yaml): the Job logs in to the admin
# API with ADMIN_TOKEN and invites the address (`POST /admin/invite`). An invited address may then register through the
# normal API even with sign-ups closed - measured 2026-11-25: `send-verification-email` answers 400 for an address
# before the invite and 200 after it.
#
# **An existing account is never touched.** Whether a registered user exists is read from the admin API (`GET
# /admin/users`, `_status` 0 = registered, 1 = invited only) - not inferred from a failed login, and not from
# `/identity/accounts/prelogin`, which answers unknown addresses with a made-up KDF so that it cannot be used to tell
# accounts apart (2026-11-25: one unknown address got exactly the owner's 600000-round PBKDF2). If the account exists
# and the stored password still opens it, nothing to do. If it exists and the password does not, its owner has changed
# the master password - which is theirs to do - and the Job says so and leaves it; re-registering or resetting would
# destroy the vault.
#
# Why registration is done through the API and not by inserting a row: Vaultwarden 1.37.5 expects client-side crypto
# (PBKDF2 master key, HKDF-derived enc/mac keys, a protected 64-byte symmetric key, and an RSA keypair whose private half
# is encrypted with it). A row written by hand exists and cannot log in - `{"message":"Username or password is
# incorrect"}` with nothing to indicate why. `send-verification-email` returns the token directly when mail is disabled,
# and `register/finish` consumes it, so the server writes every field in the format its own verification expects.
#
# The passwords are the initial master passwords, in Bitwarden Secrets Manager (`vaultwarden-account-password`,
# `vaultwarden-ciceley-password`). Each person should change theirs after the first login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-account
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: vaultwarden-account
    creationPolicy: Owner
  data:
    - secretKey: email
      remoteRef: { key: vaultwarden-account-email }
    - secretKey: password
      remoteRef: { key: vaultwarden-account-password }
    - secretKey: ciceley-email
      remoteRef: { key: vaultwarden-ciceley-email }
    - secretKey: ciceley-password
      remoteRef: { key: vaultwarden-ciceley-password }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-account-script
  namespace: vaultwarden
data:
  bootstrap.py: |
    #!/usr/bin/env python3
    """Ensure each declared Vaultwarden account exists, and prove a new one by logging in.

    Accounts come from VW_<n>_NAME / VW_<n>_EMAIL / VW_<n>_PASSWORD, n = 1, 2, ... until one is missing.
    """
    import base64, hashlib, hmac, http.cookiejar, json, os, secrets, sys, urllib.parse, urllib.request
    from cryptography.hazmat.primitives import hashes, serialization
    from cryptography.hazmat.primitives.asymmetric import rsa
    from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
    from cryptography.hazmat.primitives.kdf.hkdf import HKDF

    BASE = os.environ["VAULTWARDEN_URL"].rstrip("/")
    ADMIN_TOKEN = os.environ["VW_ADMIN_TOKEN"].strip()
    ITER = 600000
    b64 = lambda b: base64.b64encode(b).decode()
    # The admin session is a cookie; one opener keeps it for every call.
    opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))

    def call(method, path, body=None, form=False):
        data, headers = None, {}
        if body is not None:
            data = (urllib.parse.urlencode(body) if form else json.dumps(body)).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded" if form else "application/json"
        req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
        try:
            with opener.open(req, timeout=30) as r:
                return r.status, r.read().decode()
        except urllib.error.HTTPError as e:
            return e.code, e.read().decode()

    def enc2(pt, k_enc, k_mac):
        iv = secrets.token_bytes(16)
        pad = 16 - (len(pt) % 16)
        ct = Cipher(algorithms.AES(k_enc), modes.CBC(iv)).encryptor().update(pt + bytes([pad]) * pad)
        return f"2.{b64(iv)}|{b64(ct)}|{b64(hmac.new(k_mac, iv + ct, hashlib.sha256).digest())}"

    def users():
        code, body = call("GET", "/admin/users")
        if code != 200:
            raise SystemExit(f"GET /admin/users failed: HTTP {code}")
        return {u["email"].lower(): u for u in json.loads(body)}

    def login(email, pw_hash):
        return call("POST", "/identity/connect/token", {
            "grant_type": "password", "username": email, "password": pw_hash,
            "scope": "api offline_access", "client_id": "cli",
            "deviceType": 8, "deviceIdentifier": "account-bootstrap", "deviceName": "account-bootstrap",
        }, form=True)[0]

    def ensure(name, email, password):
        master_key = hashlib.pbkdf2_hmac("sha256", password.encode(), email.encode(), ITER, 32)
        pw_hash = b64(hashlib.pbkdf2_hmac("sha256", master_key, password.encode(), 1, 32))
        u = users().get(email)
        if u is not None and u.get("_status") != 1:
            if login(email, pw_hash) == 200:
                print(f"{email}: exists and the stored password opens it - nothing to do")
            else:
                print(f"{email}: exists; the stored password no longer opens it (changed by its owner?) - left alone")
            return True
        if u is None:
            code, body = call("POST", "/admin/invite", {"email": email})
            if code != 200:
                print(f"{email}: invite failed: HTTP {code} {body[:200]}")
                return False
            print(f"{email}: invited")
        code, body = call("POST", "/identity/accounts/register/send-verification-email", {"email": email, "name": name})
        if code != 200:
            print(f"{email}: send-verification-email failed: HTTP {code} {body[:200]}")
            return False
        token = body.strip().strip('"')
        enc_key = HKDF(algorithm=hashes.SHA256(), length=32, salt=None, info=b"enc").derive(master_key)
        mac_key = HKDF(algorithm=hashes.SHA256(), length=32, salt=None, info=b"mac").derive(master_key)
        user_key = secrets.token_bytes(64)
        priv = rsa.generate_private_key(public_exponent=65537, key_size=2048)
        code, body = call("POST", "/identity/accounts/register/finish", {
            "email": email, "name": name, "masterPasswordHash": pw_hash, "masterPasswordHint": None,
            "key": enc2(user_key, enc_key, mac_key),
            "keys": {
                "publicKey": b64(priv.public_key().public_bytes(serialization.Encoding.DER,
                                                                serialization.PublicFormat.SubjectPublicKeyInfo)),
                "encryptedPrivateKey": enc2(priv.private_bytes(serialization.Encoding.DER,
                                                               serialization.PrivateFormat.PKCS8,
                                                               serialization.NoEncryption()),
                                            user_key[:32], user_key[32:]),
            },
            "kdf": 0, "kdfIterations": ITER, "emailVerificationToken": token,
        })
        if code not in (200, 201):
            print(f"{email}: register/finish failed: HTTP {code} {body[:200]}")
            return False
        # Prove it, rather than reporting success from the register response alone.
        code = login(email, pw_hash)
        print(f"{email}: created; login returns HTTP {code}")
        return code == 200

    code, _ = call("POST", "/admin", {"token": ADMIN_TOKEN}, form=True)
    if code != 200:
        raise SystemExit(f"admin login failed: HTTP {code}")
    ok, n = True, 1
    while f"VW_{n}_EMAIL" in os.environ:
        ok &= ensure(os.environ[f"VW_{n}_NAME"], os.environ[f"VW_{n}_EMAIL"].strip().lower(), os.environ[f"VW_{n}_PASSWORD"])
        n += 1
    if n == 1:
        raise SystemExit("no accounts declared (VW_1_EMAIL missing)")
    sys.exit(0 if ok else 1)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vaultwarden-account-bootstrap
  namespace: vaultwarden
  annotations:
    # A **PostSync hook**, not a tracked resource: a Job that has completed can never match its own manifest again (its
    # status and its pod are immutable), so ArgoCD reports it OutOfSync forever and an `ArgoCDAppOutOfSync` alert fires on
    # something that is working correctly. As a hook it is re-created on each sync and not diffed - which suits an
    # idempotent bootstrap exactly: it reads the user list first and leaves every existing account alone.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      initContainers:
        # The only dependency. Installed at run time so no image has to be built and published for one script.
        - name: deps
          image: docker.io/library/python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
          command: ["sh", "-c", "pip install --quiet --target /deps cryptography"]
          volumeMounts:
            - { name: deps, mountPath: /deps }
      containers:
        - name: bootstrap
          image: docker.io/library/python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
          command: ["python", "/scripts/bootstrap.py"]
          env:
            - { name: VAULTWARDEN_URL, value: "http://vaultwarden.vaultwarden.svc.cluster.local" }
            - { name: PYTHONPATH, value: /deps }
            - name: VW_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: vaultwarden-secret, key: ADMIN_TOKEN } }
            - { name: VW_1_NAME, value: "Miguel" }
            - name: VW_1_EMAIL
              valueFrom: { secretKeyRef: { name: vaultwarden-account, key: email } }
            - name: VW_1_PASSWORD
              valueFrom: { secretKeyRef: { name: vaultwarden-account, key: password } }
            - { name: VW_2_NAME, value: "Ciceley" }
            - name: VW_2_EMAIL
              valueFrom: { secretKeyRef: { name: vaultwarden-account, key: ciceley-email } }
            - name: VW_2_PASSWORD
              valueFrom: { secretKeyRef: { name: vaultwarden-account, key: ciceley-password } }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: deps, mountPath: /deps }
      volumes:
        - { name: scripts, configMap: { name: vaultwarden-account-script } }
        - { name: deps, emptyDir: {} }
