# Pull credential for the estate's own registry, in the kagent namespace (2026-11-24).
#
# The triage CronJob used to pull `alpine` from Docker Hub, so this namespace needed no pull secret. It now runs
# `bismigel/triage-tools` from zot - the same image built from that same pinned alpine plus curl and jq - because
# installing those tools at pod start raced the pod's own DNS and left the job failing while the alert it was meant
# to triage went unread.
#
# Same shape as media/registry-cred.yaml and external-secrets/registry-cred-apps.yaml: the password is Bitwarden's
# `registry-password`, there is no second copy, and the host is the readable name the manifests use - kubelet looks
# the credential up by the name written in the image field, so they must agree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-cred
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: registry-cred
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.bismigel.dev":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: registry-username
    - secretKey: password
      remoteRef:
        key: registry-password
