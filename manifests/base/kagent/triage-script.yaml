# The loop's script, in a ConfigMap rather than inline in the CronJob: an inline block scalar is where YAML
# ends and shell begins, and quoting that wrong is invisible until the Job runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-script
  namespace: kagent
data:
  triage.sh: |
    #!/bin/sh
    set -u
    AM="http://alertmanager.monitoring.svc:9093/api/v2/alerts?active=true&silenced=false&inhibited=false"

    # Watchdog is a permanent test alert: always firing, says nothing. Triaging it would spend five model calls
    # an hour on a heartbeat. Filtered here rather than muted in Alertmanager, because muting it would also stop
    # WatchdogMissing from noticing that delivery is dead - which is the only job it has.
    alerts=$(curl -sf "$AM" 2>/dev/null | jq '[.[] | select(.labels.alertname != "Watchdog")]' 2>/dev/null)
    [ -z "$alerts" ] && { echo "alertmanager unreachable or empty"; exit 0; }
    n=$(echo "$alerts" | jq 'length')
    echo "firing alerts (excluding Watchdog): $n"
    [ "$n" -eq 0 ] && exit 0

    echo "$alerts" | jq -c '.[0:3][]' | while read -r a; do
      name=$(echo "$a" | jq -r '.labels.alertname')
      summary=$(echo "$a" | jq -r '.annotations.summary // .annotations.description // ""')
      text="Alert firing in the Bakuran homelab.

    alertname: ${name}
    summary: ${summary}

    Diagnose from the live cluster. Name ONE diagnosis, the command that confirms it, and the GitOps change you would propose. Do not propose deleting a PVC, PV or Namespace."
      body=$(jq -nc --arg t "$text" '{jsonrpc:"2.0",id:1,method:"message/send",params:{message:{role:"user",parts:[{kind:"text",text:$t}],messageId:"cron"}}}')
      ans=$(curl -sf -m 180 -X POST http://triage.kagent:8080/ -H 'Content-Type: application/json' -d "$body" \
            | jq -r '.result.artifacts[0].parts[0].text // "(no answer)"' 2>/dev/null)
      echo "--- ${name}"
      echo "$ans"

      # Straight to the chat the alert arrived in: a diagnosis nobody reads is a log line. Prefixed so it is clear
      # this is a model's reading of the cluster, not a measurement.
      #
      # Telegram rejects a message over 4096 characters with a 400, and an agent's answer is easily longer - the
      # first run failed exactly that way, silently, because `-f` hides the body. Truncated to fit, with the full
      # text left in the Job log, and the response body printed when it still fails.
      short=$(printf '%s' "${ans}" | cut -c1-3200)
      token=$(cat /etc/telegram/bot-token)
      code=$(curl -s -m 25 -o /tmp/tg.json -w '%{http_code}' -X POST \
        "https://api.telegram.org/bot${token}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=[triage] ${name} - ${summary}

    ${short}")
      if [ "$code" != "200" ]; then
        echo "telegram send failed for ${name}: http=${code} $(jq -r '.description // ""' /tmp/tg.json 2>/dev/null)"
      fi
    done
