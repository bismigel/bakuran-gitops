# The controller's chart-given RBAC is `create/update/patch/delete` on `*` (kagent-writer-role, hardcoded,
# no values toggle). This policy is what makes that survivable: the kagent controller may write only inside
# its own namespace.
#
# Two things about the first version of this file, both wrong and both worth keeping as a lesson:
#   * `PATCH` is not a valid ValidatingAdmissionPolicy operation - a PATCH request arrives at admission as
#     UPDATE, and the API rejects the policy outright.
#   * the expression had escape clauses (`... || request.operation == 'DELETE'`) that permitted exactly the
#     deletions it was meant to stop. A guard whose exception list swallows its rule is not a guard.
#
# Cluster-scoped writes have an empty request.namespace, so they are denied by the same test.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kagent-controller-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
  variables:
    - name: isKagentController
      expression: >-
        request.userInfo.username == 'system:serviceaccount:kagent:kagent-controller'
  matchConditions:
    - name: kagent-controller-only
      expression: variables.isKagentController
  validations:
    - expression: request.namespace == 'kagent'
      message: >-
        The kagent controller may only write inside namespace kagent. Any cluster-wide change belongs in
        bakuran-gitops and goes through a pull request.
