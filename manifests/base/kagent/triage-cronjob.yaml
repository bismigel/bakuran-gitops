# The trigger. Alertmanager has no webhook receiver in this cluster, so the loop is pull-based: every five
# minutes, ask the triage agent about every alert that is firing and not silenced, print the answer and send
# it to the chat the alert came from.
#
# Why a poll and not a receiver: a webhook means an ingress, a shared secret and something that must be up at
# 03:00. A poll cannot be spoofed and fails the way every other Job fails - visibly, in `ops/broken`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: triage
  namespace: kagent
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600   # above the 300s agent timeout plus apk + the other calls
      template:
        spec:
          serviceAccountName: triage-runner
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: triage-script
                defaultMode: 0555
            - name: telegram
              secret:
                secretName: kagent-telegram
                items: [{key: bot-token, path: bot-token}]
                defaultMode: 0400
          containers:
            - name: triage
              image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
              command: ["/bin/sh", "-c"]
              args:
                - apk add --no-cache curl jq >/dev/null && exec /scripts/triage.sh
              env:
                - name: TELEGRAM_CHAT_ID
                  value: "607008268"
              volumeMounts:
                - {name: script, mountPath: /scripts}
                - {name: telegram, mountPath: /etc/telegram, readOnly: true}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
