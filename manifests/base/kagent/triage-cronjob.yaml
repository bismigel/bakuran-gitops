# The trigger. Alertmanager has no webhook receiver in this cluster, so the loop is pull-based: every ten
# minutes, ask the triage agent about an alert that is firing, not silenced, and **not already triaged with the
# same `startsAt`**, then send the answer to the chat the alert came from.
#
# Every ten, not every five, and the dedupe is what makes the interval a detail rather than a cost: a six-hour
# alert used to produce ~72 agent runs and ~72 Telegram messages; it now produces one, and the schedule only
# decides how quickly a *new* alert is picked up.
#
# Why a poll and not a receiver: a webhook means an ingress, a shared secret and something that must be up at
# 03:00. A poll cannot be spoofed and fails the way every other Job fails - visibly, in `ops/broken`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: triage
  namespace: kagent
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900   # one alert: 420s agent timeout + apk install + the Telegram call
      template:
        spec:
          serviceAccountName: triage-runner
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: triage-script
                defaultMode: 0555
            - name: telegram
              secret:
                secretName: kagent-telegram
                items: [{key: bot-token, path: bot-token}]
                defaultMode: 0400
            # The loop's memory. Without it every run is a fresh pod that cannot answer "have I looked at this
            # already?" - which is how one stuck alert cost ~100 agent runs in six hours (2026-11-17).
            - name: state
              persistentVolumeClaim:
                claimName: triage-state
          # zot, not Docker Hub: the same `registry-cred` shape the estate's other workloads use.
          imagePullSecrets:
            - name: forgejo-registry-pull
          containers:
            - name: triage
              # The tools are IN this image: the same pinned alpine base plus `apk add curl jq`, built at BUILD time by
              # homelab-context's triage-image workflow. The pod needs no network to start, so it cannot lose the race
              # that failed six times over 60s on 2026-11-24 and left the alert it was meant to triage unread.
              #
              # This host, not registry.bismigel.dev: the estate has two registries and they are not interchangeable
              # (see forgejo-registry-pull.yaml). CI's token can push to this one; zot needs a writer credential that
              # lives only in the image-publishing repos. Moving this to zot later is a one-line change plus that secret.
              image: forgejo.forgejo.svc:3000/bismigel/triage-tools:sha-2d22ba38aea3@sha256:ed1b1d06436f278af4fdf1097f58be9620b3fd862eaeb21bedd2cfdefce3182d
              command: ["/bin/sh", "-c"]
              args:
                # No install step: the image carries curl and jq. A job that needs the network to start cannot
                # diagnose the network.
                - exec /scripts/triage.sh
              env:
                - name: TELEGRAM_CHAT_ID
                  value: "607008268"
              volumeMounts:
                - {name: script, mountPath: /scripts}
                - {name: telegram, mountPath: /etc/telegram, readOnly: true}
                - {name: state, mountPath: /state}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
