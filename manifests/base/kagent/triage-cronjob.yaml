# The trigger. Alertmanager has no webhook receiver in this cluster, so the loop is pull-based: every ten
# minutes, ask the triage agent about an alert that is firing, not silenced, and **not already triaged with the
# same `startsAt`**, then send the answer to the chat the alert came from.
#
# Every ten, not every five, and the dedupe is what makes the interval a detail rather than a cost: a six-hour
# alert used to produce ~72 agent runs and ~72 Telegram messages; it now produces one, and the schedule only
# decides how quickly a *new* alert is picked up.
#
# Why a poll and not a receiver: a webhook means an ingress, a shared secret and something that must be up at
# 03:00. A poll cannot be spoofed and fails the way every other Job fails - visibly, in `ops/broken`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: triage
  namespace: kagent
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900   # one alert: 420s agent timeout + apk install + the Telegram call
      template:
        spec:
          serviceAccountName: triage-runner
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: triage-script
                defaultMode: 0555
            - name: telegram
              secret:
                secretName: kagent-telegram
                items: [{key: bot-token, path: bot-token}]
                defaultMode: 0400
            # The loop's memory. Without it every run is a fresh pod that cannot answer "have I looked at this
            # already?" - which is how one stuck alert cost ~100 agent runs in six hours (2026-11-17).
            - name: state
              persistentVolumeClaim:
                claimName: triage-state
          # zot, not Docker Hub: the same `registry-cred` shape the estate's other workloads use.
          imagePullSecrets:
            - name: registry-cred
          containers:
            - name: triage
              # Alpine, with the install retried, because the prebuilt toolset cannot be pulled YET. What we know
              # now, in order, each measured on 2026-11-24: CI can only push to Forgejo's registry
              # (10.43.x:3000), kubelet cannot resolve `*.svc` names (`no such host`), and it refuses that registry's
              # plain HTTP (`server gave HTTP response to HTTPS client`) because only zot is in the nodes'
              # insecure-registries config. So the toolset belongs in ZOT, and pushing there needs the writer
              # credential that lives in the image-publishing repos. Once that secret exists on this repository's CI,
              # the workflow merged in homelab-context already targets zot and this line becomes a pin.
              image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
              command: ["/bin/sh", "-c"]
              args:
                # Temporary, until the toolset is publishable to zot: `apk update` first and retried together with the
                # add, six attempts over ~60s. It only buys the pod's resolver time to settle.
                - |
                  set -e
                  n=0
                  until apk update >/dev/null 2>&1 && apk add --no-cache curl jq >/dev/null; do
                    n=$((n+1))
                    if [ "$n" -ge 6 ]; then echo "apk add failed after $n attempts" >&2; exit 1; fi
                    sleep 10
                  done
                  exec /scripts/triage.sh
              env:
                - name: TELEGRAM_CHAT_ID
                  value: "607008268"
              volumeMounts:
                - {name: script, mountPath: /scripts}
                - {name: telegram, mountPath: /etc/telegram, readOnly: true}
                - {name: state, mountPath: /state}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
