apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deepseek-key.yaml
  - telegram-key.yaml
  - agent-triage.yaml
  # 7.7: the submitter. Two tools, one verb, caged by guard-tools-vap.yaml.
  - agent-diagnose.yaml
  - triage-runner-rbac.yaml
  - triage-state-pvc.yaml
  - triage-script.yaml
  - triage-cronjob.yaml
  - guard-vap.yaml
  - guard-vap-binding.yaml
  # 7.7/10.14: the tool server may create Workflows in argo, and may not write anything else anywhere.
  - guard-tools-vap.yaml
  - guard-tools-vap-binding.yaml
  # The Role the agent submits through. It lives in this directory because the boundary is kagent's, and in
  # namespace argo because that is where the Workflows are.
  - runbook-submitter-rbac.yaml
  # The tool server is NOT here: it is owned by the chart's Application, so the move from chart-owned to
  # declared-owned happens inside one app. See manifests/base/kagent/tool-server/.
