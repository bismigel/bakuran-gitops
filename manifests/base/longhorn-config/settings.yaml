# Longhorn Settings that aren't rendered by the chart's default-setting template.
# Declared here so they're reproducible (previously set out-of-band).
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: support-bundle-manager-image
  namespace: longhorn-system
value: docker.io/longhornio/support-bundle-kit:v0.0.98
---
# Longhorn reserves *provisioned* size, not written bytes, and at 100 % it treats a 15 GiB PVC as
# 15 GiB of disk even when 330 MiB is written. Measured 2026-11-05 across all volumes:
#
#   requested 123 GiB      actually used 9.2 GiB      <- 13x over-request
#
# That made `patola-thinkcentre:/mnt/data` look 97 % full (119 GiB scheduled of 135 GiB) while the
# filesystem held 12 GiB, and blocked new replica scheduling for no physical reason. 200 % is the
# setting Longhorn provides for exactly this: it says "requests are conservative, allow up to twice
# the disk". Reverting is one value.
#
# It is only safe because a real-space alert exists as well (`LonghornDiskActualSpaceLow`, added in
# the same change). Over-provisioning without a bytes-based alarm is how a filesystem fills silently.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: storage-over-provisioning-percentage
  namespace: longhorn-system
value: "200"
---
# Replicas were placed as volumes were created, so the disks drifted apart: on 2026-11-05 the
# promises were 122 GiB on `.81:/mnt/longhorn`, 111 GiB on `.80:/mnt/data` and 90 GiB on
# `.82:/mnt/media-nvme`, with `.80` holding the smallest disk (135 GiB) closest to its limit.
# Raising the over-provisioning allowance made that invisible rather than fixing it.
#
# `best-effort` lets Longhorn move replicas itself when a disk is out of balance with the others,
# instead of leaving every future volume to land wherever the scheduler happens to look. It is
# deliberately not `least-effort`: with three disks of very different sizes the point is to actually
# balance, and a volume rebuild is cheap here (9 GiB of real data across all volumes).
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance
  namespace: longhorn-system
value: best-effort
---
# Two settings that decide whether "survive one node" is true, reviewed against the measured state on 2026-11-19.
#
# 1. replica-soft-anti-affinity was `false`. It is the knob that tells Longhorn it MAY put two replicas of one volume on
#    the same node when space is tight - which quietly turns a three-replica volume into a two-node promise at exactly the
#    moment something is already rebuilding. With three nodes and three replicas the spread costs nothing today (every
#    3-replica volume has one replica per node, measured), and `true` is what keeps that true as volumes are rebuilt.
#
# 2. replica-auto-balance-disk-pressure-percentage was 90. A disk at 90 % used has 10 % free, which is below the 25 %
#    `storage-minimal-available-percentage` floor - so the rebalance would start evacuating a disk at the point the pool
#    can no longer accept what it moves. 80 leaves a margin where both ends of that move are legal.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-soft-anti-affinity
  namespace: longhorn-system
value: "true"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance-disk-pressure-percentage
  namespace: longhorn-system
value: "80"
