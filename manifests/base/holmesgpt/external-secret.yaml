# The same DeepSeek key the Hermes agent uses - no new credential, no new Bitwarden item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmesgpt-keys
  namespace: ops-advisor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: holmesgpt-keys
  data:
    - secretKey: DEEPSEEK_API_KEY
      remoteRef:
        key: deepseek-api-key
