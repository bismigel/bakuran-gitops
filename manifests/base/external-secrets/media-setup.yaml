# The media stack's shared credential Secret, from Bitwarden.
#
# Two reads produce this Secret, on purpose:
#
#   dataFrom.extract  the 14 application values come from ONE Bitwarden item,
#                     `media-setup-config`: a JSON object whose member names are
#                     already this Secret's key names. That is one ListSecrets plus
#                     one GetSecret - 2 calls per reconcile - where a name ref per
#                     key cost 2 calls each and made the reconcile fail whenever the
#                     API stalled on any one of them. Rotate these 14 values in
#                     `media-setup-config`; editing the individual vault items no
#                     longer reaches the media stack.
#
#   data              the four keys below stay individual vault items because a
#                     second ExternalSecret reads those same items directly
#                     (overlays/prod/books/lazylibrarian-secrets.yaml and
#                     base/media/arr-auth.yaml). Copying them into the blob would
#                     give the vault two places to edit and a rotation of the shared
#                     item would leave this copy silently stale - the exact drift
#                     ESO exists to make visible.
#
# Why ESO at all: these values were mirrored into this Secret by
# bakuran-infra/scripts/media-setup-secret.sh, which preferred Bitwarden and fell
# back to scraping each app's /config. That fallback is why the copy could drift
# from the vault: after a PVC restore an app regenerates its own API key and the
# vault's copy is stale. ESO makes the vault the only writer, and makes staleness
# visible (the ExternalSecret stops syncing) instead of silent.
#
# qbt-password maps to the vault's qbittorrent-password: the Secret's key name predates the vault's naming and is kept so
# nothing that reads it has to change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-setup
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target: { name: media-setup }
  dataFrom:
    - extract: { key: media-setup-config }
  data:
    - { secretKey: lazylibrarian-api-key, remoteRef: { key: lazylibrarian-api-key } }
    - { secretKey: prowlarr-api-key,      remoteRef: { key: prowlarr-api-key } }
    - { secretKey: qbt-password,          remoteRef: { key: qbittorrent-password } }
    - { secretKey: sabnzbd-api-key,       remoteRef: { key: sabnzbd-api-key } }
