# Bitwarden Secrets Manager via the ESO provider. One store == one
# organization + project. The access token lives in the
# `bitwarden-access-token` Secret (namespace external-secrets); ESO talks to the
# Bitwarden SDK server over HTTPS. The CA is referenced **live** from the
# cert-manager-issued `bitwarden-tls-certs` secret (caProvider) so it self-heals
# after a reinstall instead of going stale like a pinned caBundle.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            key: token
            namespace: external-secrets
      organizationID: 2827e6c4-744c-4b08-8f48-b4e100fe99dc
      projectID: 9f853b6b-139a-4fdc-9795-b4e10101c750
