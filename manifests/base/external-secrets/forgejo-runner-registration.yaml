# The runner's registration token, from Bitwarden.
#
# It is consumed once, by the init container, which writes /data/.runner and never needs it again - but a pod recreated
# with a fresh volume does, and a token that lived only in a terminal is a token nobody has when that day comes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-registration
  namespace: forgejo
spec:
  refreshInterval: 24h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target: { name: forgejo-runner-registration }
  data:
    - secretKey: token
      remoteRef: { key: forgejo-runner-registration }
# NOT HERE: kagent/triage. It looks like a hand-made secret and is not one - kagent's Agent controller owns it, and ESO
# refuses to take ownership (`already owned by another Agent controller triage`). Measured 2026-11-16. Its contents are
# generated from the Agent resource, so the token it carries comes from that resource, not from a terminal.
