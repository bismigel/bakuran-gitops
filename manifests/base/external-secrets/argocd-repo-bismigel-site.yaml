# ArgoCD's read credential for bismigel-site, which is a **private** repository.
#
# It served these hostnames from one deployment, and losing the credential is how they all went
# 404 on 2026-11-25: `bismigel.dev`, `www.bismigel.dev`, `miguelarbis.dev`, `www.miguelarbis.dev`,
# `www.ciceley.cc`, `runbook.bismigel.dev`. The Application reported `Unknown` with
#
#   failed to list refs: authentication required: Repository not found.
#
# which reads like a deleted repository, not an auth problem - GitHub answers 404, not 401, to an
# unauthenticated request for a private repo.
#
# HTTPS with the estate's existing GitHub PAT (`github-pat` in Bitwarden) rather than a deploy key:
# no new key to mint, no key to leak into a slot nobody rotates, and the same PAT is already used by
# `ghcr-secret` for the registry. It is read-only in practice - ArgoCD only fetches.
#
# Contrast with status-api and tools-site next door: both are public, so they carry **no** credential
# at all. A credential on a public repository is worse than none, because ArgoCD then authenticates
# and a stale token breaks the sync (that was 2026-11-25's other bug).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-bismigel-site
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: repo-bismigel-site
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/bismigel/bismigel-site.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: ghcr-user }
    - secretKey: password
      remoteRef: { key: github-pat }
