# ArgoCD's repository credentials, from Bitwarden.
#
# Three of these were created by hand during setup. They are the most dangerous secrets in the estate to lose by
# accident: without them ArgoCD cannot read the repository, so nothing deploys and nothing self-heals.
#
# sshPrivateKey is the deploy key for the GitHub-side repos; the Forgejo one uses an HTTP read token, because Forgejo's
# own git server is inside the cluster and a token is simpler than a key there.
# 2026-11-25: the same bug as `repo-forgejo-bakuran-gitops` (deleted earlier the same day) was live in
# three more files next to this one - `argocd-repo-bismigel-site.yaml`, `-status-api.yaml` and
# `-tools-site.yaml`. Each paired GitHub's HTTPS URL with the Forgejo read token, so ArgoCD
# authenticated to a public repository with a password GitHub no longer accepts:
#
#   failed to list refs: authentication required: Invalid username or token.
#
# The effect was worse than a failed sync. `bismigel-site` is what serves bismigel.dev, and its
# Application had *no resources at all*, so the tunnel routed nine hostnames to an ingress
# controller that had no Ingress for any of them - which is exactly the 404 that started this.
# All three repositories are public and read anonymously; they are deleted rather than repaired.
#
# `repo-forgejo-bakuran-gitops` was deleted on 2026-11-25. It paired GitHub's HTTPS URL with the Forgejo
# *read token*: when the estate switched ArgoCD's read path to GitHub, the `url:` was rewritten but the
# credential was not, so ArgoCD authenticated to a public repository with a password GitHub no longer
# accepts ("Password authentication is not supported for Git operations"). Every sync of the `root`
# Application failed, and because deleting the resulting Secret did not help - this ExternalSecret
# recreated it within the hour - it looked like a stale ArgoCD cache. It was not; it was a declaration.
#
# A public repository needs no credential: anonymous HTTPS is what `git ls-remote` does inside the
# repo-server pod, and it works. The `repo-bakuran-gitops` deploy key above stays for the repos that
# are still private.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-bakuran-gitops
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: repo-bakuran-gitops
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: git@github.com:bismigel/bakuran-gitops.git
        name: bakuran-gitops
        # With a template, ESO writes ONLY what the template renders. Omitting this line produced a repository secret
        # with no key at all, and every Application went Unknown with "authentication required: Unauthorized".
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef: { key: argocd-repo-bakuran-gitops }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-private-api
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: repo-private-api
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: git@github.com:bismigel/private-api.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef: { key: argocd-repo-private-api }
---
# EasyShortlist is private from its first commit, so ArgoCD needs a credential before the Application exists -
# otherwise Phase B's first sync fails with "authentication required" and looks like a manifest problem.
#
# `argocd-repo-easyshortlist` was a Forgejo read token, and 2026-11-25 rewrote the URL to GitHub while keeping
# the token - so ArgoCD authenticated to GitHub with a password it no longer accepts and the Application sat
# Unknown ("Password authentication is not supported for Git operations"). That looked like a repo problem and was
# a credential problem, the same shape as bismigel-site's.
#
# Now the estate's GitHub PAT, the same one `ghcr-secret` and repo-bismigel-site use: one credential to rotate
# rather than one per repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-easyshortlist
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: repo-easyshortlist
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/bismigel/easyshortlist.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: ghcr-user }
    - secretKey: password
      remoteRef: { key: github-pat }
