# ArgoCD's repository credentials, from Bitwarden.
#
# Three of these were created by hand during setup. They are the most dangerous secrets in the estate to lose by
# accident: without them ArgoCD cannot read the repository, so nothing deploys and nothing self-heals.
#
# sshPrivateKey is the deploy key for the GitHub-side repos; the Forgejo one uses an HTTP read token, because Forgejo's
# own git server is inside the cluster and a token is simpler than a key there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-bakuran-gitops
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: repo-bakuran-gitops
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: git@github.com:bismigel/bakuran-gitops.git
        name: bakuran-gitops
        # With a template, ESO writes ONLY what the template renders. Omitting this line produced a repository secret
        # with no key at all, and every Application went Unknown with "authentication required: Unauthorized".
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef: { key: argocd-repo-bakuran-gitops }
---
# private-api sources from Forgejo like every other app of ours (ADR 0015). It used to clone from GitHub with its own deploy key,
# which made it the only estate-owned Application still reading the mirror; the read token below is the same one the other Forgejo
# secrets use, so nothing new had to be stored.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-forgejo-private-api
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: repo-forgejo-private-api
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: http://forgejo.forgejo.svc.cluster.local:3000/bismigel/private-api.git
        username: bismigel
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: forgejo-read-token }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-forgejo-bakuran-gitops
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: repo-forgejo-bakuran-gitops
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: http://forgejo.forgejo.svc.cluster.local:3000/bismigel/bakuran-gitops.git
        username: bismigel
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: forgejo-read-token }
