# ArgoCD's read credential for the status-api repository, now that it lives on Forgejo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-forgejo-status-api
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: repo-forgejo-status-api
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: http://forgejo.forgejo.svc.cluster.local:3000/bismigel/status-api.git
        username: bismigel
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: forgejo-read-token }
