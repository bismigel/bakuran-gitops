apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    # `privileged` deliberately: the *arr stack mounts the 826 GB mergerfs pool by
    # hostPath, which baseline forbids. Reported at restricted via audit/warn.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO config PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      initContainers:
        - name: disable-auth
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          # A reference of the form repo:tag@digest parses with a digest and NO tag, so
          # Kubernetes defaults imagePullPolicy to Always - it asks the registry even though
          # the image is cached. Pinned init containers must say IfNotPresent explicitly.
          # (2026-11-03: the four media apps were stuck in ImagePullBackOff on this one line,
          # with .81 unable to reach Docker Hub.)
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              f=/config/config.xml
              [ -f "$f" ] || exit 0
              # Auth stays enabled (v4 rejects None for remote) but is skipped
              # for local (LAN) addresses, so LAN is login-free; remote (tunnel)
              # would require the admin login.
              sed -i \
                -e 's#<AuthenticationMethod>[^<]*</AuthenticationMethod>#<AuthenticationMethod>Forms</AuthenticationMethod>#' \
                -e 's#<AuthenticationRequired>[^<]*</AuthenticationRequired>#<AuthenticationRequired>Enabled</AuthenticationRequired>#' \
                -e 's#<AllowedHosts>[^<]*</AllowedHosts>#<AllowedHosts>192.168.10.81,127.0.0.1,localhost,sonarr,radarr,prowlarr,bazarr,sonarr.media.svc,sonarr.media.svc.cluster.local,radarr.media.svc,radarr.media.svc.cluster.local,prowlarr.media.svc,prowlarr.media.svc.cluster.local,sonarr.bismigel.dev,radarr.bismigel.dev,prowlarr.bismigel.dev,bazarr.bismigel.dev</AllowedHosts>#' \
                "$f"
              chown 1000:1000 "$f" 2>/dev/null || true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: prowlarr
          image: linuxserver/prowlarr:develop@sha256:e7a05286500b6e51084b0ba263dbbaf825db1ec7b731bf18aea30df84714e5f6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9696
              hostPort: 9696
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Toronto"
          volumeMounts:
            - name: config
              mountPath: /config
            # Custom Cardigann definitions (AudioBookBay). Mounted as a
            # directory so adding an indexer never touches the config PVC.
            - name: custom-definitions
              mountPath: /config/Definitions/Custom
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: media
          # One export, mounted once; the library paths are subPaths of it (ADR 0011).
          # **Imports copy, they do not hardlink — measured 2026-11-12.** A `subPath` mount of an NFS volume is
          # a *separate NFS mount*; `link()` requires the same **vfsmount**, not the same filesystem, so `ln`
          # returns `Cross-device link` even when `st_dev` matches. The old hostPath arrangement behaved the
          # same way, so this predates the move to NFS. Fixing it needs one mount plus app-side paths —
          # configuration inside each app, not a manifest edit. Tracked as 10.12.
          nfs:
            server: 192.168.10.82
            path: /mnt/media
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: custom-definitions
          configMap:
            name: prowlarr-custom-definitions
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: prowlarr
  ports:
    - port: 9696
      targetPort: 9696
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO config PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      initContainers:
        - name: disable-auth
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          # A reference of the form repo:tag@digest parses with a digest and NO tag, so
          # Kubernetes defaults imagePullPolicy to Always - it asks the registry even though
          # the image is cached. Pinned init containers must say IfNotPresent explicitly.
          # (2026-11-03: the four media apps were stuck in ImagePullBackOff on this one line,
          # with .81 unable to reach Docker Hub.)
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              f=/config/config.xml
              [ -f "$f" ] || exit 0
              # Auth stays enabled (v4 rejects None for remote) but is skipped
              # for local (LAN) addresses, so LAN is login-free; remote (tunnel)
              # would require the admin login.
              sed -i \
                -e 's#<AuthenticationMethod>[^<]*</AuthenticationMethod>#<AuthenticationMethod>Forms</AuthenticationMethod>#' \
                -e 's#<AuthenticationRequired>[^<]*</AuthenticationRequired>#<AuthenticationRequired>Enabled</AuthenticationRequired>#' \
                -e 's#<AllowedHosts>[^<]*</AllowedHosts>#<AllowedHosts>192.168.10.81,127.0.0.1,localhost,sonarr,radarr,prowlarr,bazarr,sonarr.media.svc,sonarr.media.svc.cluster.local,radarr.media.svc,radarr.media.svc.cluster.local,prowlarr.media.svc,prowlarr.media.svc.cluster.local,sonarr.bismigel.dev,radarr.bismigel.dev,prowlarr.bismigel.dev,bazarr.bismigel.dev</AllowedHosts>#' \
                "$f"
              chown 1000:1000 "$f" 2>/dev/null || true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: sonarr
          lifecycle:
            postStart:
              exec:
                # Recreate the library symlink on every start; `ln -sfn` is idempotent.
                command: ["/bin/sh", "-c", "ln -sfn /downloads/tv /tv"]
          image: linuxserver/sonarr@sha256:0deb8db6c839ac475e9cd86277712772c40ba7f929a003d7e1de36c4b666bc13
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8989
              hostPort: 8989
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Toronto"
          volumeMounts:
            - name: config
              mountPath: /config
            # ONE mount of the export; the library path is a **symlink** into it (2026-11-13).
            #
            # `subPath` mounts are separate NFS mounts, so `link()` saw different vfsmounts and every import
            # copied - 4 GiB free per 4 GiB episode, invisibly. A symlink resolves to the same mount, so the
            # inode is the same and `link()` hardlinks. The app's configured paths (/tv, /downloads) do not
            # change, which is why this beats rewriting every series/movie path to /data/...
            - name: media
              mountPath: /downloads
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: media
          # One export, mounted once; the library paths are subPaths of it (ADR 0011).
          # **Imports copy, they do not hardlink — measured 2026-11-12.** A `subPath` mount of an NFS volume is
          # a *separate NFS mount*; `link()` requires the same **vfsmount**, not the same filesystem, so `ln`
          # returns `Cross-device link` even when `st_dev` matches. The old hostPath arrangement behaved the
          # same way, so this predates the move to NFS. Fixing it needs one mount plus app-side paths —
          # configuration inside each app, not a manifest edit. Tracked as 10.12.
          nfs:
            server: 192.168.10.82
            path: /mnt/media
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
---
