# Exposed via the Cloudflare tunnel (behind Access); LAN NodePorts are
# loopback-only now.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media
spec:
  ingressClassName: nginx-admin
  rules:
    - host: sonarr.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8989
---
