apiVersion: v1
kind: Namespace
metadata:
  name: downloads
  labels:
    # Same reason as `media`: hostPath into the download spool on the pool.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-pvc
  namespace: downloads
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  type: NodePort
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      nodePort: 30081
  selector:
    app: qbittorrent
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  ingressClassName: nginx-admin
  rules:
    - host: qbittorrent.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  replicas: 1
  # hostPort 8081 + RWO config PVC: a RollingUpdate would deadlock on the port.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # **Away from the egress node, deliberately.** Two WireGuard tunnels cannot stack: inside this pod the gluetun
      # handshake to Proton is not covered by the endpoint route that the *node* pins into `main`, so on `.81` it enters
      # the node's own tunnel and never completes — measured 2026-11-10, `restarting VPN because it failed to pass the
      # healthcheck`, repeatedly.
      #
      # `DoesNotExist` rather than a hostname: the requirement is "anywhere that is not already tunnelled", which
      # survives the node being renamed, replaced or relabelled.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: homelab.io/wg-egress, operator: DoesNotExist }
      initContainers:
        - name: init
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /config/qBittorrent
              conf=/config/qBittorrent/qBittorrent.conf
              if [ ! -f "$conf" ]; then
                printf '[Preferences]\nWebUI\\LocalHostAuth=false\nWebUI\\HostHeaderValidation=false\nSession\\DefaultSavePath=/downloads\n' > "$conf"
                printf '[Logging]\nLogging\\Enabled=true\nLogging\\Rotate=true\nLogging\\MaxSizeBytes=10485760\n' >> "$conf"
                printf '[Legal]\nLegal\\NoNotices=true\n' >> "$conf"
              fi
              # Keep this client out of the router's state.
              #
              # qBittorrent defaults Connection\UPnP to TRUE, so every session it
              # asks the router for port mappings. On 2026-10-25 the media node lost
              # all WAN egress for 61 minutes starting ~11 min after a torrent swarm
              # peaked: LAN fine, the router answered a hairpin ping for .82 in 0.3ms
              # but dropped .81's, and it self-healed when the router state cleared.
              # UPnP buys nothing here anyway - all traffic leaves through the
              # WireGuard tunnel - so disable it and cap the connection counts that
              # generate that state.
              #
              # Idempotent: drop our keys, then re-add them under [Preferences], so
              # repeated starts cannot duplicate or drift.
              sed -i \
                -e '/^Connection\\UPnP=/d' \
                -e '/^Connection\\MaxConnections=/d' \
                -e '/^Connection\\MaxConnectionsPerTorrent=/d' \
                -e '/^Connection\\MaxUploadsPerTorrent=/d' \
                "$conf"
              if grep -q '^\[Preferences\]' "$conf"; then
                awk '/^\[Preferences\]$/ && !done {
                       print;
                       print "Connection\\UPnP=false";
                       print "Connection\\MaxConnections=200";
                       print "Connection\\MaxConnectionsPerTorrent=50";
                       print "Connection\\MaxUploadsPerTorrent=20";
                       done=1; next } { print }' "$conf" > "$conf.tmp"
                mv "$conf.tmp" "$conf"
              fi
              # the rewrite above runs as root; hand it back to the app user or
              # qBittorrent (abc) can read our settings but cannot save any,
              # which silently reverts preferences to defaults on the next start
              chown 1000:1000 "$conf" 2>/dev/null || true   # PUID/PGID of the app container
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        # The tunnel, as a sidecar. Everything in this pod shares one network namespace, so qBittorrent has no route
        # that bypasses it — and gluetun's firewall means *no tunnel, no traffic*, which is the property a node-level
        # tunnel cannot give a workload.
        - name: vpn
          image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          env:
            - { name: VPN_SERVICE_PROVIDER, value: protonvpn }
            - { name: VPN_TYPE, value: wireguard }
            - { name: WIREGUARD_PRIVATE_KEY, valueFrom: { secretKeyRef: { name: proton-wg, key: private_key } } }
            - { name: SERVER_COUNTRIES, value: "Canada" }
            # The WebUI must survive the kill-switch, or the pod is unreachable and the container looks healthy.
            - { name: FIREWALL_INPUT_PORTS, value: "8080" }
            # The library is NFS from .82 and the API server is in the cluster CIDR: those must NOT take the tunnel.
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "192.168.2.0/24,10.42.0.0/16,10.43.0.0/16" }
            # Proton supports port forwarding; it is what makes seeding actually work through a VPN.
            - { name: VPN_PORT_FORWARDING, value: "on" }
          securityContext:
            capabilities: { add: [NET_ADMIN] }
          volumeMounts:
            - { name: tun, mountPath: /dev/net/tun }
          readinessProbe:
            # gluetun's own health endpoint answers once the tunnel is up, so qBittorrent is not "ready" before it.
            httpGet: { path: /v1/openvpn/status, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:4.6.7-r0-ls353@sha256:55f15d44396315551f87294a176efae733b16e283f38980308e46073950257c6
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Manila"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              hostPort: 8081
              name: webui
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /downloads
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
      volumes:
        # Needed by the VPN sidecar. `downloads` is a privileged-PSA namespace already (hostPath for the pool), so this
        # is not a new class of privilege.
        - name: tun
          hostPath: { path: /dev/net/tun }
        # One export, mounted once; every library path is a subPath of it (ADR 0011).
        # Two separate NFS mounts of the same export are different mount points, and Sonarr imports by hardlink —
        # so the paths must be bind mounts inside one filesystem or imports silently become copies.
        - name: media
          nfs:
            server: 192.168.2.82
            path: /mnt/media
        - name: config
          persistentVolumeClaim:
            claimName: config-pvc
