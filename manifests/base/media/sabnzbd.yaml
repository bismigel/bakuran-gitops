# Usenet downloader (SABnzbd) for the *arr stack. Runs on the media box (.81),
# served on the LAN via NodePort 30082. The Frugal Usenet account lives in a
# Secret `usenet-frugal` (keys user/pass) created OUT OF BAND from Bitwarden —
# the media cluster has no External Secrets operator (ESO runs on .82 only), so
# it can't use an ExternalSecret. See bakuran-infra/scripts/media-usenet-secret.sh.
# An init seeds sabnzbd.ini (server + dirs + no-auth) so a rebuilt stack comes up
# already pointing at Usenet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-config
  namespace: downloads
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: downloads
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      initContainers:
        - name: seed-config
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          # A reference of the form repo:tag@digest parses with a digest and NO tag, so
          # Kubernetes defaults imagePullPolicy to Always - it asks the registry even though
          # the image is cached. Pinned init containers must say IfNotPresent explicitly.
          # (2026-11-03: the four media apps were stuck in ImagePullBackOff on this one line,
          # with .81 unable to reach Docker Hub.)
          imagePullPolicy: IfNotPresent
          env:
            - name: USENET_USER
              valueFrom:
                secretKeyRef: { name: usenet-frugal, key: user }
            - name: USENET_PASS
              valueFrom:
                secretKeyRef: { name: usenet-frugal, key: pass }
          command: ["sh", "-c"]
          args:
            - |
              ini=/config/sabnzbd.ini
              [ -f "$ini" ] && exit 0
              mkdir -p /config
              {
                printf '%s\n' '__version__ = 19'
                printf '%s\n' '[misc]'
                printf '%s\n' 'host = 0.0.0.0'
                printf '%s\n' 'port = 8080'
                printf '%s\n' 'username = ""'
                printf '%s\n' 'password = ""'
                printf '%s\n' 'host_whitelist = sabnzbd.bismigel.dev'
                printf '%s\n' 'download_dir = /downloads/incomplete'
                printf '%s\n' 'complete_dir = /downloads/complete'
                printf '%s\n' 'permissions = "777"'
                printf '%s\n' '[servers]'
                printf '%s\n' '[[news.frugalusenet.com]]'
                printf '%s\n' 'host = "news.frugalusenet.com"'
                printf '%s\n' 'port = 563'
                printf 'username = "%s"\n' "$USENET_USER"
                printf 'password = "%s"\n' "$USENET_PASS"
                printf '%s\n' 'connections = 20'
                printf '%s\n' 'ssl = 1'
                printf '%s\n' 'enable = 1'
                printf '%s\n' '[categories]'
                printf '%s\n' '[[tv]]'
                printf '%s\n' 'name = "tv"'
                printf '%s\n' 'dir = "tv"'
                printf '%s\n' '[[movies]]'
                printf '%s\n' 'name = "movies"'
                printf '%s\n' 'dir = "movies"'
              } > "$ini"
              chown -R 1000:1000 /config 2>/dev/null || true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: sabnzbd
          image: linuxserver/sabnzbd@sha256:382f9bd4e3f6df2abf7bcc92edada0c5bd4d4ff26eb5416f257ac54989464fa1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              hostPort: 8082
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Manila"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /downloads
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            # 1Gi was not enough: on 2026-11-03 the container was OOMKilled (exit
            # 137) mid-unpack of a BluRay rar and entered CrashLoopBackOff, which
            # the *arrs saw as "SABnzbd unavailable" and reported as a download
            # client failure. Post-processing is the memory-hungry part, not
            # downloading. 2Gi costs nothing on a 16GiB node and covers a normal
            # unpack; the alternative is tuning SABnzbd's article cache down, which
            # trades the same memory for slower downloads.
            limits: { memory: 2Gi }
      volumes:
        # One export, mounted once; every library path is a subPath of it (ADR 0011).
        - name: media
          nfs:
            server: 192.168.2.82
            path: /mnt/media
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: sabnzbd
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabnzbd
  namespace: downloads
spec:
  ingressClassName: nginx-admin
  rules:
    - host: sabnzbd.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sabnzbd
                port:
                  number: 8080
