apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # Explicit: it used to inherit the cluster default (local-path), which
  # pins the config to one node.
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
      # 8Gi, not 1Gi: Jellyfin refuses to start unless /config/data has 2GiB
      # free. On local-path it was seeing the whole disk; a Longhorn volume
      # only has what we ask for (2026-10-28 crash loop).
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: default
  labels:
    app: jellyfin
spec:
  replicas: 1
  # hostPort 8096 (+ RWO config PVC) can't overlap during a rollout, so a
  # RollingUpdate deadlocks (old pod holds the port) — stop old, then start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
      # No prometheus.io/* annotations: Jellyfin exposes no /metrics endpoint
      # (needs a plugin), so scraping it only produced a false TargetDown.
    spec:
      # Run the app as a normal user, not root. The config/cache volumes are
      # handed over by the fix-ownership init below; the render node
      # (/dev/dri/renderD128) is mode 0666, so QSV still works.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups:
          - 303
      initContainers:
        # Plugins live on the config volume, so a redeploy keeps them — but a
        # fresh PVC has none, and the catalog is a UI action nobody can review.
        # This installer makes the set declarative: add a line here instead of
        # clicking in the dashboard, and every artefact is pinned by hash.
        #
        # Skipped entirely when the target folder already exists, so a restart
        # does not re-download or overwrite plugin configuration.
        #
        # Target ABI: the server is 12.2.0 (confirmed at
        # /System/Info/Public), so 12.0/12.1 plugins are compatible.
        - name: install-plugins
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          # Must be root: `apk add unzip` installs into /, and the plugin tree
          # it creates is chowned to 1000 by fix-ownership afterwards.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              plugins=/config/plugins
              mkdir -p "$plugins"
              command -v unzip >/dev/null 2>&1 || apk add --no-cache unzip >/dev/null 2>&1
              command -v unzip >/dev/null 2>&1 || { echo "unzip unavailable"; exit 1; }

              fetch() { # url dest
                if command -v curl >/dev/null 2>&1; then
                  curl -fsSL --retry 3 --max-time 120 -o "$2" "$1"
                else
                  wget -qO "$2" "$1"
                fi
              }

              verify() { # file sha256 md5
                if [ -n "$2" ]; then printf '%s  %s\n' "$2" "$1" | sha256sum -c - >/dev/null; fi
                if [ -n "$3" ]; then printf '%s  %s\n' "$3" "$1" | md5sum -c - >/dev/null; fi
              }

              install_plugin() { # folder url sha256 md5
                dest="$plugins/$1"
                if [ -d "$dest" ]; then echo "present: $1"; return 0; fi
                tmp=$(mktemp -d)
                fetch "$2" "$tmp/p.zip"
                verify "$tmp/p.zip" "$3" "$4"
                mkdir -p "$dest"
                unzip -q -o "$tmp/p.zip" -d "$dest"
                rm -rf "$tmp"
                echo "installed: $1"
              }

              # Intro Skipper — skip intros/outros using detected markers.
              # Third-party, shipped from GitHub releases by Jellyfin ABI.
              install_plugin IntroSkipper_12.0.5.0 \
                "https://github.com/intro-skipper/intro-skipper/releases/download/12.0/v12.0.5.0/intro-skipper-v12.0.5.0.zip" \
                "5a3ce9686f79ef064bef69fa18708171acc2106707fca8beaed03a22b12d9f24" ""

              # Open Subtitles — subtitle search; the account/API key is optional
              # and configured in the dashboard, not here.
              install_plugin open-subtitles_25.0.0.0 \
                "https://repo.jellyfin.org/files/plugin/open-subtitles/open-subtitles_25.0.0.0.zip" \
                "" "4fe7744c4e24f22fcb395c90d66fbfb6"

              # Subtitle Extract — pulls embedded tracks out to sidecar files so
              # clients that cannot render embedded subs still direct-play.
              install_plugin subtitle-extract_8.0.0.0 \
                "https://repo.jellyfin.org/files/plugin/subtitle-extract/subtitle-extract_8.0.0.0.zip" \
                "" "e3186613d48582deb73b687e8bbb2758"

              # Optional, commented out on purpose: AniList metadata for the
              # anime library. Useful, but it only pays off once the library is
              # tagged with AniList ids instead of TVDB ones.
              # install_plugin anilist_15.0.0.0 \
              #   "https://repo.jellyfin.org/files/plugin/anilist/anilist_15.0.0.0.zip" \
              #   "" "7894285e510f2e22b2364df570a546b3"
          volumeMounts:
            - name: config
              mountPath: /config
        # The config PVC and the transcode cache were created by root. Hand
        # them to UID 1000 once (idempotent) so the non-root main container can
        # write. /cache is only chowned while its transcodes dir is still root's.
        - name: fix-ownership
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              chown -R 1000:1000 /config
              if [ "$(stat -c %u /cache/transcodes 2>/dev/null || echo 0)" != "1000" ]; then
                chown -R 1000:1000 /cache
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
      containers:
        - name: jellyfin
          # Digest-pinned (was the floating tag `12.2`): a re-tag upstream
          # would silently change what runs here. Bump deliberately.
          image: jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
          # The iGPU is provided by the Intel device plugin as the
          # gpu.intel.com/i915 resource (manifests/intel-gpu-plugin): no
          # privileged mode and no hostPath /dev/dri.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            # hostPort: LAN access for TV clients (they can't do Cloudflare
            # Access). Jellyfin is pinned to .81, so this binds there.
            - containerPort: 8096
              hostPort: 8096
              name: http
            - containerPort: 8920
              name: https
          env:
            # LAN URL clients should use. NOT the NodePort (30906/30096 is
            # loopback-only under the edge lock, so it's unreachable from the LAN).
            #
            # The **name**, not a node address (2026-11-05, story 8.3). This was `http://192.168.2.81:8096` — the media
            # node — so a client that follows the advertised URL was sent to a machine that may not be running Jellyfin
            # at all. Found by moving the pod to `.80` and reading `/System/Info/Public` back: the server reported
            # `localAddress: http://192.168.2.81:8096` while listening on a different node, and `.81:8096` was returning
            # nothing (its `hostPort` only exists on the node the pod is on).
            #
            # Hardcoding a node here would have made the rest of 8.3 pointless for exactly the clients the failover is
            # for. `jellyfin.lan` resolves to the LoadBalancer address, which follows the pod.
            # **Unset on purpose** (2026-11-10). It was `http://jellyfin.lan:8096`, which is a LAN-only name — and
            # Jellyfin hands that value to *every* client in `/System/Info/Public` as `LocalAddress`. A browser opening
            # `https://jellyfin.bismigel.dev` therefore loaded the page and was then told to talk to an address that does
            # not resolve outside this LAN: the HTML arrived (200) and the application did not work.
            #
            # Measured before removing it: over the public URL, `LocalAddress` came back as `http://jellyfin.lan:8096`.
            #
            # With it unset, each client keeps the address it actually used — the TV dials `jellyfin.lan:8096`, a browser
            # on the public name keeps that, and neither is told about the other's world. The reason it was set in 8.3
            # (a stable address that follows the pod rather than a node) still holds, because `jellyfin.lan` now resolves
            # to the LoadBalancer address — the TV supplies it itself.
            - name: JELLYFIN_PublishedServerUrl
              value: ""
          resources:
            requests:
              memory: 512Mi
              gpu.intel.com/i915: 1
            limits:
              memory: 4Gi
              gpu.intel.com/i915: 1
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          # Transcode temp lives here. Must be LOCAL disk: the old /mnt/media
          # is the mergerfs pool, and mergerfs placed transcodes on .82 over
          # NFS — so every transcode read/wrote its segments across the network.
          hostPath:
            path: /var/cache/jellyfin
            type: DirectoryOrCreate
        # NFS from the storage host, not a hostPath (story 8.3). `/mnt/media` used to exist only on
        # `.81`, which made "pinned to .81" implicit — a pod scheduled elsewhere failed to mount
        # rather than starting. Mounting the export directly means any node can serve the library,
        # and `.82` now exports it to the LAN rather than `.81` alone (bakuran-infra#261).
        #
        # This only works because 8.4 put `mount.nfs` and `mount` on the FHS paths on every node;
        # before that a pod-level NFS volume failed with `exit status 127`, which is why every other
        # media mount in this estate is a hostPath.
        - name: media
          nfs:
            server: 192.168.2.82
            path: /mnt/media
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: default
  annotations:
    # Ask for the address explicitly instead of letting the pool allocate. `vip_pool` alone left the
    # Service `<pending>` (kube-vip watched it and assigned nothing, logged no error), and an address
    # that is chosen rather than discovered is what the TV's bookmarks and the Unbound override and
    # the firewall rule all depend on. If this annotation and the pool ever disagree, the annotation
    # wins — and `vip_pool` is a single address on purpose so they cannot.
    kube-vip.io/loadbalancerIPs: "192.168.2.84"
spec:
  # LoadBalancer via kube-vip. `192.168.2.84`, requested explicitly with the annotation — `vip_pool`
  # alone left this `<pending>`, with no allocation and no error.
  #
  # This was reverted to NodePort once, on 2026-11-05, and the reason matters: the first VIP attempt
  # did not serve TCP. But most of the debugging that followed it was **invalid**, because with the
  # Service back to NodePort, kube-proxy had no rules for the VIP at all — probes against
  # `192.168.2.84` were measuring a stale address, not a broken one. Re-applied to test once, with the
  # Service in the state it is supposed to be in.
  type: LoadBalancer
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      name: http
    - port: 8920
      targetPort: 8920
      nodePort: 30920
      name: https
---
# Serve Jellyfin via the media cluster's own ingress-nginx (NodePort 32080) so
# the Cloudflare tunnel can reach it at http://127.0.0.1:32080 instead of the
# raw LAN NodePort 30096. Pairs with the tunnel routing change (Phase 2).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: jellyfin.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
