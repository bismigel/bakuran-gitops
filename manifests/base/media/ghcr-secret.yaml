# GHCR pull secret for the media namespace (media-mcp is a private image).
# Same Bitwarden-backed pattern as manifests/external-secrets/ghcr-secret.yaml,
# but ESO now runs in this unified cluster, so it can source it here directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: ghcr-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: ghcr-user
    - secretKey: token
      remoteRef:
        key: ghcr-token
