# The estate's own image registry, so deploying stops depending on GitHub.
#
# Why this exists at all: the only first-party image (media-mcp) was pulled from ghcr.io, and the workflow that pushed it
# there was retired with the GitHub CI. Pushing to Forgejo's built-in registry was tried first and fails for a structural
# reason worth writing down: Forgejo builds its token realm from ROOT_URL, which is the public hostname, so every
# in-cluster push is redirected to Cloudflare Access and gets a login page. A registry whose auth challenge is served by
# itself has no such problem.
#
# Two addresses, on purpose:
#   * the ClusterIP is PINNED (10.43.200.10) so k3s registries.yaml can point at a stable address - containerd runs on
#     the host and cannot resolve .svc.cluster.local
#   * the Service name works inside the cluster, for the runner pod that pushes
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: forgejo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  # 10Gi was fitted to the first few images and ran out on 2026-11-23: the volume reported
  # 10805010432 bytes used of 10737418240 (actual > requested), and every build after that failed
  # its last step with `uploading layer chunked: 500` while zot logged `no space left on device`.
  # A full registry is invisible from the app side — CI just stops producing images — so the size is
  # paid for up front. 25Gi leaves room for roughly a fortnight of four-image builds at the current
  # tag rate; retention in zot is the durable fix and is tracked separately, because pruning tags
  # that a pinned prod overlay references would break a rollback.
  # Longhorn expands online; allowVolumeExpansion is true on the longhorn StorageClass and each node
  # has at least 22GB free per replica disk.
  resources:
    requests:
      storage: 25Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: forgejo
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  # RWO volume: one registry at a time, and the Service stays up across restarts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: registry
          # zot, not distribution/registry: the official registry image carries CRITICALs in its Go stdlib (2.8.3 has
          # two, 3.0.0 has four), and this estate's scan refuses to add debt it can avoid. zot v2.1.23 scanned clean on
          # 2026-11-16 and is OCI-native. If a future bump is not clean, the answer is an exception with an owner and an
          # expiry in scripts/scan-policy.yaml, not a quiet baseline entry.
          #
          # The tag is written out even though the digest already pins the bytes: a digest gives reproducibility and
          # says nothing about provenance. The first version of this pinned `latest` by digest, and it turned out to be
          # v2.1.23 byte for byte - correct content, unreadable answer to "what is running and what changed".
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.23@sha256:b68f727fe35c1eb45b2ae91519dfb0e33192d69b5104882c3e7809b7146c4a02
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - { name: registry, containerPort: 5000 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: auth, mountPath: /auth, readOnly: true }
            - { name: config, mountPath: /etc/zot, readOnly: true }
          # A TCP probe, not an HTTP one: with htpasswd enabled /v2/ answers 401 by design, so an httpGet probe can
          # never pass and the pod never becomes Ready - the registry was answering requests the whole time while
          # Kubernetes called it unhealthy. A socket probe asserts what is meant: the process is listening.
          readinessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: auth
          secret:
            secretName: registry-htpasswd
        - name: config
          configMap:
            name: registry-config
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: forgejo
spec:
  type: ClusterIP
  clusterIP: 10.43.200.10
  selector:
    app.kubernetes.io/name: registry
  ports:
    - { name: registry, port: 5000, targetPort: 5000 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: forgejo
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": { "rootDirectory": "/var/lib/registry" },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": { "htpasswd": { "path": "/auth/htpasswd" } }
      },
      "extensions": {
        "sync": {
          "enable": true,
          "registries": [
            {
              "urls": ["https://registry-1.docker.io"],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 5,
              "retryDelay": "1s",
              "syncTimeout": "10m"
            }
          ]
        }
      },
      "log": { "level": "info" }
    }
