# The registry's own auth file, sourced from Bitwarden rather than from a kubectl create in a terminal.
#
# It holds the bcrypt line (bismigel:$2y$...) that zot reads as its htpasswd file. Storing the *hash* and not the
# password is deliberate: the hash is what the registry needs, and a hash cannot be replayed against anything else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-htpasswd
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: registry-htpasswd
  data:
    - secretKey: htpasswd
      remoteRef:
        key: registry-htpasswd
