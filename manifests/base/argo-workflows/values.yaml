# Argo Workflows: the execution layer for runbooks.
#
# Deliberately small. What is kept is the part that makes it worth adopting - WorkflowTemplates as Kubernetes
# objects, retries, and a `suspend` step that stops a workflow until a human resumes it (ADR 0012 as a primitive
# instead of a promise). What is turned down is the part that would need babysitting: no artifact repository (the
# runbooks collect evidence into the log), no SSO (one operator), no autoscaling.
#
# The chart ships 8 ClusterRoles by default. That is the same shape as kagent's wildcard role and deserves the same
# scrutiny: they are the executor/agent roles Argo needs to create pods in the namespace a workflow runs in. If this
# outlives the experiment, they get narrowed the way kagent's were.
controller:
  replicas: 1
  # The controller's default bind also grants clusterWorkflowTemplates; this estate creates none (`kubectl get
  # clusterworkflowtemplates` is empty - both templates are namespace-scoped and generated from git by gen-runbooks). A
  # grant for an object nobody creates is a credential without a job.
  clusterWorkflowTemplates:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  # Watch every namespace: a runbook for the media stack and one for argocd are separate workflows in separate
  # namespaces, and a single operator does not want two controllers.
  workflowNamespaces: []
  metricsConfig:
    enabled: true
    path: /metrics
    port: 9090

# Story 7.5, security pass 2026-11-18. Without this the chart emits a CLUSTER-wide ClusterRole for the server whose
# verbs are `secrets [get]`, `pods [get,list,watch,delete]` and full CRUD on workflows/templates/cronworkflows/sensors/
# eventbindings - measured with `kubectl get clusterrole argo-workflows-server`. Combine that with the server running
# `--auth-mode=server --secure=false` (it does NO authentication of its own; measured: an unauthenticated GET to
# /api/v1/workflows/argo from a pod returns 200) and the ONLY thing between a browser and `secrets get` cluster-wide is
# a Cloudflare Access session.
#
# `singleNamespace: true` makes the chart emit a namespaced Role instead of that ClusterRole (chart template
# server-cluster-roles.yaml: `{{- if and .Values.server.enabled .Values.server.rbac.create}}` with
# `{{- if .Values.singleNamespace}} kind: Role`). Every workflow in this estate lives in `argo`, so the server loses
# nothing it uses and loses the ability to read a secret, or delete a pod, anywhere else. The residual - `secrets [get]`
# and `workflows [delete]` INSIDE argo - needs the role replaced rather than scoped, and is the next step, not this one.
singleNamespace: true

# The last cluster-wide grant goes too. `server.clusterWorkflowTemplates.enabled: true` is the chart default and it emits
# `argo-workflows-server-cluster-template` (ClusterRole + CRB) so the SERVER can read and edit ClusterWorkflowTemplates.
# This estate has none - `kubectl get clusterworkflowtemplates` returns an empty list - because the two templates
# (`action`, `diag`) are namespace-scoped and generated from git. A grant for an object nobody creates is a credential
# without a job. Re-enable this the day a ClusterWorkflowTemplate exists.
server:
  clusterWorkflowTemplates:
    enabled: false
  # ...and the namespaced Role the chart would still emit is replaced by manifests/base/argo-workflows/server-rbac/,
  # which grants create-on-workflows and read verbs and nothing else. See that file for the verb-by-verb argument.
  rbac:
    create: false
  replicas: 1
  authMode: server          # no SSO: there is one operator, and Access/Cloudflare is the outer boundary
  # Story 7.5: the human pane is Argo's *own* UI, behind the admin ingress and Cloudflare Access — not a second
  # dashboard over the same templates. `authMode: server` is what makes that possible: in `client` mode the UI has no
  # server-side session, so a reverse proxy in front of it cannot carry an identity.
  #
  # The admin ingress is `nginx-admin` (the class every Access-gated surface uses), and `argo.bismigel.dev` is declared
  # in bakuran-infra's `cloudflare/sync.sh` both as an admin hostname and as an Access app with a 24h session.
  ingress:
    enabled: true
    ingressClassName: nginx-admin
    annotations:
      # HTTP, not HTTPS: argo-server runs with `--secure=false` (the chart default), so pointing the ingress at HTTPS produced a 502 on
      # every request - the browser showed Cloudflare's error page and the ingress log showed nothing useful. TLS terminates at
      # Cloudflare; the connector speaks plain HTTP to the admin controller on :80.
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - argo.bismigel.dev
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

# No artifact repository. Nothing in this estate's runbooks needs to move files between steps; evidence is text in
# the workflow log, which is what gets read at 03:00 anyway.
artifactRepository: {}
useDefaultArtifactRepo: false

executor:
  # The executor is a Go binary that runs as an init container and as a wait sidecar around EVERY step. 128Mi killed it
  # at startup - OOMKilled, exit 137 - so no workflow in this cluster had ever completed a single step. Everything else
  # about the runbook layer was correct and unexercised.
  #
  # 512Mi is a ceiling, not a target: the executor's measured need is a few hundred MiB at container start. The request
  # stays small so a diagnostic workflow is cheap to schedule.
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 512Mi}

# The default service account is per-namespace; workflows run as `argo-workflow` and get the executor role only.
workflow:
  serviceAccount:
    create: true
