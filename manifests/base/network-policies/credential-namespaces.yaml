# Story 10.5: the namespaces that hold credentials stop trusting each other.
#
# Measured 2026-11-18: eleven namespaces ran pods with NO NetworkPolicy at all, next door to immich and books which are
# default-deny. Four of the eleven are the ones that matter - they hold the Bitwarden machine token
# (`external-secrets`), the database operator (`cnpg-system`), every alert and every scrape credential (`monitoring`),
# and the git host whose tokens CI uses (`forgejo`). A compromised workload anywhere in the cluster could reach all four.
#
# Shape, and it is the shape `immich`/`books` already use: a `default-deny` policy for both directions, then explicit
# allows. Two facts from rehearsing this in staging (2026-11-18) rather than assuming:
#
#   1. **Default-deny is symmetric.** Allowing ingress from a client does not let that client *open* the connection -
#      the first rehearsal had the wrong side open and the ALLOWED client timed out too. Every allow below therefore
#      appears on both ends.
#   2. The API server and DNS are **not** ordinary peers: both are Cilium entities (`kube-apiserver`) or endpoint
#      selectors (`kube-dns` in `kube-system`), because the API server is a host process and `NetworkPolicy` cannot
#      name it. `allow-apiserver-egress.yaml` records how that was found the hard way.
#
# Staging rehearsal (before this reached production): two pods plus a Service in a scratch namespace, the same
# default-deny and the same allow - allowed client 200 in 15ms, outsider timed out, DNS resolved for both.
#
# ---- external-secrets: holds the Bitwarden machine token --------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-webhook-and-bitwarden
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # WITHIN the namespace, which default-deny also blocks: `bitwarden-sdk-server` listens on 9998 and the webhook on
    # 443, and both are called from pods in this same namespace.
    #
    # Found by the estate's own guardrail, not by review: two minutes after this policy first landed,
    # `broken` reported `external-secrets-config Synced/Degraded` and `ArgoCDAppUnhealthy`, and the operator's log said
    # `failed to do request: Get "http://bitwarden-sdk-server...:9998/..."`. A default-deny namespace with no
    # same-namespace rule is a namespace whose own pods cannot talk to each other.
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 9998 }
        - { protocol: TCP, port: 443 }
    # The metrics endpoint, 8080 (2026-11-27). ESO exports `externalsecret_status_condition`, and that is what
    # `ExternalSecretNotSyncing` alerts on - the only signal left now that ArgoCD reports a stalled reconcile as
    # Progressing instead of Degraded. `monitoring` runs no NetworkPolicy of its own, so its egress is open and only
    # this end needs the allow.
    #
    # Found by scraping it rather than by review: the job was in `metrics-scrape-config` and correct, the target was
    # discovered, and it sat `down` with `dial tcp ...:8080` because default-deny blocks the port and nothing said so.
    # Same failure shape as the 9998 rule above.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # The SDK server above, and the webhook - same namespace.
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 9998 }
        - { protocol: TCP, port: 443 }
    # The vault the tokens come from. Bitwarden's API does not publish a stable CIDR, so this is the honest shape:
    # HTTPS out, nothing else.
    - ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver
  namespace: external-secrets
spec:
  endpointSelector: {}
  ingress:
    - fromEntities: [kube-apiserver]
    # ...and the same call again with a different identity, because the webhook path does not
    # get the `kube-apiserver` one. Proved 2026-11-21 with `cilium-dbg monitor --type drop`
    # while ArgoCD tried to create the `usenet-xsnews` ExternalSecret:
    #
    #   xx drop (Policy denied) to endpoint 1465, identity remote-node->42598:
    #     10.42.1.204:34692 -> 10.42.0.93:10250 tcp SYN
    #
    # Three things in that line: the source is a **node**, not the apiserver entity; the
    # destination port is **10250**, the webhook's container port, because policy is matched
    # after the Service DNATs 443 -> 10250 (the 443 allow in the NetworkPolicy above is
    # therefore dead for this path); and the consequence is not a policy warning - the
    # validating webhook has `failurePolicy: Fail`, so **every** ExternalSecret and
    # SecretStore create/patch was refused cluster-wide from 2026-11-18 23:40 (when the
    # default-deny landed) until this line. Nobody noticed because ESO's periodic refresh
    # only patches the target Secret, never the ExternalSecret object.
    #
    # Port-scoped on purpose: nodes may reach the webhook, nothing else about the namespace
    # widens.
    - fromEntities: [remote-node, host]
      toPorts:
        - ports:
            - { port: "10250", protocol: TCP }
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "6443", protocol: TCP }
---
# ---- cnpg-system: the database operator ----------------------------------------------------------------
#
# `monitoring` and `forgejo` are NOT in this file yet, and that is a decision rather than an omission: prometheus
# scrapes dozens of targets across every namespace and five login-watch CronJobs curl applications from this namespace,
# while `forgejo` runs both the git server and the CI runner that must reach the internet. Guessing those allowlists
# would break CI and the alerting that would tell us - the rehearsal proves the mechanism, not the flow list. They need
# measured flows (Hubble has no CLI on this workstation yet) and they are the next step in story 10.5.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Cilium, not `networking.k8s.io`, because the instance allowlist below selects pods in OTHER namespaces by their
# CloudNativePG label. A plain NetworkPolicy cannot do that: `podSelector` and `namespaceSelector` in one `from` combine
# as an AND (pods *labelled* x in namespaces *labelled* y), so reaching every CNPG instance means enumerating
# namespaces - a list that rots the day a cluster moves. The first version of this file put `toEndpoints` inside a plain
# NetworkPolicy and the API server refused it:
#   unknown field "spec.egress[1].toEndpoints" - caught by `kubectl apply --dry-run=server`, not by a YAML linter.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-instances-and-apiserver
  namespace: cnpg-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # The status endpoint, the instance metrics, replication and the PLUGIN port - in whichever namespace owns the
    # cluster.
    #
    # 9090 is the one the first version missed, and the symptom was not a network error anybody saw directly: the
    # immich Cluster reported "Cluster cannot proceed to reconciliation due to an error while interacting with plugins"
    # with 2/2 instances ready, and the operator's own log held the answer -
    #   while querying plugin identity: ... dial tcp 10.43.206.106:9090: i/o timeout   (pluginName: barman-cloud...)
    # CloudNativePG 1.25+ talks to its plugins (barman-cloud, logical decoding) over gRPC on 9090, beside the instance
    # manager on 8000. A readiness of 2/2 is not the same as "reconciling".
    - toEndpoints:
        - matchExpressions:
            - { key: "k8s:io.kubernetes.pod.namespace", operator: NotIn, values: ["kube-system"] }
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
            - { port: "9187", protocol: TCP }
            - { port: "5432", protocol: TCP }
            - { port: "9090", protocol: TCP }
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "6443", protocol: TCP }
  ingress:
    # The API server's webhook call. Nothing else calls the operator from outside: the instances are called BY it.
    #
    # `kube-apiserver` is not enough on its own (found 2026-11-22): the admission webhook at
    # `cnpg-webhook-service:443` is called by a **host process**, so it arrives with the `remote-node` identity, on
    # the **container** port 9443 - policy is matched after the Service DNATs 443 -> 9443. Without this rule every
    # `ScheduledBackup` failed with
    #   failed calling webhook "mbackup.cnpg.io": Post ".../mutate-postgresql-cnpg-io-v1-backup"
    # and three clusters stopped taking backups (forgejo-pg and vaultwarden-pg: none at all; immich-pg: days old)
    # without a single alert. Same two facts as the ESO webhook fix in this file, one namespace earlier (#157).
    - fromEntities: [kube-apiserver, remote-node, host]
      toPorts:
        - ports:
            - { port: "9443", protocol: TCP }
    # ...and the operator has to reach its OWN namespace's plugin pod: `barman-cloud` is a Service here on 9090, and
    # `toEndpoints` egress alone was not enough because default-deny stops the *reply path's* peer from accepting the
    # connection - the same symmetry mistake as `external-secrets`, in the same file, found the same way (the plugin
    # kept timing out at 23:59 after the egress rule had already been added).
    - fromEndpoints:
        - matchExpressions:
            - { key: "k8s:io.kubernetes.pod.namespace", operator: In, values: ["cnpg-system"] }
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
            - { port: "8000", protocol: TCP }
    # ...and the instances answer on their own ports when the operator initiates (return traffic is handled by
    # connection tracking, so no ingress rule is needed for it).
