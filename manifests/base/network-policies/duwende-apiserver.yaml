# CiliumNetworkPolicy: let the duwende namespace reach the Kubernetes API.
#
# Why this is not a plain NetworkPolicy: the k8s NetworkPolicy in
# policies.yaml already allows ipBlock 10.43.0.1/32:443 and
# 192.168.10.0/24:6443, yet pods in duwende still time out against
# kubernetes.default.svc. With Cilium, the API connection is redirected to the
# kube-apiserver host endpoint and the destination IP seen by the policy engine
# is not the ClusterIP, so an ipBlock rule does not match and the request is
# dropped. `toEntities: kube-apiserver` is the identity-based way to express the
# same intent and works regardless of how the ClusterIP is translated.
#
# Cilium policies are additive with k8s NetworkPolicy: this only adds the API
# path, it does not loosen anything else in policies.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: duwende-egress-kube-apiserver
  namespace: duwende
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
