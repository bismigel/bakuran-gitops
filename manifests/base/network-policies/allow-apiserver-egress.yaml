# Pods in a default-deny namespace cannot reach the API server with a plain Kubernetes NetworkPolicy.
#
# Found on 2026-11-05 while putting Immich's database under CloudNativePG (story 8.2). The CNPG instance
# manager reads its own `Cluster` object before it will initialise a database, and from `immich` — which is
# default-deny in both directions — it failed with:
#
#   wait-for-get-cluster: Get "https://10.43.0.1:443/...": dial tcp 10.43.0.1:443: i/o timeout
#
# Two `NetworkPolicy` egress rules were added, the second listing the service CIDR, the API VIP and all three
# node addresses on 443/6443. The pods were correctly selected by label. It still timed out.
#
# The reason is that the API server does not run as a pod — it is a **host-networking** process. Under Cilium,
# "allowed to reach the API server" is the `kube-apiserver` *entity*, a separate policy decision from
# pod-to-pod traffic, and `NetworkPolicy` has no way to name it. Every other namespace here that allows
# `10.43.0.1/32:443` is a namespace whose pods were never actually using that path, so the pattern looked
# sufficient and was not.
#
# The same namespace also has to admit the operator, which is the subject of the second document below.
#
# How far this generalises: `forgejo` (8.5) never hit this because it has no NetworkPolicy at all. Any future
# default-deny namespace that hosts a CNPG cluster, an operator, or anything that reads its own CRs needs this
# same grant — which is why it is one file with a stated purpose rather than a stanza inside each namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: immich-pg
  egress:
    # The API server, by identity rather than address.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            # 6443 is what `duwende-egress-kube-apiserver` uses and what works here; 443 is kept
            # because that is the address the failing client dials (`10.43.0.1:443`).
            - { port: "443", protocol: TCP }
            - { port: "6443", protocol: TCP }
    # DNS by endpoint, not by entity: this Cilium's entity list does not include `kube-dns` — the CRD
    # rejects the whole policy with `toEntities[0]: Unsupported value: "kube-dns"`, which is how the first
    # version of this file failed *silently* from ArgoCD's point of view (sync error, object never created,
    # and the symptom looked exactly like the policy not working).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Streaming replication between the instances of the cluster.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
            cnpg.io/cluster: immich-pg
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }

---
# The other half of the same problem, found straight after the first: with egress open, the instance bootstrapped —
# and then the operator could not read it back, because the ingress allowlist in this namespace names only
# same-namespace pods, ingress-nginx and monitoring. The cluster sat at `ready=1/1` reporting
# "Instance Status Extraction Error: HTTP communication issue" while the primary itself was healthy.
#
# CloudNativePG's operator lives in `cnpg-system` and polls each instance's status endpoint on 8000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: immich-pg
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            # 8000 is the instance manager's `/pgstatus`; 9187 is its metrics endpoint, which the monitoring
            # namespace can already reach through `allow-ingress` and which this rule does not need to open.
            - { port: "8000", protocol: TCP }
