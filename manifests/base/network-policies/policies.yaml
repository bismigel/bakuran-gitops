# Narrow hole for the stacks that take NZBs from Prowlarr: the Books stack
# (LazyLibrarian searches through Prowlarr) and SABnzbd (Prowlarr hands out a
# /download URL that SAB must fetch itself). Only Prowlarr, only Newznab's port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-prowlarr-indexer-clients
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: prowlarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: books
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: downloads
      ports:
        - protocol: TCP
          port: 9696
---
