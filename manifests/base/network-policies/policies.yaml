# Network policies for the application namespaces.
#
# Ingress: a pod selected by any NetworkPolicy only accepts the listed ingress.
# Egress: default-deny plus explicit allow rules (DNS, internal, and either
# specific FQDNs or public HTTP/S). Infrastructure namespaces (kube-system,
# argocd, longhorn-system, monitoring, cert-manager, external-secrets,
# observability, kepler) are intentionally not managed here.
#
# Each rule starts with same-namespace traffic and ingress-nginx. Cross-namespace
# rules are added only where a real dependency exists. The downloads per-app
# egress allowlists live in downloads-egress.yaml (CiliumNetworkPolicy with
# toFQDNs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-admin
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: books
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-admin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
        # The agent namespace, like media/immich already allow: Hermes needs to
        # read /status and /healthcheck for SRE triage. It holds no ABS login,
        # so this is reachability only, not data access.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: duwende
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-admin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Jellyfin on 8096 is for LAN TVs and phones. Keep it narrow: the LAN CIDR, the pod CIDR, and
    # only the Jellyfin HTTP port.
    #
    # The pod CIDR is not a widening for convenience — it is what makes the service VIP work at all
    # (2026-11-05, story 8.3). A client reaching `192.168.10.84` is DNAT'd and then **masqueraded** by
    # the node holding the VIP, so the pod sees the *node's* cilium_host address (10.42.1.x), not the
    # client's LAN address. Without this rule the packet matched nothing and was dropped: ICMP
    # answered (the node holds the VIP), TCP timed out, and every node in the cluster reported 200
    # because their own IPVS intercepted the VIP before it ever left the node.
    - from:
        - ipBlock:
            cidr: 192.168.10.0/24
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 8096
---

