# GENERATED by cmd/gen-runbooks - the one evidence workflow. The fallback for an alert with no action.
#
# Parameterised by namespace rather than generated once per alert: 70 of the 72 objects this replaced were
# byte-identical, and Argo's documentation is explicit that templates exist to be reused (ADR 0018).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: diag
  namespace: argo
spec:
  entrypoint: triage
  # Finished runs clean themselves up. Three Failed step pods from 2026-11-17 (the action role bug, fixed the next
  # morning) were still sitting in the argo namespace a day later, and their names alone pushed STATE.md over the tier-0 byte
  # budget - a diagnosis is evidence, but evidence nobody reads is debris. A day is long enough to read a verdict and
  # short enough that the namespace cannot accumulate a month of them.
  ttlStrategy:
    secondsAfterCompletion: 86400
  arguments:
    parameters:
      - {name: namespace, value: monitoring}
  templates:
    - name: triage
      steps:
        # get pods -o wide --field-selector status.phase!=Running,status.phase!=Succeeded
        - - name: pods
            inline:
              container:
                image: registry.k8s.io/kubectl:v1.34.5@sha256:c7bf8cf6e79f474fda2623a7b98572a1b909c4d912b05062b444ffe79883fdbe
                command: [/bin/kubectl]
                args:
                  - "-n"
                  - "{{workflow.parameters.namespace}}"
                  - "get"
                  - "pods"
                  - "-o"
                  - "wide"
                  - "--field-selector"
                  - "status.phase!=Running,status.phase!=Succeeded"
        # get events --field-selector type=Warning --sort-by=.lastTimestamp
        - - name: events
            inline:
              container:
                image: registry.k8s.io/kubectl:v1.34.5@sha256:c7bf8cf6e79f474fda2623a7b98572a1b909c4d912b05062b444ffe79883fdbe
                command: [/bin/kubectl]
                args:
                  - "-n"
                  - "{{workflow.parameters.namespace}}"
                  - "get"
                  - "events"
                  - "--field-selector"
                  - "type=Warning"
                  - "--sort-by=.lastTimestamp"
        # logs -l app.kubernetes.io/name --tail=100 --ignore-errors
        - - name: logs
            inline:
              container:
                image: registry.k8s.io/kubectl:v1.34.5@sha256:c7bf8cf6e79f474fda2623a7b98572a1b909c4d912b05062b444ffe79883fdbe
                command: [/bin/kubectl]
                args:
                  - "-n"
                  - "{{workflow.parameters.namespace}}"
                  - "logs"
                  - "-l"
                  - "app.kubernetes.io/name"
                  - "--tail=100"
                  - "--ignore-errors"
