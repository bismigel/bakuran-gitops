# GENERATED by cmd/gen-runbooks - the actions that can run in-cluster (ADR 0018).
#
# One object, not one per alert: measured 2026-11-16, the 72 generated templates carried 3 distinct step bodies and the
# ArgoCD controller had been OOM-killed 25 times carrying that table as API objects.
#
# A step group appears here only when **every** diagnose command of that action can run in a pod. An action that needs the host
# over ssh, or kubectl exec to borrow somebody else's container, runs on a workstation instead - ops-diag says so and does
# not submit, because a step that cannot answer is worse than a sentence that says where to look.
#
# Read-only by construction: diagnose only, and the role it runs under refuses every write verb. A remedy is never run in-cluster
# (ADR 0012).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: action
  namespace: argo
spec:
  entrypoint: run-action
  # The pods need the registry credential, and Kubernetes takes imagePullSecrets from the *service account*, not from the workflow.
  # Naming the account here does both jobs: the pull secret comes with it, and the RBAC in rbac.yaml is bound to the account the steps
  # actually run as - the first version ran as the default account, which had neither.
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - {name: action, value: none}
  templates:
    - name: run-action
      steps:
        - - name: argocd-app-out-of-sync
            when: '"{{workflow.parameters.action}}" == "argocd-app-out-of-sync"'
            template: run-argocd-app-out-of-sync
        - - name: argocd-component-down
            when: '"{{workflow.parameters.action}}" == "argocd-component-down"'
            template: run-argocd-component-down
        - - name: deployment-replicas-unavailable
            when: '"{{workflow.parameters.action}}" == "deployment-replicas-unavailable"'
            template: run-deployment-replicas-unavailable
        - - name: etcd-quorum-at-risk
            when: '"{{workflow.parameters.action}}" == "etcd-quorum-at-risk"'
            template: run-etcd-quorum-at-risk
        - - name: jellyfin-transcode-broken
            when: '"{{workflow.parameters.action}}" == "jellyfin-transcode-broken"'
            template: run-jellyfin-transcode-broken
        - - name: longhorn-volume-faulted
            when: '"{{workflow.parameters.action}}" == "longhorn-volume-faulted"'
            template: run-longhorn-volume-faulted
        - - name: nodedown
            when: '"{{workflow.parameters.action}}" == "nodedown"'
            template: run-nodedown
        - - name: pod-stuck-pending
            when: '"{{workflow.parameters.action}}" == "pod-stuck-pending"'
            template: run-pod-stuck-pending
        - - name: prometheus-watchdog-stale
            when: '"{{workflow.parameters.action}}" == "prometheus-watchdog-stale"'
            template: run-prometheus-watchdog-stale
        - - name: status-api-not-scraped
            when: '"{{workflow.parameters.action}}" == "status-api-not-scraped"'
            template: run-status-api-not-scraped

    # argocd-app-out-of-sync - An Application is OutOfSync although self-heal is on - the cluster is refusing the update, or the comparison is stale
    - name: run-argocd-app-out-of-sync
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          kubectl -n argocd get applications -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status --no-headers | awk '$2=="OutOfSync"'
          kubectl -n argocd get application -o json | jq -r '.items[] | select(.status.sync.status=="OutOfSync") | "\(.metadata.name): \(.status.conditions[0].message // "no condition")"'
          kubectl -n argocd logs -l app.kubernetes.io/name=argocd-application-controller --tail=40 | grep -iE 'error|refus|denied|invalid' | tail -10
          
          printf '\nverdict: %s\n' 'A message naming a refused field or a denied request means the cluster is rejecting the manifest and the diff will never converge. No message, and a recent manifest change, points at the comparison being stale - refresh the Application before touching anything else.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # argocd-component-down - An ArgoCD component has no ready replica - nothing deploys while it is down
    - name: run-argocd-component-down
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          kubectl -n argocd get pods -o wide
          kubectl -n argocd get events --sort-by=.lastTimestamp | tail -12
          kubectl -n argocd logs -l app.kubernetes.io/name=argocd-repo-server --tail=25 | grep -iE 'error|fatal|refus|timeout' | tail -10
          
          printf '\nverdict: %s\n' 'repo-server down means nothing can render, so every Application goes Unknown and the cluster keeps running its last known state; application-controller down means nothing reconciles, so drift accumulates silently. Both look like "ArgoCD is broken" and only the second one is quiet.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # deployment-replicas-unavailable - A Deployment has unavailable replicas - the pods cannot be scheduled, pulled or started
    - name: run-deployment-replicas-unavailable
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          kubectl get deployments -A -o json | jq -r '.items[] | select((.status.unavailableReplicas // 0) > 0) | "\(.metadata.namespace)/\(.metadata.name)"'
          kubectl get pods -A -o wide --field-selector status.phase!=Running,status.phase!=Succeeded
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp | tail -15
          
          printf '\nverdict: %s\n' 'Unschedulable pods name a resource (cpu, memory, a nodeSelector with no matching node); ImagePullBackOff names the registry or the pull secret; CrashLoopBackOff needs the pod log rather than the event. The event text decides which of those it is.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # etcd-quorum-at-risk - Fewer than two etcd members hold a leader - the next loss is a cluster that cannot elect
    - name: run-etcd-quorum-at-risk
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          curl -sG 'http://prometheus.monitoring.svc:9090/api/v1/query' --data-urlencode 'query=etcd_server_has_leader' | jq -r '.data.result[] | "\(.metric.instance) has_leader=\(.value[1])"'
          kubectl get nodes -o wide
          kubectl -n kube-system get pods -l 'app in (etcd)' -o wide
          kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes -o json | jq -r '.items[].endpoints[] | "endpoint \(.addresses[0]) ready=\(.conditions.ready)"'
          
          printf '\nverdict: %s\n' 'A member with has_leader=0 that is also NotReady on the node list is a machine problem; has_leader=0 on a Ready node is etcd refusing to elect - that is the case where restarting members one at a time is the only safe move, and restarting two is how a recoverable cluster is lost.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # jellyfin-transcode-broken - Jellyfin cannot transcode - hardware decode of 10-bit HEVC produces no frames
    - name: run-jellyfin-transcode-broken
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          kubectl -n default exec deploy/jellyfin -- sh -c 'grep -l "error code: -38" /config/log/FFmpeg.Transcode*.log | tail -3'
          kubectl -n default exec deploy/jellyfin -- sh -c 'grep -A5 HardwareDecodingCodecs /config/config/encoding.xml'
          
          printf '\nverdict: %s\n' 'If '\''hevc'\'' is in HardwareDecodingCodecs, this is it: 10-bit HEVC is hardware-decoded into a P010 surface and scale_vaapi refuses it. Removing '\''hevc'\'' from that list keeps hardware *encoding* (the expensive half) and software-decodes HEVC (cheap at 1080p).'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # longhorn-volume-faulted - A Longhorn volume is faulted - it has fewer healthy replicas than its policy demands
    - name: run-longhorn-volume-faulted
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          kubectl -n longhorn-system get volumes.longhorn.io -o custom-columns=NAME:.metadata.name,STATE:.status.state,ROBUSTNESS:.status.robustness,NODE:.status.currentNodeID --no-headers | awk '$3!="healthy"'
          kubectl -n longhorn-system get replicas.longhorn.io -o custom-columns=NAME:.metadata.name,DATA:.spec.dataEngine,NODE:.spec.nodeID,FAILED:.spec.failedAt,STATE:.status.currentState --no-headers | head -20
          kubectl get nodes -o wide
          kubectl -n longhorn-system get pods -l app=longhorn-manager -o wide
          
          printf '\nverdict: %s\n' 'Faulted with all nodes Ready means a replica disk failed or was evicted, not a node outage - the volume still serves reads from its remaining replica and the repair is a rebuild, not a restore. Faulted with a node NotReady is the case where doing nothing for an hour is what turns a rebuild into a restore from backup.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # nodedown - A node's exporter has been down for two minutes - the node is down, or only the exporter is
    - name: run-nodedown
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          kubectl get nodes -o wide
          curl -sG 'http://prometheus.monitoring.svc:9090/api/v1/query' --data-urlencode 'query=up{job="node-exporter"}' | jq -r '.data.result[] | "\(.metric.instance) up=\(.value[1])"'
          kubectl get pods -A -o wide --field-selector status.phase!=Running,status.phase!=Succeeded | head -20
          
          printf '\nverdict: %s\n' 'The node showing NotReady means the machine is down or the kubelet is; a Ready node with up=0 means only the exporter or its NetworkPolicy broke. Both look identical from the alert, and the two fixes are different.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # pod-stuck-pending - A pod is Pending - the scheduler will not place it, and its events say why
    - name: run-pod-stuck-pending
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          kubectl get pods -A -o json | jq -r '.items[] | select(.status.phase=="Pending") | "\(.metadata.namespace)/\(.metadata.name)"'
          kubectl get events -A --field-selector reason=FailedScheduling --sort-by=.lastTimestamp | tail -10
          kubectl describe nodes | grep -A4 'Allocated resources' | head -20
          
          printf '\nverdict: %s\n' 'FailedScheduling names the constraint (insufficient cpu/memory, node affinity, a taint, a volume in the wrong zone). If the message says the volume is not attachable, the pod is not the problem - the PVC is.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # prometheus-watchdog-stale - No Watchdog from either Prometheus - rules are not being evaluated, or the alerting path is broken
    - name: run-prometheus-watchdog-stale
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          curl -sG 'http://prometheus.monitoring.svc:9090/api/v1/query' --data-urlencode 'query=ALERTS{alertname="Watchdog"}' | jq -r '.data.result[] | "\(.metric.instance) state=\(.metric.alertstate)"'
          kubectl -n monitoring get pods -l 'app in (prometheus,alertmanager)' -o wide
          kubectl -n monitoring logs -l app=prometheus --tail=20 | grep -iE 'error|rule|evaluat' | tail -10
          curl -s 'http://alertmanager.monitoring.svc:9093/api/v2/status' | jq -r '.cluster.status'
          
          printf '\nverdict: %s\n' 'Watchdog absent from one instance means that Prometheus is not evaluating rules; absent from both means the pipeline is down rather than a rule bug. An alertmanager with a single peer reports "disabled" for high availability - that is the estate, not a fault.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt

    # status-api-not-scraped - status-api is not reporting - the scrape, the service or its checks are gone
    - name: run-status-api-not-scraped
      script:
        image: registry.bismigel.dev/ops-run@sha256:6022b133b68a966c7a73be56604eb3dbc5441638d35b205848c13cc215ed4cfb
        command: [/bin/sh]
        source: |
          (
          kubectl -n apps get pods -l app=status-api -o wide
          kubectl -n apps get svc,servicemonitor -o wide 2>/dev/null | head -10
          curl -s -m 5 "http://status-api.apps.svc:9091/healthz" || true
          curl -sG 'http://prometheus.monitoring.svc:9090/api/v1/targets' --data-urlencode 'state=active' | jq -r '.data.activeTargets[] | select(.labels.job | test("status")) | "\(.labels.job) \(.scrapeUrl) \(.health) \(.lastError // "")"'
          
          printf '\nverdict: %s\n' 'A healthy pod with no active target means the ServiceMonitor, the port or the NetworkPolicy broke - the status page is fine and its alarm is what stopped. A pod that is not Running means the page is genuinely down and the missing metric is the symptom, not the fault.'
          ) 2>&1 | { mkdir -p /tmp && tee /tmp/verdict.txt; }
      outputs:
        parameters:
          - name: verdict
            valueFrom:
              path: /tmp/verdict.txt
