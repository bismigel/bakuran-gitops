# GENERATED by cmd/gen-runbooks - the actions, run in-cluster (ADR 0018).
#
# The step groups are gated by the `action` parameter, so this is ONE object holding the whole registry rather than
# one object per alert. The commands are copied from the actions, which stay the only place a procedure is written;
# regenerate (and `--check`) when an action changes.
#
# Read-only by construction: diagnose only. A remedy is never run in-cluster (ADR 0012), and the ServiceAccount this
# template uses is being narrowed to get/list/watch in story R.9.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: action
  namespace: argo
spec:
  entrypoint: run-action
  arguments:
    parameters:
      - {name: action, value: none}
  templates:
    - name: run-action
      steps:
        # egress-map-stale-ifindex - Selected pods cannot egress although the tunnel is up - Cilium's egress map holds a stale interface index
        - - name: egress-map-stale-ifindex
            when: '{{workflow.parameters.action}} == "egress-map-stale-ifindex"'
            inline:
              container:
                image: alpine/k8s:1.34.5@sha256:2757ed9328916879dded68cc467d54e675b64826f7566ecf14f54104646a79ff
                command: [/bin/sh, -c]
                args:
                  - "(\nkubectl -n kube-system exec $(kubectl -n kube-system get pods -l k8s-app=cilium --field-selector spec.nodeName=calamansi-intel -o name | head -1 | cut -d/ -f2) -c cilium-agent -- cilium-dbg bpf egress list | head -4\n\nprintf '\\nverdict: %s\\n' 'If the map'\\''s '\\''Egress Ifindex'\\'' differs from the live ifindex, this is it. Recreating proton0 changes the index and Cilium does not re-resolve it, so every selected pod is dropped while reporting Running and Healthy.'\nprintf '\\nnot run here (needs the host): %s\\n' 'ssh root@192.168.2.81 '\\''cat /sys/class/net/proton0/ifindex'\\'''\n) 2>&1 | tee /tmp/verdict.txt"
                outputs:
                  parameters:
                    - name: verdict
                      valueFrom:
                        path: /tmp/verdict.txt
        # handshake-gate-refusing-label - The tunnel election holds the lease but refuses egress-node - the tunnel does not handshake
        - - name: handshake-gate-refusing-label
            when: '{{workflow.parameters.action}} == "handshake-gate-refusing-label"'
            inline:
              container:
                image: alpine/k8s:1.34.5@sha256:2757ed9328916879dded68cc467d54e675b64826f7566ecf14f54104646a79ff
                command: [/bin/sh, -c]
                args:
                  - "(\nkubectl -n kube-system get secret wg-proton-private-key -o jsonpath='{.data.private-key}' | base64 -d | wg pubkey\n\nprintf '\\nverdict: %s\\n' 'No handshake, or a public key from the Secret that differs from the live interface, means the key in the cluster is stale. A second concurrent tunnel cannot be the answer: Proton allows one session per account (measured 2026-11-13).'\nprintf '\\nnot run here (needs the host): %s\\n' 'ssh root@192.168.2.81 '\\''wg show proton0 latest-handshakes; wg show proton0 | grep -E \"endpoint|allowed\"'\\'' | ssh root@192.168.2.81 '\\''wg show proton0 public-key'\\'''\n) 2>&1 | tee /tmp/verdict.txt"
                outputs:
                  parameters:
                    - name: verdict
                      valueFrom:
                        path: /tmp/verdict.txt
        # jellyfin-transcode-broken - Jellyfin cannot transcode - hardware decode of 10-bit HEVC produces no frames
        - - name: jellyfin-transcode-broken
            when: '{{workflow.parameters.action}} == "jellyfin-transcode-broken"'
            inline:
              container:
                image: alpine/k8s:1.34.5@sha256:2757ed9328916879dded68cc467d54e675b64826f7566ecf14f54104646a79ff
                command: [/bin/sh, -c]
                args:
                  - "(\nkubectl -n default exec deploy/jellyfin -- sh -c 'grep -l \"error code: -38\" /config/log/FFmpeg.Transcode*.log | tail -3'\nkubectl -n default exec deploy/jellyfin -- sh -c 'grep -A5 HardwareDecodingCodecs /config/config/encoding.xml'\n\nprintf '\\nverdict: %s\\n' 'If '\\''hevc'\\'' is in HardwareDecodingCodecs, this is it: 10-bit HEVC is hardware-decoded into a P010 surface and scale_vaapi refuses it. Removing '\\''hevc'\\'' from that list keeps hardware *encoding* (the expensive half) and software-decodes HEVC (cheap at 1080p).'\n) 2>&1 | tee /tmp/verdict.txt"
                outputs:
                  parameters:
                    - name: verdict
                      valueFrom:
                        path: /tmp/verdict.txt
        # wireguard-probe-false-positive - WireGuardNoEgress fires while egress works - the probe target is filtered, not the tunnel
        - - name: wireguard-probe-false-positive
            when: '{{workflow.parameters.action}} == "wireguard-probe-false-positive"'
            inline:
              container:
                image: alpine/k8s:1.34.5@sha256:2757ed9328916879dded68cc467d54e675b64826f7566ecf14f54104646a79ff
                command: [/bin/sh, -c]
                args:
                  - "printf 'runs on a workstation, not in a pod: ops-run wireguard-probe-false-positive\\n' 'One target failing while the others answer 200 means the VPN server filters that host. That is a probe bug, not an outage - fix the target (it is one.one.one.one since 2026-11-14) and leave the tunnel alone.\\n'"
                outputs:
                  parameters:
                    - name: verdict
                      valueFrom:
                        path: /tmp/verdict.txt
    - name: no-action
      steps:
        - - name: nothing-registered
            when: '{{workflow.parameters.action}} == "none"'
            inline:
              container:
                image: registry.k8s.io/kubectl:v1.34.5@sha256:c7bf8cf6e79f474fda2623a7b98572a1b909c4d912b05062b444ffe79883fdbe
                command: [/bin/kubectl, version, --client]
