# Alerts that are NOT diagnosed by a condition, grouped, each saying where the operator goes instead.
#
# A waiver is a decision, not a shrug: `check-alert-coverage` (Go, in homelab-context) fails when an alert has neither a condition nor a
# waiver, so adding a rule forces the question "what happens when this fires?" in the PR rather than during the incident.
#
# Adding a condition later: delete the name from its group and put `alerts = ["<Name>"]` in the condition. The check reports
# waived alerts that no longer exist, so these lists cannot rot silently either.
#
# YAML, not TOML: this is infrastructure-as-code and the estate has one config format.
group:
- reason: 'Kubernetes state alerts: the object is named in the alert and `kubectl describe` is the diagnosis. runbook 25'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - JobPodsFailing
  - KubePodCrashLooping
  - PodContainerConfigError
  - ContainerMemoryNearLimit
  - TargetDown
  - CAdvisorScrapeFailing
  - StrayCNIAddress
  - StrayCNIMetricsMissing
- reason: 'GitOps state: `argocd app diff <name>` is the diagnosis. runbook 25 (ArgoCD section)'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - ArgoCDAppUnhealthy
  - ArgoCDMetricsMissing
- reason: ArgoCD HA internals of a single component; runbook 25 and the argocd-ha manifests
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - ArgoCDRedisHAEndpointsLow
- reason: 'etcd: the alert names the symptom and `ops/broken` plus runbook 26''s etcd section is the procedure. Quorum cases go to a human immediately'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - EtcdDbSizeNearQuota
- reason: 'Longhorn: capacity and scheduling alerts are answered by `ops/longhorn-air` and runbook 26 (storage). Story 10.11 right-sized the last one'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - LonghornDiskActualSpaceLow
  - LonghornScrapeFailing
  - LonghornDiskUnavailable
  - LonghornVolumeDegraded
- reason: 'Media pool capacity and health: `ops/mounts` then MEDIA.md. A human decides what to delete, never a script (ADR 0002 in spirit: nothing is deleted automatically)'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: workstation
  alerts:
  - MediaPoolCritical
  - MediaPoolDaysToFull
  - RootFilesystemDaysToFull
  - ProtonBackupStale
- reason: Cloudflare surface is read-only to this estate; the procedure is runbook 23 and the diagnostic is `curl` against the edge, which the export cannot do
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: workstation
  alerts:
  - CloudflareCertificateInactive
  - CloudflareExporterStale
  - CloudflareTunnelDown
  - CloudflareTunnelSingleConnector
  - CloudflareZoneNotActive
- reason: 'Router alerts: homelab-context/docs/reference/network.md §9 has the read-only checks; the box has no out-of-band console, so anything needing hands is a human decision (story 4.6)'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: workstation
  alerts:
  - RouterHeartbeatStale
  - RouterInterfaceErrors
  - RouterPfStateTableHigh
  - RouterResolverDown
  - NetworkDeviceTlsExpiringSoon
  - NetworkDeviceUnreachable
  - WanUnreachable
- reason: 'Public edge probes and SLOs: the alert carries the URL and `ops/public-surface` shows the whole surface; burn-rate alerts are forecasts whose action is capacity, not a fix'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - PublicSLOFastBurn
  - PublicSLOSlowBurn
  - StatusApiCheckFailing
- reason: 'Alert delivery itself: `ops/broken` plus the watchdog runbook; if Telegram is down the alert is the only symptom and the fix is in runbook 24'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - AlertmanagerNotificationFailing
- reason: 'The WireGuard alerts that are NOT egress: the exporter is missing, or the unit restarted. Both are read with `systemctl status` on .81; the egress conditions cover the interesting cases. Both are read with `systemctl status` on .81; the egress conditions cover the interesting cases'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: workstation
  alerts:
  - WireGuardMetricsMissing
- reason: 'External Secrets: one provider (Bitwarden), two questions - is one object stuck (runbook 25 §ExternalSecretNotSyncing) and is the provider itself failing (runbook 25 §BitwardenProviderFailing). A failed reconcile does not lose data: the target Secret keeps its last synced values, so the diagnosis is the provider call log, not the object'
  where: cluster
  alerts:
  - ExternalSecretNotSyncing
  - BitwardenProviderFailing
- reason: 'CNPG WAL archiving: the cluster''s ContinuousArchiving condition and the barman plugin log name the cause. runbook 07'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - CNPGWalArchivingFailing
  - CNPGMetricsMissing
- reason: 'EasyShortlist app SLOs and safety alerts: the app''s own signals are the diagnosis - /admin "Processing issues" (IDs and codes only), the app logs (leak_kind, candidate ids) and the shortlist dashboards. runbook 28'
  # Story 7.4: where the answer runs - a pod/kubectl (`cluster`) or the host/router/token proxy
  # (`workstation`). Required for every group; check-alert-coverage fails without it.
  where: cluster
  alerts:
  - EasyShortlistJobFailureBurnRate
  - EasyShortlistLeakBlock
  - EasyShortlistScoreDisagreement
  - EasyShortlistTimeToScoreBurnRate
