# The watchdog is the alert that proves alerting works. Read-only on the evaluator's store: vmalert writes
# `watchdog:evaluation:alive` into VictoriaMetrics, so one query answers whether rules are being evaluated.
id: prometheus-watchdog-stale
title: No Watchdog in the store - vmalert is not evaluating rules, or the alerting path is broken
severity: high
blast_radius: cluster
reversible: true
runbook: homelab-context/docs/reference/conditions.md
runbook_repo: homelab-context
measured: '2026-11-18'
alerts:
- PrometheusWatchdogStale
- AlertmanagerNotReceivingAlerts
detect:
  commands:
  - curl -sG 'http://victoriametrics.monitoring.svc:8428/api/v1/query' --data-urlencode 'query=ALERTS{alertname="Watchdog"}' | jq -r '.data.result | length'
  expect: notempty
diagnose:
  commands:
  - curl -sG 'http://victoriametrics.monitoring.svc:8428/api/v1/query' --data-urlencode 'query=ALERTS{alertname="Watchdog"}' | jq -r '.data.result[] | "\(.metric.instance) state=\(.metric.alertstate)"'
  - kubectl -n monitoring get pods -l 'app in (vmalert,alertmanager)' -o wide
  - kubectl -n monitoring logs -l app=vmalert --tail=20 | grep -iE 'error|rule|evaluat' | tail -10
  - curl -s 'http://alertmanager.monitoring.svc:9093/api/v2/status' | jq -r '.cluster.status'
  verdict: 'Watchdog absent from the store means vmalert is not evaluating rules - the pipeline is down rather than a rule bug.
    Both vmalert replicas write it, so a single replica failing is not visible here; that is what the two-replica
    anti-affinity is for. An alertmanager with a single peer reports "disabled" for high availability - that is the estate, not a
    fault.'
remedy:
  commands: []
  why_safe: No automatic remedy. The watchdog exists to make "alerting is broken" loud; an agent that restarts Prometheus on it hides
    the next occurrence instead of reporting it.
