# Found 2026-11-16 the long way: "the Xbox cannot play this episode, web works, so the file must be HEVC".
#
# It was not the file. h264 High 8-bit SDR, E-AC3 5.1, decoded cleanly - and identical in structure to the episodes that
# played. The server could not transcode it, and could not transcode any of 34 items: the iHD driver returns
# "Function not implemented" for scale_vaapi from a P010 (10-bit) surface, so hardware-decoded HEVC produced no frames
# and ffmpeg exited 218. Anything the client could direct-play worked; anything needing a transcode died. Web players
# direct-play, which is why "it works in the browser" hid a server-side bug for weeks.
#
# YAML, not TOML: this is infrastructure-as-code and the estate has one config format.
id: jellyfin-transcode-broken
title: Jellyfin cannot transcode - hardware decode of 10-bit HEVC produces no frames
severity: medium
blast_radius: node
reversible: true
runbook: homelab-context/docs/reference/media.md
measured: '2026-11-16'
detect:
  commands:
  - 'kubectl -n default exec deploy/jellyfin -- sh -c ''f=$(ls -t /config/log/FFmpeg.Transcode*.log 2>/dev/null | head -1); [ -z "$f" ] || ! grep -q "error code: -22" "$f"'''
  expect: any-fail
diagnose:
  commands:
  - 'kubectl -n default exec deploy/jellyfin -- sh -c ''grep -l "error code: -38" /config/log/FFmpeg.Transcode*.log | tail -3'''
  - kubectl -n default exec deploy/jellyfin -- sh -c 'grep -A5 HardwareDecodingCodecs /config/config/encoding.xml'
  verdict: 'If ''hevc'' is in HardwareDecodingCodecs, this is it: 10-bit HEVC is hardware-decoded into a P010 surface and scale_vaapi refuses it. Removing ''hevc'' from that list keeps hardware *encoding* (the expensive half) and software-decodes HEVC (cheap at 1080p).'
remedy:
  commands:
  - kubectl -n default exec deploy/jellyfin -- sh -c 'cd /config/config && cp -n encoding.xml encoding.xml.bak && sed -i "/<string>hevc<\/string>/d" encoding.xml'
  - kubectl -n default rollout restart deploy/jellyfin
  why_safe: Removes one line from the hardware-decode list and restarts one Deployment. Jellyfin rewrites encoding.xml on shutdown, so the backup is taken before the edit and is kept under a dated name. Direct play is untouched - only transcodes change path, from a broken one to a working one.
