# The probe was pinned to one host that Proton filters; the tunnel was fine the whole time.
#
# YAML, not TOML: this is infrastructure-as-code and the estate has one config format.
id: wireguard-probe-false-positive
title: WireGuardNoEgress fires while egress works - the probe target is filtered, not the tunnel
severity: low
blast_radius: external
reversible: true
runbook: modules/wireguard-metrics.nix
runbook_repo: bakuran-infra
measured: '2026-11-14'
alerts:
- WireGuardNoEgress
detect:
  commands:
  - ssh root@192.168.10.81 'curl -s -o /dev/null -m 8 -w "%{http_code}" https://1.1.1.1/'
  - ssh root@192.168.10.81 'curl -s -o /dev/null -m 8 -w "%{http_code}" https://ifconfig.me'
  expect: any-fail
diagnose:
  commands:
  - ssh root@192.168.10.81 'for u in https://ifconfig.me https://one.one.one.one/ https://1.1.1.1/; do printf "%s " "$u"; curl -s -o /dev/null -m 8 -w "%{http_code}\n" "$u"; done'
  verdict: One target failing while the others answer 200 means the VPN server filters that host. That is a probe bug, not an outage - fix the target (it is one.one.one.one since 2026-11-14) and leave the tunnel alone.
remedy:
  commands: []
  why_safe: 'Nothing to remedy remotely: the fix is a one-line change to the probe target in bakuran-infra, reviewed like any other change.'
