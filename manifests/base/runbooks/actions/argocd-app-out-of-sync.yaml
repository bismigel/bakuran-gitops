# An Application reports OutOfSync with selfHeal on: either the cluster refuses something (admission, RBAC, an immutable field) or the
# comparison itself is stale. Read-only: everything here is get/describe/logs, so it runs in a pod.
#
# YAML, not TOML: this is infrastructure-as-code and the estate has one config format.
id: argocd-app-out-of-sync
title: An Application is OutOfSync although self-heal is on - the cluster is refusing the update, or the comparison is stale
severity: medium
blast_radius: workload
reversible: true
runbook: homelab-context/docs/reference/high-availability.md
runbook_repo: homelab-context
measured: '2026-11-18'
alerts:
- ArgoCDAppOutOfSync
detect:
  commands:
  - kubectl -n argocd get applications -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status --no-headers | awk '$2=="OutOfSync"{print $1}'
  expect: notempty
diagnose:
  commands:
  - kubectl -n argocd get applications -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status --no-headers | awk '$2=="OutOfSync"'
  - 'kubectl -n argocd get application -o json | jq -r ''.items[] | select(.status.sync.status=="OutOfSync") | "\(.metadata.name): \(.status.conditions[0].message // "no condition")"'''
  - kubectl -n argocd logs -l app.kubernetes.io/name=argocd-application-controller --tail=40 | grep -iE 'error|refus|denied|invalid' | tail -10
  verdict: A message naming a refused field or a denied request means the cluster is rejecting the manifest and the diff will never
    converge. No message, and a recent manifest change, points at the comparison being stale - refresh the Application before
    touching anything else.
remedy:
  commands: []
  why_safe: No automatic remedy. Clicking "sync" on a diff that is stale looks like a fix and hides the refusal; the operator has to read
    the message first.
