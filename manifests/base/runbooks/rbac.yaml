# What the diagnostic workflows may do: read evidence, and nothing else.
#
# R.9 closed 2026-11-16. The workflow ServiceAccount was bound to cluster-admin so the layer could be proved working at
# all. That was deliberate debt with an annotation; this replaces it with the permissions the evidence workflow actually
# uses - pods, events and pod logs - and nothing more.
#
# Why not grant more. The condition registry's commands in `conditions/*.toml` need `kubectl exec` (arbitrary code inside
# a container) and, in one case, read the WireGuard private key. Those are privileges ADR 0012 refuses to give a
# scheduler: the engine may look and report, never touch. So procedures stay on a workstation or an agent, where the
# operator has those rights deliberately, and this cluster grants the workflow only what a read-only investigation needs.
#
# Derived by reading the workflow, not from a template of "usual" rights: the diag workflow runs exactly
#   kubectl -n <ns> get pods | get events | logs -l app.kubernetes.io/name
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-workflow-diagnose
  annotations:
    bakuran.dev/owner: "story R.9"
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Argo's own executor needs this to report step results; it is not part of the investigation.
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-workflow-diagnose
subjects:
  - kind: ServiceAccount
    name: argo-workflow
    namespace: argo
roleRef:
  kind: ClusterRole
  name: argo-workflow-diagnose
  apiGroup: rbac.authorization.k8s.io
