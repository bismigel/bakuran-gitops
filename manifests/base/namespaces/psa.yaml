# Pod Security Admission for namespaces whose manifests do not create a
# Namespace object themselves. Namespaces created by an application carry their
# PSA labels in that application's manifest instead.
#
# `monitoring` and `media` are audit/warn only. Their pods use hostNetwork,
# hostPath or hostPort; baseline enforcement would reject them on restart.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
