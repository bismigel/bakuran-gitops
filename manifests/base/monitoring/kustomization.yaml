# Monitoring stack, cluster-agnostic: alert rules, dashboards, exporters, and the Victoria metrics
# stack (scrape config, store, evaluator) with Grafana in front.
#
# The layout, after the 2026-11-21 refactor that deleted Prometheus rather than patching around it:
#
#   vm-scrape.yaml          the scrape config, written for VictoriaMetrics (no strictParse flag)
#   victoriametrics.yaml    the store: scrape, 14d retention, 20Gi
#   vmalert.yaml            the evaluator: 2 replicas, the same rule ConfigMaps, Alertmanager
#   grafana.yaml            the read side; datasource uid `prometheus` aliased onto the store
#   rules/  exporters/  checks/                unchanged
#   dashboards/                              the TSDB comparison dashboard is deleted with the comparison it
#                                            showed: both of its datasources now resolve to the same store, and the
#                                            figures it quoted were the ones corrected on 2026-11-21 (they live in
#                                            docs/reference/observability.md and the published post)
#
# Longhorn is still NOT here: it is a Helm release owned by its own Application.
#
# Scrape targets that are production-specific (public hostnames probed by blackbox,
# the ingress host check) still live in these files; moving them into the overlay
# is the next step — it changes the rendered output, so it is a separate change
# with its own verification.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - exporters/netdev-exporter.yaml
  # The router API key its exporter reads. Declared as an ExternalSecret so a rotation on the router reaches the cluster
  # instead of leaving a dead credential behind a 401 nobody watches (story 10.8).
  - exporters/opnsense-api-secret.yaml
  - rules/alerting-easyshortlist.yaml
  - rules/alerting-network-devices.yaml
  - dashboards/grafana-dashboard-network-devices.yaml
  - dashboards/grafana-dashboard-switch.yaml
  - rules/alerting-workloads.yaml
  - rules/alerting.yaml
  - checks/evaluation-watchdog.yaml
  # exporters/prometheus-archive.yaml removed 2026-11-25: it declared two local-path PVCs to keep the
  # pre-2026-11-21 Prometheus history. That history did not survive the 2026-11-24 rebuild (no PV and no
  # local-path directory for either claim on any node); ArgoCD recreated the claims empty, they could
  # never bind (nothing mounts them), and the Pending PVCs kept this app Progressing. They carried
  # Prune=false, so the two empty objects remain until someone deletes them on purpose (ADR 0002).
  - exporters/blackbox-exporter.yaml
  - exporters/cloudflare-edge-exporter.yaml
  - exporters/etcd-metrics-proxy.yaml
  - dashboards/grafana-dashboard-cilium.yaml
  - dashboards/grafana-dashboard-containers.yaml
  - dashboards/grafana-dashboard-control-plane.yaml
  - dashboards/grafana-dashboard-edge.yaml
  - dashboards/grafana-dashboard-longhorn.yaml
  - dashboards/grafana-dashboard-network.yaml
  - dashboards/grafana-dashboard-overview.yaml
  - dashboards/grafana-dashboard-power.yaml
  - dashboards/grafana-dashboard-slo.yaml
  - dashboards/grafana-dashboard-storage.yaml
  - checks/immich-login-watch.yaml
  - checks/forgejo-mirror-check.yaml
  - checks/ingress-host-check.yaml
  - exporters/jellyfin-bitrate.yaml
  - checks/jellyfin-login-watch.yaml
  - exporters/kube-state-metrics.yaml
  - exporters/victoriametrics.yaml
  - exporters/vmalert.yaml
  - exporters/kube-vip.yaml
  - checks/login-alerts.yaml
  - exporters/longhorn-metrics-policy.yaml
  - exporters/grafana.yaml
  - exporters/vm-scrape.yaml
