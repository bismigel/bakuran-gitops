# The cluster's copy of the router API key — declared for the first time, because it was never in git (story 10.8).
#
# `netdev-exporter` consumes `Secret monitoring/opnsense-api` for `OPNSENSE_KEY`/`OPNSENSE_SECRET`. The Secret existed
# but no manifest created it: it was made by hand, so when the router key was rotated on 2026-11-04 (see
# opentofu/opnsense/README.md) nothing refreshed the copy and every call has returned
# `{"status":401,"message":"Authentication Failed"}` since. Found on 2026-11-09 while writing `ops/traffic`.
#
# Five days of silence is the lesson: an in-cluster consumer whose credential is dead looks like a monitoring problem,
# not a credential problem. ESO re-reads Bitwarden hourly, so a rotation on the router is followed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense-api
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    # Same name as the hand-made Secret, so the exporter needs no change; `Owner` is what lets ESO adopt it and keep it
    # current from now on.
    name: opnsense-api
    creationPolicy: Owner
  data:
    - secretKey: OPNSENSE_KEY
      remoteRef:
        key: opnsense-api-key
    - secretKey: OPNSENSE_SECRET
      remoteRef:
        key: opnsense-api-secret
