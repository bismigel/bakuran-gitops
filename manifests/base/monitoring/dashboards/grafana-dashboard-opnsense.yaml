# The router on its own dashboard (story 10.6 follow-up: vnstat arrived, so the router now has both live counters and
# historical totals).
#
# Layout rule from the network-devices dashboard, kept: one subject, one panel. Throughput is split per interface because
# "was that the WAN or the LAN?" is the first question anyone asks about a traffic spike, and a combined graph cannot
# answer it. This dashboard exists because the estate's 2026-11-06 question — "what moved 11 GB at 19:00 on Nov 1" — was
# answered only by inference across three application databases.
#
# Every query below is against a series that was verified live before this file was written:
#   opnsense_interface_*   from netdev-exporter (counters, per interface)
#   opnsense_pf_states_*, opnsense_memory_*, opnsense_dhcp_leases   likewise
#   netdev_up, netdev_tcp_ms, netdev_tls_days_left, netdev_wan_tcp_ms
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-opnsense
  namespace: monitoring
data:
  opnsense.json: |
    {
      "uid": "homelab-opnsense",
      "title": "OPNsense \u2014 router",
      "tags": [
        "network",
        "router"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "WAN throughput (em1)",
          "description": "Bits per second across the WAN interface. `out` is what left the house, which is the direction that answers \"what moved 11 GB last night\".",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(opnsense_interface_rx_bytes{iface=\"em1\"}[5m])*8",
              "legendFormat": "in",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "rate(opnsense_interface_tx_bytes{iface=\"em1\"}[5m])*8",
              "legendFormat": "out",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "LAN throughput (em0)",
          "description": "Internal 192.168.2.0/24 traffic through the router. NFS from .82 to .81 shows here.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(opnsense_interface_rx_bytes{iface=\"em0\"}[5m])*8",
              "legendFormat": "in",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "rate(opnsense_interface_tx_bytes{iface=\"em0\"}[5m])*8",
              "legendFormat": "out",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Clients VLAN throughput (vlan01)",
          "description": "Wi-Fi VLAN \u2014 where the TVs and phones are. A 4K Jellyfin stream shows up here and on LAN.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(opnsense_interface_rx_bytes{iface=\"vlan01\"}[5m])*8",
              "legendFormat": "in",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "rate(opnsense_interface_tx_bytes{iface=\"vlan01\"}[5m])*8",
              "legendFormat": "out",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Interface errors",
          "description": "OPNsense exports rx_errors only: there is no opnsense_interface_tx_errors series (verified 2026-11-24 by listing every opnsense_interface_* metric - rx_bytes, rx_errors, rx_packets, tx_bytes, tx_packets). A tx line would be a panel that can never fill. Non-zero here means physical trouble - duplex, cabling, or a failing NIC.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(opnsense_interface_rx_errors{iface=~\"em0|em1|vlan01\"}[5m])",
              "legendFormat": "{{iface}} rx",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "pf state table",
          "description": "Firewall state entries. Rising without bound is a connection leak; the limit is on the same series family.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "opnsense_pf_states_current",
              "legendFormat": "used",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "pf state limit",
          "description": "",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "opnsense_pf_states_limit",
              "legendFormat": "limit",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Router memory",
          "description": "",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "opnsense_memory_used_bytes",
              "legendFormat": "used",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "DHCP leases",
          "description": "",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "opnsense_dhcp_leases",
              "legendFormat": "leases",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Device reachability",
          "description": "Management port answers. This is the panel that was missing while the switch was unreachable.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "up",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "netdev_up",
              "legendFormat": "{{target}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Management latency",
          "description": "",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "netdev_tcp_ms",
              "legendFormat": "{{target}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "netdev_wan_tcp_ms",
              "legendFormat": "wan egress",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Certificate days left",
          "description": "Days until each device's management certificate expires. A self-signed cert still expires.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "netdev_tls_days_left",
              "legendFormat": "{{target}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
