# Managed by GitOps. Edit panels here; Grafana reloads them within 30s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo
  namespace: monitoring
data:
  slo.json: |
    {
      "uid": "homelab-slo",
      "title": "Homelab SLOs",
      "tags": ["homelab", "slo", "availability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-7d", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Public availability (7d)",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "avg(slo:probe_success:ratio7d)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.995 },
                  { "color": "green", "value": 0.999 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error budget remaining (7d)",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "avg(slo:probe_success:budget_remaining7d)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.25 },
                  { "color": "green", "value": 0.5 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Public probes down",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(probe_success == 0) or vector(0)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Availability by target (1h)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "slo:probe_success:ratio1h", "legendFormat": "{{instance}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.9,
              "max": 1,
              "custom": { "lineWidth": 2, "fillOpacity": 6, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Availability by target (7d)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "slo:probe_success:ratio7d", "legendFormat": "{{instance}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.98,
              "max": 1,
              "custom": { "lineWidth": 2, "fillOpacity": 6, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Probe duration",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "probe_duration_seconds", "legendFormat": "{{instance}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 6, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } }
        }
      ]
    }
