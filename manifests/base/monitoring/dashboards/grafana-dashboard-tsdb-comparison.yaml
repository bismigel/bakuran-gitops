# Managed by GitOps. Edit panels here; Grafana reloads them within 30s.
#
# LIVE comparison of both signals. Metrics: Prometheus vs VictoriaMetrics (same config by construction).
# Logs: VictoriaLogs vs Loki, both fed by the same otel-logs collector. All panels read Prometheus, which
# scrapes both backends' own /metrics - so one datasource, no cross-datasource joins.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tsdb-comparison
  namespace: monitoring
data:
  tsdb-comparison.json: |
    {
      "uid": "tsdb-comparison",
      "title": "Observability comparison \u2014 metrics and logs (live)",
      "tags": [
        "homelab",
        "comparison"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "METRICS \u2014 Prometheus vs VictoriaMetrics (same config, same 45 targets)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Memory (MiB) \u2014 lower is better",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus",
              "expr": "process_resident_memory_bytes{job=\"prometheus\"} / 1048576"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaMetrics",
              "expr": "process_resident_memory_bytes{job=\"victoriametrics\"} / 1048576"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Series stored",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus head series",
              "expr": "prometheus_tsdb_head_series{job=\"prometheus\"}"
            },
            {
              "refId": "B",
              "legendFormat": "VM active series (tsid cache)",
              "expr": "vm_cache_entries{job=\"victoriametrics\",type=\"storage/tsid\"}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Ingest rate (samples or rows /s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus appended",
              "expr": "sum(rate(prometheus_tsdb_head_samples_appended_total{job=\"prometheus\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "VM ingested",
              "expr": "sum(rate(vm_rows_added_to_storage_total{job=\"victoriametrics\"}[5m]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "row",
          "title": "LOGS \u2014 VictoriaLogs vs Loki (one collector, two sinks, identical input)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "collapsed": false
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory (MiB)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "VictoriaLogs",
              "expr": "process_resident_memory_bytes{job=\"victorialogs\"} / 1048576"
            },
            {
              "refId": "B",
              "legendFormat": "Loki",
              "expr": "process_resident_memory_bytes{job=\"loki\"} / 1048576"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Ingest rate (rows/s vs lines/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "VictoriaLogs rows/s",
              "expr": "sum(rate(vl_rows_ingested_total{job=\"victorialogs\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "Loki lines/s",
              "expr": "sum(rate(loki_distributor_lines_received_total{job=\"loki\"}[5m]))"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Total stored (cumulative \u2014 Loki started 2026-11-21, VictoriaLogs days earlier)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "VictoriaLogs rows",
              "expr": "sum(vl_rows_ingested_total{job=\"victorialogs\"})"
            },
            {
              "refId": "B",
              "legendFormat": "Loki lines",
              "expr": "sum(loki_distributor_lines_received_total{job=\"loki\"})"
            }
          ]
        },
        {
          "id": 9,
          "type": "text",
          "title": "What this shows, and what it does not",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "options": {
            "mode": "markdown",
            "content": "### Metrics \u2014 decided\n\nMeasured 2026-11-21, same `prometheus-config`, 45 targets, 30 s: **VictoriaMetrics holds ~84% of the series in ~15% of the memory** (154 MiB vs 1049 MiB), and answers the same PromQL at least as fast (7\u201318 ms vs 17\u201322 ms). Prometheus stays the *interface* \u2014 rules, exporters, PromQL \u2014 VictoriaMetrics is the store.\n\n### Logs \u2014 not decided, and the graph says why\n\nLoki was added on 2026-11-21 and starts **empty**, so the cumulative and disk panels are not comparable yet. What *is* comparable already: **memory is close** (Loki ~190 MiB vs VictoriaLogs ~110 MiB \u2014 nowhere near the 10\u00d7 gap metrics showed) and **query latency is the same order** (~130\u2013170 ms vs ~150\u2013320 ms for a namespace scan of 200 entries).\n\nDeployment effort, which is the other half of the answer: VictoriaLogs took **3 objects and 4 flags**, zero config file. Loki took **4 objects and 31 lines of `loki.yml`**, and needed three fixes to accept a single log line: the contrib collector removed its `loki` exporter, Loki 2.9 has no OTLP endpoint (hence 3.2.1), and the Longhorn volume needs `fsGroup: 10001`.\n\n### What to conclude\n\nMetrics: replace. Logs: **keep the incumbent unless a week of equal volume shows an advantage** \u2014 the incumbent's whole justification is fewer moving parts, and Loki has not yet earned replacing it.\n\nRaw numbers and the staging run: `homelab-context/docs/reference/observability.md`."
          }
        }
      ]
    }
