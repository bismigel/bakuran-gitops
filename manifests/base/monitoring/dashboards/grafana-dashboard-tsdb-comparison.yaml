# Managed by GitOps. Edit panels here; Grafana reloads them within 30s.
#
# LIVE comparison. Both backends scrape the same config (VM mounts prometheus-config), and Prometheus also scrapes
# VictoriaMetrics' own /metrics, so one datasource plots both. Panel 5 runs count(up) through each datasource so a
# divergence is visible rather than inferred.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tsdb-comparison
  namespace: monitoring
data:
  tsdb-comparison.json: |
    {
      "uid": "tsdb-comparison",
      "title": "TSDB comparison \u2014 Prometheus vs VictoriaMetrics (live)",
      "tags": [
        "homelab",
        "comparison"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Resident memory (MiB) \u2014 lower is better",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus",
              "expr": "process_resident_memory_bytes{job=\"prometheus\"} / 1048576"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaMetrics",
              "expr": "process_resident_memory_bytes{job=\"victoriametrics\"} / 1048576"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU cores used",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus",
              "expr": "rate(process_cpu_seconds_total{job=\"prometheus\"}[5m])"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaMetrics",
              "expr": "rate(process_cpu_seconds_total{job=\"victoriametrics\"}[5m])"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Ingest rate (samples or rows per second)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus appended",
              "expr": "sum(rate(prometheus_tsdb_head_samples_appended_total{job=\"prometheus\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaMetrics ingested",
              "expr": "sum(rate(vm_rows_inserted_total{job=\"victoriametrics\",type=\"prometheus\"}[5m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Series stored",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus head series",
              "expr": "prometheus_tsdb_head_series{job=\"prometheus\"}"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaMetrics (rows inserted, cumulative)",
              "expr": "sum(vm_rows_inserted_total{job=\"victoriametrics\"})"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Same PromQL through each backend \u2014 the counts should match",
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "Prometheus",
              "expr": "count(up)"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "VictoriaMetrics",
              "expr": "count(up)"
            }
          ]
        },
        {
          "id": 6,
          "type": "text",
          "title": "How to read this",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "options": {
            "mode": "markdown",
            "content": "Both backends scrape the **same config** (VictoriaMetrics mounts Prometheus' own `prometheus-config`), so the series and memory numbers compare the same work.\n\n**Panel 1 is the decision.** Staging A/B (15 000 avalanche series, steady state): VictoriaMetrics **164 MiB** vs Prometheus **360 MiB**, disk **118 MB vs 499 MB**, latency a wash (26\u201380 ms).\n\n**Panel 5 is the correctness check:** the same `count(up)` through each must return the same number. Divergence means one is not seeing the same targets.\n\nVictoriaMetrics is an **observer**: nothing alerts from it. Deleting `manifests/base/monitoring/exporters/victoriametrics.yaml` removes it."
          }
        }
      ]
    }
