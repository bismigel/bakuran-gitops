# Managed by GitOps. Edit panels here; Grafana reloads them within 30s.
#
# LIVE comparison of both signals. Metrics: Prometheus vs VictoriaMetrics (same config by construction).
# Logs: VictoriaLogs vs Loki, both fed by the same otel-logs collector. All panels read Prometheus, which
# scrapes both backends' own /metrics - so one datasource, no cross-datasource joins.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tsdb-comparison
  namespace: monitoring
data:
  tsdb-comparison.json: |
    {
      "uid": "tsdb-comparison",
      "title": "Observability comparison \u2014 metrics and logs (live)",
      "tags": [
        "homelab",
        "comparison"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "METRICS \u2014 Prometheus vs VictoriaMetrics (same config, same 45 targets)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Memory (MiB) \u2014 lower is better",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus",
              "expr": "process_resident_memory_bytes{job=\"prometheus\"} / 1048576"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaMetrics",
              "expr": "process_resident_memory_bytes{job=\"victoriametrics\"} / 1048576"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Series stored",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus head series",
              "expr": "prometheus_tsdb_head_series{job=\"prometheus\"}"
            },
            {
              "refId": "B",
              "legendFormat": "VM active series (tsid cache)",
              "expr": "vm_cache_entries{job=\"victoriametrics\",type=\"storage/tsid\"}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Ingest rate (samples or rows /s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Prometheus appended",
              "expr": "sum(rate(prometheus_tsdb_head_samples_appended_total{job=\"prometheus\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "VM ingested",
              "expr": "sum(rate(vm_rows_added_to_storage_total{job=\"victoriametrics\"}[5m]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "row",
          "title": "LOGS \u2014 VictoriaLogs vs Loki (one collector, two sinks, identical input)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "collapsed": false
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory (MiB)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "VictoriaLogs",
              "expr": "process_resident_memory_bytes{job=\"victorialogs\"} / 1048576"
            },
            {
              "refId": "B",
              "legendFormat": "Loki",
              "expr": "process_resident_memory_bytes{job=\"loki\"} / 1048576"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Ingest rate (rows/s vs lines/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "VictoriaLogs rows/s",
              "expr": "sum(rate(vl_rows_ingested_total{job=\"victorialogs\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "Loki lines/s",
              "expr": "sum(rate(loki_distributor_lines_received_total{job=\"loki\"}[5m]))"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Total stored (cumulative \u2014 Loki started 2026-11-21, VictoriaLogs days earlier)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "VictoriaLogs rows",
              "expr": "sum(vl_rows_ingested_total{job=\"victorialogs\"})"
            },
            {
              "refId": "B",
              "legendFormat": "Loki lines",
              "expr": "sum(loki_distributor_lines_received_total{job=\"loki\"})"
            }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "TRACES \u2014 Tempo vs VictoriaTraces (one collector, two sinks, identical spans)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "collapsed": false
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Memory (MiB)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Tempo",
              "expr": "process_resident_memory_bytes{job=\"tempo\"} / 1048576"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaTraces",
              "expr": "process_resident_memory_bytes{job=\"victoria-traces\"} / 1048576"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Spans per second (should be identical)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 18
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Tempo received",
              "expr": "sum(rate(tempo_distributor_spans_received_total{job=\"tempo\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaTraces ingested",
              "expr": "sum(rate(vt_rows_ingested_total{job=\"victoria-traces\",type=\"opentelemetry_traces_otlphttp_protobuf\"}[5m]))"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Total spans stored (cumulative \u2014 both started the same minute)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 18
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Tempo",
              "expr": "sum(tempo_distributor_spans_received_total{job=\"tempo\"})"
            },
            {
              "refId": "B",
              "legendFormat": "VictoriaTraces",
              "expr": "sum(vt_rows_ingested_total{job=\"victoria-traces\",type=\"opentelemetry_traces_otlphttp_protobuf\"})"
            }
          ]
        },
        {
          "id": 14,
          "type": "text",
          "title": "What this shows, and what it does not",
          "gridPos": {
            "h": 13,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "options": {
            "mode": "markdown",
            "content": "### Metrics \u2014 decided\n\nSame `prometheus-config`, 45 targets, 30 s: VictoriaMetrics holds **~84% of the series in ~15% of the memory** (154 vs 1049 MiB) at equal-or-better query latency (7\u201318 ms vs 17\u201322 ms). Replace the store, keep Prometheus' interface (PromQL, rules, exporters).\n\n### Logs \u2014 incumbent holds, for deployment cost rather than memory\n\nMemory is close (**~197 MiB Loki vs ~126 MiB VictoriaLogs**, nowhere near the 10\u00d7 gap metrics showed) and query latency is the same order. The difference is effort: VictoriaLogs is **3 objects + 4 flags**, Loki **4 objects + 31 lines of `loki.yml`** and needed three fixes to accept one log line. Its cumulative/disk panels are not comparable yet \u2014 Loki started 2026-11-21.\n\n### Traces \u2014 new, and both fed by the same spans\n\nHermes' FastAPI auto-instrumentation sends spans to the collector, which now exports to **both** stores. First measurement, identical input: **Tempo 77 MiB vs VictoriaTraces 27 MiB** (2.9\u00d7), 4 objects + 23 lines of YAML against 3 objects + 2 flags. Both reported exactly **5 625 spans**, which is the symmetry check.\n\nCaveat that belongs on the page: VictoriaTraces is **0.13**, five months old, and its README warns that on-disk formats and APIs may change. Leaner is not the same as safe for a fleet.\n\n### The gap in all three\n\nThis proves the *plumbing*, not the *experience*. A Datadog user misses clicking a slow span and seeing its logs; that needs one business service instrumented end to end and Panels linking trace\u2192log. Not measured yet.\n\nRaw numbers and the staging run: `homelab-context/docs/reference/observability.md`."
          }
        }
      ]
    }
