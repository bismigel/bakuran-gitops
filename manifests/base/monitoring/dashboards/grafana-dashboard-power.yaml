# Managed by GitOps. Edit panels here; Grafana reloads them within 30s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-power
  namespace: monitoring
data:
  power.json: |
    {
      "uid": "homelab-power",
      "title": "Homelab Power",
      "tags": [
        "homelab",
        "power"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Cluster power (W): measured vs modelled",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])) + sum(rate(kepler_node_dram_joules_total{mode=\"dynamic\"}[5m]))",
              "refId": "A",
              "legendFormat": "measured (package+DRAM)"
            },
            {
              "expr": "sum(rate(kepler_node_platform_joules_total{mode=\"dynamic\"}[5m]))",
              "refId": "B",
              "legendFormat": "platform (model)"
            }
          ],
          "description": "Two different quantities, and the panel used to show only the first under the name \"cluster power\", which read as a 13x understatement (23 W vs 296 W measured 2026-11-24).\n\nA (measured) is RAPL: CPU package + DRAM, excluding idle cores, disks, board and PSU losses. B (model) is Kepler's platform estimate - `kepler_node_info` reports `platform_power_source: none` on these hosts, so nothing meters it; Kepler derives it from a per-architecture model and splits the result across containers to produce the per-pod panel below. Neither is wall draw.",
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Energy 24h: package+DRAM (kWh)",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(increase(kepler_node_package_joules_total{mode=\"dynamic\"}[24h])) / 3.6e6",
              "refId": "A"
            }
          ],
          "description": "Measured RAPL energy (CPU package + DRAM) over the last 24h, in kWh. Not the estate's electricity: disks, board and PSU losses are not in it, and on these hosts they dominate.",
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Average 24h: measured (W)",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "avg_over_time((sum(rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])) + sum(rate(kepler_node_dram_joules_total{mode=\"dynamic\"}[5m])))[24h:5m])",
              "refId": "A"
            }
          ],
          "description": "24h mean of total measured draw.",
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Nodes reporting",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "count(kepler_node_info) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Pods tracked",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "count(count by (pod_name) (kepler_container_joules_total{mode=\"dynamic\"})) or vector(0)",
              "refId": "A"
            }
          ],
          "description": "Containers with energy attribution.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Busiest node share",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "max(rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])) / sum(rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])) * 100",
              "refId": "A"
            }
          ],
          "description": "Which node dominates the power budget.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU package power by node",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])",
              "refId": "A",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "min": 0,
              "max": null
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Per-node measured total (W)",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (instance) (rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])) + sum by (instance) (rate(kepler_node_dram_joules_total{mode=\"dynamic\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "min": 0,
              "max": null
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Top pods by attributed power (W)",
          "description": "An attribution, not a measurement: Kepler divides a power budget by cgroup CPU share, so read it as a ranking. The budget is the platform MODEL (`platform_power_source: none` on these hosts), which is why these values sum to ~296 W while RAPL measures 23 W of CPU package. Useful for \"who is burning it\", useless as watts.",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "topk(10, sum by (pod_name) (rate(kepler_container_joules_total{mode=\"dynamic\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{pod_name}}"
            }
          ],
          "description": "An attribution, not a measurement: Kepler divides a power budget by each cgroup's CPU share, so read it as a ranking, not as watts. The budget is the platform MODEL - `kepler_node_info` reports `platform_power_source: none` on these hosts - which is why these values sum to ~296 W while RAPL measures 23 W of CPU package. It answers \"which workload is burning the most\", and it answers that well.",
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "min": 0,
              "max": null
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "CPU temperature by node",
          "description": "Package (Intel coretemp) or Tctl (AMD k10temp) per node, via node_hwmon. The label join is what picks the package sensor out of the per-core ones.",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 0,
              "max": 100,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "max by (instance) (node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name) node_hwmon_chip_names{chip_name=~\"coretemp|k10temp\"} * on (instance, chip, sensor) group_left (label) node_hwmon_sensor_label{label=~\"Package id 0|Tctl\"})",
              "refId": "A",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Drive temperature by node (NVMe)",
          "description": "NVMe Composite sensor per node. Sustained >70 C is where these drives start throttling.",
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 0,
              "max": 100,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "max by (instance) (node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name) node_hwmon_chip_names{chip_name=\"nvme\"} * on (instance, chip, sensor) group_left (label) node_hwmon_sensor_label{label=\"Composite\"})",
              "refId": "A",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Hottest sensor (now)",
          "description": "Maximum across every hwmon sensor on each node \u2014 CPU, drive, board, wifi. A single number to answer 'is anything hot right now'.",
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 12,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "expr": "max by (instance) (node_hwmon_temp_celsius)",
              "refId": "A",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 14,
          "type": "table",
          "title": "All temperature sensors",
          "description": "Every hwmon sensor with its chip and label, so an unexpected reading can be identified without ssh: chip_name comes from node_hwmon_chip_names, label from node_hwmon_sensor_label (e.g. 'Package id 0', 'Core 3', 'Composite').",
          "gridPos": {
            "x": 12,
            "y": 29,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 1,
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true
                },
                "renameByName": {
                  "instance": "node",
                  "chip_name": "chip",
                  "label": "sensor",
                  "Value": "\u00b0C"
                }
              }
            }
          ],
          "targets": [
            {
              "expr": "node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name) node_hwmon_chip_names * on (instance, chip, sensor) group_left (label) node_hwmon_sensor_label",
              "refId": "A",
              "format": "table",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
