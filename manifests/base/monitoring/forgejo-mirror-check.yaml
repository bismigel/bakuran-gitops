# Are the GitHub mirrors still syncing?
#
# Why this exists: a Forgejo pull mirror that silently stops syncing looks
# perfectly healthy from every angle we normally watch — pod Ready, PVC bound,
# UI green, and (with Access in front) every external probe sees a 302. The
# only signal is `mirror_updated` going stale, so the check has to ask Forgejo
# itself.
#
# Same shape as ingress-host-check: one alert per failing repository, pushed
# straight to Alertmanager, resolved by expiry — and an explicit resolve when a
# repository is fresh again, so a fixed mirror does not stay "firing" for hours.
#
# The token is a Forgejo access token with read scope, mounted from the
# `forgejo-mirror-token` Secret in this namespace (created out-of-band, like
# every other credential in this estate).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-mirror-check
  namespace: monitoring
spec:
  # Every 6h. Mirrors sync daily, so two missed syncs is the smallest interval
  # that cannot fire on a single lost run.
  schedule: "23 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              command: ["/bin/sh", "-c"]
              args:
                  - |
                    #!/bin/sh
                    # Are the git mirrors still syncing?
                    #
                    # Rewritten 2026-11-16. The first version only knew about *pull* mirrors: it read `mirror_updated` and treated a missing
                    # value as stale. That was correct while GitHub was the origin and Forgejo pulled from it. After the migration these
                    # repositories are origins with a *push* mirror to GitHub, so `mirror_updated` is empty, the age arithmetic produced an
                    # absurd number, and six repositories fired "has not mirrored in 17758458h" while every one of them was mirroring fine.
                    #
                    # A monitor that reports a nonsense age is worse than no monitor: it teaches people to ignore the alert.
                    #
                    # Now: take the newest of the two timestamps a repository can have - `mirror_updated` (pull) and the push mirror's
                    # `last_update` - and only alert when a repository has neither, or when the newest one is older than 72h.
                    set -u
                    AM="http://alertmanager.monitoring.svc:9093/api/v2/alerts"
                    BASE="http://forgejo.forgejo.svc.cluster.local:3000/api/v1"
                    TOKEN="$(cat /etc/forgejo/token)"
                    # A stable identity, NOT the pod name. The pod name changes every run, so an alert posted by one run can never be
# resolved by the next - they accumulate and expire after 24h. Six alerts were firing from a single old run for exactly
# this reason, and the first run after the rewrite could not clear them for the same reason.
HOST="forgejo-mirror-check"
                    MAX_AGE=259200          # 72h = three missed daily syncs
                    now=$(date -u +%s)
                    stale=0
                    checked=0
                    
                    fire() {
                      curl -s -m 10 -X POST -H 'Content-Type: application/json' -d "$1" "$AM" || true
                    }
                    
                    alert() {   # alert <repo> <summary>
                      fire "[{\"labels\":{\"alertname\":\"ForgejoMirrorStale\",\"severity\":\"warning\",\"instance\":\"$HOST\",\"repo\":\"$1\"},\"annotations\":{\"summary\":\"$2\"}}]"
                    }
                    
                    resolve() {
                      fire "[{\"labels\":{\"alertname\":\"ForgejoMirrorStale\",\"severity\":\"warning\",\"instance\":\"$HOST\",\"repo\":\"$1\"},\"endsAt\":\"$(date -u -d @0 +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo 1970-01-01T00:00:00Z)\"}]" >/dev/null 2>&1 || true
                    }
                    
                    # Every repository this instance mirrors, in either direction.
                    repos=$(curl -sf -m 20 -H "Authorization: token $TOKEN" "$BASE/repos/search?limit=100" \
                      | tr ',' '\n' | grep -o '"full_name":"[^"]*/[^"]*"' | cut -d'"' -f4 | cut -d/ -f2 | sort -u)
                    
                    if [ -z "$repos" ]; then
                      echo "FAIL: no repositories returned by the API"
                      fire "[{\"labels\":{\"alertname\":\"ForgejoMirrorCheckBroken\",\"severity\":\"warning\",\"instance\":\"$HOST\"},\"annotations\":{\"summary\":\"the Forgejo mirror check cannot list repositories\"}}]"
                      exit 1
                    fi
                    
                    for r in $repos; do
                      ts=""
                      # Pull mirror (the mirror-of-GitHub case): mirror_updated on the repository.
                      pull=$(curl -sf -m 20 -H "Authorization: token $TOKEN" "$BASE/repos/bismigel/$r" \
                             | tr ',' '\n' | grep -o '"mirror_updated":"[^"]*"' | cut -d'"' -f4)
                      # Push mirror (the origin-with-a-mirror case): last_update on the mirror entry.
                      push=$(curl -sf -m 20 -H "Authorization: token $TOKEN" "$BASE/repos/bismigel/$r/push_mirrors" \
                             | tr ',' '\n' | grep -o '"last_update":"[^"]*"' | head -1 | cut -d'"' -f4)
                    
                      for cand in "$pull" "$push"; do
                        case "$cand" in ""|1970*) continue;; esac
                        e=$(date -u -d "$(echo "$cand" | tr 'T' ' ' | tr -d 'Z')" +%s 2>/dev/null || echo 0)
                        [ "$e" -gt 0 ] || continue
                        if [ -z "$ts" ] || [ "$e" -gt "$ts" ]; then ts=$e; fi
                      done
                    
                      checked=$((checked+1))
                      if [ -z "$ts" ]; then
                        echo "NO-TIMESTAMP $r: neither mirror_updated nor a push mirror last_update"
                        alert "$r" "$r has no mirror timestamp: it is neither a pull mirror nor pushing to one"
                        stale=$((stale+1))
                        continue
                      fi
                      age=$((now - ts))
                      if [ "$age" -gt "$MAX_AGE" ]; then
                        hours=$((age / 3600))
                        echo "STALE $r: last sync ${hours}h ago"
                        alert "$r" "$r last synced ${hours}h ago (threshold 72h)"
                        stale=$((stale+1))
                      else
                        echo "ok $r: $((age / 3600))h ago"
                        resolve "$r"
                      fi
                    done
                    
                    echo "checked ${checked} repo(s), stale: ${stale}"
                    [ "$stale" -eq 0 ]
              volumeMounts:
                - name: token
                  mountPath: /etc/forgejo
                  readOnly: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 96Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: token
              secret:
                secretName: forgejo-mirror-token
