# Are the GitHub mirrors still syncing?
#
# Why this exists: a Forgejo pull mirror that silently stops syncing looks
# perfectly healthy from every angle we normally watch — pod Ready, PVC bound,
# UI green, and (with Access in front) every external probe sees a 302. The
# only signal is `mirror_updated` going stale, so the check has to ask Forgejo
# itself.
#
# Same shape as ingress-host-check: one alert per failing repository, pushed
# straight to Alertmanager, resolved by expiry — and an explicit resolve when a
# repository is fresh again, so a fixed mirror does not stay "firing" for hours.
#
# The token is a Forgejo access token with read scope, mounted from the
# `forgejo-mirror-token` Secret in this namespace (created out-of-band, like
# every other credential in this estate).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-mirror-check
  namespace: monitoring
spec:
  # Every 6h. Mirrors sync daily, so two missed syncs is the smallest interval
  # that cannot fire on a single lost run.
  schedule: "23 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  AM="http://alertmanager.monitoring.svc:9093/api/v2/alerts"
                  BASE="http://forgejo.forgejo.svc.cluster.local:3000/api/v1"
                  TOKEN="$(cat /etc/forgejo/token)"
                  HOST="$(cat /proc/sys/kernel/hostname)"
                  # 72h = three missed daily syncs.
                  MAX_AGE=259200
                  now=$(date -u +%s)
                  stale=0

                  repos=$(curl -sf -m 20 -H "Authorization: token $TOKEN" \
                            "$BASE/repos/search?limit=100&mirror=true" \
                          | tr ',' '\n' | grep -o '"full_name":"[^"]*/[^"]*"' \
                          | cut -d'"' -f4 | cut -d/ -f2 | sort -u)

                  if [ -z "$repos" ]; then
                    echo "FAIL: no mirrors returned by the API"
                    curl -s -m 10 -X POST -H 'Content-Type: application/json' \
                      -d "[{\"labels\":{\"alertname\":\"ForgejoMirrorCheckBroken\",\"severity\":\"warning\",\"instance\":\"$HOST\"},\"annotations\":{\"summary\":\"Forgejo returned no mirrors to the freshness check\",\"description\":\"Either the API is down or the token lost read access. Auto-resolves when the next run sees repositories again.\"}}]" \
                      "$AM" || true
                    exit 1
                  fi

                  for r in $repos; do
                    ts=$(curl -sf -m 20 -H "Authorization: token $TOKEN" "$BASE/repos/bismigel/$r" \
                         | tr ',' '\n' | grep -o '"mirror_updated":"[^"]*"' | cut -d'"' -f4)
                    iso=$(echo "$ts" | tr 'T' ' ' | tr -d 'Z')
                    epoch=$(date -u -d "$iso" +%s 2>/dev/null || echo 0)
                    if [ "$epoch" -eq 0 ]; then
                      echo "FAIL $r: no usable mirror_updated ('$ts')"
                      stale=$((stale+1))
                      curl -s -m 10 -X POST -H 'Content-Type: application/json' \
                        -d "[{\"labels\":{\"alertname\":\"ForgejoMirrorStale\",\"severity\":\"warning\",\"instance\":\"$HOST\",\"repo\":\"$r\"},\"annotations\":{\"summary\":\"$r has no mirror timestamp\",\"description\":\"The mirror exists but Forgejo reports no last-sync time.\"}}]" \
                        "$AM" || true
                      continue
                    fi
                    age=$((now - epoch))
                    if [ "$age" -gt "$MAX_AGE" ]; then
                      echo "STALE $r: ${age}s since last sync"
                      stale=$((stale+1))
                      curl -s -m 10 -X POST -H 'Content-Type: application/json' \
                        -d "[{\"labels\":{\"alertname\":\"ForgejoMirrorStale\",\"severity\":\"warning\",\"instance\":\"$HOST\",\"repo\":\"$r\"},\"annotations\":{\"summary\":\"$r has not mirrored from GitHub in $((age/3600))h\",\"description\":\"Forgejo pull mirrors sync daily. Three missed syncs means the GitHub credential, the network path, or the mirror itself is broken. Auto-resolves when the mirror syncs again.\"},\"endsAt\":\"$(date -u -d @$((now+43200)) +%Y-%m-%dT%H:%M:%SZ)\"}]" \
                        "$AM" || true
                    else
                      # Explicit resolve: same labels, endsAt now.
                      curl -s -m 5 -X POST -H 'Content-Type: application/json' \
                        -d "[{\"labels\":{\"alertname\":\"ForgejoMirrorStale\",\"severity\":\"warning\",\"instance\":\"$HOST\",\"repo\":\"$r\"},\"endsAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]" \
                        "$AM" >/dev/null 2>&1 || true
                    fi
                  done

                  echo "checked $(echo "$repos" | wc -w) mirror(s), stale: $stale"
                  [ "$stale" -eq 0 ]
              volumeMounts:
                - name: token
                  mountPath: /etc/forgejo
                  readOnly: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 96Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: token
              secret:
                secretName: forgejo-mirror-token
