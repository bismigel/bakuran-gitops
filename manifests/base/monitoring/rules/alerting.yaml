# Prometheus alerting rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: infra
        rules:
          # --- is the backup actually getting to R2 (2026-11-23) -------------------
          # The appdata archive stopped uploading on 2026-11-21. `homelab-backup-apps`
          # exited 1 every night and the only report of it was a push to an
          # Alertmanager endpoint that story 10.10 had closed - so the estate knew,
          # in a journal nobody reads, and could not say. These two rules read the
          # metric the host now writes (modules/backup-age-metrics.nix) instead of an
          # exit code, because an exit code describes the attempt and the object
          # describes the backup.
          - alert: BackupArchiveStale
            expr: (time() - homelab_backup_newest_timestamp_seconds{dataset=~"appdata|credentials"}) > 36 * 3600
            for: 30m
            labels: { severity: critical }
            annotations:
              summary: "the newest {{ $labels.dataset }} object in R2 is {{ $value | humanizeDuration }} old (limit 36h)"
              description: "The archive, not one app: the guard sits above the upload, so a single SKIP means nothing was uploaded. Check the timer ran, then the journal, then whether the R2 credential can still WRITE (a read-only key passes every other check)."
              runbook_url: "https://runbook.bismigel.dev/runbook/07-backups-recovery/#backuparchivestale"
          - alert: BackupAgeMetricsMissing
            # Same lesson as WireGuardMetricsMissing and StrayCNIMetricsMissing: a monitor
            # whose metric never arrives is not a monitor. Without the series,
            # BackupArchiveStale above cannot fire - the two fail together silently.
            expr: absent(homelab_backup_age_seconds)
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "homelab_backup_* metrics are absent - the backup-age unit is not reporting"
              description: "Check homelab-backup-age-metrics on sitaw-amd and that /var/lib/node-exporter/textfile/backup-age.prom exists and is world-readable (the collector runs as nobody and skips an unreadable file silently)."
              runbook_url: "https://runbook.bismigel.dev/runbook/07-backups-recovery/#backupagemetricsmissing"
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "node-exporter down on {{ $labels.instance }}"
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#nodedown"
          - alert: TargetDown
            # kubelet-cadvisor and longhorn have their own scrape-failure
            # alerts (they say what you are now blind to), so exclude them
            # here instead of paging twice for the same condition.
            expr: up == 0 unless on(job, instance) up{job=~"kubelet-cadvisor|longhorn"} == 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "target {{ $labels.job }}/{{ $labels.instance }} down"
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#targetdown"
          # A backup disk that has fallen off the bus is indistinguishable from one
          # that needs no work: the mirror timer is weekly, the unit only exits 1 if
          # it *runs*, and the empty mountpoint becomes a directory on the root disk.
          # On 2026-11-02 a USB hub dropped both disks three times in 25 minutes
          # (21:55, 22:15, 22:17); nothing noticed, and the offline copy on the stick
          # had been five days stale before anyone looked at it.
          #
          # absent() rather than a threshold: the series disappears when nothing is
          # mounted, so there is no value to compare. Exact matchers are kept as
          # labels, which is why the summary can name the mount.
          - alert: BackupMountMissing
            expr: |
              absent(node_filesystem_size_bytes{mountpoint="/mnt/backup-sd", instance="192.168.2.82:9100"}) == 1
              or
              absent(node_filesystem_size_bytes{mountpoint="/mnt/scratch", instance="192.168.2.81:9100"}) == 1
            for: 20m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is not mounted"
              description: "No filesystem series for this mount, so nothing is mounted there (or the node-exporter is gone, which TargetDown covers). Until it comes back, writes aimed at the backup path land on the root filesystem, and the weekly mirror/off-site copy does nothing and reports success."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#backupmountmissing"
          # Proton offsite staleness: the unit records its own success timestamp (written only after upload AND verify
          # succeeded), so this fires when a weekly run has been MISSED for longer than cadence + grace. 'Just old' (a
          # 6-day-old archive) is normal; >9 days means Sunday's run did not succeed. absent() covers the metric never
          # being written, with a 24h for so a fresh deploy does not page before the first run.
          - alert: ProtonBackupStale
            expr: |
              absent(homelab_backup_proton_success_timestamp_seconds) == 1
              or
              time() - homelab_backup_proton_success_timestamp_seconds > 777600
            for: 24h
            labels: { severity: warning }
            annotations:
              summary: "Proton offsite has not succeeded in 9 days"
              description: "The newest age-encrypted Proton archive is older than the weekly cadence plus two days grace, so a run was missed or has been failing without OnFailure catching it. Check homelab-backup-proton on .82 before relying on the second offsite."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#protonbackupstale"
          - alert: DiskFillingUp
            # /mnt/media is excluded here: the media pool is a mergerfs union of
            # four branches across two hosts, so it gets its own pair of alerts.
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!="/mnt/media"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!="/mnt/media"}) * 100 > 85
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "disk {{ $labels.mountpoint }} on {{ $labels.instance }} >85% full"
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#diskfillingup"
          - alert: RootFilesystemDaysToFull
            # The root filesystem on the cluster nodes carries etcd, k3s state and
            # the containerd image store (21-29G of images per node on 2026-10-30),
            # so it fills from deployment churn rather than from user data and
            # spends months at 30-40% before crossing 85%. Same two guards as
            # MediaPoolDaysToFull: a 24h window so a one-off cleanup (20G freed on
            # 2026-10-30) cannot fake a trend, and fire only when headroom is
            # genuinely low *and* still shrinking.
            expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[24h], 7 * 86400) < 0
              and (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.20
            for: 2h
            labels: { severity: warning }
            annotations:
              summary: "root filesystem on {{ $labels.instance }} projected to fill within 7 days"
              description: "Image store and k3s state are growing faster than they are being reclaimed. `k3s crictl rmi --prune` and `nix-collect-garbage --delete-older-than 14d` usually recover 15-20G; etcd does not survive a full /."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#rootfilesystemdaystofull"
          - alert: HostMemoryHigh
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "memory on {{ $labels.instance }} >90%"
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#hostmemoryhigh"
          # Media pool (/mnt/media on calamansi-intel): the whole media stack and
          # every *arr import dies when this fills, so warn early and loud.
          #
          # HISTORICAL (the union is gone as of 2026-11-02; /mnt/media is NFS from
          # .82). Kept because it explains why the media alerts are layered - the
          # pool view alone hid a full branch. The branch-level rules are deleted.
          #
          # WARNING: the *union* is the wrong fault domain on its own. mergerfs
          # (category.create=epmfs) only writes into branches that already hold
          # the library directory, and each branch has its own 4G minfreespace.
          # 2026-10-24: /mnt/media read 71% while media-sda was at 99% and every
          # create under /books,/tv,/movies failed with ENOSPC. So the pool
          # alerts below stay, but the per-branch ones are the real signal.
          - alert: MediaPoolDaysToFull
            # % full cannot tell "stable at 90%" from "dead in two days".
            # Two guards, both learned the hard way: the 6h window fired on the
            # 155G one-off rebalance right after it ran (avail dropped sharply on
            # remote82-sda, so the slope said "full within a week" while the disk
            # was 58% free). So: 24h window to smooth one-off moves, and only fire
            # when headroom is genuinely low (<15%) *and* still trending down.
            expr: predict_linear(node_filesystem_avail_bytes{mountpoint=~"/mnt/media.*"}[24h], 7 * 86400) < 0
              and (node_filesystem_avail_bytes{mountpoint=~"/mnt/media.*"} / node_filesystem_size_bytes{mountpoint=~"/mnt/media.*"}) < 0.15
            for: 2h
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} projected to fill within 7 days"
              description: "At the current 6h trend this filesystem runs out inside a week. Rebalance, tighten acquisition sizes, or add capacity."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#mediapooldaystofull"
          # --- WireGuard (ProtonVPN) on the media node -------------------
          # 2026-10-25: the tunnel died with "packets sent, 0 bytes received"
          # (stale endpoint IP) and took the whole media stack with it. Nothing
          # monitored it: the pool alerts watch disks, NodeDown watches the node,
          # and this failure leaves both looking healthy while no *arr can reach
          # an indexer. Metrics come from a textfile collector on the host
          # (bakuran-infra modules/wireguard-metrics.nix).
          - alert: WireGuardNoHandshake
            expr: (time() - wireguard_latest_handshake_seconds) > 300
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "WireGuard {{ $labels.iface }} on {{ $labels.instance }} has not handshaked in 5m"
              description: "Packets may still be leaving with no reply - check `wg show {{ $labels.iface }}` and the endpoint IP in the host config."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#wireguardnohandshake"
          # A handshake is not proof of a working tunnel. This is the alert that
          # was missing on 2026-10-25: a stale private key handshook happily and
          # blackholed everything, and only handshake-based alerts existed.
          - alert: WireGuardNoEgress
            expr: wireguard_egress_ok == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.instance }}: WireGuard up but no data path"
              description: "Handshake may be fine; traffic is not leaving. Compare the key on the interface with SOPS before touching it (NETWORK.md 8.2)."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#wireguardnoegress"
          # Restarting wg-quick is the operation that strands .81. A restart that
          # "succeeds" leaves no other trace, so surface it even when nothing broke.
          - alert: WireGuardRestarted
            expr: increase(wireguard_unit_restarts[15m]) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "wireguard on {{ $labels.instance }} restarted"
              description: "The WireGuard unit restarted. A restart has taken a node off the network before (NETWORK.md 7.1). Confirm egress and LAN reachability."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#wireguardrestarted"
          - alert: WireGuardMetricsMissing
            expr: absent(wireguard_latest_handshake_seconds)
            for: 20m
            labels: { severity: warning }
            annotations:
              summary: "No WireGuard metrics at all"
              description: "Either the textfile timer on the media node is not running or node-exporter is not scraping /var/lib/node-exporter/textfile."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#wireguardmetricsmissing"
          - alert: StrayCNIAddress
            # A host interface holding an address inside the pod CIDR is an
            # address the IPAM will happily hand to a pod. On 2026-10-26 a pod got
            # 10.42.0.1 - the leftover flannel bridge cni0 on one node - so every
            # request to that pod's IP was delivered to the host instead: the
            # liveness probe got connection refused and the container was killed
            # on a loop while the deployment sat at 1/2 ready.
            # The cni-stray-sweep unit removes the interface and leaves this at 1
            # for the run that did.
            expr: homelab_stray_cni_removed > 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.instance }} had a non-Cilium interface inside the pod CIDR (removed by cni-stray-sweep)"
              description: "Pods can be allocated an address the node itself owns, which makes them unreachable while they look scheduled. Check which interface was removed in the host journal (tag cni-stray-sweep)."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#straycniaddress"
          - alert: StrayCNIMetricsMissing
            # Same lesson as WireGuardMetricsMissing: a monitor whose metric never
            # arrives is not a monitor. The sweep runs hourly; 90m of silence
            # means the timer or the textfile broke, not that the hosts are clean.
            expr: absent(homelab_stray_cni_removed)
            for: 90m
            labels: { severity: warning }
            annotations:
              summary: "homelab_stray_cni_* metrics absent - cni-stray-sweep is not reporting"
              description: "Check the timer on the hosts (systemctl list-timers cni-stray-sweep) and that /var/lib/node-exporter/textfile/stray-cni.prom exists and is world-readable."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#straycnimetricsmissing"
          - alert: MediaPoolFillingUp
            expr: (1 - node_filesystem_avail_bytes{mountpoint="/mnt/media"} / node_filesystem_size_bytes{mountpoint="/mnt/media"}) * 100 > 85
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "media pool (/mnt/media) >85% full"
              description: "{{ $value }}% used — reclaim space (arr cleanup) or add a disk before imports start failing."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#mediapoolfillingup"
          - alert: MediaPoolCritical
            expr: (1 - node_filesystem_avail_bytes{mountpoint="/mnt/media"} / node_filesystem_size_bytes{mountpoint="/mnt/media"}) * 100 > 92
            for: 15m
            labels: { severity: critical }
            annotations:
              summary: "media pool (/mnt/media) >92% full — downloads/imports will fail"
              description: "{{ $value }}% used on the media library, now served from .82 over NFS (1.9 TB btrfs). Reclaim with *arr cleanup; growing it means a bigger disk on .82, not another branch."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#mediapoolcritical"
          # NOTE: BackupFailed alerts are *pushed* to Alertmanager by the systemd
          # OnFailure hooks (see modules/backup*.nix), so there's no rule for them.
      - name: etcd
        rules:
          # Metrics come from the etcd-metrics-proxy DaemonSet (node loopback
          # 127.0.0.1:2381 relayed to <node-ip>:9101, scraped by kubernetes-pods),
          # so these selectors deliberately avoid a `job=` filter.
          - alert: EtcdNoLeader
            expr: etcd_server_has_leader == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "etcd {{ $labels.instance }} has no leader"
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#etcdnoleader"
          - alert: EtcdMemberUnreachable
            expr: count(etcd_server_has_leader) < 3
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "only {{ $value }}/3 etcd members are reporting metrics"
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#etcdmemberunreachable"
          - alert: EtcdQuorumAtRisk
            expr: sum(etcd_server_has_leader) < 2
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "etcd quorum lost or at risk ({{ $value }}/3 leaders)"
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#etcdquorumatrisk"
          - alert: EtcdHighFsyncLatency
            expr: histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])) by (le)) > 0.5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "etcd WAL fsync p99 > 500ms — disk is the bottleneck"
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#etcdhighfsynclatency"
          - alert: EtcdDbSizeNearQuota
            expr: max(etcd_mvcc_db_total_size_in_bytes) > 1.5e9
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "etcd DB > 1.5GiB (2GiB quota) — compact/defrag or raise the quota"
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#etcddbsizenearquota"
      - name: cloudflare
        rules:
          # Cloudflare edge health from the REST-only exporter. Free-plan zones
          # have no GraphQL analytics, but tunnel/zone/TLS state is real data.
          - alert: CloudflareTunnelDown
            expr: cloudflare_tunnel_up == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "Cloudflare tunnel {{ $labels.tunnel }} is {{ $labels.status }}"
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#cloudflaretunneldown"
          - alert: CloudflareTunnelSingleConnector
            expr: cloudflare_tunnel_connectors < 2
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "cloudflare tunnel {{ $labels.tunnel }} has {{ $value }} connector(s), edge HA is degraded"
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#cloudflaretunnelsingleconnector"
          - alert: CloudflareZoneNotActive
            expr: cloudflare_zone_up == 0
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "zone {{ $labels.zone }} is not active in Cloudflare"
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#cloudflarezonenotactive"
          - alert: CloudflareZonePaused
            expr: cloudflare_zone_paused == 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "zone {{ $labels.zone }} is paused, traffic bypasses Cloudflare"
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#cloudflarezonepaused"
          - alert: CloudflareCertificateInactive
            expr: cloudflare_zone_certificate_active == 0
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "universal certificate for {{ $labels.zone }} is {{ $labels.status }}"
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#cloudflarecertificateinactive"
          # The exporter's own health, and the hole that this group had until 2026-11-19.
          #
          # The rule below was written as `time() - cloudflare_export_timestamp_seconds > 600`, which cannot fire when
          # the exporter's refresh RAISES: the exception path replaces the whole page with `cloudflare_api_up 0`, so the
          # timestamp series disappears and the expression has no data. A rule that goes silent exactly when the thing
          # it watches breaks is the failure this estate keeps writing down. Hence the absent() arm.
          #
          # Why this matters concretely: on 2026-11-19 an account API token was rolled. It also backed the R2 access
          # key, so nightlies and PG backups stopped working, and nothing paged - the only signal available was this
          # exporter, whose health nothing watched. (The R2 break is a separate gap: story in the backup epic.)
          - alert: CloudflareExporterStale
            expr: absent(cloudflare_export_timestamp_seconds) or time() - cloudflare_export_timestamp_seconds > 600
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "cloudflare edge exporter has not refreshed in 10m: token expired or API unreachable"
              description: >-
                Either the exporter stopped producing a timestamp at all (the absent() arm - a failed refresh replaces
                its whole metric page) or it is serving a snapshot older than 10 minutes. Both mean the edge numbers on
                every dashboard are frozen, and CloudflareTunnelDown cannot fire because it reads the frozen data.
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#cloudflareexporterstale"
          - alert: CloudflareExporterRefreshFailing
            expr: cloudflare_api_up == 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "cloudflare exporter: the last refresh completed with errors for 15m"
              description: >-
                The exporter is up and serving, but at least one API call in its refresh raised - usually the token:
                rolled, expired, or scoped down. This is the metric that would have made the 2026-11-19 credential roll
                visible before it broke R2, nightlies and PG backups.
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#cloudflareexporterrefreshfailing"
      - name: argocd
        rules:
          # ArgoCD's own health, asked the only way that catches "up but blind": if the
          # controller stops exporting app metrics, every rule below it (Unhealthy,
          # OutOfSync) simply stops firing - a green page with no coverage. TargetDown
          # covers an exporter that is gone; this covers the metrics disappearing for any
          # other reason and says what is now unmonitored.
          - alert: ArgoCDMetricsMissing
            expr: absent(argocd_app_info) == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "ArgoCD is exporting no application metrics"
              description: "argocd_app_info is gone, so ArgoCDAppUnhealthy, ArgoCDAppOutOfSync and the sync-failure rules are all blind until it returns: a broken vault-style green. Either the application controller is not running or its metrics endpoint stopped being scraped. Check the argocd namespace before trusting any ArgoCD dashboard."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#argocdmetricsmissing"
          - alert: ArgoCDAppOutOfSync
            expr: argocd_app_info{sync_status!="Synced"} == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "ArgoCD {{ $labels.name }} is {{ $labels.sync_status }} (drift)"
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#argocdappoutofsync"
          # Component health, not app health. Without this, ArgoCD can be
          # cluster-wide single-node (every replica on one host) and nothing
          # notices: the apps still report Synced/Healthy until that node dies.
          - alert: ArgoCDComponentDown
            expr: |
              (kube_deployment_status_replicas_available{namespace="argocd",deployment=~"argocd-server|argocd-repo-server|argocd-applicationset-controller"} < 1)
              or (kube_statefulset_status_replicas_ready{namespace="argocd",statefulset="argocd-application-controller"} < 1)
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "ArgoCD {{ $labels.deployment }}{{ $labels.statefulset }} has no ready replica"
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#argocdcomponentdown"
          - alert: ArgoCDAppUnhealthy
            expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "ArgoCD {{ $labels.name }} health={{ $labels.health_status }}"
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#argocdappunhealthy"
      - name: workloads
        rules:
          # On 2026-10-26 the public site ran at 1 of 2 ready replicas for minutes
          # while one pod crash-looped, and nothing fired: the pod-level signals
          # (restarts) and the deployment-level signal (ready vs desired) were both
          # unwatched. "Degraded but still serving" is exactly the state that goes
          # unnoticed until the second replica goes too.
          - alert: KubePodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in 15m"
              description: "Find the cause before deleting the pod: a crash loop with a clean exit is usually something killing it (probe, OOM, unreachable address)."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#kubepodcrashlooping"
          - alert: KubeDeploymentReplicasMismatch
            expr: |
              (kube_deployment_spec_replicas - kube_deployment_status_replicas_ready) > 0
              and kube_deployment_spec_replicas > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.deployment }} is {{ $value | printf \"%.0f\" }} replica(s) short of desired"
              description: "Ten minutes is longer than a rollout: either a pod cannot become ready or the rollout is stuck. Check pod events for probe failures."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#kubedeploymentreplicasmismatch"
      - name: media
        rules:
          # Jellyfin uses strategy Recreate (RWO config PVC), so any roll kills
          # active streams. Catches real downtime irrespective of pod churn.
          - alert: CronJobFailed
            expr: |
              (
                (kube_job_status_failed{job_name!=""} > 0)
                * on (namespace, job_name) group_left (owner_name)
                    kube_job_owner{owner_kind="CronJob"}
              )
              unless on (namespace, owner_name)
              (
                (
                  kube_job_status_start_time
                  * on (namespace, job_name) group_left (owner_name)
                      kube_job_owner{owner_kind="CronJob"}
                )
                < on (namespace, owner_name) group_left ()
                  label_replace(
                    kube_cronjob_status_last_successful_time,
                    "owner_name", "$1", "cronjob", "(.*)"
                  )
              )
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CronJob failed: {{ $labels.namespace }}/{{ $labels.job_name }}"
              description: "A scheduled job's last run failed. Read its logs; it clears when the next run succeeds."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#cronjobfailed"
          # The rule above cannot see a job that is still RETRYING: kube_job_status_failed
          # stays 0 until the Job gives up. On 2026-10-30 immich-login-watch failed every
          # minute for ~20 minutes and nothing fired - by the time the Job would have been
          # marked failed, the next Job had already started.
          #
          # This is the signal that exists while it is happening: a container inside a
          # Job-owned pod terminated with reason=Error. The attributes are deliberately
          # the Job's, not the CronJob's, because that is what the log command needs.
          #
          # The age guard (`time() - kube_pod_created < 3600`) is not decoration: failed
          # pods LINGER after the job that owns them is replaced, and without it a single
          # daily-job failure would page for as long as failedJobsHistoryLimit keeps the
          # pod - days, not minutes. Ten-minute `for` on top of that means a one-off blip
          # in a 1-minute CronJob (whose pods are cleaned up within three runs) stays quiet.
          - alert: JobPodsFailing
            expr: |
              (
                count by (namespace, owner_name) (
                  (kube_pod_container_status_terminated_reason{reason="Error"} > 0)
                  * on (namespace, pod) group_left (owner_name)
                      kube_pod_owner{owner_kind="Job"}
                  and on (namespace, pod)
                  (time() - kube_pod_created < 3600)
                )
              ) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Job pods failing: {{ $labels.namespace }}/{{ $labels.owner_name }}"
              description: "Containers in this Job's pods terminated with an error and are being retried. CronJobFailed only fires once the Job gives up, so this is the earlier signal. Logs: kubectl -n {{ $labels.namespace }} logs job/{{ $labels.owner_name }}."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#jobpodsfailing"
          # The witness needs a witness. evaluation-watchdog is what notices when the evaluator
          # stops evaluating: its TSDB is on local-path, so losing that node means the pod cannot
          # start anywhere, no rule fires, and the pager goes quiet - silence that looks like health.
          # If the CronJob itself stops running, that protection is gone and nothing says so, because
          # everything that could notice lives inside Prometheus. This is the cheap half-answer:
          # make the job's own silence loud while Prometheus is still alive.
          #
          # `> 900` on a */2 schedule is three missed runs; a brand-new CronJob has no
          # last-successful timestamp at all, which is why this is time()-based rather than absent().
          # The one monitor whose subject is outside the cluster. Its own liveness used to be a
          # weekly Telegram message and a human noticing the absence; the router now POSTs to
          # status-api every five minutes and this fires at twelve missed beats. Critical on
          # purpose: if this is down, nothing else in this file can page anyone about a total
          # cluster loss.
          - alert: RouterHeartbeatStale
            expr: |
              time() - router_heartbeat_last_seen_timestamp_seconds > 3600
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "the router's out-of-cluster witness has not reported for an hour"
              description: "homelab-heartbeat.sh on the OPNsense router has not reached /api/heartbeat in 12 runs. The switch that reports a total cluster loss may itself be dead. Check: ssh root@192.168.2.1 'tail -20 /var/log/homelab-heartbeat.log'."
              runbook_url: "https://runbook.bismigel.dev/runbook/15-alerts/#the-witness-outside-the-cluster-routerheartbeatstale"
          - alert: PrometheusWatchdogStale
            expr: |
              time() - kube_cronjob_status_last_successful_time{cronjob="evaluation-watchdog"} > 900
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "evaluation-watchdog has not succeeded in 15+ minutes"
              description: "The dead-man switch for rule evaluation is not running, so a silent pager would now go unreported. Logs: kubectl -n monitoring logs -l app=evaluation-watchdog --tail=50."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#prometheuswatchdogstale"
  slo.yml: |
    groups:
      - name: slo
        rules:
          - record: slo:probe_success:ratio5m
            expr: avg_over_time(probe_success[5m])
          - record: slo:probe_success:ratio1h
            expr: avg_over_time(probe_success[1h])
          - record: slo:probe_success:ratio6h
            expr: avg_over_time(probe_success[6h])
          - record: slo:probe_success:ratio7d
            expr: avg_over_time(probe_success[7d])
          - record: slo:probe_success:budget_remaining7d
            expr: clamp_min(1 - ((1 - avg_over_time(probe_success[7d])) / 0.005), 0)
          - alert: PublicProbeDown
            expr: probe_success == 0
            # 5m -> 10m (2026-11-18): a single probe failing for one scrape cycle is a Cloudflare edge hiccup, and the
            # SLO rules below already speak for sustained failure. Ten minutes is still faster than a human notices.
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "public probe {{ $labels.instance }} is down"
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#publicprobedown"
          - alert: PublicSLOFastBurn
            # Two windows, deliberately. The 1h window proves the burn is not a
            # single scrape hiccup; the 5m window proves it is still happening
            # right now, so the alert stops once the service recovers instead of
            # running until the long window forgets. Uses the recording rules so
            # the alert and the dashboard cannot disagree about the number.
            # Thresholds loosened 2026-11-18 (0.99 -> 0.97, 5m -> 10m): 99% over an hour is 36 seconds of failed
            # probes, which fired on ordinary edge noise. 97% over an hour is ~2 minutes, still far inside the 99.5%
            # weekly objective, so this now means "something is properly broken" rather than "a probe blinked".
            expr: slo:probe_success:ratio1h < 0.97 and slo:probe_success:ratio5m < 0.97
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "public SLO fast burn: {{ $labels.instance }} 1h availability {{ $value | humanizePercentage }}"
              description: "Below 99% over the last hour and still failing at the last scrape. Error budget is going fast."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#publicslofastburn"
          - alert: PublicSLOSlowBurn
            # The 6h window is the trend, the 1h window is the history, and
            # the 5m window proves it is still happening. A resolved
            # three-minute blip keeps the 1h ratio low, so the 1h window
            # alone can still page after recovery.
            # Loosened 2026-11-18 (0.995 -> 0.99, 15m -> 30m). The 7d objective IS 99.5%, so alerting at 99.5% over
            # 6h was alerting on the objective being met exactly. 99% over 6h is a real trend, and half an hour of it
            # is a trend rather than a wobble.
            expr: slo:probe_success:ratio6h < 0.99 and slo:probe_success:ratio1h < 0.99 and slo:probe_success:ratio5m < 0.99
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "public SLO slow burn: {{ $labels.instance }} 6h availability {{ $value | humanizePercentage }}"
              description: "Under the 99.5% objective across 6h and 1h, and still failing in the last 5m. A historic blip alone no longer fires this."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#publicsloslowburn"
---
# Alertmanager
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: telegram
      group_by: ["alertname"]
      group_wait: 30s
      # 5m -> 10m, 4h -> 12h (2026-11-18, "reduce overall noise"): an unresolved warning re-sent every four hours is
      # three messages a day about a thing nobody has forgotten. Twice a day is a reminder; four times is a metronome.
      group_interval: 10m
      repeat_interval: 12h
      routes:
        # SEVERITY SPLIT (2026-11-22, from the numbers: 77 Telegram messages in six hours and **293
        # alert state transitions** - the messages were not a metronome, they were fire/resolve pairs from
        # alerts that flap. A warning that flaps costs two messages under `send_resolved: true` and says
        # nothing the second time it fires.
        #
        #   critical -> announce, and announce the resolution (you want to know the page is over)
        #   warning  -> announce once, then stay quiet (there is nobody to page, and `resolved` for a
        #               warning is the least useful message this bot can send)
        - matchers: ['severity="critical"']
          receiver: telegram
          group_by: ["alertname", "node"]
          repeat_interval: 12h
        - matchers: ['severity="warning"']
          receiver: telegram-warn
          group_by: ["alertname", "node"]
          group_interval: 10m
          repeat_interval: 24h
        # Login alerts (posted by the access-login-watch CronJob): notify
        # immediately and don't follow up with a "resolved" message.
        - matchers: ['alertname="AppLogin"']
          receiver: telegram-login
          group_by: ["user", "app"]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 24h
    # A pushed SmokeTestFailed is a CONSEQUENCE. On 2026-10-29 a single degraded app
    # failed the smoke test every 15 minutes all night, each instance "resolving" 5
    # minutes later - noise on top of the specific alert that already said what was
    # wrong. While a cause-level alert fires, stay quiet.
    inhibit_rules:
      - source_matchers:
          - 'alertname=~"ArgoCDAppUnhealthy|ArgoCDAppOutOfSync|KubePodCrashLooping|PublicProbeDown|WireGuardNoEgress|CronJobFailed|JobPodsFailing"'
        target_matchers:
          - 'alertname="SmokeTestFailed"'
        # No `equal:` - the pushed alert carries only instance+unit, so there is no
        # shared label to match on and `equal` would never inhibit.

      # ---- the same condition, said twice (2026-11-02 audit) ----
      # A Job owned by a CronJob raised BOTH of these for the same event: 3 + 3
      # notifications for three failed runs. The CronJob alert names the owner a
      # human acts on, so it wins; the pod-level one still speaks for one-shot Jobs.
      - source_matchers:
          - 'alertname="CronJobFailed"'
        target_matchers:
          - 'alertname="JobPodsFailing"'
        equal: [namespace, owner_name]

      # DeploymentReplicasUnavailable and KubeDeploymentReplicasMismatch describe the
      # same thing ("spec.replicas - ready > 0") at different granularity, and both
      # fired for sabnzbd/audiobookshelf. Keep the one whose message says what to
      # check; silence the arithmetic duplicate.
      - source_matchers:
          - 'alertname="DeploymentReplicasUnavailable"'
        target_matchers:
          - 'alertname="KubeDeploymentReplicasMismatch"'
        equal: [namespace, deployment]

      # If node-exporter itself is down its filesystem series vanish, and
      # BackupMountMissing would then fire for a cause it cannot see. TargetDown
      # names the actual fault (the scrape), so it wins for the same instance.
      - source_matchers:
          - 'alertname="TargetDown"'
        target_matchers:
          - 'alertname="BackupMountMissing"'
        equal: [instance]

      # Over-committed is the escalated form of headroom-low, for the same disk.
      - source_matchers:
          - 'alertname="LonghornDiskSchedulingOverCommitted"'
        target_matchers:
          - 'alertname="LonghornDiskSchedulingHeadroomLow"'
        equal: [node, disk_path]
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secret/bot-token
            chat_id: 607008268
            send_resolved: true
      # Warnings: one message per group, no resolution, and a 24h reminder instead of 12h. Same chat.
      - name: telegram-warn
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secret/bot-token
            chat_id: 607008268
            send_resolved: false
      - name: telegram-login
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secret/bot-token
            chat_id: 607008268
            send_resolved: false
            message: '{{ range .Alerts }}🔐 {{ .Annotations.summary }} ({{ .Annotations.details }}){{ "\n" }}{{ end }}'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target: { name: alertmanager-telegram, template: { data: { bot-token: "{{ .token }}" } } }
  data:
    - secretKey: token
      remoteRef: { key: telegram-bot-token }
---
# Two replicas with gossip, not one. On 2026-11-03 the single Alertmanager sat on the node
# whose egress is the WireGuard tunnel; when the tunnel died its Telegram POSTs timed out and
# the estate went mute with every alert still firing. A StatefulSet (not a Deployment) because
# gossip peers need stable names: alertmanager-0/1 are resolvable at
# alertmanager-N.alertmanager-headless.monitoring.svc.cluster.local forever.
#
# Silences and the notification log replicate over gossip, so the per-pod emptyDir is enough -
# losing a pod loses nothing that matters. Both replicas carry the same config, so either can
# send the notification; silence and dedupe state is shared.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  serviceName: alertmanager-headless
  replicas: 2
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      securityContext: { runAsUser: 65534, runAsGroup: 65534 }
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["calamansi-intel"]
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
            - '--cluster.listen-address=0.0.0.0:9094'
            - '--cluster.advertise-address=$(POD_IP):9094'
            - '--cluster.peer=alertmanager-0.alertmanager-headless.monitoring.svc.cluster.local:9094'
            - '--cluster.peer=alertmanager-1.alertmanager-headless.monitoring.svc.cluster.local:9094'
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          ports:
            - containerPort: 9093
              name: web
            - containerPort: 9094
              name: cluster
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: secret, mountPath: /etc/alertmanager/secret, readOnly: true }
            - { name: data, mountPath: /alertmanager }
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: secret
          secret: { secretName: alertmanager-telegram }
        - name: data
          emptyDir: {}
---
# Stable per-replica DNS and the gossip endpoint. Headless, so each pod gets its own A record.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-headless
  namespace: monitoring
spec:
  clusterIP: None
  selector: { app: alertmanager }
  ports:
    - name: cluster
      port: 9094
      targetPort: 9094
---
# A drain may take one replica; it must never take both and silence the pager.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: alertmanager }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: ClusterIP
  selector: { app: alertmanager }
  ports:
    - name: web
      port: 9093
      targetPort: 9093
