# Workload-level alert rules: container CPU/memory (cAdvisor) and Longhorn.
#
# Separate ConfigMap from alerting.yaml on purpose: adding groups should be a
# readable diff, not a rewrite of an 11KB file. monitoring.yaml projects both
# into /etc/prometheus/rules, so the rule_files glob picks this up unchanged.
#
# Why these exist: metrics-server can answer `kubectl top` for *now* but keeps
# no history, so a sentinel container burning a full core for hours was only
# visible by accident. cAdvisor makes it a series that can alert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-rules-workloads
  namespace: monitoring
data:
  workloads.yml: |
    groups:
      - name: workloads
        rules:
          - alert: ContainerMemoryNearLimit
            expr: |
                max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", container!="POD"})
                  / on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.9
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} [{{ $labels.container }}] at {{ humanizePercentage $value }} of its memory limit"
              description: "Above 90% of the container memory limit for 10 minutes — OOMKill is next."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#containermemorynearlimit"
          # A pod that cannot start is silent: it is not crash-looping, it is not
          # failing probes, it just exists. On 2026-10-28 a bad nodeSelector +
          # hostPath type=Directory combination would have looked exactly like
          # this, and nothing would have said so.
          - alert: PodStuckPending
            expr: |
              kube_pod_status_phase{phase="Pending"} == 1
              unless on(namespace, pod) kube_pod_owner{owner_kind="Job"} == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} Pending for 15m"
              description: "Scheduling or mount failure. Check events: a hostPath type=Directory that does not exist on the selected node, an unschedulable nodeSelector, or a PVC that never bound."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#podstuckpending"
          - alert: PodContainerConfigError
            expr: |
              kube_pod_container_status_waiting_reason{reason=~"CreateContainerConfigError|CreateContainerError"} == 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot create its container ({{ $labels.reason }})"
              description: "Usually a missing Secret/ConfigMap key, or a hostPath that does not exist on this node."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#podcontainerconfigerror"
          - alert: CAdvisorScrapeFailing
            expr: up{job="kubelet-cadvisor"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "cAdvisor scrape failing on {{ $labels.instance }}"
              description: "No container CPU/memory data from this node. Container panels and the workload rules above are blind until this recovers."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#cadvisorscrapefailing"
      # The alerting path. Everything above assumes a notification leaves the cluster; on
      # 2026-11-01 that assumption was untestable because Alertmanager was not scraped at
      # all. These make delivery itself a signal.
      - name: alerting-path
        rules:
          - alert: AlertmanagerNotificationFailing
            # Not `> 0` on the counter: a couple of failures sit in the total forever.
            # Rate over 15m, so a single failure inside the window still trips it.
            expr: increase(alertmanager_notifications_failed_total[15m]) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Alertmanager cannot deliver via {{ $labels.integration }} ({{ $labels.reason }})"
              description: "Alerts are firing but the notification is not leaving the cluster. Telegram is the only channel - check the bot-token secret and chat_id, then `curl <am>/api/v2/status`."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#alertmanagernotificationfailing"
          - alert: AlertmanagerNotReceivingAlerts
            # Prometheus firing while Alertmanager hears nothing is exactly the 2026-11-01
            # shape: the alert existed, the notification path did not.
            expr: |
              absent(up{job="alertmanager"} == 1)
              or
              (sum(increase(alertmanager_alerts_received_total[30m])) == 0
                and sum(ALERTS{alertstate="firing"}) > 0)
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Alertmanager is not receiving alerts while Prometheus is firing"
              description: "Either Alertmanager is down (its scrape target is absent) or nothing is reaching it while {{ $value }} alerts are firing in Prometheus."
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#alertmanagernotreceivingalerts"
          # The heartbeat is a RECORDING rule, not an alert (2026-11-18).
          #
          # It used to be `alert: Watchdog, expr: vector(1)` with `severity: none`. That fires forever by construction,
          # so Alertmanager re-sent "Alerting pipeline heartbeat" to Telegram every `repeat_interval` - six messages a
          # day, forever, carrying no information a human can act on. An always-true alert is noise with a heartbeat's
          # job description.
          #
          # It is still needed: `evaluation-watchdog` (checks/evaluation-watchdog.yaml) proves rule *evaluation* is
          # alive by asking Prometheus to count it, because the alerter cannot report its own death. So the proof of
          # life stays as a series - always 1, evaluated every interval, routed nowhere because it is not an alert -
          # and `count(watchdog:evaluation:alive)` is what the CronJob queries. A dead Prometheus makes the series go
          # stale, the query return empty, and the CronJob post straight to Telegram: the alarm is the ABSENCE, not a
          # message that has to arrive.
          - record: watchdog:evaluation:alive
            expr: vector(1)
      - name: longhorn
        rules:
          # longhorn_volume_robustness is an enum-style metric: one series per
          # state label (healthy/degraded/faulted/unknown), with value 1 for the
          # state that is current. Comparing the value to 2 or 3 never matches,
          # which made these two rules dead on arrival — the state has to be
          # selected by label, not by value.
          - alert: LonghornVolumeDegraded
            expr: longhorn_volume_robustness{state="degraded"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn volume {{ $labels.pvc }} ({{ $labels.volume }}) is DEGRADED"
              description: "A replica is gone or rebuilding. Tolerated, but do not lose a second one."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#longhornvolumedegraded"
          - alert: LonghornVolumeFaulted
            expr: longhorn_volume_robustness{state="faulted"} == 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Longhorn volume {{ $labels.pvc }} ({{ $labels.volume }}) is FAULTED"
              description: "Data unavailable to the workload using this PVC."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#longhornvolumefaulted"
          # --- the image registry's own volume (2026-11-23) ------------------
          # The claim was 10Gi, the volume reported 10805010432 bytes used, and every
          # build after that died at `uploading layer chunked: 500` with zot logging
          # `no space left on device`. From the app side that reads as "CI is stalled":
          # no release branch appears and nothing says why. The claim is 25Gi now
          # (#196); this rule is what makes the *next* fill visible before a build
          # fails. kubelet already publishes both series, so no exporter is needed -
          # what was missing was the rule.
          - alert: RegistryDiskSpaceLow
            expr: |
              kubelet_volume_stats_available_bytes{namespace="forgejo",persistentvolumeclaim="registry-data"}
                / kubelet_volume_stats_capacity_bytes{namespace="forgejo",persistentvolumeclaim="registry-data"} < 0.15
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "the image registry has {{ humanizePercentage $value }} of its volume free"
              description: "At zero a layer push fails with HTTP 500 and builds stop producing images - from the app repository that looks like CI being idle, not like a full disk. Check the tag count and retention before growing the claim again."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#registrydiskspacelow"
          # --- per-disk scheduling headroom (2026-10-30) ---------------------
          # LonghornDiskStorageLow above compares *usage*, which was blind to the
          # failure that actually happened: sitaw-amd's /var/lib/longhorn held 45G
          # of replicas with 120MiB left for another one, at 43% "usage" of its
          # capacity, and nothing fired. The scheduler admits a replica when
          # (filesystem available - scheduled) > 0, and Longhorn exports scheduled
          # bytes per *node* only, so that per-disk number was invisible.
          #
          # It is reconstructed here: longhorn_replica_info carries the disk *path*
          # (not the disk name) plus the volume, so joining it with the volume size
          # sums scheduled bytes per path; node-exporter supplies the free space of
          # the filesystem that path lives on. node-exporter has no `node` label,
          # hence the node_uname_info join, and /var/lib/longhorn is a directory on
          # the root filesystem rather than a mountpoint, hence the second branch.
          #
          # Ratio = "how much of the space this disk still has free is already
          # promised to replicas". It rises when anything else fills the filesystem
          # too (containerd images on /), which is the same trap from the other
          # side. A disk at 1.0 can take one more replica of a size it does not
          # have room for, and it does so by first displacing whatever lives there.
          # The two numbers Longhorn does not export, and the ratio the alerts use.
          # Split into three rules rather than one expression because the dashboard
          # needs the bytes: a ratio of 0.84 says "pressured", but 13 G free against
          # 45 G promised is what tells you the rebuild will not fit.
          #
          # Order matters: rules in a group evaluate in sequence, so the ratio rule
          # can read the two above it.
          - record: longhorn:disk_scheduled_bytes
            expr: |
              label_replace(
                sum by (node, disk_path) (
                  longhorn_replica_info * on (volume) group_left() max by (volume) (longhorn_volume_capacity_bytes)
                ),
                "disk_path", "$1", "disk_path", "^(.*)/$"
              )
          - record: longhorn:disk_free_bytes
            expr: |
              max by (node, disk_path) (
                label_replace(
                  label_replace(
                    node_filesystem_avail_bytes{fstype="ext4", mountpoint=~"/mnt/.+"}
                      * on (instance) group_left (nodename) node_uname_info,
                    "node", "$1", "nodename", "(.+)"
                  ),
                  "disk_path", "$1", "mountpoint", "(.+)"
                )
                or
                label_replace(
                  label_replace(
                    node_filesystem_avail_bytes{fstype="ext4", mountpoint="/"}
                      * on (instance) group_left (nodename) node_uname_info,
                    "node", "$1", "nodename", "(.+)"
                  ),
                  "disk_path", "/var/lib/longhorn", "__name__", ".*"
                )
              )
          - record: longhorn:disk_scheduled_to_free_ratio
            expr: |
              longhorn:disk_scheduled_bytes
                / on (node, disk_path) group_left () longhorn:disk_free_bytes
          # Thresholds are set for how sparse replicas behave, not for tidy-looking
          # numbers. Longhorn reserves *provisioned* size: sitaw-amd promises 48G on
          # its root disk with 7.3G actually written, so ~0.85 means "more provisioned
          # than filled", which is normal here. Measured 2026-10-30 before choosing
          # these: disks over 0.75 = 2, over 0.9 = 0, highest = 0.849. The incident
          # this replaces had 120MiB of room against 45G promised (~0.997), so 0.9
          # still catches it.
          #
          # What makes a high ratio dangerous is that a *rebuild* has to fit: the
          # largest volume is 32.2G. While a dedicated disk can take the replica this
          # costs nothing; it costs redundancy only when the pressured disk is the last
          # candidate.
          # The scheduling ratio above measures *promises*. This measures bytes, and it is what
          # makes raising `storage-over-provisioning-percentage` safe: if the filesystems holding
          # Longhorn disks really start filling, this fires long before a rebuild runs out of room.
          - alert: LonghornDiskActualSpaceLow
            expr: |
              (node_filesystem_avail_bytes{mountpoint=~"/mnt/(data|longhorn|media-nvme)"}
                / node_filesystem_size_bytes{mountpoint=~"/mnt/(data|longhorn|media-nvme)"}) < 0.15
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has {{ humanizePercentage $value }} of its space free"
              description: "This is a filesystem holding Longhorn replicas, measured in actual bytes. Scheduling headroom is a promise; this is the disk."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#longhorndiskschedulingheadroomlow"
          # The invariant the 2026-10-30 cleanup argues for: replicas belong on the
          # dedicated partitions, not on the filesystem holding etcd and the
          # container image store. `default-disk-*` is the disk Longhorn auto-creates
          # at /var/lib/longhorn, i.e. inside the OS filesystem; its capacity is that
          # filesystem's size, so this ratio is "share of / given to Longhorn".
          # REMOVED as an alert 2026-10-30, kept as the "Longhorn on OS filesystems"
          # dashboard panel. It fired on all three nodes the moment it was deployed,
          # because all three genuinely keep replicas under /var/lib/longhorn - a
          # structural fact that no amount of alerting changes, and one that would have
          # paged forever until someone drained the disks. An invariant that is
          # permanently true is a gauge, not an alert: what needs to reach a human is
          # the point at which the situation costs redundancy, which is what the two
          # ratio rules above measure. The migration decision is tracked in
          # homelab-context/NEXT-STEPS.md. (The orphaned `description:` that used to
          # follow this comment was part of the deleted alert - promtool rejected the
          # file with "mapping key description already defined".)
          - alert: LonghornScrapeFailing
            expr: up{job="longhorn"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn metrics scrape failing on {{ $labels.instance }}"
              description: "Volume robustness rules are blind while this target is down."
              runbook_url: "https://runbook.bismigel.dev/runbook/26-storage-etcd-longhorn-disks/#longhornscrapefailing"
      # status-api answers "does each service actually work", which is a different
      # question from "is its pod up". These two alerts are the whole point of it:
      # one for a failing check, one for the checker going quiet.
      - name: status-api
        rules:
          - alert: StatusApiCheckFailing
            expr: status_api_check_ok == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.check }} fails its functional check"
              description: >-
                status-api's check for {{ $labels.check }} has failed for 10 minutes.
                These checks look at what the service does, not whether its pod is
                Ready — the qBittorrent password and the empty Jellyfin library on
                2026-11-02 were both invisible to pod status. Open /api/detail (basic
                auth) for the error.
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#statusapicheckfailing"
          - alert: StatusApiNotScraped
            expr: absent(status_api_check_ok)
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "status-api reports nothing at all"
              description: >-
                No status_api_check_ok series for 15 minutes: the checker, its scrape
                or a network policy is broken. This is the alert that stops "no news"
                from reading as "no problems" — a dead checker and a healthy estate
                look identical from the outside.
              runbook_url: "https://runbook.bismigel.dev/runbook/27-egress-edge-and-the-monitors/#statusapinotscraped"
      - name: deployments
        rules:
          # Restart-count alerts alone are not enough. A Deployment can be
          # stuck for a long time while only the crashing pod makes noise and
          # the previous ReplicaSet keeps serving traffic: argocd-server sat
          # in exactly that state — 181 restarts, one unavailable replica,
          # rollout never completing — with nothing but PodRestartingOften to
          # show for it. These two rules describe the *rollout*, not the pod.
          - alert: DeploymentReplicasUnavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ printf \"%.0f\" $value }} unavailable replicas"
              description: "Desired replicas that are not available for 15 minutes. Overlaps DeploymentRolloutStalled when the cause is a ReplicaSet that never becomes Ready; fires alone when pods cannot be scheduled at all."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#deploymentreplicasunavailable"
      - name: argocd-redis
        rules:
          - alert: ArgoCDRedisHAEndpointsLow
            expr: kube_endpoint_address_available{namespace="argocd",endpoint=~"argocd-redis-ha(-haproxy)?"} < 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "ArgoCD Redis HA service {{ $labels.endpoint }} has {{ $value }}/3 endpoints"
              description: "Redis or HAProxy discovery is degraded. Check pod readiness, announce Services and sentinel logs."
              runbook_url: "https://runbook.bismigel.dev/runbook/25-kubernetes-workloads-and-argocd/#argocdredishaendpointslow"
