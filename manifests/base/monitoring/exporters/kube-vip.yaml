# kube-vip — a floating API address for the cluster.
#
# Why: without it every client points at one node (sitaw-amd, .82). That node is
# not special, but losing it broke `kubectl` for humans and for anything outside
# the cluster, even though the other two servers were healthy. This advertises
# 192.168.10.100 over ARP from whichever control-plane node currently holds the
# leader lease.
#
# The address must also be in the API server certificate, or TLS fails even
# though the TCP connection works — that is the `--tls-san=192.168.10.100` line in
# each host's k3s flags (bakuran-infra, 2026-10-28).
#
# ARP mode, not BGP: this is one flat L2 segment. If the network is ever cut into
# VLANs with routing between them, revisit this.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip
rules:
  - apiGroups: [""]
    resources: ["services", "services/status", "nodes", "endpoints"]
    verbs: ["list", "get", "watch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "get", "watch", "create", "update", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "get", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    app: kube-vip
spec:
  selector:
    matchLabels:
      app: kube-vip
  template:
    metadata:
      labels:
        app: kube-vip
      # No prometheus.io annotations: only the leader listens on :8080, so
      # scraping all three replicas produced permanent TargetDown alerts for the
      # two followers (2026-10-28).
    spec:
      # One instance per server; the lease decides which one owns the address,
      # so a node failure hands it over without a human.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      hostNetwork: true
      # So orphan-guard can see whether the kube-vip container's process is alive;
      # that is the entire signal it acts on (see the orphan-guard comment below).
      shareProcessNamespace: true
      serviceAccountName: kube-vip
      tolerations:
        - operator: Exists
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v0.8.7@sha256:32829cc6f8630eba4e1b5e4df5bcbc34c767e70703d26e64a0f7317951c7b517
          imagePullPolicy: IfNotPresent
          # v0.8.x: the control-plane manager command. Without it the binary prints
          # its help and exits 0, which looks like a Completed pod, not a crash.
          args: ["manager"]
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "SYS_TIME"]
          env:
            - name: vip_arp
              value: "true"
            - name: port
              value: "6443"
            - name: vip_cidr
              value: "32"
            # cp_enable is what enables the control-plane VIP feature - it does
            # not start apiserver/scheduler/controller-manager (k3s owns those).
            # With both cp and svc disabled kube-vip exits: "no features are
            # enabled".
            - name: cp_enable
              value: "true"
            # Service VIPs on, for one reason: Jellyfin (story 8.3). With a hostPort its LAN
            # address *was* the node it happened to run on, so "make it reschedulable" and "keep
            # the TV working" were in direct conflict. A LoadBalancer address that follows the pod
            # resolves that, and `vip_pool` bounds it to one address so kube-vip cannot hand out
            # anything else by accident.
            - name: svc_enable
              value: "true"
            - name: vip_pool
              value: "192.168.10.84/32"
            - name: vip_leaderelection
              value: "true"
            # 15/10/2, not 5/3/1. kube-vip's leader-election client EXITS when it
            # cannot renew (manager.go calls Kill() when election returns, bypassing
            # the deferred Cleanup), and the address it held is then left on the host
            # interface - so another node can acquire the same VIP and two nodes
            # answer ARP for one address. Reproduced in staging 2026-10-28 by killing
            # the node that held both the VIP and the etcd leadership: API writes
            # stall while a new etcd leader is elected, renewal misses its deadline,
            # kube-vip exits 255. With 15/10/2 the same experiment leaves the VIP
            # untouched and the API answering throughout (single holder for 274s).
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
            - name: address
              value: "192.168.10.100"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        # orphan-guard: the address this pod's node is holding, removed again when
        # kube-vip is no longer running to hold it.
        #
        # Why it exists. kube-vip's leader-election client EXITS (255) when it cannot
        # renew, and manager.go calls sm.Kill() on the way out - which bypasses the
        # deferred Cleanup() that would have released the address. The VIP therefore
        # stays on the host interface of a node that is no longer the leader, and a
        # second node that acquires the lease answers ARP for the same address: two
        # nodes, one IP, intermittent API failures that look like anything but a
        # duplicate VIP. Widening the lease to 15/10/2 removed the *trigger* seen in
        # production on 2026-10-29; this removes the *orphan* for any other exit path.
        #
        # The rule is one sentence: if kube-vip is not running here and this node still
        # has the VIP, the address is orphaned. Nothing needs to be read over the API,
        # because a node that is genuinely serving the VIP always has a kube-vip process
        # holding it; the only way to have the address without the process is an exit
        # that skipped cleanup.
        #
        # That is why this does not read the leader lease. The first version did, via
        # busybox wget - which cannot verify a CA (no --ca-certificate), and the pod is
        # hostNetwork so `kubernetes.default.svc` does not resolve from the host's
        # resolv.conf. It failed closed (nothing removed) and therefore looked healthy
        # while doing nothing at all. Detecting the absent process needs only /proc and
        # `ip`, both of which the image already has.
        #
        # shareProcessNamespace puts every container's processes in one /proc, so the
        # guard can see whether kube-vip is alive; `comm` is matched (not cmdline) so
        # the guard cannot match its own arguments.
        - name: orphan-guard
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              strikes=0
              misses=0
              while :; do
                # Ours but unwanted: the address is here and no kube-vip process holds it.
                if ! grep -qsx 'kube-vip' /proc/[0-9]*/comm \
                   && ip -4 -o addr show | grep -q "inet $VIP/"; then
                  strikes=$((strikes + 1))
                else
                  strikes=0
                fi
                if [ "$strikes" -ge 3 ]; then
                  addr=$(ip -4 -o addr show | awk -v v="$VIP" '$4 ~ "^" v "/" {print $4; exit}')
                  iface=$(ip -4 -o addr show | awk -v v="$VIP" '$4 ~ "^" v "/" {print $2; exit}')
                  echo "orphan-guard: no kube-vip process here; removing orphaned $addr from $iface"
                  ip addr del "$addr" dev "$iface" 2>/dev/null || true
                  strikes=0
                fi

                # Not ours, but pointing at a node that no longer answers for it. The
                # mirror case, found 2026-10-30: after the lease moved (.82 -> .81) this
                # node kept an ARP entry for the OLD holder's MAC, so every packet to the
                # VIP went to a node that had already given it up. The visible damage is
                # indirect - cilium here cannot reach the API, so it never programs
                # endpoints, so cross-node traffic to this node is punted.
                #
                # The test is deliberately dumb: if this node does not hold the address and
                # the address does not answer, the neighbour entry is suspect. Deleting it
                # costs nothing - the kernel re-resolves on the next packet - and it
                # self-heals whether the cause was a stale MAC, a moved lease or a flapping
                # interface. Two consecutive misses (~60s) so a single dropped ICMP does
                # not churn the cache.
                if ! ip -4 -o addr show | grep -q "inet $VIP/"; then
                  if ping -c1 -W2 "$VIP" >/dev/null 2>&1; then
                    misses=0
                  else
                    misses=$((misses + 1))
                    if [ "$misses" -ge 2 ]; then
                      iface=$(ip route get "$VIP" 2>/dev/null | awk '{for(i=1;i<NF;i++) if ($i=="dev") {print $(i+1); exit}}')
                      if [ -n "${iface:-}" ] && ip neigh show "$VIP" dev "$iface" 2>/dev/null | grep -q .; then
                        echo "orphan-guard: $VIP does not answer and this node is not its holder; flushing stale neighbour entry on $iface"
                        ip neigh del "$VIP" dev "$iface" 2>/dev/null || true
                      fi
                      misses=0
                    fi
                  fi
                else
                  misses=0
                fi
                sleep 5
              done
          env:
            - name: VIP
              value: "192.168.10.100"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
