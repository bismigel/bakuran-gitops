# THE ESTATE'S METRICS STORE. Scrape, storage and query for every metric this lab keeps.
#
# It started life as a read-only observer beside Prometheus - the comparison that produced the numbers in
# `docs/reference/observability.md` (322 MiB against 1140 MiB for the same scrape, March 2026-11-21). The
# comparison is closed and this is the winner, so the file changed shape with the role: no leniency flag to read
# Prometheus' config, no second backend to be comparable with.
#
# What the other processes used to do, and who does it now:
#   * scrape    -> this Deployment, reading `metrics-scrape-config` (see vm-scrape.yaml for why the config is its own
#                  file instead of Prometheus' `prometheus.yml` with `strictParse=false`);
#   * evaluate  -> `vmalert` (vmalert.yaml), two replicas, the same rule ConfigMaps;
#   * alert     -> Alertmanager, named by vmalert directly;
#   * read      -> Grafana, whose `prometheus` datasource uid now points here (grafana.yaml);
#   * history   -> the old Prometheus volumes, kept as an archive and not running (prometheus-archive.yaml).
#
# Sizing is a real constraint, not a preference. This volume is Longhorn, and Longhorn ENFORCES its size, unlike
# local-path, where the Prometheus volume holds 66 GiB against an 8Gi request with nobody complaining. 43 MB/h of
# ingest is ~31 GB over 30 days, so retention is 14d on a 20Gi volume; the two move together or not at all.
#
# TWO ARTEFACTS OF REUSING PROMETHEUS' CONFIG, both accepted rather than papered over (2026-11-21):
#   * the `prometheus` job scrapes `localhost:9090`, which inside THIS pod is nothing. That target is
#     permanently down and always will be. It is why `count(up)` on this instance is not the comparison -
#     `count(up == 1)` minus that one, or the per-job counts, is.
#   * `kube-state-metrics` and `ksm` are two jobs scraping the same exporter; Prometheus has both, so this
#     does too. Fixing either means diverging the config, which is the one thing the comparison cannot have.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics-read
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes, namespaces]
    verbs: [get, list, watch]
  # `kubelet-cadvisor` is not a direct scrape: the config goes through the API server's
  # node proxy (`/api/v1/nodes/<node>/proxy/metrics/cadvisor`), so it needs `nodes/proxy`.
  # Without it all three cadvisor targets answer 403 and VictoriaMetrics holds no
  # container-level series at all - found 2026-11-21, after the comparison had been quoted
  # as "84% of the series in 15% of the memory" while VM was missing the highest-cardinality
  # job in the estate. Prometheus' own ServiceAccount has it, which is why only one side
  # was affected.
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics-read
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: victoriametrics-read }
subjects: [{ kind: ServiceAccount, name: victoriametrics, namespace: monitoring }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  # local-path, not longhorn (2026-11-21, after the migration): the monitor must not live on the
  # storage it reports on. The 20Gi Longhorn volume pushed patola:/mnt/data to 186% of its scheduling
  # allowance, and the LonghornDiskSchedulingOverCommitted alert fired for the metrics store itself.
  # This follows the old Prometheus decision: local-path trades history on node loss for independence
  # from Longhorn. The volume is pinned to sitaw-amd by the Deployment's nodeSelector below.
  #
  # 20Gi is measured, not guessed: full ingest was ~43 MB/h, so 14 days projects to ~14 GiB. local-path
  # does not enforce the request the way Longhorn does; the retention and the disk-fill alerts are the guard.
  storageClassName: local-path
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  replicas: 1
  # Recreate: the volume is ReadWriteOnce; a RollingUpdate deadlocks with both pods Pending (measured in staging).
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: victoriametrics }
  template:
    metadata:
      labels: { app: victoriametrics }
    spec:
      serviceAccountName: victoriametrics
      # local-path is a node-local volume. The metrics store belongs on the platform node next to the
      # old Prometheus archive, not on patola, whose image filesystem is already 85% full and whose
      # Longhorn disk is the one the scheduling alert names.
      nodeSelector:
        kubernetes.io/hostname: sitaw-amd
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.93.14@sha256:077dd0e569d0ee0e0fbdbf8bb227cd1d222f462051e88024f1eb3aa7fec3e733
          args:
            # Its own config, written for this parser: 16 scrape jobs, one global interval, nothing else.
            - -promscrape.config=/etc/prometheus/prometheus.yml
            # The ConfigMap volume updates; the *process* does not, unless it is told to look.
            # `-promscrape.configCheckInterval` is DISABLED by default (`victoria-metrics -help`:
            # "By default, the checking is disabled"), so on 2026-11-21 this pod was running the
            # 14 jobs it started with while the file on disk carried 19 - `loki`, `tempo`,
            # `victoria-traces` and `victorialogs` existed in the volume and were never scraped.
            # The symptom is invisible: `count(up)` simply differs between the two backends.
            - -promscrape.configCheckInterval=30s
            - -storageDataPath=/storage
            # 14d, not 30d, and the number comes from measured ingest: ~43 MB/h, so 14 days projects to
            # ~14 GiB against the 20Gi local-path request. The old 30-day estimate (~31 GB) is what forced
            # the move off Longhorn. local-path does not enforce the request; the DiskFillingUp and
            # RootFilesystemDaysToFull alerts are the guard now. Raise retention and storage together.
            - -retentionPeriod=14d
            - -httpListenAddr=:8428
          ports: [{ containerPort: 8428, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: storage, mountPath: /storage }
          resources:
            # 768Mi was an observer's limit. The production store OOMKilled at 680Mi on 2026-11-21, and
            # every vmalert rule failed for ~5 minutes while the store restarted. 2Gi is the measured
            # working set with room for the 14d retention and the full scrape set.
            requests: { cpu: 50m, memory: 512Mi }
            limits: { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 5
            periodSeconds: 10
          # A new TSDB on local-path has to scan/replay before it answers; a liveness probe alone can
          # kill it during that window. This gives startup 150s, then liveness takes over.
          startupProbe:
            httpGet: { path: /health, port: 8428 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap: { name: metrics-scrape-config }
        - name: storage
          persistentVolumeClaim: { claimName: victoriametrics }
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  selector: { app: victoriametrics }
  ports: [{ port: 8428, name: http }]
