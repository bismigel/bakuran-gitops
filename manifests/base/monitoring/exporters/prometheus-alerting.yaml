# A second Prometheus, so that losing a node does not stop alert *evaluation*.
#
# Prometheus' TSDB stays on local-path deliberately (see the PVC in monitoring.yaml:
# the monitor must not live on the storage it reports on), which pins the volume to
# one node. The documented cost was history. The undocumented one surfaced on
# 2026-11-03: if that node dies, the pod cannot start anywhere, so NO rule is
# evaluated, every alert stops - including NodeDown - and the pager turns silent.
# Silence looks exactly like healthy, which is the worst failure mode here.
#
# This instance fixes the evaluation half only:
#   * same config and rules as the primary (same ConfigMaps, projected the same way)
#   * its own local-path volume, anti-affine to the primary, so the two are always on
#     different nodes and no single node loss can take both
#   * NO dashboard traffic: Grafana keeps pointing at the `prometheus` Service, so
#     graphs are unchanged and this one exists purely so rules keep firing
#
# Duplicate alerts are not a problem: this Deployment sets no `external_labels`, so an
# alert evaluated by both instances has the same label set - i.e. the same Alertmanager
# fingerprint - and Alertmanager's notification log collapses them into one message.
# Adding a per-replica external label here would break exactly that, and double-page.
#
# What this does NOT fix: Grafana history is still tied to whichever node the primary
# volume lives on. That is the accepted trade from 2026-11-01, unchanged.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-alerting-data
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  # local-path for the same reason as the primary: this must not depend on Longhorn,
  # which is one of the things Prometheus is asked to report on.
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-alerting
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: prometheus-alerting
  template:
    metadata:
      labels:
        app: prometheus-alerting
    spec:
      serviceAccountName: prometheus
      # REQUIRED, not preferred: two local-path instances that ended up on the same
      # node would be one instance with extra steps.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: prometheus
              topologyKey: kubernetes.io/hostname
      initContainers:
        # local-path PVs are root-owned; prom/prometheus runs as nobody (65534).
        - name: fix-permissions
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
          volumeMounts:
            - name: storage
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            # Same retention as the primary, on purpose: several rules use 6h and 1d
            # windows, so a shorter window here would evaluate them differently and
            # the two instances would disagree about what is firing.
            # Same 30 days as the primary (story 10.6) - but NOT the same volume, and that is what the measured
            # numbers say. This instance projects the same ConfigMaps, so it ingests every metric the primary does,
            # not "only rule results": measured 2026-11-18 it held 1.9 GiB after ~8 days, which is ~7 GiB per 30 days
            # against a **4 GiB local-path volume** - and local-path cannot be expanded. So the size cap decides here,
            # whatever the time flag says, and it was set to 2GB: already biting at 1.9 GiB.
            #
            # 3GB is the honest number for this volume: it leaves headroom for the WAL and compaction while staying
            # inside the PVC. The cost is stated rather than hidden - this instance keeps roughly two weeks of history,
            # which is acceptable because it exists to EVALUATE rules (the primary is what Grafana reads, with 30 days
            # on 8 GiB). If its history is ever wanted too, the fix is a volume that can grow, not a bigger cap.
            - '--storage.tsdb.retention.size=3GB'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: storage
              mountPath: /prometheus
          resources:
            # 1Gi was sized for a 1 GB TSDB, and that is what it had. Retaining 30 days (story 10.6) raised the number of
            # blocks the process loads at startup, so 1Gi became an **OOMKill loop**: both this and the alerting instance
            # restarted every ~90 s for an hour on 2026-11-09, and every graph in Grafana read "no data" because the
            # process never lived long enough to answer. Measured before raising: nodes run at 41-55% of 15 GiB, so 2Gi
            # here is headroom, not a squeeze.
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
        # Kept in step with the primary: without a reloader this instance would run
        # whatever rules it started with, so a rule edit would make the two disagree.
        - name: config-reloader
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c"]
          args:
            - |
              last=""
              while true; do
                h=$(md5sum /etc/prometheus/prometheus.yml /etc/prometheus/rules/*.yml 2>/dev/null | md5sum | cut -d' ' -f1)
                if [ -n "$last" ] && [ "$h" != "$last" ]; then
                  wget -q -O /dev/null --post-data= http://127.0.0.1:9090/-/reload && echo "prometheus reloaded"
                fi
                last="$h"
                sleep 10
              done
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          projected:
            sources:
              - configMap: { name: prometheus-rules }
              - configMap: { name: prometheus-rules-workloads }
              - configMap: { name: prometheus-rules-network-devices }
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-alerting-data
---
# Only the dead-man switch uses this; Grafana deliberately does not.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-alerting
  namespace: monitoring
spec:
  selector:
    app: prometheus-alerting
  ports:
    - name: web
      port: 9090
      targetPort: 9090
