apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # `privileged` deliberately: node-exporter, the etcd metrics proxy and the
    # hostNetwork exporters need hostNetwork/hostPath, which baseline forbids.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      # Both replicas by stable name, not the ClusterIP: with one target kube-proxy sends each
      # notification to whichever pod it picks and the other replica never learns about the
      # alert - gossip replicates silences and the notification log, deliberately NOT active
      # alerts. Naming both means either can notify and the shared log suppresses the double.
      alertmanagers:
        - static_configs:
            - targets:
                - 'alertmanager-0.alertmanager-headless.monitoring.svc:9093'
                - 'alertmanager-1.alertmanager-headless.monitoring.svc:9093'
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            action: keep
            regex: kube-system;kube-state-metrics
      # The alerting path itself. On 2026-11-01 three volumes were dataless for four hours
      # and `LonghornVolumeFaulted` was *firing* in Prometheus the whole time - but nothing
      # here scraped Alertmanager, so "did the notification actually go out?" was
      # unanswerable without curling its /metrics by hand. An alerting system whose
      # delivery cannot be observed is a hypothesis, not a control.
      - job_name: 'alertmanager'
        static_configs:
          - targets:
              - 'alertmanager-0.alertmanager-headless.monitoring.svc:9093'
              - 'alertmanager-1.alertmanager-headless.monitoring.svc:9093'
      # The comparison backend's own management metrics, so the dashboard reads both from one datasource.
      - job_name: 'victoriametrics'
        static_configs:
          - targets: ['victoriametrics.monitoring.svc:8428']
      # The two log stores' own metrics, so the comparison panels read from one datasource. Both are observers:
      # VictoriaLogs is the incumbent, Loki is the challenger added 2026-11-21.
      - job_name: 'victorialogs'
        static_configs:
          - targets: ['victorialogs.observability.svc:9428']
      - job_name: 'loki'
        static_configs:
          - targets: ['loki.observability.svc:3100']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']
      - job_name: 'ksm'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: kube-state-metrics
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"
      # The LAN switch, which is OpenWrt, not Kubernetes (2026-11-13). `prometheus-node-exporter-lua` was installed on
      # the switch itself and bound to its LAN address; the firewall on the switch accepts tcp/9100 from `.82` only, so
      # this scrape is the single permitted client rather than the exporter being open on the LAN.
      #
      # No `node` label on these series (the exporter does not know it is a switch), so anything that joins on `node`
      # must use `instance` instead - see the dashboard and any rule touching switch health.
      - job_name: 'switch'
        static_configs:
          - targets: ['192.168.2.3:9100']
            labels:
              instance: 'gs108tv3'
              site: 'lan'
              # NOT `device:` — the exporter labels every netdev series with the *port* name (`lan1`…`lan8`, `switch`,
              # `switch.1`), and a static `device` label here silently overwrote all of them, collapsing eight ports into
              # one series. Measured 2026-11-13: 496 series arrived and every one read `device="switch"`.
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: node-exporter
          # role: pod leaves __address__ as the pod IP with no port, so Prometheus
          # defaults to :80. Force the node-exporter port explicitly.
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9100'
            target_label: __address__
      - job_name: 'kepler'
        # Power exporter (hostNetwork, so each pod IP is its node IP). Scrape the
        # pods directly — scraping the Service would load-balance across nodes and
        # give each node's series intermittent gaps. honor_labels keeps kepler's
        # own `instance=<node>` label instead of the scrape address.
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: kepler
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9102'
            target_label: __address__
      - job_name: 'kubelet-cadvisor'
        # Per-container CPU / memory / throttling. This is the only source of
        # container history in the stack: metrics-server answers `kubectl top`
        # for the current instant and stores nothing, so a container spinning at
        # a full core stayed invisible until someone ran top by hand.
        # Scraped through the apiserver proxy, which the prometheus SA is
        # already allowed to do (nodes/proxy, read-only) — the kubelet's
        # self-signed cert and each node's firewall stay out of the path.
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - job_name: 'longhorn'
        # Longhorn manager metrics: volume robustness, per-node storage and
        # per-disk capacity. Volume health used to be CRD-only, i.e. readable by
        # asking the API but invisible to graphs and alerts.
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            action: keep
            regex: longhorn-system;longhorn-backend
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: manager
      - job_name: 'argocd'
        # Scrape each controller endpoint (not the Service) so the leader's
        # argocd_app_info metrics are always collected.
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            action: keep
            regex: argocd;argocd-metrics
      - job_name: 'blackbox'
        # Public-path probes: the exporter runs in the cluster and the request
        # goes out through Cloudflare and back through the tunnel.
        metrics_path: /probe
        scrape_interval: 30s
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://bismigel.dev/
              # /healthz, not /: the page returns 503 whenever any functional check
              # fails, so probing it made a media outage look like "edge unreachable"
              # (2026-11-02 19:04-20:33: radarr/sonarr clients down, PublicProbeDown
              # fired). Reachability and function are different questions and now have
              # different signals - StatusApiCheckFailing covers the second.
              - https://status.bismigel.dev/healthz
              - https://ciceley.cc/
              - https://jellyfin.bismigel.dev/
              - https://immich.bismigel.dev/api/server/ping
              - https://karakeep.bismigel.dev/
              - https://kavita.bismigel.dev/
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
spec:
  ingressClassName: nginx-admin
  rules:
    - host: prometheus.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  # NOT longhorn, deliberately. Prometheus is the thing that reports storage
  # incidents, so its TSDB must not live on the storage it reports on. On 2026-11-01
  # a Longhorn manager failure marked replicas failed, the prometheus-data volume went
  # with them, and Prometheus restarted mid-outage at 06:53:42 - the monitoring that
  # was supposed to explain the outage was itself a casualty of it.
  #
  # local-path trades replication for independence: the PV is pinned to whichever node
  # the pod first schedules on, and if that node dies the metric history goes with it.
  # That is the right trade - metrics are regenerable, and a monitor that disappears
  # with the thing it monitors is worthless. Owner agreed to lose the history
  # (2026-11-01).
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      initContainers:
        # local-path PVs are root-owned; prom/prometheus runs as nobody (65534).
        - name: fix-permissions
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
          volumeMounts:
            - name: storage
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            # Time-based, not size-based (story 10.6, 2026-11-09). `retention.size=1GB` is honest about disk but
            # useless for a question about a date: on 2026-11-06 an 11 GB egress spike at 19:00 on Nov 1 could not be
            # answered because a 1 GiB cap had already rolled that hour off the disk. 30 days inside an 8 GiB volume is
            # the trade, and `retention.size` stays as a backstop so a metric explosion cannot fill the node.
            - '--storage.tsdb.retention.time=30d'
            - '--storage.tsdb.retention.size=4GB'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: storage
              mountPath: /prometheus
          resources:
            # 1Gi was sized for a 1 GB TSDB, and that is what it had. Retaining 30 days (story 10.6) raised the number of
            # blocks the process loads at startup, so 1Gi became an **OOMKill loop**: both this and the alerting instance
            # restarted every ~90 s for an hour on 2026-11-09, and every graph in Grafana read "no data" because the
            # process never lived long enough to answer. Measured before raising: nodes run at 41-55% of 15 GiB, so 2Gi
            # here is headroom, not a squeeze.
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
        # Reload Prometheus when the config/rules ConfigMaps change (supports
        # --web.enable-lifecycle); avoids a manual restart after rule edits.
        - name: config-reloader
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c"]
          args:
            - |
              last=""
              while true; do
                h=$(md5sum /etc/prometheus/prometheus.yml /etc/prometheus/rules/*.yml 2>/dev/null | md5sum | cut -d' ' -f1)
                if [ -n "$last" ] && [ "$h" != "$last" ]; then
                  wget -q -O /dev/null --post-data= http://127.0.0.1:9090/-/reload && echo "prometheus reloaded"
                fi
                last="$h"
                sleep 10
              done
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          # Two ConfigMaps share one rules directory: the existing
          # prometheus-rules (alerting.yaml) and prometheus-rules-workloads
          # (workload/Longhorn groups). Adding groups no longer means rewriting
          # an 11KB file, and the files land in the same /etc/prometheus/rules
          # that rule_files already globs.
          projected:
            sources:
              - configMap: { name: prometheus-rules }
              - configMap: { name: prometheus-rules-workloads }
              - configMap: { name: prometheus-rules-network-devices }
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs:
      - /metrics
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
      # The second backend, for the live comparison dashboard. Same targets, scraped independently.
      # Nothing alerts from it; it is an observer until the comparison decides otherwise.
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoriametrics.monitoring.svc:8428
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
        # local-path PVs are root-owned; grafana runs as UID 472.
        - name: fix-permissions
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
          ports:
            - containerPort: 3000
              name: web
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: storage
              mountPath: /var/lib/grafana
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            # Admin password from Bitwarden (ExternalSecret `grafana-admin`).
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Per-user auto-login: trust the identity Cloudflare Access injects
            # (each person gets their own Grafana account).
            - name: GF_AUTH_PROXY_ENABLED
              value: "true"
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: Cf-Access-Authenticated-User-Email
            - name: GF_AUTH_PROXY_HEADER_PROPERTY
              value: username
            - name: GF_AUTH_PROXY_AUTO_SIGN_UP
              value: "true"
            - name: GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN
              value: "false"
            - name: GF_AUTH_PROXY_WHITELIST
              value: "10.42.0.0/16,10.43.0.0/16"
            - name: GF_USERS_AUTO_ASSIGN_ORG
              value: "true"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: "Admin"
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          # One ConfigMap per dashboard: editing a dashboard touches one small
          # file instead of a 20KB blob, and the review diff stays readable.
          projected:
            sources:
              - configMap: { name: grafana-dashboard-overview }
              - configMap: { name: grafana-dashboard-storage }
              - configMap: { name: grafana-dashboard-control-plane }
              - configMap: { name: grafana-dashboard-power }
              - configMap: { name: grafana-dashboard-edge }
              - configMap: { name: grafana-dashboard-slo }
              - configMap: { name: grafana-dashboard-cilium }
              - configMap: { name: grafana-dashboard-containers }
              - configMap: { name: grafana-dashboard-longhorn }
              # grafana-dashboard-network has existed since 2026-10-25 but was never listed
              # here, so it never reached Grafana. Found by the 2026-11-01 gap audit.
              - configMap: { name: grafana-dashboard-network }
              - configMap: { name: grafana-dashboard-network-devices }
              - configMap: { name: grafana-dashboard-opnsense }
              # Every dashboard must be listed TWICE: once as a ConfigMap in the kustomization, and once here.
              # Adding only the first is silent - the file renders, CI passes, and Grafana never sees it. The
              # comment eight lines up is about this exact failure on 2026-10-25, and it happened again on
              # 2026-11-13 with the switch dashboard.
              - configMap: { name: grafana-dashboard-switch }
              - configMap: { name: grafana-dashboard-tsdb-comparison }
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: nginx-admin
  rules:
    - host: grafana.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
# Grafana dashboard provider. The dashboards themselves live in
# the grafana-dashboard-*.yaml files (kept separate so dashboard edits have a readable diff).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: homelab
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
---
# Grafana admin password, synced from Bitwarden (`grafana-admin-password`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-password
