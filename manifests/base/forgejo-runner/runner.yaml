# The CI runner this estate owns, in place of rented minutes.
#
# Executor: `host`, deliberately. DinD would mean a privileged pod and a Docker daemon on a node that otherwise runs
# containerd; the pod is already a sandbox, so a job that misbehaves gets the pod's filesystem and its own service
# account (default, no RBAC) rather than a node.
#
# The trade-off is that a job can only use the tools in this image, which is the runner's own Alpine image. What that
# image actually carries is measured after the first deploy and recorded in homelab-context/docs/plans/2026-11-15-forgejo-ci-migration.md;
# if the python checks need more, the answer is a smaller purpose-built image (runner + python3 + git + trivy), not a
# privileged Docker daemon.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo
data:
  config.yml: |
    log:
      level: info
    runner:
      file: /data/.runner
      # TWO per runner, with three runners: capacity 4 was chosen when there was one runner and the peak
      # concurrent jobs measured over a week was 2. Three pods with capacity 4 would advertise twelve
      # simultaneous jobs on three nodes, which is a burst that would starve the metrics store and Longhorn
      # on whichever node took it.
      #
      # Four, not two: measured 2026-11-17 from Forgejo's own action_run table — `docs.yml` queues 1.0 s, `checks.yml` 19 s,
      # `scan.yml` 27 s and `runbook-links.yml` 34 s, with one run waiting **649 s** (10.8 min). The cause is not throughput
      # (341 runs a week is 2 an hour) but collision: `release.yml` peaks at 672 s and `scan.yml` at 503 s, and on two slots a
      # pair of those blocks every 30-second check behind them.
      # NOT autoscaled, and this is the measurement that says why: peak **concurrent** jobs in the seven days to
      # 2026-11-17 was **2**, against a capacity of 4. An autoscaler here would idle, and it is not free —
      # forgejo-runner v13.2.1 has no scaler of its own (its `one-job` command exists so something else can drive ephemeral
      # runners), driving that means a controller holding a registration token, and the runner file is on a RWO PVC so
      # replicas cannot share it. If the peak ever approaches capacity the order is: capacity first (one line, no cost),
      # then a second runner labelled `heavy:host` so an eleven-minute release build cannot sit in front of a
      # thirty-second check, and only then scale-out. The query that answers "am I close" is on PR #60.
      capacity: 2
      timeout: 30m
      fetch_timeout: 5m
      fetch_interval: 3s
      labels:
        - "in-cluster:host"
    cache:
      enabled: true
      dir: /data/cache
    host:
      workdir_parent: /data/work
# The forgejo-runner-data and forgejo-build-scratch PVCs are no longer declared (2026-11-25): nothing has mounted
# them since 2026-11-21, and after the rebuild they were empty and Pending. They carried Prune=false,Delete=false,
# so ArgoCD leaves the live objects alone, and IgnoreExtraneous (on them since #578) keeps them out of the sync
# status. Releasing them is runbook 17, by name, by a human (ADR 0002).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  # THREE runners, one per node, not one runner with capacity 4 on one node (2026-11-21).
  #
  # The single runner was pinned to patola by its RWO local-path volume and became the largest CPU
  # consumer on the node that already carried Longhorn's instance managers and at one point 97% load.
  # CI is bursty and it is the one tenant that can run anywhere: /data is an emptyDir now, so a pod
  # can land on any node, and each replica registers itself with the instance token (the `register`
  # init container is idempotent per pod instead of shared-state).
  #
  # The price, stated: each pod installs its toolset once at start (~30 s), so three pods cost three
  # installs per rollout instead of one - and nothing is cached between them. That is the trade for
  # not having a node-pinned volume. Capacity per runner drops to 2 so three pods do not offer 12
  # simultaneous jobs on three nodes.
  #
  # TRUE scale-to-zero (a pod per job, 0 when idle) needs an external controller: KEDA's gitea scaler
  # plus `forgejo-runner one-job --ephemeral`, and crucially a PREBUILT runner image - installing the
  # toolset per job would make CI slower, not faster. That is a story, not this change.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # ONE AT A TIME, terminating before starting. With `replicas == nodes` and a hard host anti-affinity,
      # the default surge (25% of 3 -> 1 extra pod) asks for a 4th node that does not exist, so the rollout
      # deadlocks: the new pod is Pending on anti-affinity and the old pod is never terminated because
      # maxUnavailable 0 waits for a new pod to be ready first. `maxSurge: 0` makes the scheduler's answer
      # possible - free a node, then fill it.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      # One runner per node: two replicas on one node is the configuration this change exists to leave.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: forgejo-runner
              topologyKey: kubernetes.io/hostname
      # Story 15.3. The runner polls Forgejo over HTTP and never calls the Kubernetes API, and its ServiceAccount is
      # `default` with no RBAC - so the mounted token buys nothing and is one more credential inside a container that
      # runs arbitrary PR content. `bakuran-gitops/.forgejo/workflows/checks.yml` already says the property out loud
      # ("the runner is a pod with the default service account and no RBAC - that is a security property worth keeping");
      # this makes it true at the pod, not only at the role.
      automountServiceAccountToken: false
      # NO nodeSelector. It existed because a local-path volume pinned the pod there, and the two volumes
      # are now emptyDirs - leaving the selector behind is the fourth version of the same mistake: the pod is
      # told to spread across hosts and told to sit on one, and the scheduler reports "1 node didn't match
      # anti-affinity, 2 didn't match node affinity" forever.
      securityContext:
        fsGroup: 1000
      initContainers:
        # Registration writes /data/.runner. Doing it in an init container means a pod that is restarted does not need
        # anybody to remember a command - and a runner whose token was revoked re-registers instead of failing silently.
        - name: register
          image: data.forgejo.org/forgejo/runner:13@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -s /data/.runner ]; then
                echo "already registered; leaving the state file alone"
                exit 0
              fi
              forgejo-runner register --no-interactive \
                --instance "http://forgejo.forgejo.svc.cluster.local:3000" \
                --token "$REGISTRATION_TOKEN" \
                --name "in-cluster" \
                --labels "in-cluster:host" \
                --config /etc/runner/config.yml
          env:
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-registration
                  key: token
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/runner }
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
          # Measured in the pod on 2026-11-16: the runner image carries git and bash, and none of the rest.
          #   * python3 + py3-yaml - every checker in these repos is python3
          #   * nodejs - `actions/checkout` and every other action/* is a JavaScript action; without node the job
          #     clones the repository and then stops, with no error in the runner log. That cost one failed run to find.
          #   * yamllint - bakuran-gitops' first check, and it is a python module Alpine ships
          #   * curl, jq - diagnostics, and `curl` is the download path for anything not packaged
          #   * kustomize, hugo, pandoc - bismigel-site renders manifests, converts pages and builds them
          #   * kubectl - render steps today, a server dry-run once the runner has a kubeconfig
          #   * go - ADR 0016 made executable code Go, and the port cannot wait for nix to build artefacts: the runner is
          #     where the checks CI runs are executed. Alpine's go is ~180 MiB, which is exactly the transition cost the
          #     ADR named ("CI runs go build, or the runner gains the package"). Measured in this pod 2026-11-16:
          #     `go build ./...` of homelab-context takes ~6 s warm, and the module cache lives on the workspace PVC.
          #   * buildah + netavark - container builds, closing 14.7's runtime gap. Measured in this pod 2026-11-16:
          #     `buildah bud` builds media-mcp (python base) in 48 s with NO privileged flag, using --storage-driver vfs
          #     (overlay-on-overlay is refused in a container), BUILDAH_ISOLATION=chroot, and TMPDIR on a disk-backed PVC
          #     (tmpfs was tried first and ran out, because buildah writes blobs there too).
          # NOT here: kubeconform (no Alpine package; its half is the kustomize render), nix (a decision about what the
          # runner's job is, not a package to add).
          # The better end state is a purpose-built image (runner + python3 + pyyaml + node + trivy) built once and
          # pinned; this is the version that costs no build pipeline.
          #
          # The image runs as uid 1000, which cannot apk-add anything. The container is therefore root - and that is
          # contained deliberately: no privileged flag, no hostPath, no host network, so uid 0 in this pod reaches a
          # scratch filesystem and the pod's own service account (default, no RBAC). Jobs already run whatever the
          # repository puts in them; the pod is the boundary, not the uid.
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Retried, because a fresh pod starts its first apk before the pod's DNS and egress rules are
              # programmed: the index then looks empty, apk reports "no such package" for a list of packages that
              # exist, and `set -e` kills the container. That is the observed crash loop (exit 14, 8 restarts):
              # each restart repeated the same race, and every task assigned to a dying pod stayed "running"
              # forever, so a build silently never happened. The same command succeeds a minute later, which is
              # what the retries buy. A real outage still fails, only after ~40s of trying.
              # apk update MUST come first and be retried together with the add: the runner image ships a stale
              # baked-in index, so `apk add` alone reports "no such package" for packages that exist (python3,
              # py3-yaml, yamllint, postgresql16) and never recovers, because add does not refresh the index. A
              # fresh index fetch is what actually makes the packages resolvable.
              n=0
              until apk update >/dev/null 2>&1 && apk add --no-cache python3 py3-yaml go nodejs yamllint curl jq kustomize hugo pandoc kubectl buildah netavark postgresql16 >/dev/null; do
                n=$((n+1))
                if [ "$n" -ge 6 ]; then
                  echo "apk add failed after $n attempts; refusing to run a runner without its tools" >&2
                  exit 1
                fi
                echo "apk add failed (attempt $n), retrying in 10s" >&2
                sleep 10
              done
              # trivy is not packaged by Alpine, so it is fetched at container start from a pinned release. The pin
              # matters: an unpinned scanner turns into a scan that fails on a day nobody changed this repository.
              if [ ! -x /usr/local/bin/trivy ]; then
                curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  | tar -xz -C /usr/local/bin trivy
              fi
              # Stale scratch, swept at start. A job that is cancelled or killed leaves its work directories behind
              # (`checks-*` from the checks image extraction, `ci-*` from the other workflows, `guards-go-*` from
              # the guards build, `es-*` from every buildah invocation), and nothing else ever removes them - the
              # pod they lived in is the only thing that would have. `-mmin +120` keeps the scratch of a job that
              # is running right now; `|| true` because a cleanup that fails is not a reason to refuse to run CI.
              find /tmp /var/lib/containers -maxdepth 1 \( -name 'checks-*' -o -name 'ci-*' -o -name 'guards-go-*' -o -name 'es-*' \) -mmin +120 -exec rm -rf {} + 2>/dev/null || true
              exec forgejo-runner daemon --config /etc/runner/config.yml
          env:
            - name: TRIVY_VERSION
              value: "0.76.2"

          resources:
            requests: { cpu: 100m, memory: 128Mi }
            # 3 Gi, because the host executor runs every job inside this container: the 1 Gi limit was shared by
            # concurrent `scan` (trivy, image layers) and `buildah` steps, which is where an `Init:OOMKilled` comes from.
            # 2 CPU: a buildah job on patola can otherwise take all four cores from the VM, Longhorn and etcd. The
            # node-Pressure signal lives in the node metrics; ContainerHighCPU now excludes the forgejo namespace.
            limits: { cpu: 2, memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/runner }
            - { name: build-scratch, mountPath: /var/lib/containers }
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        # emptyDir, not the local-path PVC it used to be: the volume was what pinned this pod to one node,
        # and the only state in it was `.runner` (recreated by the init container on every start) plus the
        # work directory. Losing the cache on restart is the cost and it is smaller than the cost of a
        # node-bound CI runner.
        #
        # Bounded at 10 Gi, because an unbounded emptyDir is a disk the kubelet will happily fill: the orphaned
        # `/data/.cache/go-build` reached 11 GiB and orphaned `/var/lib/containers/es-*` directories another
        # 11 GiB, which pushed .82's 98 GiB root filesystem to 78% - a node-level pressure that has nothing to
        # do with what the jobs were building. The limit isolates that to this pod's own volume.
        - name: data
          emptyDir:
            sizeLimit: 10Gi
        # Buildah's storage on a real filesystem rather than the pod's overlay, because it must mount overlays inside
        # it. 5 Gi is ~8x the largest build measured here (610 MB with the vfs driver, which copies layers).
        # emptyDir, not the local-path PVC. This is the trap I walked into one commit ago: a single RWO
        # volume bound to one node, combined with a hard anti-affinity that requires the replicas to land on
        # *different* nodes, is unsatisfiable - the new pod sat Pending with no node that could host it.
        # Buildah's scratch is transient by nature (`--storage-driver vfs` copies layers per build); losing
        # it on restart means re-pulling base images on the next build, which is cheaper than a CI that
        # cannot schedule.
        #
        # Bounded at 10 Gi for the same reason as `data`: buildah copies layers into this directory per build
        # with the vfs driver, and the leftovers (es-*) are the other half of the 11 GiB that filled .82's root
        # filesystem. 10 Gi is still ~16x the largest build measured here (610 MB).
        - name: build-scratch
          emptyDir:
            sizeLimit: 10Gi
