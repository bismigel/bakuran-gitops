# ArgoCD's own UI was unreachable at argocd.bismigel.dev, and had been since the rebuild.
#
# The hostname was in the Cloudflare tunnel's route list and in `install/argocd/values.yaml` - but that
# values file is a *bootstrap-time* Helm input, applied by hand when the cluster is built, not by any
# Application. The `argocd-ha` app manages only a PDB. So the tunnel routed the host to an ingress
# controller that had no Ingress for it, which answers 404; Cloudflare Access answered 302 first, so the
# breakage looked like "Access is having a moment" rather than a missing object.
#
# Declared here, in the path the `argocd-ha` Application owns, so it survives a rebuild. This Ingress is
# the ONLY owner of the object: `server.ingress.enabled` is `false` in `install/argocd/values.yaml`, because
# two owners of one object is what ADR 0011 forbids - and here the disagreement would be silent and wrong
# (see the note on `argocd-ha/pdb.yaml`, which owns the PDBs for the same reason).
#
# `argocd-server` serves PLAIN HTTP on its container port: `configs.params."server.insecure": true` in
# `install/argocd/values.yaml` turns off its own TLS listener, so the Service's port 80 is the backend and
# nginx must not be told to speak HTTPS to it. The previous version of this file declared
# `backend-protocol: HTTPS` on port 443, which with `server.insecure: true` active is a 502 - and because
# `argocd-ha` has `selfHeal: true`, it would have overwritten any Helm-rendered Ingress with exactly that.
#
# `ssl-redirect: false` because Cloudflare terminates TLS at the edge: letting nginx redirect to https
# again sends the browser to a port the tunnel does not serve.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx-admin
  rules:
    - host: argocd.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
