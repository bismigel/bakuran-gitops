apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 10s
    exporters:
      logging:
        verbosity: detailed
      prometheus:
        endpoint: "0.0.0.0:8889"
      # ONE trace store, decision taken 2026-11-21 (owner): the Victoria stack owns the estate's telemetry, so
      # the comparison pair is over and Tempo's exporter is gone. `logging` stays so a missing backend is visible
      # in the collector's own log rather than silently dropped.
      otlphttp/vtraces:
        traces_endpoint: http://victoria-traces.observability.svc:10428/insert/opentelemetry/v1/traces
        compression: gzip
        retry_on_failure: { enabled: true }
        sending_queue: { enabled: true, queue_size: 5000 }
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          # Hermes' auto-instrumented spans stop being a log line here and start being data.
          exporters: [logging, otlphttp/vtraces]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging, prometheus]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          resources:
            requests: { cpu: 20m, memory: 64Mi }
          image: otel/opentelemetry-collector-contrib:0.110.0@sha256:0ed3688bbb02dabc0429ef648ebe3e9c53aca5e7c5a6b1a4a61b9f583b823e36
          command: ["/otelcol-contrib", "--config=/etc/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: otel-collector-conf
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8889
      targetPort: 8889
