apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      # Run on every node — including the tainted control-plane MacBook — so all
      # three hosts are covered. Prometheus scrapes these via the dedicated
      # `node-exporter` job (app=node-exporter, forced to :9100).
      tolerations:
        - operator: Exists
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0@sha256:4cb2b9019f1757be8482419002cb7afe028fdba35d47958829e4cfeaf6246d80
          args:
            - '--path.procfs=/host/proc'
            - '--path.sysfs=/host/sys'
            # Stat filesystems through the HOST root (mounted at /rootfs), not the
            # container's overlay. Without this the filesystem collector reads the
            # host mount list from /host/proc/mounts but stats the container's own
            # /, so every host mount outside /proc|/sys|/dev|/etc|/host is
            # invisible — this is why /mnt/media (mergerfs on calamansi-intel)
            # never showed up, and why the "/" numbers were the overlay's.
            - '--path.rootfs=/rootfs'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
            # Textfile collector: hosts drop custom metrics here. Used for
            # WireGuard (handshake age, transfer counters) on calamansi-intel,
            # because node_exporter has no wireguard collector and "is the VPN
            # up" cannot be answered from the container.
            - '--collector.textfile.directory=/host/textfile'
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: proc
              mountPath: /host/proc
            - name: sys
              mountPath: /host/sys
            - name: rootfs
              mountPath: /rootfs
              # HostToContainer, not rprivate: a mount that appears or is remounted after the pod started (and a
              # separate submount under /mnt/* on .82) was invisible or shadowed inside this container's mount
              # namespace — so node_exporter reported `/` (77.8%) for /mnt/media, /mnt/longhorn and /mnt/backup-sd
              # when they were really 4-23% used. It only stats the host root: read it, do not write it.
              mountPropagation: HostToContainer
              readOnly: true
            - name: textfile
              mountPath: /host/textfile
              readOnly: true
          resources:
            requests:
              memory: 50Mi
              cpu: 100m
            limits:
              memory: 200Mi
      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: rootfs
          hostPath:
            path: /
            type: Directory
        - name: textfile
          hostPath:
            path: /var/lib/node-exporter/textfile
            type: DirectoryOrCreate
