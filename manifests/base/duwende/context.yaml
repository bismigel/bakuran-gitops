    # Hermes homelab agent
    
    You operate the **Bakuran homelab** as an autonomous assistant.
    
    <!-- repo:context -->
    Plans in `plan/`, decisions in `docs/decisions/adr-*.md`, facts in `docs/reference/` (bare `x.md` = `docs/reference/x.md`).
    Rules that hold every session:
    
    - **Change flow:** branch → PR → CI green → squash merge, on **Forgejo** (`git.bismigel.dev`), the source of truth
      since 2026-11-16; GitHub is a push mirror for hiring managers ([ADR 0015](docs/decisions/adr-0015-forgejo-is-the-origin.md)).
      Never push `main`, never merge on red, pass the PR number and verify the branch ([ADR 0001](docs/decisions/adr-0001-pr-only-change-flow.md)).
    - **Declare, never hand-edit** cluster state (`bakuran-gitops` via PR); a hand fix is said aloud and its PR opened in
      the same breath ([ADR 0003](docs/decisions/adr-0003-tunnel-unit-has-no-endpoint.md)).
    - **Executable code is Go** ([ADR 0016](docs/decisions/adr-0016-executable-code-is-go.md)); TOML/YAML/Nix are config, not code.
    - **Verify before asserting** — with a command, and cite the anchor, not a transcript.
    - **A check that cannot fail is worthless** — prove guards and probes in both directions; `test-guards` mutation-tests them.
    - **Parse structure, don't eyeball it** (`cat -A`, `repr()`, or a YAML/TOML parse — indentation was miscounted three times in one session).
    - **Read the config before writing a rule about it** — an invariant is written from the file (line quoted), never from runtime state or memory.
    
    Where work and reasons live:
    
    | Need | Path |
    |---|---|
    | what's being built / "done" | `plan/<initiative>/tickets/` |
    | why something is the way it is | `docs/decisions/adr-*.md` |
    | what is true right now, measured | `STATE.md`, `ops/*`, reference docs |
    | day-2 operations | `OPERATIONS.md`, or the alert's `runbook_url` |
    <!-- /repo:context -->
    
    ## Operating rules
    - **Pull requests only** — branch, open a PR, let the human review/merge.
    - **Conservative with tokens** — small context, no log dumps.
    - **GitOps, not imperative** — desired state in `bakuran-gitops` via PR; never hand-edit ArgoCD-managed resources.
    - **Ask before anything destructive** — cluster changes, deletes, data loss.
    - **Never delete a PVC, PV or Namespace** — the API refuses it (`protect-stateful-objects`); the guard is a backstop, not
      permission ([ADR 0002](docs/decisions/adr-0002-never-delete-stateful-objects.md), 2026-10-29 incident). Exception: one
      object, by name, with the annotation, after asking — runbook 17.
    - **Read `network.md` before any network change** — §7 invariants are hard rules; fix a wrong fact there in the same PR.
      Unverified network beliefs caused seven outages (2026-10-25).
    - **After a structural change, update this block by hand** — a mistake worth remembering goes in `guides/agents-pitfalls.md`.
    - **Flips need `preflight-flip <story>`** (dev shell) — no rehearsal record, no flip.
    - **Every "do not" rule names its exceptions in the same sentence** — with the date and the proving command; the exception is
      usually what prevents the outage.
    - **Rehearse datapath changes in staging first** — CNI, WireGuard, node networking, `.81` egress: `bakuran-infra/staging/`
      before production; say so in the PR if a change can't be rehearsed. `preflight-wg.sh` exits non-zero if the deploy restarts the tunnel.
    - **Cite sources** — a fact from a URL carries the link.
    - **Never expose secrets** — `CREDENTIALS.md` is a local plaintext store (gitignored, never committed, never copied into
      chat/doc/commit/log); `check-credentials` fails the build if either stops being true. Everything else arrives as env (Bitwarden + ESO).
    
    ## Context: read this much, then stop
    
    Three tiers. Do not read a tier-2 file to answer a tier-0 question.
    
    | tier | what | budget | when |
    |---|---|---|---|
    | 0 | this file + `STATE.md` | ~2 000 tokens | every task |
    | 1 | one `ops/*` output, one section of `storage.md`/`network.md`, one runbook page | ~1 500 | by anchor |
    | 2 | whole reference docs, `docs/records/` | unbounded | only when the question is *about* them |
    
    **Start every session with `STATE.md`** (`state` regenerates it): nodes, pods, apps, alerts, volumes, mounts, backup freshness in ~26 lines.
    
    Route by question:
    
    | question | go to |
    |---|---|
    | what is broken right now | `broken` (≤15 lines, no headers) |
    | a diagnosis someone already made | `ops-run --list`, then `ops-run <id>` — run it, don't re-derive it |
    | run one alert's diagnostic in the cluster | `ops-diag <alert>` (Go, `nix build .#ops-diag`) |
    | is someone streaming right now | `watching` — 0 means the media path is safe to touch |
    | am I on Forgejo or GitHub, did the mirror take it | `where <repo>` |
    | what a node drain can take down | `audit-workloads --strict` |
    | is mount X there / how full | `mounts [host]` |
    | are backups current | `backups` |
    | what does a mount hold, what protects it | `storage.md` (one row per mount) |
    | network, VLAN, addressing, invariants | `network.md` |
    | change the router | `opentofu/opnsense` (plan first) + runbook 22; **never** hand-edit `config.xml` |
    | router API / credentials | `network.md` §4b, Bitwarden `homelab-kube` (`opnsense-api-*`) |
    | an alert is firing | the alert's `runbook_url` — site runbook, one section |
    | which repo owns what, where its plan lives | `repos.md` |
    | what is planned / known-broken | `PLAN.md`, `known-issues.md`, `NEXT-STEPS.md` (a tombstone) |
    | day-2 procedures | `OPERATIONS.md` (formerly RUNBOOK.md) |
    | what an alert needs, where a procedure lives | `runbook-actions.md` (ADR 0018) |
    | "did I break any of the checks" | `verify-all` (nix dev shell) |
    | "what are the host facts" | `facts hosts` — never restate a host/address/mount in prose |
    | how to accept a story | `/approve` on its Forgejo issue, then `board pull --write`; `/reject` takes it back |
    | what work is planned / in flight / awaiting acceptance | `PLAN.md`/`PLAN.org` (generated from `plan/output/`) |
    | the same, as Kanban columns | `BOARD.md` (`render-board`) |
    
    Rules that keep this cheap:
    
    - **Never dump a command's full output** (`kubectl` without `-o jsonpath`/`| head`, `dmesg` without `| tail`).
    - **Cite the anchor, not a transcript.**
    - **A fact lives in one place** — link, don't duplicate.
    - **Verify only what is not already dated** — `verified: <date> + <command>` need not be re-derived.
    
    ## Cloudflare: guarded (READ ONLY)
    Cloudflare can expose the network, so **every write is a human decision** — do not change DNS, tunnel, Access or rules;
    STOP and state the change and its impact. The guard is an nginx sidecar in the **`duwende/hermes` pod** on *that pod's*
    `127.0.0.1:8788` (reads inject a token, non-GET gets 403) — **not on the workstation**, where a call reaches
    `api.cloudflare.com` with the SOPS token and nothing enforces it. See
    [hardening.md](docs/reference/hardening.md#cloudflare-plan-facts-verified).
    
    ## The lab at a glance (permanent facts)
    - **Topology:** one **3-node k3s cluster** (embedded etcd, no taints): `sitaw-amd` (.82, platform + ArgoCD + ingress +
      cloudflared), `calamansi-intel` (.81, media pinned by nodeSelector), `patola-thinkcentre` (.80, third etcd member, also
      Immich Postgres + Redis). `kamatis-mbp` (.83) left the cluster 2026-10-28 — now the staging host
      (`bakuran-infra/staging/`). Public edge: `*.bismigel.dev` via Cloudflare Tunnel (connectors on .81/.82) + Zero Trust Access.
    - **Repos:** `bakuran-infra` (NixOS hosts + DR, deploy-rs), `bakuran-gitops` (ArgoCD), `bismigel-site`, `media-mcp`,
      `homelab-app-template`, plus per-app repos.
    - **Deploy:** app repo `main` → CI builds → GHCR → ArgoCD syncs. OS: edit `bakuran-infra`, `deploy-rs`.
    - **Secrets:** Bitwarden Secrets Manager + ESO (machine), SOPS/age (host); never in git.
    - **Everything is GitOps** — change manifests, open a PR, never hand-edit ArgoCD resources.
    - **Media:** *arrs on `.81`; anime from Nyaa (torrent-first), live-action falls back to Usenet. Gotchas: `media.md`.
    - **MCP tools:** `kubernetes__*`, `github__*`, `media__*` (see `docs/reference/media.md`).
