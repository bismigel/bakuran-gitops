    ---
    type: reference
    audience: operator
    owns: what is broken now — the live list, and the index of incident records
    ---
    
    # Known issues
    
    What is broken **now**, and what to do about it. History — including every incident that is fixed — lives in
    `docs/records/incidents/` and is indexed at the bottom of this page. The split is deliberate: this file is what an
    operator reads at 2 a.m., and it should never grow a "resolved" section again.
    
    > Moved out of `KNOWN-ISSUES.md` on 2026-11-14 (story 11.1). That file was 1088 lines and two documents in one: a live
    > list and a five-week incident diary, which is why stale entries sat beside live ones and nobody read either.
    
    ## Last health scan (2026-10-28 ~21:40 UTC, verified live)
    
    - **Unified 3-node k3s cluster**, `sitaw-amd` (.82), `calamansi-intel` (.81),
      `patola-thinkcentre` (.80), embedded etcd **3 members**, API VIP `192.168.10.100`;
      `k3s v1.34.5+k3s1`. All three `Ready`, 31 ArgoCD apps `Synced`, 0 abnormal pods,
      0 firing alerts, 17/17 Longhorn volumes healthy.
      (`kamatis-mbp` .83 left the cluster on 2026-10-28 and is now the staging host.)
    - All nodes `Ready`, all pods `Running`, all PVCs `Bound`; every ArgoCD app
      `Synced/Healthy` (the old `root` OutOfSync is fixed, item 2).
    - Backups: `homelab-backup.service` on both hosts = `Result=success` → R2.
    - ⚠️ **`.81` load average ~10 on a 4-core i5** with CPU ~57% idle and ~20% iowait
      (829 tasks), I/O / NFS / mergerfs bound, not CPU. Jellyfin scans every 15m
      (completes in ~5s). Not yet investigated.
    - `media-mcp` (`:30097/mcp`) answers **unauthenticated** on the LAN (returns 406 to a
      bare GET, i.e. no auth gate) while holding all the *arr/Jellyfin API keys.
    
    ## Active
    
    1. ~~**Origin not yet tunnel-only.**~~ **FIXED (2026-10-14):** k3s now binds
       **NodePorts to loopback only** (`--kube-proxy-arg nodeport-addresses=127.0.0.1/32`)
       on all nodes, so only the local cloudflared connector (`127.0.0.1:32080`) can
       reach them, LAN clients can no longer reach NodePorts and thus can't bypass
       Cloudflare Access (nor spoof the header). Supporting changes: the tunnel's
       `jellyfin` route repointed to `127.0.0.1:32080` (Jellyfin Ingress), and Hermes
       now reaches `media-mcp` via the in-cluster Service (`media-mcp.media.svc:8080`).
       Verified: LAN NodePorts return `000`; the tunnel still serves every hostname.
    2. ~~**`root` ArgoCD app reads `OutOfSync`**~~ **FIXED (2026-10-13):** root cause was
       an invalid `spec.source.helm.includeCrds` in the `external-secrets` Application
       (not an ArgoCD field, the controller silently dropped it → permanent drift).
       Removed; `root` now syncs.
    3. **`miguelarbis.dev` is a 301 redirect** to `bismigel.dev` (Bulk Redirect), not
       its own site, intentional. `www.miguelarbis.dev` also routed.
    4. **Media pool branch imbalance** (`/mnt/media`, 2026-10-24) — mergerfs runs
       `category.create=epmfs`: a new file goes to the branch that already holds its
       directory, so **only branches that carry the library dirs can ever receive
       writes**. Two consequences, both seen today:
       - When the dirs existed only on `media-sda`, everything piled there; it hit
         **99% (3.9G free)**, below mergerfs' 4G `minfreespace`, and creates failed
         with `ENOSPC` **while `df /mnt/media` reported 789G free**. Symptom:
         LazyLibrarian imported a book to `/config`
         (`eBook dir ['/books'] not writeable, using /config`).
       - After `media-dirs` also created the dirs on `media-nvme`, new content went
         there instead and filled it: **12G free (91%)** within hours, while
         `remote82-sda` sat at 4%.
       - **Done (2026-10-24):** rebalanced by moving folders between branches —
         `9-1-1` (46G), `INVINCIBLE` (23G), `The Sopranos` (19G) → `remote82-sda`,
         and the two big nvme movies → `media-sda`. Every move was byte-verified
         before deleting the source; the pool serves the content throughout
         (mergerfs merges reads). Result: sda 54%, nvme 43%, remote82-sda 24%.
       - **Still open (needs a human):** the local branches are 369G against 300G+
         of media, so the trend is inevitable. Either create the library dirs on
         `remote82-sda` too (writes then depend on the NFS export from `.82`, which
         `media-dirs` deliberately avoided), or add local capacity, or stop growing.
       - Rebalance recipe: `OPERATIONS.md` → *LazyLibrarian is not downloading* → step 7.
       - Triage: `OPERATIONS.md` → *LazyLibrarian is not downloading* → step 7.
    
