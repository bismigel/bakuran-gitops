    ---
    type: reference
    audience: agent
    owns: the safety model for ops-run — blast radius, the three lines that do not move, why no engine
    ---
    
    # Conditions — the safety model
    
    The registry lives in `bakuran-gitops/manifests/base/runbooks/actions/`, beside the alert rules it serves,
    so a rule and its procedure can land in one PR - a procedure maintained in a different repository rots at the
    rate the environment changes. `runbooks/actions/*.yaml` turns a diagnosis that has already been done once into something you **run** instead of read. The format
    and the four authoring rules are in [`actions/README.md`](https://github.com/bismigel/bakuran-gitops/blob/main/manifests/base/runbooks/actions/README.md); this page is the part a reviewer
    argues with, because it is what stops the registry becoming an agent with a gun.
    
    ## What may be automated, and what may not
    
    | blast radius | diagnosis | remedy |
    |---|---|---|
    | `node` | always | may run unattended, must be idempotent and reversible |
    | `external` (a probe target, a SaaS) | always | may run; it is a config change reviewed like code |
    | `cluster` | always | **refused without `--yes`**, and never unattended |
    
    Three lines that do not move, whatever a playbook would find convenient:
    
    1. **Nothing deletes or recreates a PVC, PV or Namespace.** ADR 0002 — the API refuses it anyway, and a registry that tries
       is a registry that has stopped reading its own estate.
    2. **Nothing restarts the tunnel or changes routing** without `preflight-wg.sh` having passed in the same breath. That
       script exists because the operation has stranded a node seven times.
    3. **Nothing runs on a timer.** `ops-run` is invoked by a human or an agent that has read the diagnosis. A condition that
       fires by itself is an incident generator with no owner.
    
    ## Why there is no engine, yet
    
    An n8n-style engine is the obvious next thought — visual flows, retries, schedules — and it is also a stateful service holding
    credentials, with the logic in a database instead of git. That is the opposite of this estate's one non-negotiable.
    
    So the shape is: **the registry is git, execution is `ops-run`, and an engine may later be a scheduler and notifier that
    calls `ops-run`** — never the place the remedy is written. Story 12.4 records that decision properly; this page is the reason
    it will be decided that way rather than by drift.
    
    ## Adding a condition
    
    1. Copy the closest existing file in `bakuran-gitops/manifests/base/runbooks/actions/`.
    2. `diagnose` first: what command decides this, and what does each answer mean? If you cannot write that sentence, the
       diagnosis is not finished.
    3. Only then a `remedy`, with `why_safe` in one sentence a reviewer can argue with.
    4. `measured = <date>` — when you last proved the diagnosis. A condition without a date is a guess wearing a filename.
    5. `check-conditions` — id must match the filename, cited docs must exist, and a remedy without
       `why_safe` fails.
  docs_reference_agents.md: |
    ---
    type: reference
    audience: both
    owns: which agents run here, what each may touch, what each holds, and how to ask one something
    ---
    
    # Agents — who can do what
    
    Four things act on this estate. Only one of them writes to the cluster, and it is not a model.
    
    | actor | where | reads | writes | holds | can it change the cluster? |
    |---|---|---|---|---|---|
    | **ArgoCD** | `argocd` | git | **the cluster** | repo read + cluster write | **yes — alone** |
    | **Hermes** | `duwende` | cluster, repos, media APIs | PRs, Telegram replies | `DEEPSEEK_API_KEY`, `GH_TOKEN`, `TELEGRAM_BOT_TOKEN` | no — via PR only |
    | **HolmesGPT** | `ops-advisor` | cluster: get/list/watch | nothing | `DEEPSEEK_API_KEY` only | **no** |
    | **kagent** | `kagent` | its own CRs | its own namespace only | `DEEPSEEK_API_KEY` | **no** — fenced by admission |
    | **triage agent** | `kagent` (pod) | 4 read tools | nothing | none | **no** |
    | **pi** (workstation) | your machine | everything | files, commits | deepseek + git + kubectl | via PR only |
    
    Two of these are one system: `kagent` is a runtime, and `triage` is the agent it runs. They are separate rows
    because their permissions differ — the controller's RBAC is wildcard by chart default, and the agent's tools are
    four of eighteen.
    
    Verified 2026-11-15 with `kubectl auth can-i … --as=system:serviceaccount:ops-advisor:holmesgpt`:
    `list pods`, `get nodes`, `list pvc`, `volumes.longhorn.io` → **yes**; `create/delete pods`,
    `delete pvc`, `delete namespaces`, `patch deployments`, `get secrets` → **no**.
    
    ## Hermes — the agent you talk to
    
    Telegram bot and an HTTP dashboard, plus MCP clients for Kubernetes and Prometheus. It is the only
    model-backed actor with a repository token, so it is the one that proposes changes. It reads this
    document set through a generated ConfigMap (`duwende/homelab-context`) assembled from this repository
    by `gen-context-bundle` (Go, in this repository).
    
    ## HolmesGPT — the investigator that cannot act
    
    Ask it a question and it reads the cluster with its own read-only credentials, then answers.
    
    ```bash
    ask "why is the media pod restarting?"
    ask --ns media "which pods have restarted most?"
    ```
    
    It costs one DeepSeek call per question, so nothing calls it automatically. It holds no repository
    token and cannot open a pull request — the boundary in
    [ADR 0012](../decisions/adr-0012-an-engine-is-a-scheduler-not-a-record.md) expressed as RBAC rather
    than as a prompt. Measured latency on this estate: 20–29 s per question.
    
    ## The triage loop
    
    Every five minutes a CronJob in `kagent` reads Alertmanager, and asks the `triage` agent about each firing
    alert (excluding `Watchdog`, which is the permanent test alert). The answer goes to the Telegram chat the alert
    arrived in, prefixed `[triage]`, and into the Job log. The agent holds four tools — list, describe, events, pod
    logs — so it can read and cannot act.
    
    Measured 2026-11-15: 20–30 s per question, and its first live diagnosis was **wrong** (see below), which is why
    the eval corpus exists.
    
    ## Stopping it
    
    The loop is one CronJob, so the switch is one field:
    
    ```bash
    kubectl -n kagent patch cronjob triage -p '{"spec":{"suspend":true}}'    # emergency
    ```
    
    That is a hand-edit on a declared object, which this estate does not allow to stand: a patch is an incident
    response, and the PR that makes it permanent goes in the same breath
    ([ADR 0003](../decisions/adr-0003-tunnel-unit-has-no-endpoint.md) is what that cost once). The declarative equivalent is
    `spec.suspend: true` in `manifests/base/kagent/triage-cronjob.yaml`.
    
    Nothing else in the cluster depends on kagent. Deleting the three Applications removes the controller, the
    agent and the CronJob; the CRDs go with the chart, and the `kagent` namespace stays, empty, by
    [ADR 0002](../decisions/adr-0002-never-delete-stateful-objects.md).
    
    ## What is known to be imperfect
    
    Every caveat in this stack — the wildcard role, the 0.7.9 pin, the printed-not-stored traces, the one-alert-per-run
    loop, the guards that GitHub cannot enforce — is listed with its evidence and the thing that would close it in
    [the 2026-11-15 record](../records/2026-11-15-agentic-stack-caveats.md). Read it before assuming a limit is a
    temporary mess rather than a decision.
    
    ## What no agent does
    
    - **Merge.** Every change goes through a pull request reviewed by a human. `bakuran-gitops` should
      have branch protection on `main` for this to be structural rather than a habit; as of 2026-11-15 it
      does not.
    - **Delete stateful objects.** A PVC, PV or Namespace cannot be deleted at admission
      ([ADR 0002](../decisions/adr-0002-never-delete-stateful-objects.md)), by anyone, for any reason short
      of runbook 17.
    - **Decide that an alert needs no diagnosis.** That is written down in `runbooks/waivers.yaml`, so
      adding an alert forces the question in the pull request rather than during the incident.
    
    ## If an agent's answer looks wrong
    
    Its answers are not measurements. On 2026-11-15 the triage agent read `egress-node=true` on one node and a probe
    pinned to another, concluded the egress policy "can never match", and proposed relabelling nodes. The probe
    egresses as `84.20.16.49`; Cilium tunnels a selected pod's traffic to the gateway node, so the pod being
    elsewhere is the supported case. A confident wrong diagnosis is the normal failure mode of a language model
    with read access, and the countermeasure is a measurement, not more prompt.
    
    It probably is. The evidence to check it lives here: `docs/records/incidents/` for what actually
    happened before, `runbooks/actions/*.yaml` for the diagnoses already known, and `evals/` for whether the
    agent reaches the same conclusion from the same symptoms (5 cases, `run-evals`).
  docs_reference_runbook-actions.md: |
    ---
    type: reference
    audience: agent
    owns: the alert lifecycle's current shape — where each fact lives, the three entry points, and how to add an action
    ---
    
    # Runbook actions — one action, one procedure, one pane
    
    Something is firing. This page is the map from the alert to the thing that diagnoses it. The decision behind the layout is
    [ADR 0018](../decisions/adr-0018-the-alert-lifecycle-has-two-folders.md); the safety model for running a procedure is
    [conditions.md](conditions.md).
    
    ## Where each fact lives (one owner each)
    
    | fact | file | who writes it |
    |---|---|---|
    | what fires | `bakuran-gitops/manifests/base/monitoring/rules/*.yaml` | hand, per concern |
    | what to do | `bakuran-gitops/manifests/base/runbooks/actions/<id>.yaml`  | hand |
    | which alert has which procedure | `runbooks/index.yaml` | **generated** |
    | the prose a human reads | `bismigel-site/org/runbook/*.org`, addressed by page + anchor | hand |
    | what the cluster runs | `runbooks/templates/diag.yaml` (evidence) and `templates/action.yaml` (a procedure) | **generated** |
    | who the workflows are | `runbooks/rbac.yaml` | derived from the actions' `commands` (story R.9) |
    
    The alert lifecycle lives in `bakuran-gitops`, so a rule and its procedure land in **one pull request** — the property
    Google's SRE Workbook names as the only defence against playbooks rotting: they go out of date at the same rate as the
    environment.
    
    ## The three entry points, one key
    
    ```
    ops-run <id>              workstation / agent. detect + diagnose. read-only and always safe.
    ops-run <id> --remedy     the fix, when the action declares one and the blast radius allows it
    ops-diag <AlertName>      resolves alert -> action through the index, runs it in-cluster, prints the verdict
    argo.bismigel.dev         the same thing, clickable. Argo's UI is the pane; there is no second one
    an agent                  `k8s_create_resource` through the kagent tool server: one verb, one kind, one namespace
    ```
    
    An alert name is the key a human has (it is what the page says), a condition id is the key the procedure has. `ops-diag`
    and `runbook-index` exist to translate between them, so nobody has to remember both.
    
    `ops-diag` gives one of three answers, and says which one it gave (2026-11-18):
    
    | the alert | what happens |
    |---|---|
    | has an action, `where=cluster` | the `action` template runs in a pod, and its verdict is printed |
    | has an action, `where=workstation` | nothing is submitted: it prints `ops-run <id>`, because the procedure needs the host |
    | is waived (`action=-`) | nothing is submitted: it prints the alert's runbook **anchor**, which is the diagnosis |
    
    The third row is why the pane is not a stub for 59 of 72 alerts. The generic evidence sweep is still there for the
    operator who wants it, but as `--evidence`: on 2026-11-18, `ops-diag CloudflareTunnelDown` was spending ten seconds
    listing pods in `monitoring` to print "No resources found" — a correct answer to a question nobody asked, in the shape of
    a diagnosis.
    
    ## Adding an action
    
    1. Copy the closest file in `runbooks/actions/`.
    2. `diagnose` first: the command that decides this, and the sentence that says how to read its answer. If you cannot write
       that sentence, the diagnosis is not finished.
    3. Only then a `remedy`, with `why_safe` in one sentence a reviewer can argue with.
    4. `measured: <date>` — when the diagnosis was last proved. A procedure without a date is a guess wearing a filename.
    5. Delete the alert's name from its group in `waivers.yaml`, and add it to the action's `alerts:`.
    6. Regenerate the index and templates; `check-conditions`, `check-alert-coverage` and `check-runbook-links` must pass.
    
    The four authoring rules (diagnose first and always safe, remedy opt-in and classified, idempotent, no timers) are in
    `conditions.md`; they are not repeated here because a rule stated twice is a rule that will disagree with itself.
    
    ## An agent may start one, and nothing else
    
    Story 7.7. The fourth entry point is a tool call, and it is the narrowest of the four on purpose:
    
    | layer | file | what it grants |
    |---|---|---|
    | the tool grant | `bakuran-gitops/manifests/base/kagent/agent-diagnose.yaml` | that agent holds two tools: read the index, create a Workflow |
    | RBAC | `bakuran-gitops/manifests/base/kagent/runbook-submitter-rbac.yaml` | `create` on `workflows.argoproj.io` in `argo`. No `get`, no other group, no other namespace |
    | admission | `bakuran-gitops/manifests/base/kagent/guard-tools-vap.yaml` | the tool server may CREATE a Workflow in `argo`, and may not UPDATE or DELETE anything, anywhere |
    
    Three layers because each is a different kind of statement. A tool grant is a suggestion to a model; RBAC is what the
    API server checks; admission is what holds even when the first two are wrong. That third layer is also what stops the
    chart's wildcard `kagent-tools-cluster-admin-role` binding from mattering while story 10.14 removes it: measured
    2026-11-18 over the tool server's three-day life, its calls were `get` 1034, `describe` 326, `logs` 116, and no write.
    
    The refusal is the point. 59 of 72 alerts have no action, so the agent reads `runbook-index` first and, on `action=-`,
    answers with the runbook anchor and submits nothing. An agent that invented an action id for a waived alert would be
    worse than one that said "read the paragraph".
    
    ## What the pane is not
    
    - **It is not an engine that remedies by itself.** ADR 0012: an engine may schedule and notify, never own the remedy.
    - **It is not 72 workflow objects.** Measured 2026-11-16: 72 templates carried 3 distinct step bodies, and the ArgoCD
      application controller had been OOM-killed 25 times partly for it. Two templates and a data row replaced them.
    - **It is not the prose.** The runbook page explains and warns; the action file runs. When they disagree, the anchor is
      the only link anyone checks.
    
    ## Where the answer runs — `where`, and the decision behind it
    
    Every row carries `where=cluster` or `where=workstation`, and `check-alert-coverage` refuses a waiver group without one.
    Measured 2026-11-18: **37 cluster, 22 workstation, 0 unstated**. The distinction is not cosmetic — it is what stops the
    pane answering a router alert with a pod list.
    
    The question the estate had to settle deliberately: an in-cluster runner that reaches the hosts over ssh, or a sentence
    saying where to run it? **The sentence.** A host-side runner would put ssh keys to three hosts inside a ServiceAccount
    that a model can reach — the exact boundary stories 7.7 and 10.14 exist to narrow — and it cannot be rehearsed in
    staging, which is `bakuran-infra/staging/`'s whole job and which is unavailable today (`plan/backlog/staging-host-unavailable.md`).
    The cost is stated rather than hidden: for 22 of 72 alerts an agent can name the diagnosis and cannot complete it.
    
    Seven of the nine **critical** alerts that are waived run on the workstation, and two do not — so this is a
    classification, not a rule of thumb:
    
    | critical | where | why |
    |---|---|---|
    | `CloudflareTunnelDown`, `CloudflareZoneNotActive` | workstation | the Cloudflare API and its token proxy are on the workstation; the cluster sees only its own connector pods |
    | `RouterHeartbeatStale`, `RouterResolverDown`, `WanUnreachable`, `NetworkDeviceUnreachable` | workstation | OPNsense and the switch; `network.md` §9's checks are read-only and run from here |
    | `MediaPoolCritical` | workstation | `ops/mounts` reads the mount over ssh; a pod sees the NFS client, not the pool |
    | `ArgoCDRedisHAPodNotReady`, `LonghornDiskSchedulingOverCommitted` | cluster | the object and the answer are both Kubernetes: `kubectl describe`, `longhorn-air` |
    
    ## Current coverage — the honest number
    
    `ops-diag --list` prints the index. As of 2026-11-18: **72 alerts, 13 with a procedure, 59 waived**, and every one of the
    72 answers something — a verdict, a workstation command, or an anchor. The five pages the alerts point at hold 88
    per-alert headings and 123 runnable command blocks, so the coverage work left is transcription and review, not research.
    
    The count is now enforced in both directions rather than inferred: `check-alert-coverage` fails on an alert with no
    decision, on a waiver with no `where`, and on a waiver for an alert that already has a condition (eleven of those were
    left behind by the first actions, answering one question twice).
    
    A waiver that says `runbook 25` sends the reader to a 220-line page; a waiver that says
    `runbook=…#argocdappoutofsync` sends them to the paragraph. Every row names an anchor now — `grep -c 'runbook=[^#]*$'
    manifests/base/runbooks/index.yaml` returns 0 in `bakuran-gitops` (2026-11-18).
  docs_guides_cluster.md: |
    ---
    type: guide
    audience: operator
    owns: how to change the cluster: deploy, drift, ArgoCD, GHCR, the media and books stacks
    ---
    
    ## Check cluster status
    
    ```bash
    ssh -i ~/.ssh/id_ed25519 root@192.168.10.82 'k3s kubectl -n argocd get applications; k3s kubectl -n apps get pods'
    ssh -i ~/.ssh/id_ed25519 root@192.168.10.81 'k3s kubectl get pods -A'
    ```
    
    ## Deploy a NEW app
    
    ```bash
    # 1. Create from template (public if the image can be public)
    gh repo create bismigel/<app> --private --template bismigel/homelab-app-template
    gh repo clone bismigel/<app> && cd <app>
    
    # 2. Rename placeholders
    ./scripts/init.sh <app> <app>.ciceley.cc <port> apps bismigel
    
    # 3. Put your app in app/ + Dockerfile, then push
    git add -A && git commit -m "init <app>" && git push     # CI builds → GHCR
    
    # 4. Register with ArgoCD (add a file to the gitops repo)
    #    clusters/prod/apps/{platform,workloads}/<app>.yaml   (one file per Application)
    ```
    
    - **Public** package → nothing else needed (the `imagePullSecrets` is ignored).
    - **Private** package → ensure the shared `ghcr-secret` works (below) and that
      ArgoCD can read the repo (add a deploy key + repo secret; keys are unique per
      repo).
    
    ## Deploy an EXISTING app (code change)
    
    Just push to `main`. CI builds the image, bumps the tag in `deploy/k8s/deployment.yaml`,
    and ArgoCD syncs.
    
    ## Repos / drift discipline
    
    - **PR only.** Private repos on GitHub Free can't enable branch protection, so
      nix-station uses a global `pre-push` hook (`~/.config/git/hooks/pre-push`)
      that rejects direct pushes to `main`/`master`. Merge on GitHub.
    - ArgoCD apps are **auto-sync + selfHeal + prune**; `ArgoCDAppOutOfSync` /
      `ArgoCDAppUnhealthy` fire after 15 min (Prometheus scrapes the controller
      endpoints, the leader exposes `argocd_app_info`).
    - Hosts change **only** via `deploy-rs` from `bakuran-infra`.
    
    ## ArgoCD
    
    ```bash
    ssh ... .82 'k3s kubectl -n argocd get applications'
    # force refresh / sync
    ssh ... .82 'k3s kubectl -n argocd annotate application <name> argocd.argoproj.io/refresh=hard --overwrite'
    ssh ... .82 'k3s kubectl -n argocd patch application <name> --type merge -p "{\"operation\":{\"sync\":{\"revision\":\"main\"}}}"'
    ```
    
    ## GHCR pull secret (private packages)
    
    Now an **ExternalSecret** from Bitwarden (no Sealed Secrets):
    `bakuran-gitops/manifests/external-secrets/ghcr-secret.yaml`. To rotate, update
    `ghcr-user`/`ghcr-token` in Bitwarden → ESO re-syncs the `ghcr-secret` in `apps`.
    
    ## Media stack (.81): GitOps
    
    Managed by the `media` ArgoCD app
    (`bakuran-gitops/clusters/prod/apps/workloads/media.yaml` → `manifests/overlays/prod/media/`),
    deployed to the `calamansi-intel` cluster. Wiring (root folders, download
    clients, Prowlarr → Sonarr/Radarr):
    
    ```bash
    QBT_PASSWORD='<qbt webui password>' ~/projects/bakuran-infra/scripts/media-stack-setup.sh
    ```
    
    Media host paths on `.81`: `/mnt/media/{tv,movies,downloads,temp}` (hostPath
    mounts; the *arrs see them as `/tv`, `/movies`, `/downloads`).
    
    ## Books stack (.81): after a rebuild
    
    ArgoCD app `books` (`manifests/base/books/` + `overlays/prod/books/`) brings up Kavita + LazyLibrarian. Their
    settings live in PVCs (and are in the R2 `appdata/` backup); if the PVCs are
    lost, re-run on `nix-station`:
    
    ```bash
    # one command (idempotent): media-setup (if missing) -> Kavita admin/library ->
    # ciceley -> LazyLibrarian (SABnzbd, NZBGeek, API key, Wanted defaults, download dir)
    BWS_ACCESS_TOKEN=... ~/projects/bakuran-infra/scripts/books-bootstrap.sh
    ```
    
    Kavita account management: `kavita-user.sh list|lock|unlock|register <name>`
    (lock removes the Login role; the user keeps existing sessions until their token
    expires). `lazylibrarian-ui-setup.sh` also enables the LazyLibrarian API for
    media-mcp; its key is BWS `lazylibrarian-api-key` and must be **32 characters**.
    
    `lazylibrarian-ui-setup.sh` runs a throwaway Playwright Job (npm installs in the
    pod, reads keys from the `media-setup` Secret, deletes itself, restarts the app).
    LazyLibrarian has no config API and drops externally-seeded `config.ini` sections,
    so the UI is the only durable path, do not hand-edit the file.
    
    ## Monitoring / dashboards
    
    Prometheus and Alertmanager are GitOps-managed. Prometheus **reloads itself**
    when `prometheus-config` or `prometheus-rules` changes (`--web.enable-lifecycle`
    plus a checksum reloader sidecar), so rule edits need no manual restart.
    Grafana provisions the five `grafana-dashboard-*.yaml` ConfigMaps; the file
    provider polls every 30s but only applies a change when the dashboard `version`
    increases, **bump it in the same commit**. Kube-state-metrics uses a dedicated
    least-privilege SA (no secret/configmap reads).
    
    ## Hermes agent
    
    Deployed by the `duwende` ArgoCD app (`manifests/duwende/hermes.yaml`; the
    namespace/app name is historical).
    
    ```bash
    POD=$(ssh ... .82 'k3s kubectl -n duwende get pod -l app=hermes -o jsonpath="{.items[0].metadata.name}"')
    ssh ... .82 "k3s kubectl -n duwende exec $POD -c hermes -- hermes status"
    ssh ... .82 "k3s kubectl -n duwende exec $POD -c hermes -- hermes cron list"
    ssh ... .82 'k3s kubectl -n duwende rollout restart deployment/hermes'
    ```
    
    - Dashboard `agent.bismigel.dev` (Cloudflare Access + basic auth `admin`;
      password in BWS `hermes-dashboard-password`). API server is disabled.
    - Telegram: same bot; allowlist `TELEGRAM_ALLOWED_USERS=607008268`.
    - Model: DeepSeek `deepseek-chat` (custom OpenAI-compatible provider); MCP
      servers: kubernetes, media, prometheus, github.
    - Cloudflare stays read-only through the nginx sidecar (`127.0.0.1:8788`).
    - Role: SRE in the small sense. It reports and triages, proposes pull requests,
      and does not apply cluster changes.
    - Data on the `hermes-data` PVC (`/opt/data`); `hermes-config` seeds config/SOUL,
      `homelab-context` seeds the docs, `hermes-cron-seed` seeds the daily job.
  docs_guides_hosts.md: |
    ---
    type: guide
    audience: operator
    owns: how to change a host or the router: NixOS, secrets, reinstall, WireGuard, OpenTofu
    ---
    
    ## NixOS host changes
    
    ```bash
    cd ~/projects/bakuran-infra
    # edit hosts/<host>/... then:
    ./scripts/preflight-wg.sh                    # MANDATORY if the deploy touches .81
    nix flake check --no-build                   # invariant assertions (seed, override, migration inert)
    nix run github:serokell/deploy-rs -- .#sitaw-amd        # or .#calamansi-intel
    # validate first:  nix eval .#nixosConfigurations.sitaw-amd.config.system.build.toplevel.drvPath
    ```
    
    `preflight-wg.sh` exits non-zero when the deploy would restart
    `wg-quick-proton0` — the operation that has stranded `.81` seven times. If it
    fails, the change belongs in `bakuran.wireguard` (the reconciler), not in the
    wg-quick block.
    
    ## Host secrets (sops-nix)
    
    ```bash
    cd ~/projects/bakuran-infra
    sops secrets/homelab.yaml                       # edit (re-encrypts on save)
    nix run github:serokell/deploy-rs -- .#sitaw-amd    # apply
    ```
    
    Decrypted secrets land in `/run/secrets/`; e.g. cloudflared credentials are a
    symlink at `/root/.cloudflared/<tunnel-id>.json`. Age identity = the host's SSH
    host key. See KNOWN-ISSUES for the reinstall caveat.
    
    ## Reinstall / new host (DESTRUCTIVE: wipes disk)
    
    ```bash
    cd ~/projects/bakuran-infra
    # add hosts/<name>/{default.nix,disko.nix} + register in flake.nix + deploy.nodes
    git add -A     # flakes only see tracked files
    nix run github:nix-community/nixos-anywhere -- --flake .#<name> --target-host root@<ip>
    ```
    
    ## Network / WireGuard on the media node (.81)
    
    **Read `docs/reference/network.md` first — it is the authoritative network reference.**
    
    `.81` has no direct internet: everything goes through the Proton WireGuard full
    tunnel (`proton0`). Two hard rules:
    
    1. **Never run `systemctl restart wg-quick-proton0`.** A restart deletes and
       recreates the interface and strands the node (7 outages on 2026-10-25).
    2. **Never change the `wg-quick-proton0` unit in a deploy.** Verify afterwards:
       `systemctl show wg-quick-proton0 -p NRestarts -p ActiveEnterTimestamp` —
       `NRestarts` must stay `0` and the timestamp must not move.
    
    Restore egress in place (~30 s, no restart):
    
    ```bash
    ssh root@192.168.10.81 'KEYFILE=/root/wg.key EXPECT_FP=1795227bcb589e43 /root/wg-restore.sh'
    ```
    
    After a reboot it heals itself: the reconciler runs at +90 s and every 60 s.
    
    ```bash
    journalctl -u wireguard-reconcile -n 5    # want: ok (handshake Ns, data path HTTP 301)
    ```
    
    Full procedure: bismigel-site runbook page 14; `docs/reference/network.md` §4, §7, §9.
    
    ## Router / OPNsense change (declarative, not clicked)
    
    Full procedure: **bismigel-site runbook page 22**. The loop, in short:
    
    ```bash
    cd bakuran-infra/opentofu/opnsense
    export BWS_ACCESS_TOKEN="$(cat ~/.config/bws/access-token)"
    export OPNSENSE_KEY_ID=… OPNSENSE_SECRET_ID=…   # the BWS secret ids, listed in the root's README
    . ./env.sh       # API key + secret AND the R2 state credential, all from Bitwarden (bakuran-infra #72)
    
    nix run nixpkgs#opentofu -- init          # S3 backend -> R2, bucket homelab-backups
    nix run nixpkgs#opentofu -- plan          # READ IT
    nix run nixpkgs#opentofu -- apply
    nix run nixpkgs#opentofu -- plan          # must be "No changes"
    ```
    
    Two traps that make a green apply a lie — **check both every time**:
    
    1. **`dns_servers` is a `Set`**, so order is lost. `["192.168.10.1","1.1.1.1"]` applies as
       `1.1.1.1,192.168.10.1` and Kea sends them in that order — clients try the tunnelled
       resolver first and the change achieves nothing.
    2. **`auto_collect` must be `false`**, or `routers`/`dns_servers`/`ntp_servers` are ignored
       while the apply reports success.
    
    Read the router back instead of trusting the exit code:
    `curl -sk -u "$KEY:$SECRET" https://192.168.10.1/api/kea/dhcpv4/searchSubnet | jq -r '.rows[0].option_data'`
    
    **Take a config export before any DHCP change:** `/api/core/backup/download/this` →
    `~/router-stage/` (0600). It holds the WebGUI TLS key and the root password hash, so it is
    never committed — the repo's `.gitignore` refuses `*.xml`.
    
    Still clicked as of 2026-11-01: **26 firewall rules and 7 aliases**. Import them the same way.
  docs_guides_backups.md: |
    ---
    type: guide
    audience: operator
    owns: how to run and verify a backup, and what restore looks like
    ---
    
    ## Backups / DR
    
    Daily: credentials (`.81`/`.82`) and appdata (`.82`) → R2, age-encrypted.
    Retention: `appdata/` **14 days**, `credentials/` and `nixstation/` **90 days**
    (R2 lifecycle, enforced by `bakuran-infra/opentofu/cloudflare/r2.tf`.)
    
    Alerts (Telegram via Alertmanager):
    - a dump/credential is missing → unit aborts before upload → `BackupFailed`
    - daily 12:00: newest object >36 h → `BackupStale`
    - weekly Sun 04:30: decrypt + tar + SQLite `integrity_check` (Kavita/LL) +
      `gzip -t` the Immich dump → `BackupVerifyFailed`
    - external dead-man's switch on **nix-station** (15 min, via
      `status.bismigel.dev`): 3 failures → Telegram (`~/.config/homelab-deadman.env`)
    
    ```bash
    # back up now
    ssh ... .81 'systemctl start homelab-backup'          # credentials
    ssh ... .82 'systemctl start homelab-backup-apps'     # appdata
    ssh ... .82 'systemctl start homelab-backup-verify'   # prove it restores
    # restore: age -d -i <age identity> <file> | tar xz
    ```
    
    The age identity is at `/root/.config/homelab-backup.agekey` on `.82` (from BWS
    `backup-age-key`) and `~/.homelab-backup.agekey` on nix-station.
    Full rebuild: `bakuran-infra/docs/REBUILD.md` (+ `scripts/bootstrap-argocd.sh`).
  docs_guides_cloudflare.md: |
    ---
    type: guide
    audience: operator
    owns: how to add a hostname to the tunnel, and how Access and auto-login are wired
    ---
    
    ## Cloudflare tunnel (add a hostname)
    
    1. Add a rule to the **remote** tunnel config (API `PUT .../configurations`) →
       `http://127.0.0.1:32080` (NodePorts are loopback-only since the edge lock).
    2. Create a proxied `CNAME` → `8dcc83bd-eb95-4c0d-8f71-b92a27d37649.cfargotunnel.com`.
    3. Ensure the app's `Ingress` has that `host`.
    
    > The tunnel is **remotely-managed**; the on-host `/etc/cloudflared/config.yml`
    > (old Proxmox box) is gone. NixOS `services.cloudflared` supplies credentials;
    > routing comes from the remote config.
    
    ## Cloudflare Access / auto-login
    
    - Sensitive hostnames (`grafana`/`jellyfin`/`status`/`private`/`agent` `.bismigel.dev`)
      are gated by Access; policies managed via the CF API (`access/apps`).
    - Grafana does **per-user** auto-login via the `Cf-Access-Authenticated-User-Email`
      header (`GF_AUTH_PROXY_*`); the \*arrs are login-free on the LAN (`Forms` +
      `DisabledForLocalAddresses`).
  docs_guides_media-troubleshooting.md: |
    ---
    type: guide
    audience: operator
    owns: when the media or books stack stops fetching: the diagnoses that took longest
    ---
    
    ## LazyLibrarian is not downloading (books never get snatched)
    
    Triage in this order — the 2026-10-24 outage was #2 followed by #3, and looked
    like "nothing happens" because LL fails at *search*, long before a download.
    
    **1. Is there demand, and does anything get snatched?**
    
    ```bash
    POD=$(ssh ... .81 'k3s kubectl -n books get pod -l app=lazylibrarian -o jsonpath="{.items[0].metadata.name}"')
    ssh ... .81 "k3s kubectl -n books exec $POD -c lazylibrarian -- python3 -c \
      \"import sqlite3;d=sqlite3.connect('/config/lazylibrarian.db');print(d.execute('select Status,count(*) from books group by Status').fetchall())\""
    ```
    
    `Wanted` high + `Snatched` 0 = search problem, keep going. `Snatched` > 0 but
    nothing on disk = go to #6 (SAB/import).
    
    **2. Does LL search through Prowlarr, not straight at NZBGeek?**
    
    NZBGeek sits behind Cloudflare, which answers LL's `python-requests` calls with
    `HTTP 403` / `error code: 1010`. From the pod, direct searches look like this:
    
    ```
    book 7020 -> HTTPError HTTP Error 403: Forbidden      # body: error code: 1010
    same URL with a browser User-Agent -> 200             # so it is the signature, not the key
    ```
    
    LL has no User-Agent setting, so it must go through Prowlarr (`/2/api` = NZBgeek):
    
    ```bash
    ssh ... .81 "k3s kubectl -n books exec $POD -c lazylibrarian -- \
      sed -n '/^\[Newznab/,/^\[/p' /config/config.ini"
    # want: host = http://prowlarr.media.svc.cluster.local:9696/2
    #       api  = <prowlarr key>   bookcat = 7000,7020   enabled = 1
    ```
    
    **3. Is the Prowlarr key present and did the init container apply it?**
    
    The `provider-config` init container rewrites `[Newznab_*]` on every start from
    `books/lazylibrarian-secrets`, which is seeded out of band (no ESO in `media` or
    `books`) from BWS `prowlarr-api-key`:
    
    ```bash
    BWS_ACCESS_TOKEN=... ~/projects/bakuran-infra/scripts/lazylibrarian-secrets.sh
    ssh ... .81 'k3s kubectl -n books rollout restart deploy/lazylibrarian'
    ssh ... .81 'k3s kubectl -n books logs deploy/lazylibrarian -c provider-config --tail=5'
    # want: provider-config: [Newznab_0] updated: host, api, bookcat, ...
    ```
    
    `provider-config: no config.ini yet, nothing to do` on **every** start means the
    init container is looking at the wrong file (it read `lazylibrarian.ini` until
    2026-10-24; the app writes `/config/config.ini`) and the whole step is a no-op.
    
    **4. Can LL reach Prowlarr at all?** NetworkPolicy, not DNS:
    
    ```bash
    ssh ... .81 "k3s kubectl -n books exec $POD -c lazylibrarian -- python3 -c \
      'import urllib.request as u;print(u.urlopen(\"http://prowlarr.media.svc.cluster.local:9696/2/api?t=caps&apikey=<key>\",timeout=15).status)'"
    ```
    
    A timeout here is the `books` egress policy (`manifests/network-policies/policies.yaml`):
    books may only reach itself, DNS, `downloads:8080`, Prowlarr `9696`, and public
    80/443. 
    
    **5. Force a search now** (the `cron_search_book` job only fires periodically):
    
    ```bash
    # book id from the DB, then:
    ssh ... .81 "k3s kubectl -n books exec $POD -c lazylibrarian -- python3 -c \
      'import urllib.request as u;print(u.urlopen(\"http://127.0.0.1:5299/api?apikey=<lazylibrarian-api-key>&cmd=searchbook&id=94812&wait=1\",timeout=60).read())'"
    ssh ... .81 'k3s kubectl -n books logs deploy/lazylibrarian -c lazylibrarian --since=3m | grep -i search'
    # good: "Best match (100.0%) ... http://prowlarr...:9696/2" -> "sent to SAB successfully"
    ```
    
    **6. SAB / import.** Category `books`, `DOWNLOAD_DIR=/downloads/complete/books`
    (host `/mnt/media/complete/books`). Check the queue, then that LL flips the book
    `Wanted` -> `Snatched` -> `Open`. Only EPUB/PDF are scanned by Kavita; a MOBI-only
    release downloads but never imports.
    
    SAB has to fetch the NZB **twice removed** and both hops need egress, which is
    the most common way this looks "stuck at Grabbing 0%":
    
    1. LL gives SAB a URL on Prowlarr → needs `downloads -> media/prowlarr:9696`
       (`sabnzbd-egress` + `allow-ingress-prowlarr-indexer-clients`).
    2. Prowlarr answers **301** to `api.nzbgeek.info/api?t=get&id=...` and SAB
       follows it itself → needs the Cloudflare edge on 443. Symptom of a miss:
       `[Errno 101] Network unreachable` in SAB's log, retry every 120s.
    
    Sonarr/Radarr never hit this: they fetch the NZB in `media` (public egress) and
    POST the file to SAB. Only LazyLibrarian hands over a bare URL.
    
    **7. Imported to `/config`, not to the library.** Two tells in the LL log:
    ```
    WARNING: eBook dir ['/books'] not writeable, using /config: [Errno 28] No space left on device: '/books/ll_temp'
    ERROR: No ebook-convert found
    ```
    
    `No space left on device` on `/books` while `df` shows hundreds of GB free means
    **mergerfs**, not the disk: the library dirs are pinned to the local branch
    (`media-sda`, see `bakuran-infra/hosts/calamansi-intel/default.nix`
    `media-dirs`) and `category.create=epmfs` writes into the branch that already
    holds the path. When that branch drops below mergerfs' 4G `minfreespace`,
    creates fail with ENOSPC.
    
    ```bash
    ssh ... .81 'df -h /mnt/media-sda; du -sh /mnt/media-sda/*'   # 99% = the problem
    ssh ... .81 'df -h /mnt/media-nvme /mnt/remote82-sda'          # space elsewhere
    ```
    
    **Rebalancing a full branch** (safe, verified, no downtime — mergerfs merges
    reads, so the folder keeps serving while it moves):
    
    ```bash
    # 1. how full is each branch, and what is big
    for b in /mnt/media-sda /mnt/media-nvme /mnt/remote82-sda; do printf '%-20s ' $b; df -h $b | tail -1 | awk '{print $4" free"}'; done
    du -sh /mnt/media-sda/tv/* | sort -h | tail -5
    
    # 2. copy a folder to a branch with room (mkdir -p the parent first)
    mkdir -p /mnt/remote82-sda/tv
    nohup sh -c 'cp -a "/mnt/media-sda/tv/<show>" /mnt/remote82-sda/tv/ && echo COPIED' > /tmp/rebalance.log 2>&1 &
    
    # 3. verify EVERY file before deleting anything (spaces in names -> tab separator)
    S=/mnt/media-sda/tv/<show>; D=/mnt/remote82-sda/tv/<show>; bad=0
    while IFS=$'\t' read -r p s; do
      [ -f "$D/$p" ] && [ "$(stat -c%s "$D/$p")" = "$s" ] || { echo "MISMATCH $p"; bad=1; }
    done < <(cd "$S" && find . -type f -printf '%p\t%s\n')
    [ $bad -eq 0 ] && rm -rf "$S" && echo "moved"
    
    # 4. the pool still serves it, now from the other branch
    find /mnt/media/tv/<show> -name '*.mkv' | wc -l
    ```
    
    Rules that matter: never `rm` before the verify loop passes; moves to
    `remote82-*` are over NFS (slow, ~100 MB/s) while folders between local branches is
    fast; a *new* file can appear in the destination mid-copy (Sonarr importing) —
    that is fine, the verify loop only checks the source's file list.
    
    Last resort: lower `minfreespace` on the pool (buys a little, masks the real
    growth). The `[Errno 28]` failure is safe — the book stays on the `/config` PVC
    and can be moved by hand later.
    
    ## Audiobookshelf accounts (books ns, `.81`)
    
    Two accounts exist: **`gio`** (root/admin) and **`ciceley`** (user, no admin role).
    Passwords are random 28-char and live in BWS `audiobookshelf-gio` /
    `audiobookshelf-ciceley` (same item names in the Bitwarden vault). Both can log in
    at <https://audiobookshelf.bismigel.dev> (public hostname, ABS does its own auth).
    
    Four API facts that cost time to discover:
    
    1. **Bootstrap is `POST /init`**, not `/api/users`: `{"newRoot":{"username":"gio","password":"…"}}`.
       It only works while no root user exists (`/status` → `"isInit": false`).
    2. **Login is `POST /login`** (not `/api/login` — that path 401s with the same body,
       which looks like a wrong password). Response: `{"user":{…,"token":"…"}}`.
    3. **Users created through `POST /api/users` land `isActive: false`** — PATCH the
       user with `{"isActive":true}` or the login silently fails.
    4. **ABS caches users in memory.** Editing `pash` directly in
       `/config/absdatabase.sqlite` has no effect until the pod restarts. (Password
       resets go through the API or the UI; the DB is the last resort.)
    
    ```bash
    POD=$(ssh ... .81 'k3s kubectl -n books get pod -l app=audiobookshelf -o jsonpath="{.items[0].metadata.name}"')
    U=http://127.0.0.1:32080; H='Host: audiobookshelf.bismigel.dev'
    
    # first-run only
    ssh ... .81 "curl -s $H -X POST $U/init -H 'Content-Type: application/json' \
      --data '{\"newRoot\":{\"username\":\"gio\",\"password\":\"<pw>\"}}'"
    
    # admin token, then create users / library
    TOK=$(ssh ... .81 "curl -s $H -X POST $U/login -H 'Content-Type: application/json' \
      --data '{\"username\":\"gio\",\"password\":\"<pw>\"}'" | jq -r .user.token)
    ssh ... .81 "curl -s $H -X POST $U/api/users -H 'Authorization: Bearer $TOK' \
      -H 'Content-Type: application/json' --data '{\"username\":\"ciceley\",\"password\":\"<pw>\",\"type\":\"user\"}'"
    ssh ... .81 "curl -s $H -X PATCH $U/api/users/<id> -H 'Authorization: Bearer $TOK' \
      -H 'Content-Type: application/json' --data '{\"isActive\":true}'"
    ```
    
    Library: **Audiobooks**, media type *book*, folder `/audiobooks`
    (→ `/mnt/media/audiobooks`). Empty is normal — files appear after the next scan.
    
    Adding an account to the personal vault (needs an unlocked `bw`; the agent cannot
    unlock, and never writes a session to disk):
    
    ```bash
    export BW_SESSION=$(bw unlock --raw)
    for u in gio ciceley; do
      p=$(bws secret list -o json | jq -r --arg k "audiobookshelf-$u" '.[]|select(.key==$k).value')
      bw get template item | jq --arg u "audiobookshelf-$u" --arg p "$p" \
        '.type=1|.name=$u|.login.username=$u|.login.password=$p|.login.uris=[{"uri":"https://audiobookshelf.bismigel.dev"}]|del(.id,.organizationId,.folderId,.collectionIds)' \
        | bw encode | bw create item
     done
    bw lock
    ```
    
    Agents: Hermes has **reachability** to `books` (8080/5000/5299) for `/status` and
    `/ping`, but no app login — account changes are human-only.
