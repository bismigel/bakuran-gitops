    | `argocd.bismigel.dev` | .82 → argocd | **Access** (24h) |
    | `longhorn.bismigel.dev` | .82 → longhorn | **Access** (24h) |
    | `private.bismigel.dev` | .82 → private-api | **Access** (24h) |
    | `agent.bismigel.dev` | .82 → hermes:9119 | **Access** (24h) + Telegram |
    | `jellyfin.bismigel.dev` | ingress-nginx → jellyfin | **public** (own auth) |
    | `immich.bismigel.dev` | ingress-nginx → immich | **public** (own auth) |
    | `kavita` / `audiobookshelf`.bismigel.dev | ingress-nginx → books ns | **public** (own auth) |
    | `sonarr` / `radarr` / `prowlarr` / `bazarr`.bismigel.dev | ingress-nginx → media *arrs | **Access** (730h) |
    | `qbittorrent` / `sabnzbd`.bismigel.dev | ingress-nginx → download clients | **Access** (730h) |
    | `homepage` / `prometheus`.bismigel.dev | ingress-nginx → homepage / prometheus | **Access** (730h) |
    
    > All go through the single tunnel (connectors on `.81`/`.82`); hostnames are
    > proxied CNAMEs to the tunnel, routed to `127.0.0.1:32080`. NodePorts are
    > loopback-only, so the tunnel is the only way in for public hostnames.
    > **Access sessions:** admin-only apps **24h**; media/Homelab-Media **730h**.
    > **Jellyfin + Immich are intentionally NOT Access-gated** (native TV/phone clients
    > can't complete the email-OTP challenge), they rely on their own login. Same for
    > **Kavita and Audiobookshelf** (their mobile apps can't do the challenge). Jellyfin
    > has **no remote bitrate cap** (per-user `RemoteClientBitrateLimit = 0` since
    > 2026-11-28; `KnownProxies=127.0.0.1,10.42.0.0/16` unchanged) — see
    > [media.md gotcha 7](media.md#known-gotchas). **Jellyfin also has hostPort 8096** on
    > `.81` for LAN clients (`http://192.168.10.81:8096`).
    > The edge is declared in **`bakuran-infra/opentofu/cloudflare/`** (OpenTofu) and
    > applied with `tofu`; `cloudflare/sync.sh` is a retired, manual rollback path only.
    
    Zones: `bismigel.dev` `d7786ec1130918385079b8f224f271b5` · `ciceley.cc`
    `bfca3075a1f1d5d2836aca7f4558af0b` · `miguelarbis.dev` `0ee0ef4302ab23094e39aae78ca9492e`.
    
    ## Storage: pooled media (`/mnt/media`, 1.8 TB)
    
    The library lives on `.82`: `/mnt/media` is a single **btrfs** filesystem on the
    1.8 T `sdb`, with `/mnt/media-nvme` and `/mnt/media-sda` as separate branches.
    `.82` exports them to `.81` over **NFS4** and `.81` mounts them directly — there
    is **no union/mergerfs layer** (measured 2026-11-04: `findmnt` shows `nfs4` on
    `.81`, `btrfs /dev/sdb[/@media]` on `.82`, and `pgrep mergerfs` → 0 on both).
    `docs/reference/storage.md` is authoritative for every mount.
    
    | Host | Partition | Mount | Size |
    | --- | --- | --- | --- |
    | .82 | nvme0n1p3 | /mnt/media-nvme | ~346G |
    | .82 | sda1 | /mnt/media-sda | ~466G |
    | .81 | nvme0n1p3 | /mnt/media-nvme | ~137G |
    | .81 | sda1 | /mnt/media-sda | ~238G |
    | .81 | (union) | **/mnt/media** | **~1.2T** |
    
    Subdirs: `/mnt/media/{tv,movies,downloads,temp}` (created on the local branch,
    `/mnt/media-sda`, by the `media-dirs` systemd service).
    qBittorrent WebUI password = the standard homelab password (set via API).
    
    ## Container registry
    - `ghcr.io/bismigel/<app>`, `ghcr.io/ciceley/ciceleywebsite`.
    - Pull secret `apps/ghcr-secret`, now an **ExternalSecret** from Bitwarden.
    
    ## Backups
    - `r2:homelab-backups/credentials/`, daily, age-encrypted (host keys, kubeconfigs, BWS token).
    - `r2:homelab-backups/appdata/`, daily, age-encrypted (config PVCs: *arrs/Jellyfin/Grafana/Prometheus/Hermes).
    - **Immich (DB dump + photo library) is backed up** with the rest of appdata (since 2026-10-17).
    
