  homelab-media.md: |
    ---
    name: homelab-media
    description: "Manage the Bakuran media stack through media-mcp: libraries, requests, queues and books."
    version: 1.0.0
    metadata:
      hermes:
        tags: [homelab, media, sonarr, radarr, prowlarr, jellyfin, books]
    ---

    # Homelab media

    Use the `media` MCP tools for Sonarr, Radarr, Prowlarr, SABnzbd,
    qBittorrent, Jellyfin and LazyLibrarian. Prefer these tools over shell
    commands and never read or print API keys.

    ## Safety

    - Read the current library and queue before changing anything.
    - Ask before destructive actions, deletes, or mass changes.
    - Do not remove media files.
    - Confirm the exact title, year, season or author before adding.
    - If a tool fails, report the tool, HTTP error and the smallest next step.

    ## First checks

    1. `sonarr_series` and `radarr_movies` for library state.
    2. `sonarr_queue`, `radarr_queue`, `sabnzbd_queue`, `qbittorrent_torrents`.
    3. `prowlarr_indexers` if searches fail.
    4. `jellyfin_users` only when the request is about access.

    ## Add media

    - TV: `sonarr_lookup` -> confirm -> `sonarr_add_series` -> `sonarr_search`.
    - Movie: `radarr_lookup` -> confirm -> `radarr_add_movie` -> `radarr_search`.
    - A specific release: `sonarr_find_releases` or `prowlarr_search`, then
      `sonarr_grab_release` only after confirming the release.
    - Never add a duplicate. Search the library first.

    ## Books

    - `lazylibrarian_find_author` -> `lazylibrarian_add_author`.
    - Use `lazylibrarian_search_book`, `lazylibrarian_queue_book` and
      `lazylibrarian_unqueue_book` for individual books.
    - New authors default to Wanted; do not promise immediate downloads.

    ## Reporting

    Reply with the library, the action taken, the queue state and any blocker.
    Keep it short. Do not paste API responses or credentials.
  media-triage.md: |
    ---
    name: media-triage
    description: "Triage stuck downloads, failed imports and missing media in the Bakuran stack."
    version: 1.0.0
    metadata:
      hermes:
        tags: [homelab, media, troubleshooting, downloads]
    ---

    # Media triage

    Use this when something is stuck, missing, or failed to import.

    ## Order of checks

    1. `sonarr_queue` / `radarr_queue`: identify the item and error.
    2. `sabnzbd_queue` / `sabnzbd_history`: Usenet state.
    3. `qbittorrent_torrents`: torrent state, ratio and errors.
    4. `prowlarr_indexers`: failed indexer or authentication.
    5. `sonarr_series` / `radarr_movies`: confirm the item is monitored.
    6. `jellyfin_scan` only after the file is present.

    ## Common outcomes

    - Indexer failure: report the indexer and ask before changing it.
    - No release: run a targeted search and report the result.
    - Stuck import: report the path and error; do not delete files.
    - Disk or permission error: report the volume and the exact error.
    - Missing episode or movie: confirm monitoring, then trigger a search.

    ## Rules

    - No file deletion, no queue clearing, no mass retries.
    - Do not expose API keys, cookies or download credentials.
    - Ask before changing indexers, download clients, root folders or quality
      profiles.
  security-advisories.md: |
    ---
    name: security-advisories
    description: "Check security advisories for internet-facing homelab apps and pinned images."
    version: 1.0.0
    metadata:
      hermes:
        tags: [security, advisories, kavita, jellyfin, immich, karakeep]
    ---

    # Security advisories

    Review advisories for the public apps: Kavita, Jellyfin, Immich and Karakeep.
    Also review Cilium, ingress-nginx, k3s and Longhorn after upgrades.

    ## Sources

    - Kavita releases: https://github.com/Kareadita/Kavita/releases
    - Kavita advisories: https://github.com/Kareadita/Kavita/security/advisories
    - GitHub Advisory Database: https://github.com/advisories
    - OSV: https://osv.dev
    - Jellyfin: https://github.com/jellyfin/jellyfin/security/advisories
    - Immich: https://github.com/immich-app/immich/security/advisories
    - Karakeep: https://github.com/karakeep-app/karakeep/security/advisories

    ## Checks

    ```bash
    gh api /repos/Kareadita/Kavita/security-advisories
    gh api /repos/jellyfin/jellyfin/security/advisories
    gh api /repos/immich-app/immich/security/advisories
    gh api /repos/karakeep-app/karakeep/security/advisories
    ```

    Report only advisories that affect the running version. Include the affected
    package, fixed version, severity and the smallest safe action. Ask before
    changing an image or restarting an app.

    ## Rules

    - Do not publish vulnerability details before a fix is available.
    - Do not expose tokens, logs or user data.
    - A public app without Cloudflare Access relies on its own auth; a high-severity
      auth bypass or RCE is urgent.
