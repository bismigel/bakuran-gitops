# The metrics MCP server: the agent's read-only query path into the store.
#
# Named for its role, not for the first backend it queried (2026-11-21). The upstream image still reads
# `PROMETHEUS_URL` - that is its contract, not ours - but the object, the Service and the tool namespace the
# agent sees are `metrics`, so the next store swap changes one URL.
# Prometheus MCP server for the agent: historical metrics, PromQL and targets.
# Read-only by nature (Prometheus API); internal-only Service, no ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-mcp
  namespace: duwende
  labels: { app: metrics-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: metrics-mcp }
  template:
    metadata:
      labels: { app: metrics-mcp }
    spec:
      containers:
        - name: metrics-mcp
          image: ghcr.io/pab1it0/prometheus-mcp-server@sha256:3c3921301229618d0b00a46a06e3b0c25745b31855f16919cf7b4fa040d47ec6
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # VictoriaMetrics speaks the same API, so the tool keeps working and the URL moves with the store
            # (2026-11-21). Left pointing at Prometheus, every `prometheus_*` call - including the daily
            # report's "query Prometheus for firing alerts" - would have failed the day Prometheus stopped.
            - { name: PROMETHEUS_URL, value: "http://victoriametrics.monitoring.svc.cluster.local:8428" }
            - { name: PROMETHEUS_MCP_SERVER_TRANSPORT, value: "http" }
            - { name: PROMETHEUS_MCP_BIND_HOST, value: "0.0.0.0" }
            - { name: PROMETHEUS_MCP_BIND_PORT, value: "8080" }
            - { name: PROMETHEUS_MCP_STATELESS_HTTP, value: "true" }
            # Drop Prometheus UI links from results to keep agent context small.
            - { name: PROMETHEUS_DISABLE_LINKS, value: "true" }
            - { name: PROMETHEUS_REQUEST_TIMEOUT, value: "20" }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-mcp
  namespace: duwende
  labels: { app: metrics-mcp }
spec:
  selector: { app: metrics-mcp }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
