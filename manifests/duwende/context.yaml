    | 4. Golden path | done | 2026-10-18 | template ships policy and secure defaults |
    | 5. Trust-zone edge | done | 2026-10-19 | admin hostnames on 32081; public on 32080; HSTS on |
    | 6. Simplicity | pending | | ongoing |
    | 7. SRE follow-ups | in progress | 2026-10-18 | SLOs live; restore verification 29s; host rebuild pending |
    
    ## Cilium pilot
    
    Status: live on production (2026-10-19)
    
    Cilium 1.20.3 runs with kube-proxy and VXLAN encapsulation (`routingMode=tunnel`,
    `tunnelProtocol=vxlan`). Flannel is disabled. The NixOS
    firewall trusts `cni+` and sets `checkReversePath=false`. All nodes are Ready,
    Cilium health is 3/3, public sites and Jellyfin's LAN hostPort return 200.
    Longhorn and ArgoCD pods were recreated so they received Cilium IPs. Cilium is
    managed by ArgoCD in `bakuran-gitops`.
    
    The fix came from
    [nixos-k3s](https://github.com/niki-on-github/nixos-k3s), specifically
    `systems/x86_64-linux/supermicro-k3s/default.nix` and
    `kubernetes/core/networking/cilium/operator/helm-values.yaml`, corroborated by
    [nixos-homelab/networking](https://github.com/nixos-homelab/networking/tree/main/nix/modules/cilium).
    
    The earlier tunnel plus kube-proxy combination failed on kernel 6.12 and was
    rolled back. The uninstall left stale iptables and ip rules that broke etcd.
    Flannel was restored and the nodes were rebooted. No data was lost.
    
    ## Trust-zone edge
    
    Status: live (2026-10-19)
    
    Cloudflare routes public hostnames to loopback NodePort `32080` and Access-gated
    admin hostnames to `32081`. The tunnel and DNS are owned by
    `opentofu/cloudflare/` (`sync.sh` is a retired rollback path); HSTS is on (`max-age=15552000; includeSubDomains`, no
    preload). Admin hosts return Access 302 at the edge; public hosts return 200.
    Token rotation remains the one deferred Cloudflare task.
