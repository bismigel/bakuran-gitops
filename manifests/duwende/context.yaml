    # Homelab Context
    
    ## Why "Bakuran"
    
    Bakuran is Tagalog for the yard or enclosure behind a house, from *bakod*, a
    fence. It is the space where things get built, repaired, and occasionally taken
    apart to see how they work. This context describes that backyard lab: small,
    personal, and safe to break on purpose.
    
    > Operating context for the Bakuran homelab, kept in the **private**
    > `bismigel/homelab-context` repo so a future LLM/human has full context.
    >
    > **Secrets stay out of git.** `CREDENTIALS.md` is gitignored and lives only on
    > `nix-station` (the disaster-recovery copy is the age-encrypted credentials
    > backup in R2, see `RUNBOOK.md`). Everything else here is non-secret.
    >
    > Path: `~/projects/homelab-context/`
    > Last updated: 2026-10-24
    
    ## Read order for an LLM/agent
    
    1. **`SYSTEM.md`**, architecture, repos, automation flow (the "how it works").
    2. **`INVENTORY.md`**, hosts, IPs, ports, services, endpoints.
    3. **`CREDENTIALS.md`**, passwords, tokens, keys (local only, **not** in git).
    4. **`RUNBOOK.md`**, common tasks (deploy app, rebuild host, rotate secrets).
    5. **`KNOWN-ISSUES.md`**, what's broken / pending.
    6. **`NEXT-STEPS.md`**, prioritized roadmap of outstanding work.
    7. **`HARDENING.md`**, current security posture, what is applied/deferred, and ops commands.
    8. **Ops runbook (web):** <https://runbook.bismigel.dev/> — the sanitized, Access-gated
       procedures page (source: `bismigel-site/org/projects/runbook.org`; the public
       `bismigel.dev` host 404s it).
    
    ## One-paragraph summary
    
    Three NixOS hosts form **one k3s cluster** (embedded etcd, **3 members**):
    **`sitaw-amd`** (.82, AMD Ryzen) is the platform/control plane; **`calamansi-intel`**
    (.81, Intel i5 + QuickSync) runs the **media stack** (pinned there by `nodeSelector`
    for QSV + local `/mnt/media`); **`patola-thinkcentre`** (.80) is the 3rd control-plane/etcd member and hosts
    Immich. **`kamatis-mbp`** (.83) is the **staging host**, not a cluster member. A **single ArgoCD** Helm release runs in-cluster on `.82` (no external cluster anymore), plus ingress-nginx and
    cloudflared connectors on both `.81`/`.82` (edge HA). Infrastructure is split across
    repos: `bakuran-infra` (NixOS machines + DR), `bakuran-gitops` (ArgoCD desired
    state for the cluster), `homelab-app-template` (new apps), and per-app repos.
    Apps build images via GitHub Actions → GHCR → ArgoCD pulls and deploys. Secrets
    are **Bitwarden Secrets Manager + External Secrets Operator** (machine) and
    **SOPS/age** (host). The public edge is a Cloudflare Tunnel; Zero Trust Access gates the sensitive
    endpoints. Redis HA runs three Redis/sentinel pods and three HAProxy pods; the
    chart announce Services are made headless by a Helm post-renderer.
    
    ## Ground rules for agents
    
    - **Edit NixOS config only in `bakuran-infra`**; deploy with `deploy-rs`.
    - **Never hand-edit running k8s resources** that ArgoCD manages, change the
      manifests in the app repo or `bakuran-gitops`.
    - **Never commit secrets.** Machine secrets live in **Bitwarden** (synced by ESO);
      host secrets are SOPS-encrypted in `bakuran-infra/secrets/`. Sealed Secrets was
      removed.
    - **Everything is GitOps**, including the media stack
      (`bakuran-gitops/clusters/prod/apps/workloads/media.yaml` → `manifests/overlays/prod/media/`).
    - **Disaster recovery** = `bakuran-infra/docs/REBUILD.md` + the daily R2 backup
      (`scripts/backup-credentials.sh`).
    
    ## Where the truth lives
    
    Two doc trees, and they answer different questions:
    
    | Tree | Answers | Authority |
    |---|---|---|
    | `homelab-context/` (this repo) | *what is* — topology, addresses, roles, decisions, incidents | **authoritative for facts** |
    | `bakuran-infra/docs/` | *how to build it* — rebuild procedures, disko layouts, per-host steps | **authoritative for procedures** |
    
    When they disagree about a fact, this repo wins; when they disagree about a
    procedure, `bakuran-infra/docs/` wins because it is what actually gets executed
    during a rebuild. Fix the loser in the same PR as the change that invalidated it
    (`NETWORK.md` §11 is checked weekly by `docs-verify`).
    
    Current-state documents are `NETWORK.md`, `SYSTEM.md`, `INVENTORY.md`,
    `HIGH-AVAILABILITY.md`, `ROADMAP.md`, `RUNBOOK.md`, `MEDIA.md`, `HARDENING.md`.
    Dated records (`KNOWN-ISSUES.md`, `MIGRATION-LEARNINGS.md`,
    `PLATFORM-MIGRATION.md`) are history: do not edit past entries to match today.
