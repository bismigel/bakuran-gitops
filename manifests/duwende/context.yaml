    ## Audiobookshelf accounts (books ns, `.81`)
    
    Two accounts exist: **`gio`** (root/admin) and **`ciceley`** (user, no admin role).
    Passwords are random 28-char and live in BWS `audiobookshelf-gio` /
    `audiobookshelf-ciceley` (same item names in the Bitwarden vault). Both can log in
    at <https://audiobookshelf.bismigel.dev> (public hostname, ABS does its own auth).
    
    Four API facts that cost time to discover:
    
    1. **Bootstrap is `POST /init`**, not `/api/users`: `{"newRoot":{"username":"gio","password":"…"}}`.
       It only works while no root user exists (`/status` → `"isInit": false`).
    2. **Login is `POST /login`** (not `/api/login` — that path 401s with the same body,
       which looks like a wrong password). Response: `{"user":{…,"token":"…"}}`.
    3. **Users created through `POST /api/users` land `isActive: false`** — PATCH the
       user with `{"isActive":true}` or the login silently fails.
    4. **ABS caches users in memory.** Editing `pash` directly in
       `/config/absdatabase.sqlite` has no effect until the pod restarts. (Password
       resets go through the API or the UI; the DB is the last resort.)
    
    ```bash
    POD=$(ssh ... .81 'k3s kubectl -n books get pod -l app=audiobookshelf -o jsonpath="{.items[0].metadata.name}"')
    U=http://127.0.0.1:32080; H='Host: audiobookshelf.bismigel.dev'
    
    # first-run only
    ssh ... .81 "curl -s $H -X POST $U/init -H 'Content-Type: application/json' \
      --data '{\"newRoot\":{\"username\":\"gio\",\"password\":\"<pw>\"}}'"
    
    # admin token, then create users / library
    TOK=$(ssh ... .81 "curl -s $H -X POST $U/login -H 'Content-Type: application/json' \
      --data '{\"username\":\"gio\",\"password\":\"<pw>\"}'" | jq -r .user.token)
    ssh ... .81 "curl -s $H -X POST $U/api/users -H 'Authorization: Bearer $TOK' \
      -H 'Content-Type: application/json' --data '{\"username\":\"ciceley\",\"password\":\"<pw>\",\"type\":\"user\"}'"
    ssh ... .81 "curl -s $H -X PATCH $U/api/users/<id> -H 'Authorization: Bearer $TOK' \
      -H 'Content-Type: application/json' --data '{\"isActive\":true}'"
    ```
    
    Library: **Audiobooks**, media type *book*, folder `/audiobooks`
    (→ `/mnt/media/audiobooks`). Empty is normal — files appear after the next scan.
    
    Adding an account to the personal vault (needs an unlocked `bw`; the agent cannot
    unlock, and never writes a session to disk):
    
    ```bash
    export BW_SESSION=$(bw unlock --raw)
    for u in gio ciceley; do
      p=$(bws secret list -o json | jq -r --arg k "audiobookshelf-$u" '.[]|select(.key==$k).value')
      bw get template item | jq --arg u "audiobookshelf-$u" --arg p "$p" \
        '.type=1|.name=$u|.login.username=$u|.login.password=$p|.login.uris=[{"uri":"https://audiobookshelf.bismigel.dev"}]|del(.id,.organizationId,.folderId,.collectionIds)' \
        | bw encode | bw create item
     done
    bw lock
    ```
    
    Agents: Hermes has **reachability** to `books` (8080/5000/5299) for `/status` and
    `/ping`, but no app login — account changes are human-only.
    
    ## LazyLibrarian is not downloading (books never get snatched)
    
    Triage in this order — the 2026-10-24 outage was #2 followed by #3, and looked
    like "nothing happens" because LL fails at *search*, long before a download.
    
    **1. Is there demand, and does anything get snatched?**
    
    ```bash
    POD=$(ssh ... .81 'k3s kubectl -n books get pod -l app=lazylibrarian -o jsonpath="{.items[0].metadata.name}"')
    ssh ... .81 "k3s kubectl -n books exec $POD -c lazylibrarian -- python3 -c \
      \"import sqlite3;d=sqlite3.connect('/config/lazylibrarian.db');print(d.execute('select Status,count(*) from books group by Status').fetchall())\""
    ```
    
    `Wanted` high + `Snatched` 0 = search problem, keep going. `Snatched` > 0 but
    nothing on disk = go to #6 (SAB/import).
    
    **2. Does LL search through Prowlarr, not straight at NZBGeek?**
    
    NZBGeek sits behind Cloudflare, which answers LL's `python-requests` calls with
    `HTTP 403` / `error code: 1010`. From the pod, direct searches look like this:
    
    ```
    book 7020 -> HTTPError HTTP Error 403: Forbidden      # body: error code: 1010
    same URL with a browser User-Agent -> 200             # so it is the signature, not the key
    ```
    
    LL has no User-Agent setting, so it must go through Prowlarr (`/2/api` = NZBgeek):
    
    ```bash
    ssh ... .81 "k3s kubectl -n books exec $POD -c lazylibrarian -- \
      sed -n '/^\[Newznab/,/^\[/p' /config/config.ini"
    # want: host = http://prowlarr.media.svc.cluster.local:9696/2
    #       api  = <prowlarr key>   bookcat = 7000,7020   enabled = 1
    ```
    
    **3. Is the Prowlarr key present and did the init container apply it?**
    
    The `provider-config` init container rewrites `[Newznab_*]` on every start from
    `books/lazylibrarian-secrets`, which is seeded out of band (no ESO in `media` or
    `books`) from BWS `prowlarr-api-key`:
    
    ```bash
    BWS_ACCESS_TOKEN=... ~/projects/bakuran-infra/scripts/lazylibrarian-secrets.sh
    ssh ... .81 'k3s kubectl -n books rollout restart deploy/lazylibrarian'
    ssh ... .81 'k3s kubectl -n books logs deploy/lazylibrarian -c provider-config --tail=5'
    # want: provider-config: [Newznab_0] updated: host, api, bookcat, ...
    ```
    
    `provider-config: no config.ini yet, nothing to do` on **every** start means the
    init container is looking at the wrong file (it read `lazylibrarian.ini` until
    2026-10-24; the app writes `/config/config.ini`) and the whole step is a no-op.
    
    **4. Can LL reach Prowlarr at all?** NetworkPolicy, not DNS:
    
    ```bash
    ssh ... .81 "k3s kubectl -n books exec $POD -c lazylibrarian -- python3 -c \
      'import urllib.request as u;print(u.urlopen(\"http://prowlarr.media.svc.cluster.local:9696/2/api?t=caps&apikey=<key>\",timeout=15).status)'"
    ```
    
    A timeout here is the `books` egress policy (`manifests/network-policies/policies.yaml`):
    books may only reach itself, DNS, `downloads:8080`, Prowlarr `9696`, and public
    80/443. 
    
    **5. Force a search now** (the `cron_search_book` job only fires periodically):
    
    ```bash
    # book id from the DB, then:
    ssh ... .81 "k3s kubectl -n books exec $POD -c lazylibrarian -- python3 -c \
      'import urllib.request as u;print(u.urlopen(\"http://127.0.0.1:5299/api?apikey=<lazylibrarian-api-key>&cmd=searchbook&id=94812&wait=1\",timeout=60).read())'"
    ssh ... .81 'k3s kubectl -n books logs deploy/lazylibrarian -c lazylibrarian --since=3m | grep -i search'
    # good: "Best match (100.0%) ... http://prowlarr...:9696/2" -> "sent to SAB successfully"
    ```
    
    **6. SAB / import.** Category `books`, `DOWNLOAD_DIR=/downloads/complete/books`
    (host `/mnt/media/complete/books`). Check the queue, then that LL flips the book
    `Wanted` -> `Snatched` -> `Open`. Only EPUB/PDF are scanned by Kavita; a MOBI-only
    release downloads but never imports.
    
    SAB has to fetch the NZB **twice removed** and both hops need egress, which is
    the most common way this looks "stuck at Grabbing 0%":
    
    1. LL gives SAB a URL on Prowlarr → needs `downloads -> media/prowlarr:9696`
       (`sabnzbd-egress` + `allow-ingress-prowlarr-indexer-clients`).
    2. Prowlarr answers **301** to `api.nzbgeek.info/api?t=get&id=...` and SAB
       follows it itself → needs the Cloudflare edge on 443. Symptom of a miss:
       `[Errno 101] Network unreachable` in SAB's log, retry every 120s.
    
    Sonarr/Radarr never hit this: they fetch the NZB in `media` (public egress) and
    POST the file to SAB. Only LazyLibrarian hands over a bare URL.
    
    **7. Imported to `/config`, not to the library.** Two tells in the LL log:
    ```
    WARNING: eBook dir ['/books'] not writeable, using /config: [Errno 28] No space left on device: '/books/ll_temp'
    ERROR: No ebook-convert found
    ```
    
    `No space left on device` on `/books` while `df` shows hundreds of GB free means
    **mergerfs**, not the disk: the library dirs are pinned to the local branch
    (`media-sda`, see `bakuran-infra/hosts/calamansi-intel/default.nix`
    `media-dirs`) and `category.create=epmfs` writes into the branch that already
    holds the path. When that branch drops below mergerfs' 4G `minfreespace`,
    creates fail with ENOSPC.
    
    ```bash
    ssh ... .81 'df -h /mnt/media-sda; du -sh /mnt/media-sda/*'   # 99% = the problem
    ssh ... .81 'df -h /mnt/media-nvme /mnt/remote82-sda'          # space elsewhere
    ```
    
    **Rebalancing a full branch** (safe, verified, no downtime — mergerfs merges
    reads, so the folder keeps serving while it moves):
    
    ```bash
    # 1. how full is each branch, and what is big
    for b in /mnt/media-sda /mnt/media-nvme /mnt/remote82-sda; do printf '%-20s ' $b; df -h $b | tail -1 | awk '{print $4" free"}'; done
    du -sh /mnt/media-sda/tv/* | sort -h | tail -5
    
    # 2. copy a folder to a branch with room (mkdir -p the parent first)
    mkdir -p /mnt/remote82-sda/tv
    nohup sh -c 'cp -a "/mnt/media-sda/tv/<show>" /mnt/remote82-sda/tv/ && echo COPIED' > /tmp/rebalance.log 2>&1 &
    
    # 3. verify EVERY file before deleting anything (spaces in names -> tab separator)
    S=/mnt/media-sda/tv/<show>; D=/mnt/remote82-sda/tv/<show>; bad=0
    while IFS=$'\t' read -r p s; do
      [ -f "$D/$p" ] && [ "$(stat -c%s "$D/$p")" = "$s" ] || { echo "MISMATCH $p"; bad=1; }
    done < <(cd "$S" && find . -type f -printf '%p\t%s\n')
    [ $bad -eq 0 ] && rm -rf "$S" && echo "moved"
    
    # 4. the pool still serves it, now from the other branch
    find /mnt/media/tv/<show> -name '*.mkv' | wc -l
    ```
    
    Rules that matter: never `rm` before the verify loop passes; moves to
    `remote82-*` are over NFS (slow, ~100 MB/s) while folders between local branches is
    fast; a *new* file can appear in the destination mid-copy (Sonarr importing) —
    that is fine, the verify loop only checks the source's file list.
    
    Last resort: lower `minfreespace` on the pool (buys a little, masks the real
    growth). The `[Errno 28]` failure is safe — the book stays on the `/config` PVC
    and can be moved by hand later.
    
    ## Hermes agent
    
    Deployed by the `duwende` ArgoCD app (`manifests/duwende/hermes.yaml`; the
    namespace/app name is historical).
    
    ```bash
    POD=$(ssh ... .82 'k3s kubectl -n duwende get pod -l app=hermes -o jsonpath="{.items[0].metadata.name}"')
    ssh ... .82 "k3s kubectl -n duwende exec $POD -c hermes -- hermes status"
    ssh ... .82 "k3s kubectl -n duwende exec $POD -c hermes -- hermes cron list"
    ssh ... .82 'k3s kubectl -n duwende rollout restart deployment/hermes'
    ```
    
    - Dashboard `agent.bismigel.dev` (Cloudflare Access + basic auth `admin`;
      password in BWS `hermes-dashboard-password`). API server is disabled.
    - Telegram: same bot; allowlist `TELEGRAM_ALLOWED_USERS=607008268`.
    - Model: DeepSeek `deepseek-chat` (custom OpenAI-compatible provider); MCP
      servers: kubernetes, media, prometheus, github.
    - Cloudflare stays read-only through the nginx sidecar (`127.0.0.1:8788`).
    - Role: SRE in the small sense. It reports and triages, proposes pull requests,
      and does not apply cluster changes.
    - Data on the `hermes-data` PVC (`/opt/data`); `hermes-config` seeds config/SOUL,
      `homelab-context` seeds the docs, `hermes-cron-seed` seeds the daily job.
    
    ## Monitoring / dashboards
    
    Prometheus and Alertmanager are GitOps-managed. Prometheus **reloads itself**
    when `prometheus-config` or `prometheus-rules` changes (`--web.enable-lifecycle`
    plus a checksum reloader sidecar), so rule edits need no manual restart.
    Grafana provisions the five `grafana-dashboard-*.yaml` ConfigMaps; the file
    provider polls every 30s but only applies a change when the dashboard `version`
    increases, **bump it in the same commit**. Kube-state-metrics uses a dedicated
    least-privilege SA (no secret/configmap reads).
    
    ## Backups / DR
    
    Daily: credentials (`.81`/`.82`) and appdata (`.82`) → R2, age-encrypted.
    Retention: `appdata/` **14 days**, `credentials/` and `nixstation/` **90 days**
    (R2 lifecycle, enforced by `cloudflare/sync.sh`).
    
    Alerts (Telegram via Alertmanager):
    - a dump/credential is missing → unit aborts before upload → `BackupFailed`
    - daily 12:00: newest object >36 h → `BackupStale`
    - weekly Sun 04:30: decrypt + tar + SQLite `integrity_check` (Kavita/LL) +
      `gzip -t` the Immich dump → `BackupVerifyFailed`
    - external dead-man's switch on **nix-station** (15 min, via
      `status.bismigel.dev`): 3 failures → Telegram (`~/.config/homelab-deadman.env`)
    
    ```bash
    # back up now
    ssh ... .81 'systemctl start homelab-backup'          # credentials
    ssh ... .82 'systemctl start homelab-backup-apps'     # appdata
    ssh ... .82 'systemctl start homelab-backup-verify'   # prove it restores
    # restore: age -d -i <age identity> <file> | tar xz
    ```
    
    The age identity is at `/root/.config/homelab-backup.agekey` on `.82` (from BWS
    `backup-age-key`) and `~/.homelab-backup.agekey` on nix-station.
    Full rebuild: `bakuran-infra/docs/REBUILD.md` (+ `scripts/bootstrap-argocd.sh`).
    
    ## Cloudflare Access / auto-login
    
    - Sensitive hostnames (`grafana`/`jellyfin`/`status`/`private`/`agent` `.bismigel.dev`)
      are gated by Access; policies managed via the CF API (`access/apps`).
    - Grafana does **per-user** auto-login via the `Cf-Access-Authenticated-User-Email`
      header (`GF_AUTH_PROXY_*`); the \*arrs are login-free on the LAN (`Forms` +
      `DisabledForLocalAddresses`).
    
    ## Hermes access map (2026-10-13)
    
    Autonomy = **full**; operating rules (PR-only, token-conservative, ask before
    destructive) live in its workspace `AGENTS.md` + `/context/AGENTS.md`.
    
    | Capability | How | Notes |
    |---|---|---|
    | Cluster (both) | kubernetes MCP, multi-cluster kubeconfig | contexts `sitaw-amd` (.82) + `calamansi-intel` (.81) |
    | GitHub | `gh`/`git` (shell) + GitHub MCP (hosted remote) | PAT from Bitwarden; **open PRs only** |
    | Cloudflare | `curl http://127.0.0.1:8788/client/v4/...` | **read-only guardrail sidecar**; token isolated, writes 403 |
    | Docs | `/context/*.md` | CREDENTIALS.md excluded |
    | Models | DeepSeek primary, local qwen fallback | key in Bitwarden (`deepseek-api-key`) |
    
    **Gotcha:** never seed Bitwarden with a `PushSecret`, a leftover one clobbers the
    real value on a timer (this reverted the DeepSeek key + Telegram token once).
    
    ## 2026-10-17 additions
    
    ### Cloudflare edge (OpenTofu-managed)
    ```bash
    # source of truth: bakuran-infra/opentofu/cloudflare/ (records_all.tf, tunnel.tf,
    # access_apps.tf, zone_settings.tf, r2.tf). State lives in the R2 S3 backend.
    cd bakuran-infra/opentofu/cloudflare
    export TF_VAR_cloudflare_api_token="$(… BWS cloudflare-api-token …)"   # never to disk
    export AWS_ACCESS_KEY_ID=…  AWS_SECRET_ACCESS_KEY=…                  # BWS r2-access-key-id / r2-secret-access-key
    tofu init && tofu plan && tofu apply       # expect a small diff, and 0 to destroy
    ```
    Adding a hostname = a `cloudflare_dns_record` in `records_all.tf` **and** an
    ingress row in `tunnel.tf`. Then `dig @1.1.1.1 <host>` (answers in seconds) and
    check a neighbouring hostname to prove nothing else moved. A local cache can keep
    an NXDOMAIN for a few minutes — query the resolver directly, not `getent`.
    
    `cloudflare-sync.timer` is **retired** (it would fight the OpenTofu state).
    `cloudflare/sync.sh` is a manual **rollback** path only:
    ```bash
    ssh root@192.168.2.82 systemctl start cloudflare-sync.service   # rollback only
    ssh root@192.168.2.82 systemctl list-timers | grep cloudflare    # expect nothing
    ```
    
    ### Immich
    ```bash
    # accounts (admin from Bitwarden jellyfin-*):
    BWS_ACCESS_TOKEN=… ./scripts/immich-setup.sh
    kubectl -n immich get pods,pvc
    kubectl -n immich rollout restart deploy/immich-server   # pulls :latest
    # storage lives on .83: /mnt/data/immich/{library,postgres}
    ```
    
    ### Login watchers (monitoring)
    ```bash
    kubectl -n monitoring get cronjob access-login-watch jellyfin-login-watch immich-login-watch
    kubectl -n monitoring logs job/<watcher-job>
    ```
    
    ### Jellyfin remote cap + client IP
    ```bash
    KEY=$(bws secret list | jq -r '.[]|select(.key=="jellyfin-api-key")|.value')
    # per-user 12 Mbps cap:
    curl -s -H "Authorization: MediaBrowser Token=\"$KEY\"" \
      http://192.168.2.81:8096/System/Configuration | jq '.RemoteClientBitrateLimit'
    # network (real client IP):
    curl -s -H "Authorization: MediaBrowser Token=\"$KEY\"" \
      http://192.168.2.81:8096/System/Configuration/network | jq '.KnownProxies'
    ```
    Config lives in the Jellyfin PVC (backed up). Ingress must keep `use-forwarded-headers=true`.
    
    ### media-mcp (Hermes media tools)
    ```bash
