  KNOWN-ISSUES.md: |
    # Known Issues / Pending
    
    Updated 2026-10-30.
    
    ## Last health scan (2026-10-28 ~21:40 UTC, verified live)
    
    - **Unified 3-node k3s cluster**, `sitaw-amd` (.82), `calamansi-intel` (.81),
      `patola-thinkcentre` (.80), embedded etcd **3 members**, API VIP `192.168.2.100`;
      `k3s v1.34.5+k3s1`. All three `Ready`, 31 ArgoCD apps `Synced`, 0 abnormal pods,
      0 firing alerts, 17/17 Longhorn volumes healthy.
      (`kamatis-mbp` .83 left the cluster on 2026-10-28 and is now the staging host.)
    - All nodes `Ready`, all pods `Running`, all PVCs `Bound`; every ArgoCD app
      `Synced/Healthy` (the old `root` OutOfSync is fixed, item 2).
    - Backups: `homelab-backup.service` on both hosts = `Result=success` → R2.
    - ⚠️ **`.81` load average ~10 on a 4-core i5** with CPU ~57% idle and ~20% iowait
      (829 tasks), I/O / NFS / mergerfs bound, not CPU. Jellyfin scans every 15m
      (completes in ~5s). Not yet investigated.
    - `media-mcp` (`:30097/mcp`) answers **unauthenticated** on the LAN (returns 406 to a
      bare GET, i.e. no auth gate) while holding all the *arr/Jellyfin API keys.
    
    ## 2026-10-28 — open after the WireGuard migration
    
    - **kube-vip duplicate VIP — two separate causes, one already fixed.**
      1. **Wrong pod shape in staging (fixed 2026-10-28).** The staging manifest ran a
         2-replica *Deployment*; kube-vip is `hostNetwork`, so both pods could land on one
         node and then two processes shared a single netns, fighting over the same
         address — flapping VIP, one pod in `CrashLoopBackOff` (exit 1). It is now a
         **DaemonSet**, matching production: one pod per control-plane node, 0 restarts,
         one holder, and killing a node does not disturb it.
      2. **A crashed leader orphans its address (mitigated, not fixed).** When the node
         holding the VIP also loses the etcd leadership, API writes stall, the
         leader-election client cannot renew, and kube-vip **exits (255) without running
         its cleanup** (`manager.go`: leader election returning calls `sm.Kill()`, which
         bypasses the deferred `Cleanup()`). The address stays on the host interface while
         another node legitimately acquires the same address — observed cross-node.
         - **Mitigation, applied to production 2026-10-28** (`bakuran-gitops` #269):
           lease `5s/3s/1s` → **`15s/10s/2s`**. Rehearsed in staging first (killing the
           etcd leader left the VIP untouched and the API answering for 274 s), then
           rolled: three new kube-vip pods with **0 restarts**, one VIP holder for 280 s
           of observation, API `401` continuously, ArgoCD `Synced/Healthy`, no app or
           tunnel impact.
         - **What the trade costs:** a deliberate takeover now waits up to ~15 s instead
           of ~5 s, because the lease has to expire before another node may claim it.
         - **Closed 2026-10-29** (`bakuran-gitops` #301, #300 replaced): an `orphan-guard`
           sidecar in the kube-vip pod deletes the address when **this node still has the
           VIP but no kube-vip process holds it** — precisely the state `sm.Kill()`
           leaves behind, whatever caused the exit. `shareProcessNamespace` makes the
           process visible; `/proc/[0-9]*/comm` is matched, not `cmdline`, so the guard
           cannot match its own arguments. Three consecutive 3 s checks before acting, so
           a container restart does not empty the address mid-handover. It reads nothing
           over the API, which is the point: the first version read the leader lease with
           `busybox wget` (no `--ca-certificate`) inside a `hostNetwork` pod (where
           `kubernetes.default.svc` does not resolve). It **failed closed**, so it removed
           nothing, logged nothing, and looked healthy. Verified afterwards in a throwaway
           pod on a follower with a dummy `192.168.2.251/32`: the unmodified script logged
           `no kube-vip process here; removing orphaned 192.168.2.251/32 from gt` and the
           address was gone. Live: 3 pods `2/2`, exactly one node holding `192.168.2.100`
           through a leadership change (sitaw-amd → calamansi-intel). Staging carries the
           same container (#178), applied on its next re-provision.
    - **A repo-wide `wg-quick` grep is no longer meaningful.** The tunnel is
      `networking.wireguard`; what matters is that `postSetup` keeps `pref 32765`/`pref 32764`.
      `nix flake check` asserts it (`wireguard-invariants`).
    - **Staging has no RAM snapshots.** NixOS's `qemu-vm` always attaches a 9p share, and
      QEMU refuses `savevm`/`loadvm` while one is mounted, so checkpoints are disk-only and
      a restore costs a guest boot.
    - **Restarting a staging server through `staging-vm` is not a reboot** unless the disk
      is kept — `staging-vm fresh` re-provisions and bootstraps a new cluster with a new CA.
    
    ## 2026-10-29 — a bulk PVC delete destroyed three config volumes (**MITIGATED**)
    
    A `kubectl delete pvc --all` intended for staging's `books` namespace hit
    production's identically-named namespace at 02:37 UTC. Kavita's library database,
    LazyLibrarian's configuration and Audiobookshelf's database were destroyed; ArgoCD
    recreated the empty claims, so Kavita came back in first-run state and every API
    call returned 401 (which is what made `books` Degraded and paged all night).
    
    All three were restored from the 00:31 appdata backup, and the restored Kavita
    database still had both accounts, 152 series, 155 chapters and 5 reading-progress
    records. **The restore path worked; nothing had stopped the delete.**
    
    Mitigated, not solved:
    
    - **`protect-stateful-objects`** (`ValidatingAdmissionPolicy`) denies DELETE on
      PVC / PV / Namespace without `bakuran.dev/allow-delete: "true"`. Verified with
      `--dry-run=server`, including the exact `delete pvc --all` shape.
    - **`AGENTS.md`** forbids the agent from deleting these at all, and points at
      runbook 17 for the genuine procedure.
    - **Kavita's first-run is declarative now** (`kavita-bootstrap` PreSync hook: admin
      account + library), so a wiped volume self-heals instead of 401-ing nightly.
    
    Residual, and why this note stays open:
    
    - The agent still runs with **cluster-admin** — the policy is what stops it, not
      RBAC. A scoped ServiceAccount (no delete on PVC/PV/Namespace) would be defence
      in depth.
    - The **`AppProject` is hand-applied**. Twice on 2026-10-29 the whitelist in git and
      the live object disagreed and a sync was rejected. It should be reconciled by
      ArgoCD like everything else.
    - `kavita-secrets` is the last **hand-made Secret** (no ExternalSecret), with its
      value still visible in the object's `last-applied-configuration` annotation.
    
    ## 2026-10-25 — media node stranded by `wg-quick` restarts (**FIXED 2026-10-28**)
    
    `.81` went off the network **seven times** in one night. Root cause, verified on
    2026-10-28 in staging: `wg-quick` adds its policy rules with `ip rule add` and no
    explicit priority; the kernel derives one from the rule list
    (`fib_default_rule_pref` = the second rule's priority minus one), and with Cilium's
    rule at 9 and `local` at 100 the tunnel's rules landed at **98/99 — above `local`**.
    Packets to the node's own LAN address were then routed out of the interface instead
    of being delivered locally: ARP answered, nothing above L2, power-cycle required.
    
    The fix is the `networking.wireguard` migration with **explicit `pref 32765`/`pref
    32764`**, asserted by `nix flake check`. `pref` is the thing to protect; the old
    "never touch the unit" rule described the symptom. The historical notes below are
    kept because they record the wrong theories in the order they were held.
    - The trigger was never the endpoint or the key. Each attempt to make a fix
      permanent changed the unit — including one commit that only dropped a
      `wants/after sops-nix.service` override.
    - A separate fault caused the *original* "no egress": **a stale private key** in
      `/run/secrets` after a rolled-back activation. WireGuard handshakes with the
      wrong key and blackholes the payload — **a handshake is not a working tunnel**.
      The Proton endpoint was **never** dead; rotating it was unnecessary.
    
    Mitigations now in place:
    
    - The `wg-quick` block in Nix deliberately quotes the **previous** endpoint, so
      activating a new generation does not change the unit (verified: `NRestarts=0`,
      `ActiveEnterTimestamp` unchanged across two deploys).
    - `bakuran.wireguard` + `wireguard-reconcile.timer` own the live state and
      converge it in place with `wg set` (never a restart): boot +90 s, then every 60 s.
    - **Reboot-proof, verified** by rebooting `.81` and watching egress return with
      nobody at the keyboard.
    - Recovery without restarting: `/root/wg-restore.sh` staged on the host.
    - The reconciler's data-path check was demanding HTTP 200 from `https://1.1.1.1/`
      (which answers 301) and therefore reporting a false "no data path" on a healthy
      tunnel; fixed 2026-10-25.
    
    Still open:
    
    - **Why** delete+recreate strands the node is unexplained. Suspects: Cilium's
      datapath (the VM could not reproduce it without Cilium) and the
      `iptables-restore -n` that `wg-quick` runs (Cilium manages masquerading via
      iptables here). Until that is understood, **never change the tunnel unit on a
      running node** — `NETWORK.md` §7.1.
    - `modules/wireguard-native.nix` stages the migration to `networking.wireguard`
      (`wg setconf`, no link deletion). **Inert** (`useNative=false`); enabling it
      replaces the unit, so it is a maintenance-window change (runbook 14).
    
    ## 2026-10-26 — a pod was given the address the node already owned (**fixed + monitored**)
    
    While rolling out two documentation PRs, the `bismigel-site` deployment went to
    **1 of 2 ready** for several minutes and no alert fired. One pod was
    `CrashLoopBackOff` with 6 restarts and a clean `exit 0`.
    
    - Its IP was **`10.42.0.1`**. On `sitaw-amd`, `cni0` — a leftover flannel bridge
      from the original k3s install (`--flannel-backend=none` has been in force ever
      since), with **no ports attached** — still held `10.42.0.1/24`.
    - Cilium's `kubernetes` IPAM allocates from the node's pod CIDR and considers
      `.1` free (its own `cilium_host` takes a *random* address in that /24:
      `.196` here). So the pod was handed an address the **host already owned**: the
      probe to the pod's own IP was delivered to the host stack, nginx never
      answered, and the kubelet killed the container on a loop.
    - Deleting the pod re-created it on `10.42.0.10` and the deployment returned to
      2/2 immediately. That is the symptom fix, not the cure.
    
    **Fix (declarative):** `bakuran-infra/modules/cni-cleanup.nix` — a `cni-stray-sweep`
    oneshot + hourly timer on every node deletes any non-Cilium interface holding an
    address inside the pod CIDR and publishes `homelab_stray_cni_removed`.
    **Monitoring:** `StrayCNIAddress`, `StrayCNIMetricsMissing`, and the two workload
    alerts that were missing entirely — `KubePodCrashLooping` and
    `KubeDeploymentReplicasMismatch` (a degraded-but-serving deployment was invisible).
    Documented as `NETWORK.md` invariant 9.
    
