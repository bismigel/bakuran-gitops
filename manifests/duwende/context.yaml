    ## 2026-10-28 — patola-thinkcentre moved .84 → .80 (**DONE**)
    
    An **etcd member's peer URL is its IP**, so this is a member replacement, not an
    address change:
    
    ```
    stop k3s on .84 → etcdctl member remove <id> → wipe /var/lib/rancher/k3s/server/db
    → change the address → start k3s → joins as a NEW member (patola-thinkcentre-da1ceeba)
    ```
    
    Quorum stayed at 2/3 during the window. Two things needed a nudge afterwards,
    both because a cached IP outlived the change:
    
    - **`CiliumNode` still had `.84`** and cluster health sat at 2/3; deleting the
      CiliumNode (and the agent pod) recreated it with `.80`.
    - **The node-exporter pod kept `podIP: .84`** (hostNetwork pods capture the host
      IP at creation), so Prometheus scraped a dead address. Recreating the pod
      fixed the target.
    
    Note: `.80` is closer to Bell's DHCP range than `.84`. Add a router-side
    exclusion for `.80` or this is the `.32` duplicate-IP risk again, on an etcd
    member.
    
