    ## 2026-10-24 — LazyLibrarian never downloaded (**FIXED**)
    
    Five stacked bugs, all invisible from the UI (LazyLibrarian shows "Wanted" and
    does nothing):
    
    1. **Wrong config path.** The `provider-config` init container rewrote
       `/config/lazylibrarian.ini`; the app writes `/config/config.ini`. It logged
       `no lazylibrarian.ini yet, nothing to do` on every start, so the category and
       search-type settings from #160 and the Prowlarr host/api switch from #161 had
       never applied. Fixed in bismigel/bakuran-gitops#165.
    2. **Cloudflare bans LL's client signature.** `api.nzbgeek.info` answers
       LazyLibrarian's `python-requests` calls with `HTTP 403` / `error code: 1010`
       from the books pod; the same URL with a browser UA, or from the host, is 200.
       LL has no UA setting, so it now searches through Prowlarr's Newznab endpoint
       (`prowlarr...:9696/2`, cats 7000,7020).
    3. **No route books → media.** The egress policy allowed only same-ns, DNS,
       `downloads:8080` and public 80/443, and `media`'s ingress policy did not list
       `books`, so even the Prowlarr route would have timed out. Added a narrow
       books→prowlarr tcp/9696 hole (both directions) in the same PR.
    4. **SAB couldn't reach Prowlarr.** LL hands SAB a *URL*, so SAB fetches it
       itself — `sabnzbd-egress` allowed only DNS + Frugal, and `media`'s ingress
       didn't list `downloads`. Queue showed `Grabbing 0%`, retry every 120s.
       bismigel/bakuran-gitops#167.
    5. **SAB couldn't reach the indexer either.** Prowlarr answers `/2/download`
       with **301** to `api.nzbgeek.info/api?t=get&id=...` and SAB follows it, so it
       needs the Cloudflare edge on 443 (`[Errno 101] Network unreachable`
       otherwise). bismigel/bakuran-gitops#168 (Cloudflare `ips-v4`, tcp/443).
    
    No UA trick was needed for SAB: Prowlarr forwards the *client's* User-Agent, and
    `SABnzbd/4.x` / `curl` / browser are all accepted — only empty and
    `Python-urllib`/`python-requests` signatures get `1010`.
    
    The Prowlarr key hookup had been dropped earlier because the key was not
    recorded anywhere (`#161`: *"its Bitwarden item name is not recorded anywhere I
    can read"*). It is now canonical: BWS `prowlarr-api-key`, seeded into
    `books/lazylibrarian-secrets` by `bakuran-infra/scripts/lazylibrarian-secrets.sh`.
    
    Verified: `[Newznab_0] updated: host, api, bookcat` in the init log, `t=caps`
    200 through Prowlarr, a forced `cmd=searchbook` found a 100% match, sent it to
    SABnzbd, SAB **completed the download** (1.5 MB) and LL flipped
    the book `Wanted` → `Snatched` → `Open`.
    
    Remaining (separate, open — item 4 under *Active*): the import landed in
    `/config` instead of the library because `/mnt/media-sda` is 99% full and
    mergerfs refuses creates below its 4G `minfreespace`.
    
    Triage runbook: `RUNBOOK.md` → *LazyLibrarian is not downloading*.
    
    ## 2026-10-23 — hardening / ops learnings
    
    - **ArgoCD + Job `ttlSecondsAfterFinished`**: with `selfHeal` enabled, the TTL
      controller deletes the finished Job, ArgoCD sees it missing and recreates it,
      so the Job re-runs every TTL period forever. Do not put a TTL on a Job ArgoCD
      manages (`jellyfin-bitrate` had this and it was removed).
    - **Immutable Job templates**: changing a Job's pod template in place fails.
      Use a new name (e.g. `-v2`) or delete the Job first; ArgoCD then creates the
      new one and prunes the old.
    - **Jellyfin 12.2.0 API**: `X-Emby-Authorization` → 400 (use
      `Authorization: MediaBrowser ...`); `/System/Configuration/Playback` → 404
      (the bitrate lives in `/System/Configuration`). See `MEDIA.md`.
    - **Bitwarden `bw` session is per-process**: unlocking in a terminal does not
      unlock other processes; they need `BW_SESSION`.
    - **Cloudflare Free plan**: rate limiting and managed WAF are Pro+; only custom
      WAF rules, Access, and the leaked-credential check are free.
    - **Local Cloudflare proxy (`127.0.0.1:8788`) may be down**: reads can be done
      on `sitaw-amd` with `/run/secrets/cloudflare_api_token`.
    - **kubeconfig is now `0600`**: on-host `kubectl`/`k3s kubectl` needs root.
    - **mergerfs + NFS**: `root_squash` breaks media writes because mergerfs issues
      the NFS ops as root. See `HARDENING.md`.
    
    ## 2026-10-23 — Cilium `toFQDNs` / DNS proxy (**FIXED**)
    
    - Symptom: `toFQDNs`/`rules.dns` silently failed on `.81` (query redirected to
      the DNS proxy, no response, FQDN cache empty); DNS worked from a `.82` pod.
    - Root cause: `.81` runs the ProtonVPN WireGuard interface (`proton0`), which
      sets `net.ipv4.conf.all.src_valid_mark=1`. With `accept_local=0` on the pod
      veth, the proxy's marked DNS packet is routed via `lo` and dropped as a
      martian source (cilium#46260). `.82` has `src_valid_mark=0`, hence worked.
    - Fix: `net.ipv4.conf.default.accept_local=1` + a oneshot that sets
      `accept_local=1` on existing `lxc*` interfaces (bakuran-infra #73). Verified:
      DNS resolves on `.81` and `cilium-dbg fqdn cache list` populates.
    - `downloads` still uses **CIDR allowlisting** (#159): SABnzbd ->
      `62.164.182.0/24` + `209.160.112.0/20` on tcp/563,443,119; qBittorrent ->
      public any-port (RFC1918 excluded). Switching back to `toFQDNs` is optional.
    
    ## 2026-10-23 — NixOS resets IPv4 forwarding on activation
    
    - `systemd-sysctl` re-applies NixOS's default
      `net.ipv4.conf.all.forwarding=false` on every deploy. k3s only re-enables
      forwarding when it starts, so a deploy that doesn't restart k3s (e.g. #73)
      left forwarding off: **pod egress and hostPort DNAT broke** until a reboot.
    - Fix: pin `net.ipv4.ip_forward=1`, `conf.all.forwarding=1`,
      `conf.default.forwarding=1` (bakuran-infra #74). Check with
      `sysctl net.ipv4.ip_forward`.
    
