    # System Architecture
    
    > Local-only. Last updated: 2026-10-17
    
    ## Hosts
    
    | Host | IP | CPU | OS | Role |
    |---|---|---|---|---|
    | `sitaw-amd` | 192.168.2.82 | AMD Ryzen 5 4600G (6c/12t) | NixOS 25.11 | **Platform + ArgoCD control plane** (k3s, ingress-nginx, cloudflared) |
    | `calamansi-intel` | 192.168.2.81 | Intel i5-7500T (4c, QuickSync) | NixOS 25.11 | **Media worker**, media stack pinned here (QSV + `/mnt/media`) |
    | `patola-thinkcentre` | 192.168.2.80 | Intel i5-6500T, 16 GB (ThinkCentre M900 Tiny) | NixOS 25.11 | **etcd / control-plane**, schedulable — also runs Immich (library + postgres on `/mnt/data`) |
    | `kamatis-mbp` | 192.168.2.83 | Intel i5 (MacBook Pro 13" 2012) | NixOS 25.11 | **staging host** (not a cluster node) — KVM + `br-staging` for the VMs in `bakuran-infra/staging/` |
    | `nix-station` | 192.168.2.245 | (workstation) | NixOS | Admin/control machine (SSH + deploy origin) |
    
    All three hosts are **server nodes of one k3s cluster** (embedded etcd, **3
    members**), the cluster tolerates losing any one node. `sitaw-amd` was installed
    by wiping a Proxmox host; `kamatis-mbp` is a repurposed 2012 MacBook.
    
    ## Repos
    
    | Repo | Visibility | Purpose |
    |---|---|---|
    | `bismigel/bakuran-infra` | private | NixOS machine configs (`calamansi-intel`, `sitaw-amd`), `deploy-rs`, `modules/`, `scripts/`, `docs/REBUILD.md` |
    | `bismigel/bakuran-gitops` | private | **ArgoCD desired state**, `clusters/prod/root.yaml`, `clusters/prod/apps/{platform,workloads}/*`, `clusters/prod/projects/*`, `clusters/*`, `manifests/*` |
    | `bismigel/bismigel-site` | public | Emacs `org-publish` / Hugo site → `bismigel.dev` (primary blog) |
    | `bismigel/homelab-app-template` | private, template | New-app scaffold (Dockerfile, `deploy/k8s`, CI → GHCR → tag bump) |
    | `Ciceley/ciceleywebsite` | public | Hugo site (Stack theme), content synced from Notion |
    | `bismigel/status-api` | public | Test Go API (proves the pipeline) → `status.bismigel.dev` |
    | `bismigel/private-api` | private | Test Go API for private GHCR pulls → `private.bismigel.dev` |
    
    ## GitOps: one control plane, one cluster
    
    **A single ArgoCD runs on `sitaw-amd`, managing the one 3-node cluster**
    (in-cluster). There is no external cluster registration and no second ArgoCD.
    All workloads are ordinary in-cluster resources; the media stack is pinned to
    `calamansi-intel` via `nodeSelector` (see `manifests/base/media/kustomization.yaml`).
    ArgoCD is **HA**: `server`/`repo-server`/`applicationSet` run 2 replicas and the
    `application-controller` runs 2 (active/standby), spread across `.82`/`.81`
    (`scripts/bootstrap-argocd.sh`); Redis is a single replica.
    
    ```
    clusters/prod/root.yaml      # app-of-apps per cluster (watches clusters/prod/apps/)
    clusters/prod/apps/
      sitaw/*                     # apps + platform
      calamansi-intel/media.yaml  # the media stack (in-cluster, nodeSelector .81)
      node-exporter-appset.yaml   # ApplicationSet -> every registered cluster
    manifests/<app>/              # raw manifests the apps point at
    ```
    
    ### Automation pipeline
    ```
    app repo push ─▶ CI: build image ─▶ GHCR ─▶ CI bumps tag in deploy/k8s
                                                        │
                                  ArgoCD (sitaw-amd) ◀──┘ pulls, reconciles the cluster
    ```
    CI never holds cluster credentials. **Apps push images; ArgoCD pulls desired state.**
    
    ## Storage (pooled media)
    
    Both boxes split their NVMe into a **100 GiB OS partition** and a **media data
    partition**; the SATA disks are media too. All four media partitions are pooled:
    
    ```
    sitaw-amd    (.82): /dev/nvme0n1p3 -> /mnt/media-nvme   (~346G)  ─┐ NFS export
                        /dev/sda1       -> /mnt/media-sda    (~466G)  ─┘ (192.168.2.81)
    calamansi-intel (.81): /dev/nvme0n1p3 -> /mnt/media-nvme (~137G) ─┐
                           /dev/sda1       -> /mnt/media-sda  (~238G) ─┤ mergerfs
                           /mnt/remote82-{nvme,sda} (NFS from .82)   ─┘ -> /mnt/media (~1.2T)
    ```
    
    `patola-thinkcentre` (.80): **100 GiB root + `/mnt/data` (135 GiB ext4, a Longhorn disk)**, now used by
    **Immich** (`/mnt/data/immich/{library,postgres}`). The Immich ML container runs
    on `.82` (CPU-bound), so the MacBook only does DB/storage/API.
    
    Jellyfin + the *arrs mount the single `/mnt/media` on `.81`. `.82` exports its
    partitions via NFSv4 (`services.nfs.server`); `.81` mergerfs-unions local + remote
    (`fuse.mergerfs`, `category.create=epmfs`). The `media-dirs` systemd service
    creates the library dirs on the **local** branch
    (`/mnt/media-sda/{tv,movies,downloads,temp}`), which appear at
    `/mnt/media/{tv,movies,downloads,temp}` through the union.
    
    ## What runs where
    
    ### `sitaw-amd` (.82): hosting / platform
    - k3s (traefik/servicelb disabled), `ingress-nginx` (NodePort 32080/32443)
    - `argocd`, the **single** control plane
    - `apps`: ciceley-site, bismigel-site, private-api, status-api
      (`miguelarbis.dev` is a Cloudflare Bulk Redirect, **not** a k8s app)
    - `monitoring`: grafana (per-user SSO, PVC-backed; five dashboards provisioned from `grafana-dashboard-*.yaml`), prometheus (PVC-backed; alert rules; **self-reloads** on config/rule changes via `--web.enable-lifecycle` + a reloader sidecar), alertmanager (Telegram, NodePort 30903), kube-state-metrics (least-privilege RBAC), node-exporter, **kepler** (power/RAPL `:9102`, all nodes), etcd-metrics-proxy, cloudflare-edge-exporter
    - **login watchers** (CronJobs in `monitoring`): `access-login-watch` (Cloudflare Access logins), `jellyfin-login-watch` (Jellyfin activity log via API key), `immich-login-watch` (Immich `session` table) → Alertmanager → Telegram
    - **Immich ML** container runs here (CPU-bound); Immich server/DB/valkey stay on `.83`
    - `observability`: otel-collector; `opentelemetry-operator-system`
    - `cert-manager`, `external-secrets` (+ Bitwarden SDK server), `homepage`
    - `longhorn`, distributed storage (StorageClass `longhorn`, 2 replicas) on `.81`/`.82`
    - `duwende` app: Hermes AI agent/SRE (dashboard + Telegram; see below)
    - `cloudflared` (NixOS service), the **primary** of two tunnel connectors
    
    ### `calamansi-intel` (.81): media node (part of the unified cluster)
    - k3s **server+worker** node (etcd member); media pods are pinned here by `nodeSelector`
    - `media`: sonarr, radarr, prowlarr, bazarr, media-mcp · `downloads`: qbittorrent, sabnzbd · `default`: jellyfin
    - `monitoring`: node-exporter + **kepler** (scraped by Prometheus)
    - `cloudflared` (NixOS service), one of the edge connectors
    - **Egress = Proton WireGuard full tunnel** (`proton0`, IPv4-only `0.0.0.0/0`): policy routing (`fwmark 0xca6c` → table 51820, plus `main suppress_prefixlength 0`) sends everything into the tunnel; a `/32` pin keeps the endpoint reachable outside it. There is **no fallback path** — if the tunnel stops passing data the node has no internet. Since 2026-10-28 the interface is owned by **`networking.wireguard`** (`modules/wireguard-native.nix`): the key comes from SOPS, the peer and endpoint from `bakuran.wireguard`, and `wireguard-reconcile.timer` still corrects live drift in place with `wg set`. There is **no `wg-quick` block and no boot seed** any more. Its two policy rules carry **explicit priorities** (`pref 32765` / `pref 32764`) — that is the fix for the seven 2026-10-25 outages, and `nix flake check` fails if they disappear. See **`NETWORK.md` §4/§7.1** and runbook 14.
    - **ArgoCD-managed** via the `media` app (in-cluster).
    
    ### `kamatis-mbp` (.83): staging host (not a cluster member)
    - **Left the cluster on 2026-10-28.** It was the third etcd member; `patola-thinkcentre`
      (`.80`) replaced it, and Immich moved to Longhorn. It now runs **KVM + `br-staging`
      (`10.10.50.1/24`)** for the guests in `bakuran-infra/staging/`, and nothing on it is
      production, backed up, or reachable from production.
    - **Guests** (3 × 2.5 GB, one at a time per tap): `server` `.10`, `server2` `.11`,
      `server3` `.12` — three control planes with **embedded etcd (quorum 2/3)**, Cilium
      v1.20.3 (same digest as production), kube-proxy enabled, pod/service CIDRs
      10.52/10.53, and a **real kube-vip API VIP at `10.10.50.100`** with Cilium pointed at
      it. `native` is a fourth guest that boots the production WireGuard module.
    - **Tooling** (installed by `staging/host.nix`): `staging-vm` (start/fresh/golden/stop,
      golden base + thin overlay so a run can be discarded without re-provisioning) and
      `staging-snap` (consistent disk checkpoints of a whole cluster; no RAM snapshots —
      NixOS's 9p share disables `savevm`).
    - **Measured there**: the tunnel's rule-priority bug, the cold-boot cost of the VIP
      (~42 s of Cilium `Init` waiting for an address), VIP failover (45 s when the etcd
      leader survives), and that killing 2 of 3 members loses quorum as designed.
    
    ## Secrets (two layers)
    
    | Layer | Tool | Holds |
    |---|---|---|
    | **Machine** (k8s) | **Bitwarden Secrets Manager + External Secrets Operator** | everything the clusters consume: `ghcr-secret`, the bootstrap secrets, etc. ESO (`ClusterSecretStore bitwarden`) syncs `ExternalSecret`s into k8s Secrets. |
    | **Host** | **sops-nix** (SOPS + age) | cloudflared credentials (both boxes) + the ProtonVPN WireGuard key (`.81`). age identity = the host's SSH host key (`/etc/ssh/ssh_host_ed25519_key`). |
    | **Human** | Bitwarden (web vault) | passwords, tokens, the age backup key |
    
    **Sealed Secrets has been removed** (all secrets are now Bitwarden/ESO).
    
    ## Backups / DR
    
    Three daily backups, all **age-encrypted → R2** (`r2:homelab-backups/`):
    - **credentials/**, host SSH keys + k3s kubeconfig + BWS token, per box
      (`modules/backup.nix`). Restores the SOPS identity.
    - **appdata/**, stateful app data (config PVCs: *arrs/Jellyfin/Grafana/Prometheus/
      Hermes/Kavita/LazyLibrarian/Karakeep, plus the Immich Postgres dump and photo
      library), from the control plane via `kubectl exec` (`modules/backup-apps.nix`).
    - **nixstation/**, the admin box's own files (context, SSH keys, `cloudflare-backup`,
      SOPS keyring, age keys, `.env`) (`nix-station/modules/home/backup.nix`).
    
    The backup **env file** (`/root/.config/homelab-backup.env`) is rendered from
    SOPS (`homelab_backup_env`), not hand-placed. The **age backup private key** and
    the **SOPS admin age key** live in Bitwarden.
    
    **`docs/REBUILD.md`** = the rebuild runbook; `scripts/bootstrap-argocd.sh` does the
    one manual step (ArgoCD install + repo creds + root app). The **Cloudflare edge**
    is declared in `bakuran-infra/opentofu/cloudflare/`; the **Longhorn settings** in
    `bakuran-gitops/manifests/longhorn-config/`.
    
    ## Edge (Cloudflare)
    
    - **Declared + enforced:** `bakuran-infra/opentofu/cloudflare/` is the source of
      truth (DNS records, tunnel ingress, Access apps, zone settings, R2 lifecycle;
      state in the R2 S3 backend, `tofu plan|apply` with the CF + R2 tokens from BWS).
      A new hostname = a record in `records_all.tf` **and** an ingress entry in
      `tunnel.tf`. The old `cloudflare-sync.timer` is **retired** so it cannot fight
      the OpenTofu state; `cloudflare/sync.sh` survives only as a manual rollback
      path (`systemctl start cloudflare-sync.service` on `.82`).
    - **Tunnel** (remote-managed) on **both** boxes; public hostnames → that box's
      local `ingress-nginx` (`127.0.0.1:32080`). ingress-nginx has **2 replicas** and
      `use-forwarded-headers=true` (real client IP reaches apps).
    - **NodePorts are loopback-only**; the tunnel is the **only** path in for public
      hostnames. Media LAN clients use **hostPorts** on `.81` (Jellyfin `:8096`, Sonarr
      `:8989`, Radarr `:7878`, Prowlarr `:9696`, Bazarr `:6767`, qBittorrent `:8081`,
      SABnzbd `:8082`).
    - **NetworkPolicies** default to ingress-only deny in the app namespaces (`apps`,
      `books`, `default`, `downloads`, `homepage`, `immich`, `karakeep`, `media`,
      `duwende`). Same-namespace and `ingress-nginx` are allowed; media to
      books/default/downloads, monitoring to default/immich, and duwende to media
      are explicit. Egress stays open. Jellyfin keeps a LAN-only `192.168.2.0/24:8096`
      exception for TV clients; the public path stays on the tunnel.
    - **Zero Trust Access** gates the admin/browser apps, `argocd`, `grafana`,
      `longhorn`, `agent`, `private`, `homepage`, `prometheus`, and the media UIs
      (`sonarr`, `radarr`, `prowlarr`, `bazarr`, `qbittorrent`, `sabnzbd`), allow-listed
      by email. **Admin-only apps use a 24h session**; media keeps 730h.
    - **Jellyfin and Immich are intentionally NOT in Access** (native phone/TV clients
      can't complete an interactive challenge), served publicly by the reverse proxy
      and they do their own auth. Jellyfin remote clients are capped at **12 Mbps**
      (per-user `RemoteClientBitrateLimit`; Jellyfin `KnownProxies=127.0.0.1,10.42.0.0/16`).
    - **\*arrs** have no app-level auth (behind Access); `homepage`/`prometheus` are in
      the "Homelab Media" Access app. `status.bismigel.dev` is public.
    
    ## Duwende (homelab agent / SRE)
    
    A duwende is a small household spirit in Philippine folklore, a caretaker of the
    home and yard. The lab already has a bakuran, so its resident helper is named
    Duwende. The namespace and ArgoCD app are being renamed to `duwende`; the
    upstream workload and dashboard still use the Hermes name.
    
    An AI agent with homelab access, deployed as a k3s workload.
    It acts as the lab's SRE in the small sense: it watches, triages and reports,
    and it proposes changes through pull requests. It does not apply cluster
    changes or merge its own work.
    
    - **Dashboard:** `agent.bismigel.dev` (Cloudflare Access + basic auth `admin`;
      password in BWS `hermes-dashboard-password`).
    - **Telegram:** same bot; allowlist `TELEGRAM_ALLOWED_USERS=607008268`.
    - **Model:** DeepSeek `deepseek-chat` (`DEEPSEEK_API_KEY` from BWS) via a custom
      OpenAI-compatible provider in `config.yaml`.
    - **Tools:** **read-only** k8s (`homelab-agent-read` ClusterRole) + `GH_TOKEN`
      (`gh`/`git push`) + MCP servers **kubernetes**, **media**, **prometheus** and
      **github**. Cloudflare stays behind the read-only nginx sidecar
      (`127.0.0.1:8788`, writes blocked).
    - **Context:** the homelab docs are copied to `/opt/data` at startup
      (`AGENTS.md`, `SYSTEM.md`, …) and `SOUL.md` holds the operating rules.
    - **Scheduled:** daily **08:00 America/Toronto** report → Telegram; the job is
      seeded from `hermes-cron-seed` on a fresh PVC.
    - **Guardrails:** read-only Kubernetes RBAC (no Secrets), Cloudflare writes
      blocked by the GET-only sidecar, PR-only working rule backed by human review,
      no secret logging, and human approval before destructive work. The GitHub
      token is repo-scoped, but the PR-only rule is not a hard technical block.
    - **State:** `/opt/data` on the `hermes-data` PVC (config, sessions, memory,
      skills, cron); `hermes-config` seeds config/SOUL; included in R2 appdata backups.
    
    ## NixOS / deploy
    
    - Flake `bakuran-infra/flake.nix` → `nixosConfigurations.{sitaw-amd,calamansi-intel,kamatis-mbp,patola-thinkcentre}` + `deploy.nodes.*`.
    - `disko` for `sitaw-amd`; `hardware-configuration.nix` git-ignored (inlined).
    - Deploy: `nix run github:serokell/deploy-rs -- .#sitaw-amd` (or `.#calamansi-intel`).
    - Install: `nixos-anywhere --flake .#<host> --target-host root@<ip>`.
    - `modules/`: `base.nix`, `k3s.nix` (WireGuard/ProtonVPN on `.81`), `backup.nix`.
