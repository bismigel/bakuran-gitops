    # MEDIA.md: the media stack
    
    All media services run on the **media node** (`calamansi-intel`, `192.168.2.81`).
    The library lives on the host at `/mnt/media` (mergerfs), mounted into Jellyfin as
    `/media`; the *arrs import from `/downloads` (`/mnt/media`) into `/media/tv` and
    `/media/movies`.
    
    ## Services
    
    | Service | Namespace | LAN URL (hostPort on `.81`) | Notes |
    | --- | --- | --- | --- |
    | Sonarr | media | `http://192.168.2.81:8989` | TV; login-free on LAN |
    | Radarr | media | `http://192.168.2.81:7878` | Movies |
    | Prowlarr | media | `http://192.168.2.81:9696` | Indexers (Nyaa + NZBgeek) |
    | Bazarr | media | `http://192.168.2.81:6767` | Subtitles (OpenSubtitles) |
    | SABnzbd | downloads | `http://192.168.2.81:8082` | Usenet; `host_whitelist` includes `sabnzbd.bismigel.dev` |
    | qBittorrent | downloads | `http://192.168.2.81:8081` | Torrents (admin + homelab password) |
    | Jellyfin | default | `http://192.168.2.81:8096` | libraries: `/media/tv`, `/media/movies`; **12.2.0**; transcode cache on local NVMe; remote capped 12 Mbps; SyncPlay enabled |
    | media-mcp | media | (loopback NodePort 30097) | MCP server (below) |
    
    > **Why hostPorts:** the LAN NodePorts are loopback-only (edge lock). Sonarr/Radarr
    > v4 refuse no-auth for *remote* access, so to use them login-free they must be
    > reached from the **LAN** (local → auth skipped), same approach as Jellyfin.
    > These are also exposed via the tunnel (`*.bismigel.dev`, Access-gated), but a
    > remote request then needs the app login. **Trade-off:** the *arrs/qbt/sab are
    > login-free to anyone on the LAN (as before the edge lock).
    
    ## Managing the stack (media MCP)
    
    There is a **media MCP server** (`media` tool group) that wraps the APIs above.
    Prefer it over raw curl. Tools: `sonarr_series`, `sonarr_season_status`,
    `sonarr_queue`, `sonarr_history`, `sonarr_find_releases` (pass `indexer_id` to
    stay fast, a full search across every indexer can take minutes),
    `sonarr_season_search`, `sonarr_grab_release`, `radarr_movies`, `radarr_queue`,
    `prowlarr_indexers`, `prowlarr_search`, `sabnzbd_queue`, `sabnzbd_history`,
      `qbittorrent_torrents`, `jellyfin_scan`, `jellyfin_users`.
      **Track new media:** `sonarr_lookup` → `sonarr_add_series` (add + search),
      `radarr_lookup` → `radarr_add_movie` (add + search), `sonarr_search`,
      `radarr_search`.
      **Books:** `lazylibrarian_find_author` → `lazylibrarian_add_author` (all their
      books; new authors default to Wanted), `lazylibrarian_authors`,
      `lazylibrarian_author`, `lazylibrarian_books`, `lazylibrarian_wanted`,
      `lazylibrarian_snatched`, `lazylibrarian_queue_book` / `unqueue_book`,
      `lazylibrarian_search_book`. These use LazyLibrarian's API (enabled by the UI
      setup script; key in BWS `lazylibrarian-api-key`, **must be 32 chars**).
    
    ## API keys (where they live, who may read them)
    
    The Sonarr/Radarr/Prowlarr/SABnzbd keys are **generated by the apps**. Canonical
    copy: Bitwarden Secrets Manager `<app>-api-key` (`prowlarr-api-key`,
    `sonarr-api-key`, `radarr-api-key`, `sabnzbd-api-key`). They are mirrored into the
    `media-setup` Secret (ns `media`) by
    `bakuran-infra/scripts/media-setup-secret.sh`, which prefers Bitwarden and falls
    back to scraping `/config` in the pods. Use **`KEYS_FROM=pods`** after a PVC
    restore: the app regenerates its key, so the Bitwarden copy is stale and would
    put a wrong value in the Secret. Re-applying the Secret does **not** hot-reload
    env vars — `kubectl -n media rollout restart deploy/media-mcp` afterwards.
    
    **Agents must not read these keys.** `media-mcp` already holds them; call the MCP
    tools (`prowlarr_*`, `sonarr_*`, `radarr_*`, `sabnzbd_*`) instead. Hermes has no
    BWS token and its `homelab-agent-read` ClusterRole deliberately omits `secrets`.
    
    ## Immich (photos)
    
    Runs on the **MacBook** (`.83`): `immich-server`, `immich-postgres`, `immich-redis`
    with storage on `/mnt/data/immich/{library,postgres}`; the `immich-machine-learning`
    container runs on `.82` (CPU-bound). Public at `https://immich.bismigel.dev`
    (**no Access**, native apps can't do the email-OTP; it uses its own login).
    Users mirror Jellyfin: `gio` (admin), `anton`/`ciceley`/`delfin`/`guest`
    (`<name>@bismigel.dev`, same passwords as Jellyfin from Bitwarden). Recreate accounts
    with `bakuran-infra/scripts/immich-setup.sh`. **Backed up** by `backup-apps.nix`
    (`pg_dump` + photo library into the R2 `appdata/` backup).
    
    ## Books (Kavita + LazyLibrarian + Audiobookshelf)
    
    Namespace `books`, pinned to `.81` (QSV host + local `/mnt/media/books`); book
    files land in `/mnt/media/books` and are read by Kavita. `lazylibrarian.bismigel.dev`
    is behind the Access app **Books** (24h sessions). `kavita.bismigel.dev` and
    `audiobookshelf.bismigel.dev` are **public** (no Access, the mobile apps can't do
    the email-OTP challenge) and rely on their own login.
    
    - **Audiobookshelf**, audiobooks + podcasts (`manifests/books/audiobookshelf.yaml`,
      digest-pinned `ghcr.io/advplyr/audiobookshelf`). Library `/mnt/media/audiobooks`,
      state on the `audiobookshelf-config` PVC (`/config`, with `METADATA_PATH` and
      `BACKUP_PATH` subdirs); `/config` is in the R2 appdata backup. Runs on **8080**
      with `PORT` set, because the image default 80 needs `NET_BIND_SERVICE` and the pod
      drops all capabilities. ABS's own
      scheduled backups are **off** by default (turn them on in the UI if `/config`
      matters more than the R2 dump). LazyLibrarian audiobooks stay `Skipped`,
      so drop audio into `/mnt/media/audiobooks` (or let another tool fetch it) and ABS
      picks it up on its next scan. Library **Audiobooks** → `/audiobooks`, created via
      the API.
      - Accounts: **`gio`** (root/admin) and **`ciceley`** (normal user). Passwords are
        random 28-char, stored in BWS as `audiobookshelf-gio` / `audiobookshelf-ciceley`
        (and mirrored to the Bitwarden vault as items with the same names). Procedure and
        API gotchas: `RUNBOOK.md` → *Audiobookshelf accounts*.
    - **Kavita**, library server. Accounts: `gio` (admin) and `ciceley`
      (Pleb+Login, the **Login role is required**, otherwise login reports "account
      is disabled"). The **Books** library (Book type, Epub+Pdf, Hardcover metadata)
      points at `/books` (`/mnt/media/books`).
      `bakuran-infra/scripts/kavita-setup.sh` resets the admin password (hash written
      directly to the ASP.NET Identity table; value in BWS `kavita-admin-password`)
      **and** creates/refreshes the library. Add a user with
      `scripts/kavita-add-user.sh <name>` (invite → confirm-email flow, idempotent,
      password from BWS `jellyfin-<name>`, access to Books). Also
      `scripts/kavita-user.sh <list|lock|unlock|register>`, lock removes the
      **Login** role (login then says "account is disabled"); unlock restores it.
      Already-issued tokens stay valid until they expire.
      **Library must have EnableMetadata on** (the script sets it): with it off
      Kavita parses series from filenames, `Title - Author.epub` yields no series,
      and every scan logs *"Unable to parse any meaningful information out of
      file"* and imports nothing. Only EPUB/PDF are scanned, MOBI-only books are
      skipped (LazyLibrarian sometimes saves mobi; wait for an epub release).
    - **LazyLibrarian**, book acquisition UI. It has **no app auth** (Access is the
      only gate) and **no config API**. Do **not** seed `/config/config.ini`: the app
      re-serializes it on startup and drops sections it did not create (tried three
      ways; only the UI path survives). Configure it with
      `bakuran-infra/scripts/lazylibrarian-ui-setup.sh`, an idempotent one-off
      Playwright Job that drives the real `/config` form (fields live in collapsed
      Bootstrap tabs, so it sets DOM values and submits `config_update`). It wires:
      - **SABnzbd** (`[SABNZBD]`): `sabnzbd.downloads.svc.cluster.local:8080`,
        category `books`, key from `media-setup/sabnzbd-api-key`
      - **Prowlarr**, not NZBGeek directly (`[Newznab_0]`):
        `http://prowlarr.media.svc.cluster.local:9696/2` (Prowlarr's NZBgeek
        Newznab endpoint), cats `7000,7020`, key = BWS `prowlarr-api-key`
      Keys are read in-cluster (never passed from the host); the Job runs in `media`
      to reach that Secret and is pinned to `sitaw-amd` for direct npm egress. The
      script deletes the Job/ConfigMap afterwards and restarts the deployment.
      Verify from the app pod: Prowlarr `t=caps` → 200, SAB `/api?mode=version`.
      **Never point LL at `api.nzbgeek.info` directly** (2026-10-24): NZBGeek's
      Cloudflare answers LL's `python-requests` signature with `HTTP 403` / `error
      code: 1010`, so every search returns nothing and nothing is ever snatched. The
      same request with a browser User-Agent, or via Prowlarr, works. The indexer
      host/api/cats are enforced on every pod start by the `provider-config` init
      container in `manifests/books/lazylibrarian.yaml`, reading the optional
      `books/lazylibrarian-secrets` Secret (seeded by
      `bakuran-infra/scripts/lazylibrarian-secrets.sh`); the books namespace has no
      ESO. NetworkPolicy must allow `books` → `media`/`app=prowlarr` tcp/9696.
      Triage steps: `RUNBOOK.md` → *LazyLibrarian is not downloading*.
      **Empty Authors list?** Check the **Show Inactive Authors** toggle (filters to
      ignored/paused; in-memory, reset by restart). New authors stay hidden
      (`Status=Loading`) until the Goodreads import finishes (minutes for a prolific
      author). The setup script sets `LibraryScan` **newauthor_status/newbook_status
      = Wanted**, so new authors/books are searched automatically (audiobooks stay
      `Skipped`); to want existing books, select them under Manage Books → Wanted.
    
    ## Quality policy and what owns what (recyclarr)
    
    App *state* (config.xml + SQLite) is on PVCs, so ArgoCD cannot manage it. Three
    owners, and **no object is co-managed** — that is the rule that keeps two
    reconcilers from fighting:
    
    | Owner | Objects |
    | --- | --- |
    | **ArgoCD** (`manifests/media/`) | Deployment/PVC/Service/Ingress shape, image pins, nodeSelector, netpol |
    | **recyclarr** (`manifests/media/recyclarr.yaml`, nightly 04:17) | `quality_profile` + `custom_format` scores |
    | **OpenTofu** (`bakuran-infra/opentofu/`, *not yet built*) | indexers (Prowlarr), download clients, root folders, notifications, **and per-quality MB/min size caps** (`devopsarr_*_quality_definition`) |
    | nothing | download history, seeds, cookies | R2 `appdata/` backups |
    
    Profiles it maintains (all upgrade-enabled):
    
    | Profile | Allowed qualities | Cutoff |
    | --- | --- | --- |
    | `TV-1080p` (Sonarr) | WEBDL/WEBRip/Bluray/HDTV-1080p | WEBDL-1080p |
    | `Movies-1080p` (Radarr) | WEBDL/WEBRip/Bluray/HDTV-1080p | WEBDL-1080p |
    | `Movies-2160p` (Radarr, **opt-in per movie**) | WEBDL-2160p, WEBRip-2160p | WEBDL-2160p |
    
    No profile allows `Remux` or `Bluray-2160p`, so the 68G `Remux-2160p` that
    nearly filled a pool branch (2026-10-24) cannot come back through them. 4K is a
    deliberate per-item choice: `Movies-2160p` exists so 4K is possible without the
    remux class.
    
    **What `bakuran-infra/opentofu/media/` owns** (declarative, state in R2
    `opentofu/media/terraform.tfstate`):
    
    | Object | Notes |
    | --- | --- |
    | `quality_definition` sizes (27) | the size caps — see below |
    | root folders | `/movies`, `/tv` — **imported**, not created |
    | Telegram notifications | one per app, failure signals only |
    
    still imperative: download clients and Prowlarr indexers/applications
    (`scripts/media-stack-setup.sh`).
    
    **Size caps (added 2026-10-24):** stock Radarr/Sonarr ship `maxSize: null`
    for **every** 2160p class — that is how a 68G remux got in. Caps in MB/min:
    720p 22 · 1080p **35** (2.1 GB/h) · 1080p remux 60 · 2160p **250** (15 GB/h) ·
    2160p remux 400. Evidence: 60-min 1080p episode ≈ 30 MB/min, the 34GB 2160p
    WEB-DL ≈ 309, the 68G remux ≈ 620 — so 250 blocks remuxes and the fattest
    WEB-DLs while admitting normal 4K. (A first draft used 20/55 MB/min, which would
    have rejected every real 4K WEB-DL; do not go back to it.)
    
    **Notifications** post to the same Telegram bot/chat Alertmanager uses
    (`implementation Telegram`, `config_contract TelegramSettings`; token from BWS
    `telegram-bot-token`). Failure signals only — health issue/restored, app update,
    manual interaction. Grab/import/upgrade are **off** so a TV library does not
    produce a message per episode.
    
    Operating notes: the *arr hostPorts are unreachable from `nix-station`, so apply
    over `kubectl -n media port-forward svc/radarr 17878:7878` (and 18989 for sonarr)
    with `TF_VAR_*_url=http://127.0.0.1:<port>`. Acceptance test for every change is
    that a follow-up `plan` reports **no changes** — otherwise the declaration is
    decoration. Testing a notification needs the *full object* POSTed to
    `/notification/test` (`/{id}` is 405; a bare `{"id":…}` fails validation).
    
    Toleration notes that cost time:
    
    - The image is pinned at **7.4.0** (v7 schema). `recyclarr config create` pulls
    templates from the `config-templates` repo's **master**, which is already **v8** —
    so its output is rejected (`Property 'trash_id' not found`). Spell profiles out
    by name/qualities instead of copying templates.
    - **Do not set `quality_definition`.** TRaSH's current presets are `Max = 1000
      (Unlimited)` for *every* quality; applying them removes the 1080p cap and keeps
      2160p unlimited. Sizes belong to the Tofu layer so only one owner touches them.
    - `--preview` (not `--dry-run`) is the dry run; `--debug` is the verbose flag.
    - `reset_unmatched_scores` must be an object (`enabled: false` keeps existing CF
      scores). It is false on purpose.
    
    Dry run / verify:
    
    ```bash
    ssh ... .81 'k3s kubectl -n media create job --from=cronjob/recyclarr rr-check-$(date +%s)'
    ssh ... .81 'k3s kubectl -n media logs job/rr-check-... -c recyclarr | tail -40'
    ```
    
    Existing items keep whatever profile they already had — recyclarr creates/updates
    profiles, it does not reassign media. Reassigning the 3 4K movies to
    `Movies-1080p` is a deliberate per-item decision (or a follow-up script), not an
    automatic one.
    
    ## Login alerts
    
    Three CronJobs in `monitoring` POST to Alertmanager → Telegram:
    - `access-login-watch`, Cloudflare Access logins (admin/media apps)
    - `jellyfin-login-watch`, Jellyfin `AuthenticationSucceeded/Failed` (API key)
    - `immich-login-watch`, new rows in Immich's `session` table
    
    ## Known gotchas
    
    1. **qBittorrent 5.x completion gap**, Sonarr/Radarr can keep showing a finished
       torrent as `trackedState=downloading` (while qBittorrent says `stalledUP`), so
       it never imports. **Fix:** `kubectl -n media rollout restart deploy/sonarr
       deploy/radarr` forces a re-sync + import. Durable fix: pin qBittorrent to
       4.6.x.
    2. **Anime back-catalogue**, Nyaa posts S1/S2 as **COMPLETE/Batch** releases;
       Sonarr's per-season auto-search won't grab them. Use the interactive search
       (or `sonarr_find_releases` + `sonarr_grab_release`) and pick the batch.
    3. **Subtitles**, BluRay rips often ship only **PGS** (image) subs, which web
       clients can't render ("not supported"). Bazarr downloads **SRT** text subs;
       `use_embedded_subs=false` + `ignore_pgs_subs=true` make it fetch them.
    4. **Jellyfin scans**, mergerfs gives no live file-watching, so new media only
       appears on the scheduled scan (set to **every 15 min**). Trigger manually with
       `jellyfin_scan`.
    5. **Preferred protocol**, Sonarr's delay profile is **torrent-first** so anime
       comes from Nyaa; live-action falls back to Usenet automatically.
    6. **4K slipping in**, a 2160p movie was once grabbed despite the profile; check
       the profile's allowed qualities if big files appear.
    7. **4K HDR on remote clients**, a 4K HDR HEVC file transcodes to **4K / ~31 Mbps**
       by default, which chokes remote clients (they stop at 0ms). Fixed server-side:
       per-user `RemoteClientBitrateLimit = 12 Mbps` (longer form: `12000000`) plus
       Jellyfin `KnownProxies = 127.0.0.1,10.42.0.0/16` and ingress
       `use-forwarded-headers=true`, so Jellyfin sees the real client IP and caps only
       remote clients. LAN clients (hostPort `:8096`) stay uncapped.
    8. **SyncPlay + a remote transcoding client**, the group waits for the slow member
       to buffer and re-syncs ("lost in time, correcting"), so it stutters. Smooth only
       when every member has a good link / can direct-play. Leaving the group fixes it.
    
    ## Not an issue: Sonarr's search is slow for shows with many titles
    
    Sonarr's interactive release search (`/release`) can take **several minutes**
    for a series with many TVDB alternate titles (The Apothecary Diaries has ~10,
    including French and German). Sonarr searches **every alternate title × every
    episode × every indexer**, and each Nyaa query takes ~1s, so it adds up to
    minutes. **This is expected behaviour, not a fault**, Nyaa itself answers in
    <1s and Prowlarr in ~1s/query; the cost is purely the query count. The alternate
    titles come from the metadata provider (TVDB/SkyHook) and are **not stored in
    Sonarr's DB**, so they can't be trimmed. Preferred approach: trigger an async
    search (`sonarr_season_search`) and poll the queue, rather than blocking on the
    interactive search. Known, accepted, harmless.
    
    ## Rebuild
    
    The *arr wiring is declarative: `bakuran-infra/scripts/media-stack-setup.sh`
    (root folders, clients, Prowlarr apps/indexers, Jellyfin users/libraries/HW-accel/
    subtitles/scan), plus `media-quality-setup.sh`, `media-bazarr-setup.sh`, and the
    secret seeders `media-setup-secret.sh` / `media-usenet-secret.sh`. The books
    stack is configured with `kavita-setup.sh` + `lazylibrarian-ui-setup.sh`.
    
    ## Jellyfin 12.2.0 — API and non-root notes (2026-10-23)
    
    - **Bitrate setting**: `RemoteClientBitrateLimit` is a field of
      **`ServerConfiguration`**, so the endpoint is `GET/POST /System/Configuration`.
      There is **no** `/System/Configuration/Playback` (it 404s). The one-shot Job
      `bakuran-gitops/manifests/monitoring/jellyfin-bitrate.yaml` sets it to `0`
      (unlimited; the server stops forcing transcodes).
    - **Auth header**: Jellyfin 12.2.0 requires
      `Authorization: MediaBrowser Client="...", Device="...", DeviceId="...", Version="1.0.0"`.
      `X-Emby-Authorization` returns **400**, `X-Emby-Token` returns **401**.
      `media-stack-setup.sh` was fixed to use `Authorization`.
    - **Non-root**: the Deployment runs as **UID/GID 1000** (was root). A root
      `fix-ownership` init chowns the config PVC (`/config`, 211M) and, once, the
      transcode cache (`/cache`). `privileged: true` is retained for `/dev/dri`.
    - **QSV as non-root**: `/dev/dri/renderD128` is mode `0666` (`card0` is
      `root:video`), so any UID can use QSV. Verified encoders include `h264_qsv`,
      `hevc_qsv`, `av1_qsv`, `tonemap_vaapi`.
    - **Users**: `gio` (admin), `anton`, `ciceley`, `delfin`, `guest`, `trish` (the
      last two non-admin). Passwords in Secrets Manager as `jellyfin-<name>`;
      `trish`/`guest` are also in the personal Bitwarden vault.
    - **`root_squash`**: not safe here — `/mnt/media` is mergerfs-as-root over NFS,
      see `HARDENING.md`.
    
    ## Downloads egress allowlist (2026-10-23)
    
    SABnzbd is restricted (CiliumNetworkPolicy `sabnzbd-egress` in
    `bakuran-gitops/manifests/network-policies/downloads-egress.yaml`) to Frugal
    Usenet's networks on tcp/563,443,119: `62.164.182.0/24` (Usenet Solutions LLC)
    and `209.160.112.0/20` (Paradise Networks LLC) — the ranges
    `news.frugalusenet.com` resolves into. If Frugal adds ranges, downloads stall
    until the list is updated. qBittorrent keeps a broad public egress (RFC1918
    excluded); its privacy boundary is the host ProtonVPN kill switch.
    
    SABnzbd also needs three in-cluster/public holes the "usenet only" rule does not
    cover (added 2026-10-24, all narrow):
    
    | Destination | Port | Why |
    | --- | --- | --- |
    | `media`/`app=prowlarr` | 9696 | LazyLibrarian hands SAB a Prowlarr `/2/download` URL |
    | Cloudflare edge (`ips-v4`) | 443 | Prowlarr **301**s that URL to `api.nzbgeek.info`, which SAB fetches itself |
    | Frugal networks | 563/443/119 | article download (unchanged) |
    
    Sonarr/Radarr don't need either hole: they fetch the NZB in `media` and POST the
    body to SAB. Symptoms of a missing hole: `Grabbing 0%` + retry loop, with
    `Network unreachable` in SAB's log. Full tree in `RUNBOOK.md` → *LazyLibrarian is
    not downloading*.
