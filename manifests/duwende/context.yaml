    | 0. Baseline | done | 2026-10-18 | k3s policy controller present |
    | 1. Karakeep pilot | done | 2026-10-18 | ingress-only default deny; public 200, cross-namespace blocked, same-namespace works |
    | 2. Rollout | done | 2026-10-18 | one-shot with restore point; app namespaces covered |
