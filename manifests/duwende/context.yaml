       Verified: LAN NodePorts return `000`; the tunnel still serves every hostname.
    2. ~~**`root` ArgoCD app reads `OutOfSync`**~~ **FIXED (2026-10-13):** root cause was
       an invalid `spec.source.helm.includeCrds` in the `external-secrets` Application
       (not an ArgoCD field, the controller silently dropped it → permanent drift).
       Removed; `root` now syncs.
    3. **`miguelarbis.dev` is a 301 redirect** to `bismigel.dev` (Bulk Redirect), not
       its own site, intentional. `www.miguelarbis.dev` also routed.
    4. **Media pool branch imbalance** (`/mnt/media`, 2026-10-24) — mergerfs runs
       `category.create=epmfs`: a new file goes to the branch that already holds its
       directory, so **only branches that carry the library dirs can ever receive
       writes**. Two consequences, both seen today:
       - When the dirs existed only on `media-sda`, everything piled there; it hit
         **99% (3.9G free)**, below mergerfs' 4G `minfreespace`, and creates failed
         with `ENOSPC` **while `df /mnt/media` reported 789G free**. Symptom:
         LazyLibrarian imported a book to `/config`
         (`eBook dir ['/books'] not writeable, using /config`).
       - After `media-dirs` also created the dirs on `media-nvme`, new content went
         there instead and filled it: **12G free (91%)** within hours, while
         `remote82-sda` sat at 4%.
       - **Done (2026-10-24):** rebalanced by moving folders between branches —
         `9-1-1` (46G), `INVINCIBLE` (23G), `The Sopranos` (19G) → `remote82-sda`,
         and the two big nvme movies → `media-sda`. Every move was byte-verified
         before deleting the source; the pool serves the content throughout
         (mergerfs merges reads). Result: sda 54%, nvme 43%, remote82-sda 24%.
       - **Still open (needs a human):** the local branches are 369G against 300G+
         of media, so the trend is inevitable. Either create the library dirs on
         `remote82-sda` too (writes then depend on the NFS export from `.82`, which
         `media-dirs` deliberately avoided), or add local capacity, or stop growing.
       - Rebalance recipe: `RUNBOOK.md` → *LazyLibrarian is not downloading* → step 7.
       - Triage: `RUNBOOK.md` → *LazyLibrarian is not downloading* → step 7.
    
