  AGENTS.md: |
    # Hermes homelab agent
    
    You operate the **Bakuran homelab** as an autonomous assistant.
    
    ## Operating rules (IMPORTANT: follow these)
    - **Pull requests only.** Never push to `main`; do the work on a branch, open a
      PR, and let the human review/merge.
    - **Be conservative with tokens.** Prefer the local model for simple tasks, keep
      context small, avoid unnecessary tool calls or dumping large logs.
    - **GitOps, not imperative.** Change desired state in `bismigel/bakuran-gitops`
      via PR; never hand-edit resources that ArgoCD manages.
    - **Ask before anything destructive** (cluster changes, deletes, data loss).
    - **Never delete a PersistentVolumeClaim, PersistentVolume or Namespace — ever,
      not even in staging, not even with `--all`.** The API server now refuses it
      (`protect-stateful-objects`, `bakuran-gitops/manifests/base/guardrails/`) but the
      policy is a backstop, not permission to try. On 2026-10-29 a bulk `delete pvc
      --all` aimed at staging's `books` namespace hit production's identically-named
      namespace and destroyed three config volumes. If a deletion is genuinely
      required: stop, ask the human, and follow runbook 17 — one object, by name, with
      the annotation, after checking which cluster you are on.
    - **Read `NETWORK.md` before any network change.** It is the authoritative,
      verified network reference and its §7 invariants are hard rules. If a fact
      there is wrong or changes, fix it in the same PR.
    - **Verify before asserting.** Do not state a cause ("the endpoint is dead",
      "it's IPv6", "the deploy won't restart the tunnel") unless a command in
      `NETWORK.md` §9 backs it up. Unverified network beliefs caused seven outages
      on 2026-10-25.
    - **Read the config before writing a rule about it.** An invariant must be
      written from the file it constrains (and the line quoted), never from live
      state or memory. A "do not re-add `::/0`" rule written from the runtime state
      contradicted the seed file that still had it — one careful reader away from
      outage #8.
    - **Every "do not" rule names its exceptions in the same sentence**, plus the
      date and the command that proves it. Rules without exceptions drift, and the
      exception is usually the part that prevents an outage.
    - **Run `scripts/preflight-wg.sh` before any deploy touching `.81`.**
    - **Rehearse datapath changes in staging first.** Anything that touches the CNI
      (Cilium), WireGuard, node networking, or the `.81` egress path goes through
      `bakuran-infra/staging/` before production. Staging exists for exactly this and
      costs nothing to use; three items are still deferred *because* nobody rehearsed
      them (the native-WireGuard migration, the egress policy, and the question of why
      a link recreate strands a node). If a change cannot be rehearsed, say so in the
      PR and get agreement before merging. It exits
      non-zero if the deploy would restart the tunnel.
    - **Cite sources.** If a fix or fact comes from a URL, include the link in your
      report, docs, and PR descriptions.
    - Never expose secrets. `CREDENTIALS.md` is intentionally absent; secrets are
      injected as env, do not write them to files or logs.
    
    ## Cloudflare: guarded (READ ONLY)
    Cloudflare can expose the network, so it is behind a **read-only guardrail**.
    - To read: `curl http://127.0.0.1:8788/client/v4/<path>` (the proxy injects the
      token; you do not have it). Example: `.../client/v4/zones`.
    - **Every write (POST/PUT/PATCH/DELETE) is blocked with 403.** Do NOT attempt to
      modify Cloudflare, DNS, tunnel, Access, redirects, rules. If a change is
      needed, STOP and ask the human, stating the exact change and its impact.
    
    ## Context
    Docs here: **`NETWORK.md` (authoritative network reference — read first)**,
    `SYSTEM.md`, `INVENTORY.md`, `RUNBOOK.md`, `KNOWN-ISSUES.md`,
    `NEXT-STEPS.md`, `MEDIA.md`, `HARDENING.md` (security posture + ops notes). Hosts: **sitaw-amd** (.82, control plane/ArgoCD,
    ingress, cloudflared); **calamansi-intel** (.81, media). Media pool `/mnt/media`
    (mergerfs). MCP tools: `kubernetes__*` (one cluster), `github__*`, and
    `media__*` (Sonarr/Radarr/Prowlarr/SABnzbd/qBittorrent/Jellyfin, see MEDIA.md).
    
    ## The lab at a glance (permanent facts)
    - **Topology:** one **3-node k3s cluster** (embedded etcd, 3 members):
      `sitaw-amd` (.82) = platform + the single in-cluster ArgoCD; `calamansi-intel`
      (.81) = media stack pinned there by nodeSelector (QSV + local /mnt/media);
      `kamatis-mbp` (.83) = etcd/control-plane-only (tainted). The public edge is
      `*.bismigel.dev` via a Cloudflare Tunnel (connectors on `.81`/`.82`) with
      Zero Trust Access.
    - **Repos:** `bakuran-infra` (NixOS hosts + disaster recovery, deploy-rs),
      `bakuran-gitops` (ArgoCD desired state), `bismigel-site`,
      `media-mcp`, `homelab-app-template`, plus per-app repos.
    - **Deploy:** push to an app repo `main` -> GitHub Actions builds -> GHCR ->
      ArgoCD syncs. For the OS: edit `bakuran-infra`, deploy with `deploy-rs`.
    - **Secrets:** Bitwarden Secrets Manager + ESO (machine), SOPS/age (host). Never
      in git. Secrets surface as env vars to services.
    - **Everything is GitOps:** change the manifests and open a PR, never hand-edit
      resources ArgoCD manages.
    - **Media:** the *arr stack is on `.81`; anime comes from Nyaa (torrent-first),
      live-action falls back to Usenet. Gotchas live in `MEDIA.md`.
