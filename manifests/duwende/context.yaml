    # Platform migration plan
    
    Last updated: 2026-10-18
    
    Learnings and blog notes: [MIGRATION-LEARNINGS.md](MIGRATION-LEARNINGS.md)
    
    Goal: adopt the useful principles from the reference homelab without turning the
    lab into a rewrite. The reference is better at network isolation, environment
    separation and small, legible structure. This plan takes those lessons one phase
    at a time.
    
    Non-goals:
    
    - No CNI replacement. k3s already runs the built-in network policy controller.
    - No second environment until there is a real need for one.
    - No big-bang refactor of every manifest.
    - No change to the backup, delivery or observability paths without a rollback.
    
    Guardrails:
    
    - One phase per pull request.
    - Network policy normally goes one namespace at a time. The 2026-10-18 rollout
      was a deliberate one-shot with a restore point; future namespaces follow the
      one-at-a-time rule.
    - Verify public access, internal traffic and pod readiness before moving on.
    - Rollback is a revert of the PR; ArgoCD prunes the policy.
    - Do not start with kube-system, argocd, longhorn-system or monitoring.
    
    ## Restore point for the one-shot
    
    Created before the 2026-10-18 rollout:
    
    - Git tags `pre-platform-migration-2026-10-18` in `bakuran-gitops`,
      `homelab-context` and `bismigel-site`.
    - etcd snapshot
      `pre-platform-migration-2026-10-18-sitaw-amd-1792343580` on `.82`.
    - Fresh `credentials/` and `appdata/` backups in R2. The appdata backup now
      includes the live Hermes directory, with cache and sockets excluded.
    - Rollback: revert the network-policy PR and let ArgoCD prune it. Use the etcd
      snapshot only if cluster state itself is damaged.
    
    ## Phases
    
    ### Phase 0: Baseline
    
    Status: done (2026-10-18)
    
    - Confirmed k3s is not started with `--disable-network-policy`.
    - Confirmed no NetworkPolicies exist today.
    - Mapped the main traffic paths: ingress-nginx to apps, same-namespace calls,
      Prometheus scraping, media/downloads/books cross-namespace calls, and the
      Cloudflare tunnel terminating at ingress-nginx.
    - Chose Karakeep as the pilot because it has no Prometheus scrape annotations, no
      cross-namespace dependencies and no probes that could be blocked.
    
    ### Phase 1: Network policy pilot in `karakeep`
    
    Status: done (2026-10-18)
    
    Add an ingress-only default-deny policy. Allow:
    
    - pods in the same namespace, for Karakeep, Meilisearch and Chrome;
    - pods in `ingress-nginx`, for the public hostname.
    
    Do not restrict egress yet.
    
    Acceptance:
    
    - `https://karakeep.bismigel.dev` still returns the app.
    - Karakeep can reach Meilisearch and Chrome.
    - A pod outside the namespace cannot reach the Karakeep Service.
    - Pods stay Ready and do not restart.
    
    ### Phase 2: Network policy rollout
    
    Status: done (2026-10-18, one-shot with restore point)
    
    Ingress-only policies now cover:
    
    - `apps`, `homepage`, `duwende`: same namespace and ingress-nginx;
    - `books`: same namespace, ingress-nginx and media;
    - `media`: same namespace, ingress-nginx and duwende;
    - `default`: same namespace, ingress-nginx, media and monitoring;
    - `downloads`: same namespace, ingress-nginx, media and books;
    - `immich`: same namespace, ingress-nginx and monitoring.
    
    Egress remains open. Infrastructure namespaces are intentionally not managed.
    
    Jellyfin keeps a LAN-only `192.168.2.0/24:8096` exception for TV clients;
    the public path stays on the tunnel.
    
    Verified: public URLs return 200, all pods Ready, media to Jellyfin and
    LazyLibrarian work, Hermes can reach media-mcp, and a namespace without an
    explicit allow is refused.
    
    Note: the login watchers are pinned to sitaw-amd and wait five seconds after start. The media node NAT masks pod source IPs, and kube-router programs the policy after the pod starts.
    
    For future namespaces:
    
    - list the ingress sources before writing the policy;
    - allow same-namespace and ingress-nginx;
    - allow monitoring only where metrics are scraped;
    - verify the public URL, the background jobs and the backup path.
    
    ### Phase 3: Egress policy
    
    Status: done (app namespaces, 2026-10-18)
    
    All application namespaces now have default-deny egress with explicit DNS and
    same-namespace rules. Public HTTP(S) is allowed only where the app needs it.
    Private ranges are denied except for named dependencies. Infrastructure
    namespaces are still out of scope, and Cilium with Hubble remains the
    visibility upgrade.
    
    ### Phase 4: Golden path for new apps
    
    Status: done (2026-10-18)
    
    The app template now ships an ingress-only NetworkPolicy and secure defaults:
    non-root, no service-account token, seccomp, dropped capabilities, read-only
    root, probes and limits. New apps start from that instead of copying a live
    manifest directory.
    
    Use the existing app template instead of copying a manifest directory. Define
    the minimum an app must provide: namespace, deployment, service, ingress,
    resource limits, security context, probes, NetworkPolicy and a backup note.
    
    Do not build base/overlay directories for a second environment yet. Add them
    when a second environment exists, not before.
    
    ### Phase 5: Trust-zone edge
    
    Status: Kubernetes side ready; Cloudflare switch pending
    
    A second ingress controller (`ingress-nginx-admin`, class `nginx-admin`) is live
    on loopback NodePort 32081. No hostnames have moved yet. The remaining switch is
    the Cloudflare tunnel route for admin hostnames.
    
    Design first, then implement:
    
    - public apps on one edge path;
    - admin apps on another;
    - no shared ingress route between them.
    
    Possible shapes: one tunnel per trust zone, or two ingress classes with
    different Access policies. Keep the current two-connector tunnel until the new
    path is proven.
    
    ### Phase 6: Reduce bespoke glue
    
    Status: pending
    
    Inventory the setup scripts and one-off steps. Keep the ones that encode a real
    failure (path mounts, account roles, metadata parsing). Replace the rest with
    the golden path or a documented manual step. The goal is a smaller surface, not
    a smaller feature set.
    
    ### Phase 7: SRE follow-ups
    
    Status: in progress (SLOs done, restore verification timed, host rebuild pending)
    
    These are not from the reference repo, but the comparison confirmed them:
    
    - **SLOs:** blackbox probes, 99.5% 7d availability target, error budget and burn
    alerts are live in the Homelab SLOs dashboard.
    - **Restore verification:** ran on 2026-10-18 against the newest appdata archive in
      29 seconds. A full host rebuild is still pending.
    - run a full disaster-recovery rehearsal and record the time;
    - keep the image-pinning gap visible until it is closed.
    
    ## Progress
    
    | Phase | Status | Date | Notes |
    |---|---|---|---|
    | 0. Baseline | done | 2026-10-18 | k3s policy controller present |
    | 1. Karakeep pilot | done | 2026-10-18 | ingress-only default deny; public 200, cross-namespace blocked, same-namespace works |
    | 2. Rollout | done | 2026-10-18 | one-shot with restore point; app namespaces covered |
    | 3. Egress | done | 2026-10-18 | app namespaces; infra namespaces and Cilium visibility still open |
    | 4. Golden path | done | 2026-10-18 | template ships policy and secure defaults |
    | 5. Trust-zone edge | prepared | 2026-10-18 | admin ingress live on 32081; tunnel switch pending |
    | 6. Simplicity | pending | | ongoing |
    | 7. SRE follow-ups | in progress | 2026-10-18 | SLOs live; restore verification 29s; host rebuild pending |
    
    ## Cilium pilot
    
    Status: attempted and rolled back (2026-10-18)
    
    Cilium 1.20.3 came up with kube-proxy, but pod-to-service and external traffic
    failed. The uninstall left stale iptables and ip rules that broke etcd. Flannel
    was restored, the nodes were rebooted, and the media mounts were repaired. No
    data was lost. Cilium stays deferred.
  README.md: |
    # Homelab Context
    
    ## Why "Bakuran"
    
    Bakuran is Tagalog for the yard or enclosure behind a house, from *bakod*, a
    fence. It is the space where things get built, repaired, and occasionally taken
    apart to see how they work. This context describes that backyard lab: small,
    personal, and safe to break on purpose.
    
    > Operating context for the Bakuran homelab, kept in the **private**
    > `bismigel/homelab-context` repo so a future LLM/human has full context.
    >
    > **Secrets stay out of git.** `CREDENTIALS.md` is gitignored and lives only on
    > `nix-station` (the disaster-recovery copy is the age-encrypted credentials
