    ## Next engineering items (no human needed)
    
    -4. **Longhorn replicas live on the OS filesystem on `.80` and `.82`.** Not an incident —
       17/17 volumes healthy and each pressured disk has a dedicated sibling (`/mnt/data`
       137 G free on `.80`, `/mnt/media-nvme` 361 G free on `.82`) that would take a rebuild.
       But Longhorn's auto-created `default-disk-*` sits at `/var/lib/longhorn`, so replicas
       reserve **59 G of a 98 G root on `.80` and 48 G on `.82`**, and only 7 G is actually
       written (they are sparse). The day the data grows into its provisioned size, `/` fills
       and takes etcd and containerd with it.
       **The fix is disk eviction**, one node at a time, watching `longhorn:disk_scheduled_to_free_ratio`
       fall while volumes stay `healthy`:
       `kubectl -n longhorn-system patch node.longhorn.io <node> --type=json -p '[{"op":"replace","path":"/spec/disks/default-disk-<id>/allowScheduling","value":false},{"op":"replace","path":"/spec/disks/default-disk-<id>/evictionRequested","value":true}]'`
       Then set the chart's `defaultSettings.createDefaultDisk=false` so a new node does not
       recreate it. `.81` has to stay on root — it has no non-media disk, and putting Longhorn
       on a mergerfs branch would let a full media pool take the cluster's storage with it.
       **Until then the alerts are deliberately quiet at this level** (`> 0.9` warning,
       `> 1.0` critical, `gitops#310`): at 0.849 the cluster is healthy, and an alert that
       fires on a healthy setup trains people to ignore it.
    
    
    -3. **Egress NetworkPolicies for the infrastructure namespaces** — the next item on the
       blast-radius list, and the one that needs rehearsal. Today `apps`, `books`,
       `default`, `downloads`, `homepage`, `immich`, `media`, `karakeep` and `duwende`
       have default-deny egress with explicit allowlists. `monitoring`, `argocd`,
       `cert-manager`, `external-secrets`, `longhorn-system`, `kube-system`,
       `observability` and `opentelemetry-operator-system` do not: compromise anything in
       there and it can reach every pod in the cluster and the whole LAN.
       Why it is not done already: Prometheus must scrape every node and namespace;
       Alertmanager must reach the mail relay; cert-manager must reach ACME; ESO must reach
       Bitwarden; Longhorn replicas talk to each other on 9500-9505. Getting one of those
       wrong takes down alerting or storage — the exact failure the policies exist to
       prevent. **Rehearse in staging first** (AGENTS rule: CNI/network changes go through
       staging), starting with `monitoring` because its flows are the most enumerable
       (scrape targets + one mail/webhook destination). Cilium's answers are visible in
       `cilium-dbg monitor` / Hubble if it is enabled for the rehearsal.
    
    
    -1. ~~**`CronJobFailed` cannot see a CronJob that is still retrying.**~~ **DONE
       (2026-10-30, `gitops#305`):** `JobPodsFailing` watches containers in Job-owned pods
       that terminated with `reason=Error`, which is the signal that exists *during*
       retries. It carries a pod-age guard (`time() - kube_pod_created < 3600`) because
       failed pods linger after their job is replaced — without it one daily-job failure
       would page for days — plus `for: 10m` so a 1-minute CronJob's transient blip stays
       quiet. Validated against live Prometheus on three windows before merging: silent
       now, **fires** on the real failure window with the job name, suppressed once the
       same pods are aged past an hour. Original note: (found
       2026-10-30). `immich-login-watch` failed every minute for ~20 minutes and **no
       alert fired**, because `kube_job_status_failed` stays `0` while the Job is still
       burning through pod retries — the failure only becomes visible when the Job gives
       up, which for a 1-minute CronJob means the next Job has already started. The rule
       is right for completed failures and blind to the most common shape of one.
       Options: alert on `time() - kube_cronjob_status_last_successful_time` with a
       per-CronJob threshold (needs the schedule), or on Failed pods owned by a Job
       (`kube_pod_status_phase{phase="Failed"} * on(namespace,pod) group_left(owner_name)
       kube_pod_owner{owner_kind="Job"}`) with a generous `for:`. Neither is free of false
       positives; pick one and say why in the rule's comment.
    
    -2. ~~**A VIP that moves can strand a *follower's* ARP entry.**~~ **DONE
       (2026-10-30, `gitops#306`, `infra#180`):** the orphan-guard now also covers the
       mirror case — if this node does not hold the address and the address does not
       answer, it flushes the stale neighbour entry and the kernel re-resolves. Tested
       with a non-VIP address in a throwaway pod so the real address was never at risk.
       Original note: (2026-10-30). When the
       lease moved from `sitaw-amd` to `calamansi-intel`, `.80` kept an ARP entry mapping
       `192.168.2.100` to the **old** holder's MAC. Every VIP packet from `.80` went to a
       node that no longer had the address, so Cilium on `.80` could not reach the API
       (`TLS handshake timeout`), so it never programmed endpoints for its own pods, so
       cross-node traffic to `.80` was punted. The symptom was a restarting CronJob, 20
       minutes after a k3s restart, with **0 alerts**. Fix applied: `ip neigh del
       192.168.2.100 dev eno1` on `.80`; the entry re-resolved to the holder and Cilium
       recovered in under a minute. Worth automating: a follower could verify its ARP
       entry for the VIP resolves to the *current* holder's MAC, or kube-vip could send a
       gratuitous ARP on acquisition and periodically (`vip_arp_rate`). Runbook 20 now
       covers the manual path.
    
    
    0. **AppArmor for containers is blocked on packaging, not configuration.** The kernel
       LSM is on and `cri-containerd.apparmor.d` is loaded and enforced, but NixOS's k3s
       `containerd-shim-runc-v2` is built **without the apparmor tag**
       (`strings … | grep -ci apparmor` → 0), so `appArmorProfile: RuntimeDefault` fails
       with `CreateContainerError` and the runtime logs `apparmor spec opts: apparmor is
       not supported`. Options, in order of cost:
       1. **Overlay the k3s containerd** with `-tags apparmor` in `bakuran-infra`
          (`k3s.override`), then adopt `appArmorProfile` per workload and enforce it in CI
          the way PSA is enforced. Needs a real build and a staging rehearsal.
       2. **Re-authorise the threat model** and spend the effort elsewhere: seccomp
          `RuntimeDefault` is already default, PSA states a level on every namespace, and
          the admission policy bounds stateful deletes. Container AppArmor would add a
          second, weaker layer over seccomp.
       3. Do **not** ship `appArmorProfile` in manifests until 1 is done — it fails
          closed with a pod that never starts. Nothing sets it today.
    
       **Verdict (2026-10-30): option 2, deliberately.** The default profile containerd
       would apply allows `file,` (every path) and `network,` (every family) — it only
       denies kernel-surface primitives (mount, `/proc/sys`, `/sys/firmware`,
       `/proc/kcore`, `AF_ALG`, `AF_VSOCK`), most of which seccomp `RuntimeDefault`
       already denies. Concretely: Sonarr mounts the whole `/mnt/media` pool read-write,
       so the default profile would not protect the media library from a compromised
       Sonarr either. The real containment is a **custom `Localhost` profile** scoped to
       each workload's directories — and the cheaper version of the same win is not
       mounting the whole pool. Nothing on the incident list of the last two months
       (seven WireGuard outages, the PVC deletion, staging/prod) would have been
       prevented by an LSM; they were wrong *decisions*, not subverted *processes*.
    
       The one cheap win that is actually available today: confine **`cloudflared`** with
       a host profile. It is a systemd service, so it bypasses containerd entirely, and
       it is a network-facing process holding tunnel credentials. Worth doing on its own,
       not as part of a container-AppArmor project.
    
       Where the same effort buys more, in order: **digest pinning** (107 containers run
       a tag, so a flipped tag is arbitrary code — the only attack an adversary would
       actually pick), **egress NetworkPolicies**, and **scoping the agent's RBAC** (it is
       `system:masters`, and no LSM constrains `kubectl`).
    
    
    1. ~~**Tighten `AppProject/prod`.**~~ **DONE (2026-10-29):** 9 cluster-scoped
       kinds derived from ArgoCD's own resource trees (+2 for the guardrails), verified
       by forcing a sync of all 31 Applications — 0 `is not permitted in project`.
       **Still open:** the `AppProject` is applied by hand (`kubectl apply -f
       clusters/prod/projects.yaml`), so git and the cluster can disagree — they did,
       twice that day. It belongs in ArgoCD like everything else.
    2. ~~**Guardrails against the destructive mistake.**~~ **DONE (2026-10-29):**
       `protect-stateful-objects` (ValidatingAdmissionPolicy) denies DELETE on
       PVC/PV/Namespace without `bakuran.dev/allow-delete=true`; procedure in runbook 17.
       Still open from that incident: the agent runs as **cluster-admin** (the policy is
       the only barrier — a scoped ServiceAccount would be defence in depth), and the
       **AppProject is hand-applied** (it disagreed with git twice that day).
    3. ~~**A single failed CronJob run degrades an Application.**~~ **DONE (2026-10-29)**
       via the alert route rather than an `argocd-cm` health override: a `CronJobFailed`
       rule names the failed run directly (26 h freshness filter, because
       `kube_job_status_failed` stays 1 for every Job that ever failed), and
       `SmokeTestFailed` is inhibited while any cause-level alert fires — which is what
       stopped the all-night paging. `backoffLimit: 0` / `ttlSecondsAfterFinished` are in
       place. ArgoCD still rates a CronJob by its last run; that is left as honest
       behaviour.
    4. ~~**kube-vip: close the orphaned-address path.**~~ **DONE (2026-10-29):** the
       `orphan-guard` sidecar in the kube-vip pod removes the VIP when this node still has
       the address but **no kube-vip process holds it** — the exact state `sm.Kill()`
       leaves behind. It needs no API access: `shareProcessNamespace` makes the process
       visible and `/proc/[0-9]*/comm` is matched (not `cmdline`) so it cannot match its
       own arguments. Verified in a throwaway pod on a follower: the unmodified script
       logged `no kube-vip process here; removing orphaned 192.168.2.251/32 from gt` and
       the address was gone; in production all three pods run `2/2` and one node
       (`calamansi-intel`) holds the VIP through a handover. The lesson is worth keeping:
       my first version read the leader lease with `busybox wget`, which cannot verify a
       CA, under `hostNetwork` where `kubernetes.default.svc` does not resolve — it failed
       closed, so it looked healthy while doing nothing. **Rehearse the transport, not
       just the logic.**
    5. ~~**`applications/staging/status-api.yaml`**~~ **DONE (2026-10-30, `gitops#303`):** removed from production, along with the `staging` destination in `AppProject/prod`. Staging's own cluster runs the overlay. Original note: it still
       deploys a *staging* overlay into production. Moving it to `clusters/staging/apps/`
       prunes that namespace and workload from prod — a deliberate deletion, so it needs a
       decision, not a refactor.
    6. ~~**`books` mounts the media pool in the shared base.**~~ **WON'T DO — the premise
       was wrong (2026-10-29).** Moving the `hostPath` mounts into the prod overlay makes
       **`emptyDir` the production default** if the overlay patch is ever forgotten, i.e. a
       silent data-loss default instead of a pod that refuses to start. `hostPath` with
       `type: Directory` failing closed is the *correct* production behaviour; staging is
       the one that must say "no pool here". What was actually fragile was how staging
       overrode them: `volumes/1`, `/2`, `/3` by array index, where a reorder in the base
       would silently empty the wrong volume (possibly the `config` PVC). Each replacement
       is now preceded by a JSON-patch `test` of that slot's volume name, so a reorder
       **fails the build** (`gitops#297`). Add a *new* cluster's overlay the same way.
    7. **Empty-glob rule for CI** — carried into the Forgejo port (`ROADMAP.md` item 6):
       every CI step whose input is a glob must fail on an empty match.
