    ## 2026-10-28 — two empty partitions became Longhorn disks (**DONE**)
    
    Longhorn was at **178 Gi scheduled against ~294 Gi** of raw capacity, and that
    capacity was the *root filesystem* on each node — competing with the OS, images
    and the Nix store. `storage-over-provisioning-percentage` is 100, so it would
    soon refuse new volumes.
    
    Two partitions held essentially nothing:
    
    | Partition | Size | Used |
    |---|---|---|
    | `.82:/mnt/media-nvme` | 340 G | 4 K, **0 files** (a mergerfs branch) |
    | `.80:/mnt/data` | 135 G | 1.8 G (the superseded Immich copy) |
    
    Both became Longhorn *disks*: **max 294 → 767 G, free 162 → 637 G**.
    
    The snag, and it is worth remembering: **`/mnt/media` could not be remounted
    while pods held it open**, and `kubectl scale` is undone by ArgoCD self-heal
    within seconds. The first deploy failed on `Failed to restart mnt-media.mount`
    and rolled back, leaving the pool referencing an unmounted branch. The fix was
    the same pattern as the Immich migration: scale down *in git*, remount, scale
    back up in a second commit.
    
    A second blocker was hiding underneath: the **weekly media mirror was still
    running** and holding `/mnt/media` open (visible as `rsync` with a cwd inside the
    pool). It is resumable, so it was stopped, the remount done, and the job
    restarted — it resumed at 233 G of 278 G.
    
    Media lost no data: the removed branch was empty, the pool now has three
    branches (826 G, 524 G free), and every media app came back to `Running`.
    
    ## 2026-10-28 — every admin hostname returned 404 (**FIXED**)
    
    All 15 admin-class hostnames (arr apps, Grafana, ArgoCD, Homepage, Hermes,
    Lazylibrarian, Longhorn, Prometheus, runbook, private API) returned **404**. Behind
    Cloudflare Access this looks like an application bug; it was ingress wiring.
    
    The cause is a two-part rule that ingress-nginx applies to every Ingress:
    
    1. the referenced **`IngressClass.spec.controller`** must equal the controller's
       `--controller-class`, and
    2. the class **name** must equal the controller's `--ingress-class`.
    
    The admin release ran with the chart default `--controller-class` of
    `k8s.io/ingress-nginx`, while `IngressClass/nginx-admin` declared
    `k8s.io/ingress-nginx-admin`. Neither controller matched, so every Ingress using
    that class was ignored and nginx had no `server_name` for those hosts.
    
    Fixed by giving the admin release `controller.ingressClassResource.controllerValue:
    k8s.io/ingress-nginx-admin`, matching the class.
    
    Three things made this slower than it should have been:
    
    - **`IngressClass.spec.controller` is immutable.** It cannot be patched, so the
      object has to be deleted and recreated — ArgoCD reported a failed patch until
      it was.
    - **The first fix was wrong.** Setting the *class* to `k8s.io/ingress-nginx`
      instead made both controllers claim both classes; the admin hostnames still
      404'd and the admin controller started syncing public ingresses. The
      distinguishing field is `--controller-class`, not `--ingress-class`.
    - **A no-op edit.** One `str.replace` did not match the file (the comment text
      had changed) and reported success anyway, so `controllerValue` was never added.
      Verified afterwards with `yq` and by reading the live Deployment args.
    
    ## 2026-10-28 — the "Terraform state is on one laptop" gap was wrong
    
    The structural assessment claimed OpenTofu state lived only on the admin
    workstation. That was inferred from a `terraform.tfstate` file in the working
    directory — without checking `.terraform/terraform.tfstate` (which records the
    backend) or the bucket.
    
    It is remote already: `backend "s3"` against R2, key
    `opentofu/cloudflare/terraform.tfstate`, `use_lockfile = true`, plus an
    age-encrypted copy (`opentofu/cloudflare-*.tfstate.age`). `tofu init` succeeds
    against R2 and `tofu state pull` returns serial 6 from it.
    
    What remains is smaller: the local `terraform.tfstate` and `.backup` are stale
    leftovers that could mislead someone into thinking they are authoritative. They
    are gitignored; treat R2 as the only copy, and remember the local files are
    snapshots from whenever a plan last ran.
    
    This is the same failure the assessment warns about — asserting a fact from an
    artifact's presence instead of a command's output.
    
    ## 2026-10-30 — Longhorn had 120 MiB of room and no alert said so (**OPEN**)
    
    Found while looking for an unused partition, not while looking for a problem.
    
    Longhorn was at **178 G scheduled**, and **105 G of it sat on the root
    filesystem** of the three nodes — `/var/lib/longhorn`, the same ext4 that carries
    etcd, k3s state and the containerd image store. Per disk:
    
    | Node | Disk | Scheduled | Free for another replica |
    |---|---|---|---|
    | `.82` | `default-disk` (root fs) | 45 G | **120 MiB** |
    | `.80` | `default-disk` (root fs) | 55 G | 9.9 G |
    | `.80` | `/mnt/data` (dedicated) | 34 G | 94 G |
    | `.82` | `/mnt/media-nvme` (dedicated) | 39 G | 298 G |
    | `.81` | `default-disk` (root fs) | 5 G | 36 G |
    
    The two dedicated partitions from the 2026-10-28 entry were registered and
    healthy. **What was missing was anything that moved replicas onto them.** A
    `default-disk` is created automatically at `/var/lib/longhorn` on every node, the
    `longhorn` StorageClass sets no `diskSelector`, and nothing retires the old disk.
    So the dedicated capacity sat 93% empty while the OS filesystems took the load.
    
    **Why no alert fired: the rules compared the wrong number.**
    `LonghornDiskStorageLow` is `usage / capacity > 0.9`. The `.82` root disk read
    **43% used** while having 120 MiB of room for the next replica. Longhorn admits a
    replica when *(free space − scheduled)* is positive, and it exports scheduled
    bytes per **node** only, so the per-disk figure did not exist as a metric.
    
    What was done:
    
    1. **Reclaimed 41 G of OS filesystems** — `k3s crictl rmi --prune` plus
       `nix-collect-garbage --delete-older-than 14d` on all three nodes. `.81` went
       62% → 41%, `.82` 57% → 43%, `.80` 36% → 27%. Most of it was dead container
       images: kubelet only garbage-collects at 85% usage, so 13-16 G per node had
       been parked there indefinitely. This bought `.82` 13 G instead of 120 MiB.
    2. **New alerting** — a recording rule `longhorn:disk_scheduled_to_free_ratio`
       (scheduled bytes per disk path ÷ free space of that path's filesystem, built
       from `longhorn_replica_info` × volume size and node-exporter), plus
         `LonghornDiskSchedulingHeadroomLow` (**> 0.9, held for an hour**) and
         `LonghornDiskSchedulingOverCommitted` (**> 1.0**) and `RootFilesystemDaysToFull`.
         Both thresholds were lowered again the day they shipped, from 0.75/0.95: at 0.75
         the warning fired on two *healthy* disks, because replicas are sparse —
         `sitaw-amd` promises 48 G on a root disk holding 7 G of data. The incident this
         rule exists for was 120 MiB against 45 G promised (~0.997), so 0.9 still catches
         it while a healthy cluster stays silent.
      3. **No alert for "replicas are on the root filesystem"** —
         `LonghornDataOnRootFilesystem` was written, deployed and removed on 2026-10-30.
         Every node here keeps replicas under `/var/lib/longhorn`, so it fired on all three
         immediately, and it would have stayed red until the migration below finished. A
         condition that is permanently true is a **panel** ("Longhorn on OS filesystems" on
         the Longhorn dashboard), not a page. The inventory half is covered by the weekly
         `docs-verify` check, which compares the registered disks against runbook page 21.
      4. **Procedure documented** as runbook page 21.
    
    Still open (see runbook page 21 for the commands):
    
    - **Move the 100 G off the root filesystems** by deleting the replicas on those
      disks so Longhorn rebuilds them onto `/mnt/data` and `/mnt/media-nvme`. Nothing
      has been moved yet; `allowScheduling` is still on everywhere.
    - **Then leave scheduling off on the root-fs disks**, and add a
      `longhorn-dedicated` StorageClass with `diskSelector: dedicated` so new volumes
      cannot drift back.
    - **Disk registration, tags and `allowScheduling` are not in git.** They live only
      in the `nodes.longhorn.io` custom resource, so a disko reinstall silently
      registers a fresh `default-disk-*` with scheduling on. This is the one piece of
      cluster state that ArgoCD cannot reconcile, and it is what this entry exists to
      make findable. `docs-verify` now asserts the documented disk inventory so a
      reinstall shows up as drift instead of as a full disk six weeks later.
