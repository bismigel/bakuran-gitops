# Declarative baseline for ZeroClaw's config.toml. The init-container seeds this
# only when /zeroclaw-data/.zeroclaw/config.toml is missing (fresh/restored PVC),
# so a wiped volume comes back configured. Secrets (DeepSeek key, Telegram bot
# token) are injected at runtime via env from Bitwarden/ESO, so they are NOT here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroclaw-config-seed
  namespace: zeroclaw
data:
  config.toml: |
    schema_version = 3

    [gateway]

    [providers.models.openai.local]
    kind = "openai-compatible"
    wire_api = "chat_completions"
    uri = "http://192.168.2.12:11434/v1"
    model = "qwen3:8b"
    api_key = "ollama"

    [peer_groups.telegram_default]
    admin_for_agent_scope = true
    agents = []
    channel = "telegram.default"
    external_peers = ["607008268"]
    ignore = []
    output_modality = "mirror"

    [providers.models.deepseek.default]
    model = "deepseek-chat"
    fallback = ["openai.local"]

    [providers.models.openai]

    [channels]

    [channels.telegram]

    [channels.telegram.default]
    enabled = true
    api_base_url = "https://api.telegram.org"
    approval_timeout_secs = 120
    bot_token = ""
    draft_update_interval_ms = 1000
    excluded_tools = []
    interrupt_on_new_message = false
    mention_only = false
    reply_min_interval_secs = 0
    reply_queue_depth_max = 0
    stream_mode = "off"

    [agents]

    [agents.zeroclaw]
    acp_enable_mcp = false
    delegate_same_risk_profile = true
    enabled = true
    model_provider = "deepseek.default"
    risk_profile = "default"
    channels = ["telegram.default"]
    classifier_provider = ""
    cron_jobs = []
    delegates = []
    knowledge_bundles = []
    mcp_bundles = ["homelab"]
    runtime_profile = ""
    skill_bundles = []
    summary_provider = ""
    transcription_provider = ""
    tts_provider = ""

    [agents.zeroclaw.a2a]
    published = false
    exposed_skills = []

    [agents.zeroclaw.identity]
    format = "openclaw"

    [agents.zeroclaw.memory]
    backend = "sqlite"

    [agents.zeroclaw.precheck]
    enabled = true
    timeout_secs = 5

    [agents.zeroclaw.workspace]
    unrestricted_filesystem = false
    read_memory_from = []

    [risk_profiles]

    [risk_profiles.default]
    allowed_roots = ["/context"]
    block_high_risk_commands = true
    always_ask = []
    require_approval_for_medium_risk = true
    workspace_only = true
    shell_env_passthrough = ["PATH", "HOME", "GH_TOKEN", "KUBERNETES_SERVICE_HOST", "KUBERNETES_SERVICE_PORT", "KUBERNETES_SERVICE_PORT_HTTPS", "KUBERNETES_PORT", "KUBERNETES_PORT_443_TCP", "KUBERNETES_PORT_443_TCP_ADDR", "KUBERNETES_PORT_443_TCP_PORT", "KUBERNETES_PORT_443_TCP_PROTO", "TERM", "LANG", "TMPDIR"]
    allowed_tools = []
    excluded_tools = []
    auto_approve = ["file_read", "memory_recall", "web_search_tool", "web_fetch", "calculator", "glob_search", "content_search", "image_info", "weather", "tool_search", "browser", "browser_open"]
    firejail_args = []
    forbidden_paths = ["/etc", "/root", "/home", "/usr", "/bin", "/sbin", "/lib", "/opt", "/boot", "/dev", "/proc", "/sys", "/var", "/tmp", "~/.ssh", "~/.gnupg", "~/.aws", "~/.config"]
    level = "supervised"
    allowed_commands = ["kubectl", "gh", "git", "helm", "argocd", "jq", "curl", "wget", "tar", "unzip", "gzip", "mkdir", "rm", "mv", "cp", "sed", "awk", "sort", "uniq", "tee", "xargs", "bash", "sh", "env", "printenv", "which", "ssh", "grep", "find", "ls", "cat", "head", "tail", "wc", "echo", "pwd", "date", "df", "du", "uname", "uptime", "hostname", "python3", "pip", "node", "free", "openssl", "base64", "diff", "test", "sleep", "touch", "ln", "chmod", "stat", "yq"]

    [risk_profiles.default.delegation_policy]
    mode = "forbidden"

    [providers]

    [providers.models]

    [providers.models.deepseek]

    [mcp]
    enabled = true

    [[mcp.servers]]
    name = "kubernetes"
    transport = "http"
    url = "http://kubernetes-mcp.zeroclaw.svc.cluster.local:8080/mcp"

    [mcp_bundles.homelab]
    servers = ["kubernetes"]
