apiVersion: v1
kind: Namespace
metadata:
  name: zeroclaw
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeroclaw
  namespace: zeroclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zeroclaw-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: zeroclaw
    namespace: zeroclaw
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zeroclaw-data
  namespace: zeroclaw
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: zeroclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: github-token
  data:
    - secretKey: gh-token
      remoteRef:
        key: github-pat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-context
  namespace: zeroclaw
data:
  AGENTS.md: |
    # Homelab context
    This pod runs the ZeroClaw agent with full control of the Bakuran homelab.
    - `kubectl` is authenticated by the in-cluster ServiceAccount (cluster-admin).
    - `gh` is authenticated via GH_TOKEN.
    - Human-readable docs are mounted at /context/ (SYSTEM.md, INVENTORY.md).
    GitOps: everything lives in bismigel/bakuran-gitops (ArgoCD on sitaw-amd). Change
    manifests in Git, never the cluster; ArgoCD reconciles them.
  SYSTEM.md: |
    # Bakuran homelab
    NixOS hosts, k3s, ArgoCD GitOps, Cloudflare Tunnel + Access.
    - sitaw-amd (192.168.2.82): hosting + platform + the single ArgoCD control plane,
      ingress-nginx (NodePort 32080/32443), cloudflared.
    - calamansi-intel (192.168.2.81): media-only (Jellyfin/QuickSync, *arrs, qBittorrent),
      registered as an external cluster in the one ArgoCD.
    Secrets: machine = Bitwarden Secrets Manager + External Secrets Operator
    (ClusterSecretStore "bitwarden"); host = SOPS/age (sops-nix).
    Public ingress: Cloudflare Tunnel -> ingress, subdomains on *.bismigel.dev, gated by
    Cloudflare Access (Zero Trust).
  INVENTORY.md: |
    # Repos (github.com/bismigel)
    - bakuran-infra: NixOS hosts + deploy-rs + SOPS + scripts + docs/REBUILD.md
    - bakuran-gitops: ArgoCD desired state (applications/ + manifests/) for both clusters
    - bismigel-site: Org -> pandoc -> Hugo blog
    - homelab-app-template, status-api, private-api
    # Applications managed by ArgoCD
    media (calamansi-intel), monitoring (Grafana/Prometheus), external-secrets,
    ingress-headers, node-exporter (appset), zeroclaw.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeroclaw
  namespace: zeroclaw
  labels:
    app: zeroclaw
spec:
  replicas: 1
  strategy:
    type: Recreate          # ZeroClaw is single-writer per workspace
  selector:
    matchLabels:
      app: zeroclaw
  template:
    metadata:
      labels:
        app: zeroclaw
    spec:
      serviceAccountName: zeroclaw
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fetch-tools
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache curl tar gzip >/dev/null
              cd /opt/bin
              curl -fsSL -o kubectl https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
              curl -fsSL -o gh.tgz https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
              tar xzf gh.tgz --strip-components=2 gh_2.102.0_linux_amd64/bin/gh
              rm gh.tgz
              curl -fsSL -o jq https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
              chmod +x kubectl gh jq
          volumeMounts:
            - name: tools
              mountPath: /opt/bin
      containers:
        - name: zeroclaw
          image: ghcr.io/zeroclaw-labs/zeroclaw:debian
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway
              containerPort: 42617
          env:
            - name: PATH
              value: /opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: ZEROCLAW_gateway__host
              value: "0.0.0.0"
            - name: ZEROCLAW_gateway__allow_public_bind
              value: "true"
            # keep the pairing gate on: the web UI needs a paircode to get in
            - name: ZEROCLAW_gateway__require_pairing
              value: "true"
            # reuse the GitHub token from Bitwarden
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: gh-token
                  optional: true
            # git identity + credential helper (uses gh -> GH_TOKEN), declarative
            - name: GIT_CONFIG_COUNT
              value: "3"
            - name: GIT_CONFIG_KEY_0
              value: user.name
            - name: GIT_CONFIG_VALUE_0
              value: ZeroClaw Agent
            - name: GIT_CONFIG_KEY_1
              value: user.email
            - name: GIT_CONFIG_VALUE_1
              value: bismigel@pm.me
            - name: GIT_CONFIG_KEY_2
              value: credential.helper
            - name: GIT_CONFIG_VALUE_2
              value: "!/usr/bin/env gh auth git-credential"
            # DeepSeek key from Bitwarden -> providers.models.deepseek.default.api_key
            - name: ZEROCLAW_providers__models__deepseek__default__api_key
              valueFrom:
                secretKeyRef:
                  name: deepseek-api-key
                  key: api_key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /zeroclaw-data
            - name: context
              mountPath: /context
              readOnly: true
            - name: tools
              mountPath: /opt/bin
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zeroclaw-data
        - name: context
          configMap:
            name: homelab-context
        - name: tools
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zeroclaw
  namespace: zeroclaw
spec:
  selector:
    app: zeroclaw
  ports:
    - name: gateway
      port: 42617
      targetPort: 42617
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeroclaw
  namespace: zeroclaw
spec:
  ingressClassName: nginx
  rules:
    - host: agent.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeroclaw
                port:
                  number: 42617
