apiVersion: v1
kind: Namespace
metadata:
  name: zeroclaw
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeroclaw
  namespace: zeroclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zeroclaw-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: zeroclaw
    namespace: zeroclaw
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zeroclaw-data-lh
  namespace: zeroclaw
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: zeroclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: github-token
  data:
    - secretKey: gh-token
      remoteRef:
        key: github-pat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-bot-token
  namespace: zeroclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: telegram-bot-token
  data:
    - secretKey: bot-token
      remoteRef:
        key: telegram-bot-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeroclaw
  namespace: zeroclaw
  labels:
    app: zeroclaw
spec:
  replicas: 1
  strategy:
    type: Recreate          # ZeroClaw is single-writer per workspace
  selector:
    matchLabels:
      app: zeroclaw
  template:
    metadata:
      labels:
        app: zeroclaw
    spec:
      serviceAccountName: zeroclaw
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fetch-tools
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Best-effort: cache tools on the PVC and never block pod startup.
              set +e
              CACHE=/zeroclaw-data/tools
              mkdir -p "$CACHE" /opt/bin 2>/dev/null
              if [ ! -x "$CACHE/kubectl" ] || [ ! -x "$CACHE/gh" ] || [ ! -x "$CACHE/jq" ]; then
                apk add --no-cache curl tar gzip >/dev/null 2>&1
                cd "$CACHE" || exit 0
                curl -fsSL --retry 3 -o kubectl https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
                curl -fsSL --retry 3 -o gh.tgz https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
                [ -s gh.tgz ] && tar xzf gh.tgz --strip-components=2 gh_2.102.0_linux_amd64/bin/gh 2>/dev/null
                rm -f gh.tgz
                curl -fsSL --retry 3 -o jq https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
                chmod +x kubectl gh jq 2>/dev/null
              fi
              cp -f "$CACHE"/* /opt/bin/ 2>/dev/null
              chmod +x /opt/bin/* 2>/dev/null
              mkdir -p /zeroclaw-data/run
              chown 65534:1000 /zeroclaw-data/run 2>/dev/null
              chmod 700 /zeroclaw-data/run 2>/dev/null
              # Seed a baseline config only when the PVC has none (fresh/restored).
              CONF=/zeroclaw-data/.zeroclaw/config.toml
              if [ ! -s "$CONF" ]; then
                mkdir -p /zeroclaw-data/.zeroclaw
                cp /config-seed/config.toml "$CONF" 2>/dev/null
                chown -R 65534:1000 /zeroclaw-data/.zeroclaw 2>/dev/null
              fi
              exit 0
          volumeMounts:
            - name: tools
              mountPath: /opt/bin
            - name: data
              mountPath: /zeroclaw-data
            - name: config-seed
              mountPath: /config-seed
              readOnly: true
      containers:
        - name: zeroclaw
          image: ghcr.io/zeroclaw-labs/zeroclaw:debian
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway
              containerPort: 42617
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    sleep 3;
                    cp -f /context/AGENTS.md /zeroclaw-data/.zeroclaw/agents/zeroclaw/workspace/AGENTS.md 2>/dev/null;
                    if [ -n "$GH_TOKEN" ]; then
                    zeroclaw config set mcp.servers.github.headers.Authorization "Bearer $GH_TOKEN" --no-interactive >/dev/null 2>&1 || true;
                    fi;
                    true
          env:
            - name: PATH
              value: /opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: ZEROCLAW_gateway__host
              value: "0.0.0.0"
            - name: ZEROCLAW_gateway__allow_public_bind
              value: "true"
            # daemon RPC socket in a private dir (/run is not writable here)
            - name: ZEROCLAW_SOCKET
              value: /zeroclaw-data/run/zeroclaw.sock
            # keep the pairing gate on: the web UI needs a paircode to get in
            - name: ZEROCLAW_gateway__require_pairing
              value: "true"
            # reuse the GitHub token from Bitwarden
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: gh-token
                  optional: true
            # git identity + credential helper (uses gh -> GH_TOKEN), declarative
            - name: GIT_CONFIG_COUNT
              value: "3"
            - name: GIT_CONFIG_KEY_0
              value: user.name
            - name: GIT_CONFIG_VALUE_0
              value: ZeroClaw Agent
            - name: GIT_CONFIG_KEY_1
              value: user.email
            - name: GIT_CONFIG_VALUE_1
              value: bismigel@pm.me
            - name: GIT_CONFIG_KEY_2
              value: credential.helper
            - name: GIT_CONFIG_VALUE_2
              value: "!/usr/bin/env gh auth git-credential"
            # DeepSeek key from Bitwarden -> providers.models.deepseek.default.api_key
            - name: ZEROCLAW_providers__models__deepseek__default__api_key
              valueFrom:
                secretKeyRef:
                  name: deepseek-api-key
                  key: api_key
                  optional: true
            # Telegram bot token from Bitwarden -> channels.telegram.default.bot_token
            - name: ZEROCLAW_channels__telegram__default__bot_token
              valueFrom:
                secretKeyRef:
                  name: telegram-bot-token
                  key: bot-token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /zeroclaw-data
            - name: context
              mountPath: /context
              readOnly: true
            - name: tools
              mountPath: /opt/bin
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 2Gi
        # ---- Cloudflare guardrail sidecar ----
        # Holds the CF token (never in the agent's env) and proxies read-only
        # calls; ALL writes are blocked with 403. The agent reaches it at
        # http://127.0.0.1:8788. Changes must be requested from the human.
        - name: cf-proxy
          image: nginx:alpine
          ports:
            - name: cfproxy
              containerPort: 8788
          env:
            - name: CF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: token
                  optional: true
          volumeMounts:
            - name: cf-proxy-config
              mountPath: /etc/nginx/templates
              readOnly: true
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zeroclaw-data-lh
        - name: context
          configMap:
            name: homelab-context
        - name: tools
          emptyDir: {}
        - name: config-seed
          configMap:
            name: zeroclaw-config-seed
        - name: cf-proxy-config
          configMap:
            name: cf-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: zeroclaw
  namespace: zeroclaw
spec:
  selector:
    app: zeroclaw
  ports:
    - name: gateway
      port: 42617
      targetPort: 42617
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeroclaw
  namespace: zeroclaw
spec:
  ingressClassName: nginx
  rules:
    - host: agent.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeroclaw
                port:
                  number: 42617
---
# Cloudflare token for the guardrail sidecar (never in the agent's env).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: zeroclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: cloudflare-api-token
  data:
    - secretKey: token
      remoteRef:
        key: cloudflare-api-token
---
# Read-only Cloudflare proxy. Injects the token and 403s every write.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cf-proxy-config
  namespace: zeroclaw
data:
  default.conf.template: |
    server {
        listen 127.0.0.1:8788;
        proxy_ssl_server_name on;
        resolver 1.1.1.1 ipv6=off;

        # Guardrail: every state-changing request is blocked. Cloudflare changes
        # are intentionally NOT available to the agent — ask the human.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 403 "Blocked by the Cloudflare guardrail: changes require explicit human approval.\n";
        }

        location / {
            proxy_pass https://api.cloudflare.com;
            proxy_set_header Authorization "Bearer ${CF_TOKEN}";
            proxy_set_header Host api.cloudflare.com;
            proxy_set_header Accept-Encoding "";
        }
    }
