  RUNBOOK.md: |
    # Runbook
    
    All commands assume `nix-station` unless noted. SSH key: `~/.ssh/id_ed25519`.
    
    ## Check cluster status
    
    ```bash
    ssh -i ~/.ssh/id_ed25519 root@192.168.2.82 'k3s kubectl -n argocd get applications; k3s kubectl -n apps get pods'
    ssh -i ~/.ssh/id_ed25519 root@192.168.2.81 'k3s kubectl get pods -A'
    ```
    
    ## Deploy a NEW app
    
    ```bash
    # 1. Create from template (public if the image can be public)
    gh repo create bismigel/<app> --private --template bismigel/homelab-app-template
    gh repo clone bismigel/<app> && cd <app>
    
    # 2. Rename placeholders
    ./scripts/init.sh <app> <app>.ciceley.cc <port> apps bismigel
    
    # 3. Put your app in app/ + Dockerfile, then push
    git add -A && git commit -m "init <app>" && git push     # CI builds → GHCR
    
    # 4. Register with ArgoCD (add a file to the gitops repo)
    #    applications/sitaw/<app>.yaml   (or applications/calamansi-intel/ for the media box)
    ```
    
    - **Public** package → nothing else needed (the `imagePullSecrets` is ignored).
    - **Private** package → ensure the shared `ghcr-secret` works (below) and that
      ArgoCD can read the repo (add a deploy key + repo secret; keys are unique per
      repo).
    
    ## Deploy an EXISTING app (code change)
    
    Just push to `main`. CI builds the image, bumps the tag in `deploy/k8s/deployment.yaml`,
    and ArgoCD syncs.
    
    ## NixOS host changes
    
    ```bash
    cd ~/projects/bakuran-infra
    # edit hosts/<host>/... then:
    nix run github:serokell/deploy-rs -- .#sitaw-amd        # or .#calamansi-intel
    # validate first:  nix eval .#nixosConfigurations.sitaw-amd.config.system.build.toplevel.drvPath
    ```
    
    ## Host secrets (sops-nix)
    
    ```bash
    cd ~/projects/bakuran-infra
    sops secrets/homelab.yaml                       # edit (re-encrypts on save)
    nix run github:serokell/deploy-rs -- .#sitaw-amd    # apply
    ```
    
    Decrypted secrets land in `/run/secrets/`; e.g. cloudflared credentials are a
    symlink at `/root/.cloudflared/<tunnel-id>.json`. Age identity = the host's SSH
    host key. See KNOWN-ISSUES for the reinstall caveat.
    
    ## Reinstall / new host (DESTRUCTIVE — wipes disk)
    
    ```bash
    cd ~/projects/bakuran-infra
    # add hosts/<name>/{default.nix,disko.nix} + register in flake.nix + deploy.nodes
    git add -A     # flakes only see tracked files
    nix run github:nix-community/nixos-anywhere -- --flake .#<name> --target-host root@<ip>
    ```
    
    ## ArgoCD
    
    ```bash
    ssh ... .82 'k3s kubectl -n argocd get applications'
    # force refresh / sync
    ssh ... .82 'k3s kubectl -n argocd annotate application <name> argocd.argoproj.io/refresh=hard --overwrite'
    ssh ... .82 'k3s kubectl -n argocd patch application <name> --type merge -p "{\"operation\":{\"sync\":{\"revision\":\"main\"}}}"'
    ```
    
    ## GHCR pull secret (private packages)
    
    Now an **ExternalSecret** from Bitwarden (no Sealed Secrets):
    `bakuran-gitops/manifests/external-secrets/ghcr-secret.yaml`. To rotate, update
    `ghcr-user`/`ghcr-token` in Bitwarden → ESO re-syncs the `ghcr-secret` in `apps`.
    
    ## Cloudflare tunnel (add a hostname)
    
    1. Add a rule to the **remote** tunnel config (API `PUT .../configurations`) →
       `http://127.0.0.1:32080` (NodePorts are loopback-only since the edge lock).
    2. Create a proxied `CNAME` → `8dcc83bd-eb95-4c0d-8f71-b92a27d37649.cfargotunnel.com`.
    3. Ensure the app's `Ingress` has that `host`.
    
    > The tunnel is **remotely-managed**; the on-host `/etc/cloudflared/config.yml`
    > (old Proxmox box) is gone. NixOS `services.cloudflared` supplies credentials;
    > routing comes from the remote config.
    
    ## Media stack (.81) — GitOps
    
    Managed by the `media` ArgoCD app
    (`bakuran-gitops/applications/calamansi-intel/media.yaml` → `manifests/media/`),
    deployed to the `calamansi-intel` cluster. Wiring (root folders, download
    clients, Prowlarr → Sonarr/Radarr):
    
    ```bash
    QBT_PASSWORD='<qbt webui password>' ~/projects/bakuran-infra/scripts/media-stack-setup.sh
    ```
    
    Media host paths on `.81`: `/mnt/media/{tv,movies,downloads,temp}` (hostPath
    mounts; the *arrs see them as `/tv`, `/movies`, `/downloads`).
    
    ## ZeroClaw agent
    
    Deployed by the `zeroclaw` ArgoCD app (`manifests/zeroclaw/`).
    
    ```bash
    POD=$(ssh ... .82 'k3s kubectl -n zeroclaw get pod -l app=zeroclaw -o jsonpath="{.items[0].metadata.name}"')
    ssh ... .82 "k3s kubectl -n zeroclaw exec $POD -c zeroclaw -- zeroclaw status"
    ssh ... .82 "k3s kubectl -n zeroclaw exec $POD -c zeroclaw -- zeroclaw gateway get-paircode --new"  # web UI pair code
    ssh ... .82 'k3s kubectl -n zeroclaw rollout restart deployment/zeroclaw'
    ```
    
    - Web UI `agent.bismigel.dev` (Access-gated + pair code). Telegram is allowlisted
      via `peer_groups.telegram_default`; rebind with
      `zeroclaw channel bind-telegram <id>`.
    - Models: `deepseek.default` (primary) with `openai.local` (Ollama `192.168.2.12:11434/v1`)
      as fallback; switch in chat with `/models` and `/model`.
    - Secrets: DeepSeek key + Telegram token come from Bitwarden via ESO.
    - Config lives on the PVC; `manifests/zeroclaw/config-seed.yaml` re-seeds a fresh PVC.
    
    ## Backups / DR
    
    ```bash
    # back up now (age-encrypts host keys + kubeconfig + BWS token -> R2)
    ssh ... .81 'systemctl start homelab-backup'   # or .82
    # restore: download from r2:homelab-backups/credentials/, then
    #   age -d -i ~/.homelab-backup.agekey <file> | tar xz
    ```
    Full rebuild: `bakuran-infra/docs/REBUILD.md` (+ `scripts/bootstrap-argocd.sh`).
    
    ## Cloudflare Access / auto-login
    
    - Sensitive hostnames (`grafana`/`jellyfin`/`status`/`private`/`agent` `.bismigel.dev`)
      are gated by Access; policies managed via the CF API (`access/apps`).
    - Grafana does **per-user** auto-login via the `Cf-Access-Authenticated-User-Email`
      header (`GF_AUTH_PROXY_*`); the \*arrs are login-free on the LAN (`Forms` +
      `DisabledForLocalAddresses`).
    
    ## ZeroClaw access map (2026-10-13)
    
    Autonomy = **full**; operating rules (PR-only, token-conservative, ask before
    destructive) live in its workspace `AGENTS.md` + `/context/AGENTS.md`.
    
    | Capability | How | Notes |
    |---|---|---|
    | Cluster (both) | kubernetes MCP, multi-cluster kubeconfig | contexts `sitaw-amd` (.82) + `calamansi-intel` (.81) |
    | GitHub | `gh`/`git` (shell) + GitHub MCP (hosted remote) | PAT from Bitwarden; **open PRs only** |
    | Cloudflare | `curl http://127.0.0.1:8788/client/v4/...` | **read-only guardrail sidecar**; token isolated, writes 403 |
    | Docs | `/context/*.md` | CREDENTIALS.md excluded |
    | Models | DeepSeek primary, local qwen fallback | key in Bitwarden (`deepseek-api-key`) |
    
    **Gotcha:** never seed Bitwarden with a `PushSecret` — a leftover one clobbers the
    real value on a timer (this reverted the DeepSeek key + Telegram token once).
