# Homelab context for the ZeroClaw agent. Generated from ~/projects/homelab-context
# (EXCLUDING CREDENTIALS.md). Non-secret architecture docs so the agent can
# operate the lab. Keep in sync when the docs change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-context
  namespace: zeroclaw
data:
  AGENTS.md: |
    # ZeroClaw homelab agent
    
    You operate the **Bakuran homelab** as an autonomous assistant.
    
    ## Operating rules (IMPORTANT — follow these)
    - **Pull requests only.** Never push to `main`; do the work on a branch, open a
      PR, and let the human review/merge.
    - **Be conservative with tokens.** Prefer the local model for simple tasks, keep
      context small, avoid unnecessary tool calls or dumping large logs.
    - **GitOps, not imperative.** Change desired state in `bismigel/bakuran-gitops`
      via PR; never hand-edit resources that ArgoCD manages.
    - **Ask before anything destructive** (cluster changes, deletes, data loss).
    - Never expose secrets. `CREDENTIALS.md` is intentionally absent; secrets are
      injected as env — do not write them to files or logs.
    
    ## Cloudflare — guarded (READ ONLY)
    Cloudflare can expose the network, so it is behind a **read-only guardrail**.
    - To read: `curl http://127.0.0.1:8788/client/v4/<path>` (the proxy injects the
      token; you do not have it). Example: `.../client/v4/zones`.
    - **Every write (POST/PUT/PATCH/DELETE) is blocked with 403.** Do NOT attempt to
      modify Cloudflare — DNS, tunnel, Access, redirects, rules. If a change is
      needed, STOP and ask the human, stating the exact change and its impact.
    
    ## Context
    Docs here: `SYSTEM.md`, `INVENTORY.md`, `RUNBOOK.md`, `KNOWN-ISSUES.md`,
    `NEXT-STEPS.md`. Hosts: **sitaw-amd** (.82, control plane/ArgoCD);
    **calamansi-intel** (.81, media). Media pool `/mnt/media` (mergerfs). Tools:
    shell (`kubectl`, `gh`, `git`, `helm`, `jq`), MCP (`kubernetes`, `github`).
  SYSTEM.md: |
    # System Architecture
    
    > Local-only. Last updated: 2026-10-12
    
    ## Hosts
    
    | Host | IP | CPU | OS | Role |
    |---|---|---|---|---|
    | `calamansi-intel` | 192.168.2.81 | Intel i5-7500T (4c, QuickSync) | NixOS 25.11 | **Media** (k3s) — the whole media stack |
    | `sitaw-amd` | 192.168.2.82 | AMD Ryzen 5 4600G (6c/12t) | NixOS 25.11 | **Hosting + platform + ArgoCD control plane** (k3s, ingress-nginx, cloudflared) |
    | `nix-station` | 192.168.2.245 | (workstation) | NixOS | Admin/control machine (SSH + deploy origin) |
    
    Both boxes are single-node k3s. **`.81` is media-only; `.82` hosts everything
    else.** `sitaw-amd` was installed by wiping a Proxmox host.
    
    ## Repos
    
    | Repo | Visibility | Purpose |
    |---|---|---|
    | `bismigel/bakuran-infra` | private | NixOS machine configs (`calamansi-intel`, `sitaw-amd`), `deploy-rs`, `modules/`, `scripts/`, `docs/REBUILD.md` |
    | `bismigel/bakuran-gitops` | private | **ArgoCD desired state** — `bootstrap/root-app.yaml`, `applications/{sitaw,calamansi-intel}/*`, `applications/node-exporter-appset.yaml`, `manifests/*`, `clusters/*` |
    | `bismigel/bismigel-site` | public | Emacs `org-publish` / Hugo site → `bismigel.dev` (primary blog) |
    | `bismigel/homelab-app-template` | private, template | New-app scaffold (Dockerfile, `deploy/k8s`, CI → GHCR → tag bump) |
    | `Ciceley/ciceleywebsite` | public | Hugo site (Stack theme), content synced from Notion |
    | `bismigel/status-api` | public | Test Go API (proves the pipeline) → `status.bismigel.dev` |
    | `bismigel/private-api` | private | Test Go API for private GHCR pulls → `private.bismigel.dev` |
    
    ## GitOps — one control plane for both clusters
    
    **A single ArgoCD runs on `sitaw-amd` and manages both clusters**: `sitaw-amd`
    in-cluster, and `calamansi-intel` registered as an **external cluster**. There is
    no second ArgoCD.
    
    ```
    bootstrap/root-app.yaml      # the one app-of-apps (watches applications/)
    applications/
      sitaw/*                     # apps + platform on .82
      calamansi-intel/media.yaml  # the media stack (remote cluster)
      node-exporter-appset.yaml   # ApplicationSet -> every registered cluster
    manifests/<app>/              # raw manifests the apps point at
    ```
    
    Apps whose destination is the media box use `destination.name: calamansi-intel`.
    
    ### Automation pipeline
    ```
    app repo push ─▶ CI: build image ─▶ GHCR ─▶ CI bumps tag in deploy/k8s
                                                        │
                                  ArgoCD (sitaw-amd) ◀──┘ pulls, reconciles both clusters
    ```
    CI never holds cluster credentials. **Apps push images; ArgoCD pulls desired state.**
    
    ## Storage (pooled media)
    
    Both boxes split their NVMe into a **100 GiB OS partition** and a **media data
    partition**; the SATA disks are media too. All four media partitions are pooled:
    
    ```
    sitaw-amd    (.82): /dev/nvme0n1p3 -> /mnt/media-nvme   (~346G)  ─┐ NFS export
                        /dev/sda1       -> /mnt/media-sda    (~466G)  ─┘ (192.168.2.81)
    calamansi-intel (.81): /dev/nvme0n1p3 -> /mnt/media-nvme (~137G) ─┐
                           /dev/sda1       -> /mnt/media-sda  (~238G) ─┤ mergerfs
                           /mnt/remote82-{nvme,sda} (NFS from .82)   ─┘ -> /mnt/media (~1.2T)
    ```
    
    Jellyfin + the *arrs mount the single `/mnt/media` on `.81`. `.82` exports its
    partitions via NFSv4 (`services.nfs.server`); `.81` mergerfs-unions local + remote
    (`fuse.mergerfs`, `category.create=mfs`). `systemd.tmpfiles` creates
    `/mnt/media/{tv,movies,downloads,temp}`.
    
    ## What runs where
    
    ### `sitaw-amd` (.82) — hosting / platform
    - k3s (traefik/servicelb disabled), `ingress-nginx` (NodePort 32080/32443)
    - `argocd` — the **single** control plane
    - `apps`: ciceley-site, bismigel-site, miguelarbis-redirect, private-api, status-api
    - `monitoring`: grafana (per-user SSO), prometheus, kube-state-metrics, node-exporter
    - `observability`: otel-collector; `opentelemetry-operator-system`
    - `cert-manager`, `external-secrets` (+ Bitwarden SDK server), `homepage`
    - `zeroclaw` — homelab AI agent (web UI + Telegram; see below)
    - `cloudflared` (NixOS service)
    
    ### `calamansi-intel` (.81) — media
    - k3s
    - `media`: sonarr, radarr, prowlarr, bazarr · `downloads`: qbittorrent · `default`: jellyfin
    - `monitoring`: node-exporter (scraped by `.82`'s Prometheus)
    - **All ArgoCD-managed** via the `media` app (targeting the remote cluster).
    
    ## Secrets (two layers)
    
    | Layer | Tool | Holds |
    |---|---|---|
    | **Machine** (k8s) | **Bitwarden Secrets Manager + External Secrets Operator** | everything the clusters consume: `ghcr-secret`, the bootstrap secrets, etc. ESO (`ClusterSecretStore bitwarden`) syncs `ExternalSecret`s into k8s Secrets. |
    | **Host** | **sops-nix** (SOPS + age) | cloudflared credentials. age identity = the host's SSH host key (`/etc/ssh/ssh_host_ed25519_key`). |
    | **Human** | Bitwarden (web vault) | passwords, tokens, the age backup key |
    
    **Sealed Secrets has been removed** (all secrets are now Bitwarden/ESO).
    
    ## Backups / DR
    
    - **Daily** systemd timer (`homelab-backup`) on each box → **age-encrypts** the
      host SSH keys + k3s kubeconfig + BWS token → **Cloudflare R2**
      (`r2:homelab-backups/credentials/`). Script: `bakuran-infra/scripts/backup-credentials.sh`.
    - The **age backup private key** lives in Bitwarden (and offline) — required to
      decrypt the R2 blobs.
    - **`docs/REBUILD.md`** = the rebuild runbook; `scripts/bootstrap-argocd.sh` does
      the one manual step (ArgoCD install + repo creds + root app).
    
    ## Edge (Cloudflare)
    
    - **Tunnel** (remote-managed) runs on `.82`; public hostnames → `ingress-nginx:32080`.
    - **Zero Trust Access** gates the sensitive endpoints (`grafana`, `jellyfin`,
      `status`, `private`, `agent` under `*.bismigel.dev`), email-OTP or GitHub SSO.
    - Media is reached through the **same tunnel** (`jellyfin.bismigel.dev → 192.168.2.81:30096`).
    - **Grafana auto-login** is per-user via the Cloudflare identity header; the
      **\*arrs** are no-auth (shared).
    
    ## ZeroClaw (homelab agent)
    
    An AI agent with full homelab control, deployed as a k3s workload in the
    `zeroclaw` namespace (`bakuran-gitops/manifests/zeroclaw/`).
    
    - **Web UI:** `agent.bismigel.dev` (Access-gated; pair with a one-time code).
    - **Telegram:** chat the bot directly; only the account in
      `peer_groups.telegram_default.external_peers` is allowlisted.
    - **Models:** primary `deepseek.default` (`deepseek-chat`, key in Bitwarden);
      fallback `openai.local` → local Ollama at `192.168.2.12:11434/v1` (`qwen3:8b`).
      Switch at runtime in chat with `/models` and `/model`.
    - **Access:** cluster-admin ServiceAccount (`kubectl`) + `GH_TOKEN` (`gh`/`git push`)
      + the `/context` docs. Autonomy is `supervised` (tool actions need a Telegram tap).
    - **State:** config on the PVC; a declarative seed ConfigMap re-initializes a fresh PVC.
    
    ## NixOS / deploy
    
    - Flake `bakuran-infra/flake.nix` → `nixosConfigurations.{calamansi-intel,sitaw-amd}` + `deploy.nodes.*`.
    - `disko` for `sitaw-amd`; `hardware-configuration.nix` git-ignored (inlined).
    - Deploy: `nix run github:serokell/deploy-rs -- .#sitaw-amd` (or `.#calamansi-intel`).
    - Install: `nixos-anywhere --flake .#<host> --target-host root@<ip>`.
    - `modules/`: `base.nix`, `k3s.nix` (WireGuard/ProtonVPN on `.81`), `backup.nix`.
