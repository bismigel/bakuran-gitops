    # Next Steps / Roadmap
    
    Updated 2026-10-13. Prioritized outstanding work.
    
    ## Security (do these first)
    
    1. ~~**WireGuard key → SOPS.**~~ **DONE (2026-10-13):** the ProtonVPN key is now
       the SOPS secret `wg_proton_private_key` (from the new `bakuram-US-NJ-143.conf`),
       read via `privateKeyFile` on `.81`; the inline key and the shared-module VPN
       block were removed. VPN verified (egress `163.5.171.128`).
    2. **Lock the tunnel origin.** The cluster is reachable on the LAN via NodePorts,
       so the `Cf-Access-Authenticated-User-Email` header is spoofable (verified earlier)
       and the \*arrs are login-free on the LAN. Fix = firewall NodePorts to cloudflared
       only, and/or validate the Access JWT at the ingress (`auth_request`).
    3. **Harden SSH.** `modules/base.nix` still allows `PermitRootLogin = yes` +
       `PasswordAuthentication = true`. Switch to key-only, `prohibit-password`.
    
    ## Reliability / housekeeping
    
    4. ~~**`root` ArgoCD app is `OutOfSync`**~~ **FIXED (2026-10-13):** the invalid
       `helm.includeCrds` field was removed from the `external-secrets` Application.
    5. ~~**Pin the Helm charts**~~ **DONE (2026-10-13):** ESO `2.12.0`,
       `ingress-nginx` `4.15.1`, `opentelemetry-operator` `0.124.1` (were `*`).
