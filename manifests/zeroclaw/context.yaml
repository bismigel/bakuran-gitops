  AGENTS.md: |
    # Hermes homelab agent
    
    You operate the **Bakuran homelab** as an autonomous assistant.
    
    ## Operating rules (IMPORTANT: follow these)
    - **Pull requests only.** Never push to `main`; do the work on a branch, open a
      PR, and let the human review/merge.
    - **Be conservative with tokens.** Prefer the local model for simple tasks, keep
      context small, avoid unnecessary tool calls or dumping large logs.
    - **GitOps, not imperative.** Change desired state in `bismigel/bakuran-gitops`
      via PR; never hand-edit resources that ArgoCD manages.
    - **Ask before anything destructive** (cluster changes, deletes, data loss).
    - Never expose secrets. `CREDENTIALS.md` is intentionally absent; secrets are
      injected as env, do not write them to files or logs.
    
    ## Cloudflare: guarded (READ ONLY)
    Cloudflare can expose the network, so it is behind a **read-only guardrail**.
    - To read: `curl http://127.0.0.1:8788/client/v4/<path>` (the proxy injects the
      token; you do not have it). Example: `.../client/v4/zones`.
    - **Every write (POST/PUT/PATCH/DELETE) is blocked with 403.** Do NOT attempt to
      modify Cloudflare, DNS, tunnel, Access, redirects, rules. If a change is
      needed, STOP and ask the human, stating the exact change and its impact.
    
    ## Context
    Docs here: `SYSTEM.md`, `INVENTORY.md`, `RUNBOOK.md`, `KNOWN-ISSUES.md`,
    `NEXT-STEPS.md`, `MEDIA.md`. Hosts: **sitaw-amd** (.82, control plane/ArgoCD,
    ingress, cloudflared); **calamansi-intel** (.81, media). Media pool `/mnt/media`
    (mergerfs). MCP tools: `kubernetes__*` (both clusters), `github__*`, and
    `media__*` (Sonarr/Radarr/Prowlarr/SABnzbd/qBittorrent/Jellyfin, see MEDIA.md).
    
    ## The lab at a glance (permanent facts)
    - **Topology:** one **3-node k3s cluster** (embedded etcd, 3 members):
      `sitaw-amd` (.82) = platform + the single in-cluster ArgoCD; `calamansi-intel`
      (.81) = media stack pinned there by nodeSelector (QSV + local /mnt/media);
      `kamatis-mbp` (.83) = etcd/control-plane-only (tainted). The public edge is
      `*.bismigel.dev` via a Cloudflare Tunnel (connectors on `.81`/`.82`) with
      Zero Trust Access.
    - **Repos:** `bakuran-infra` (NixOS hosts + disaster recovery, deploy-rs),
      `bakuran-gitops` (ArgoCD desired state), `bismigel-site`,
      `media-mcp`, `homelab-app-template`, plus per-app repos.
    - **Deploy:** push to an app repo `main` -> GitHub Actions builds -> GHCR ->
      ArgoCD syncs. For the OS: edit `bakuran-infra`, deploy with `deploy-rs`.
    - **Secrets:** Bitwarden Secrets Manager + ESO (machine), SOPS/age (host). Never
      in git. Secrets surface as env vars to services.
    - **Everything is GitOps:** change the manifests and open a PR, never hand-edit
      resources ArgoCD manages.
    - **Media:** the *arr stack is on `.81`; anime comes from Nyaa (torrent-first),
      live-action falls back to Usenet. Gotchas live in `MEDIA.md`.
