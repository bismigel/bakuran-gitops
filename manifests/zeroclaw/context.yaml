    8. **Offline copy of the age backup key** (`~/.homelab-backup.agekey`) — required
       to decrypt R2 backups if Bitwarden is unreachable. Currently only in Bitwarden.
    
    ## After the 2026-10-12/13 bare-metal nuke
    
    The full wipe+restore was exercised on **both** boxes. Learnings (all folded into
    `bakuran-infra/docs/REBUILD.md` + committed fixes):
    - **`.81` had a leftover Proxmox LVM (`pve` VG)** — disko/wipefs didn't clear it,
      so `mkfs` failed on a partition that read as `LVM2_member`. Fix: `vgremove` +
      zero the first 2 GiB before reinstalling.
    - **ArgoCD install needs `--server-side`** (ApplicationSet CRD > 262144 bytes).
      Fixed in `bootstrap-argocd.sh`.
    - **ESO ClusterSecretStore now uses `caProvider`** (live `bitwarden-tls-certs`
      ca.crt) instead of a pinned `caBundle`, so it self-heals after reinstall.
