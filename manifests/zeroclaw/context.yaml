    2. **Lock the tunnel origin.** The cluster is reachable on the LAN via NodePorts,
       so the `Cf-Access-Authenticated-User-Email` header is spoofable (verified earlier)
       and the \*arrs are no-auth. Fix = firewall NodePorts to cloudflared only, and/or
       validate the Access JWT at the ingress (`auth_request`).
    3. **Harden SSH.** `modules/base.nix` still allows `PermitRootLogin = yes` +
       `PasswordAuthentication = true`. Switch to key-only, `prohibit-password`.
    
    ## Reliability / housekeeping
    
    4. **`root` ArgoCD app is `OutOfSync`** (cosmetic field-normalization on the
       `external-secrets` Application object). Investigate `ignoreDifferences` or leave.
    5. **Pin the ESO Helm chart** (currently floating `*`, on v2.12.0).
    6. **`ciceleywebsite` CI redeploys on docs-only pushes** — the release workflow
