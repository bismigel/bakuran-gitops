  README.md: |
    # Homelab Context (LOCAL ONLY — DO NOT COMMIT)
    
    > ⚠️ **This folder contains plaintext secrets and is intentionally NOT a git
    > repo.** It exists so a future LLM/human has full context to operate the
    > homelab. Never copy it into any repository, chat, or backup that leaves this
    > machine without encrypting it first.
    >
    > Path: `~/projects/homelab-context/`
    > Last updated: 2026-10-12
    
    ## Read order for an LLM/agent
    
    1. **`SYSTEM.md`** — architecture, repos, automation flow (the "how it works").
    2. **`INVENTORY.md`** — hosts, IPs, ports, services, endpoints.
    3. **`CREDENTIALS.md`** — passwords, tokens, keys (sensitive).
    4. **`RUNBOOK.md`** — common tasks (deploy app, rebuild host, rotate secrets).
    5. **`KNOWN-ISSUES.md`** — what's broken / pending.
    6. **`NEXT-STEPS.md`** — prioritized roadmap of outstanding work.
    
    ## One-paragraph summary
    
    Two NixOS hosts run single-node k3s. **`calamansi-intel` (.81, Intel i5 +
    QuickSync)** is the **media box** (the whole media stack). **`sitaw-amd` (.82,
    AMD Ryzen)** is the **hosting + platform box** and runs the **single ArgoCD
    control plane** — it manages both clusters (`.81` is a registered external
    cluster) — plus ingress-nginx and cloudflared. Infrastructure is split across
    repos: `bakuran-infra` (NixOS machines + DR), `bakuran-gitops` (ArgoCD desired
    state for both clusters), `homelab-app-template` (new apps), and per-app repos.
    Apps build images via GitHub Actions → GHCR → ArgoCD pulls and deploys. Secrets
    are **Bitwarden Secrets Manager + External Secrets Operator** (machine) and
    **SOPS/age** (host). The public edge is a Cloudflare Tunnel; Zero Trust Access
    gates the sensitive endpoints.
    
    ## Ground rules for agents
    
    - **Edit NixOS config only in `bakuran-infra`**; deploy with `deploy-rs`.
    - **Never hand-edit running k8s resources** that ArgoCD manages — change the
      manifests in the app repo or `bakuran-gitops`.
    - **Never commit secrets.** Machine secrets live in **Bitwarden** (synced by ESO);
      host secrets are SOPS-encrypted in `bakuran-infra/secrets/`. Sealed Secrets was
      removed.
    - **Everything is GitOps** — including the media stack
      (`bakuran-gitops/applications/calamansi-intel/`).
    - **Disaster recovery** = `bakuran-infra/docs/REBUILD.md` + the daily R2 backup
      (`scripts/backup-credentials.sh`).
  MEDIA.md: |
    # MEDIA.md — the media stack

    All media services run on the media node (`calamansi-intel`, 192.168.2.81).
    Library on the host at `/mnt/media` (mergerfs) -> Jellyfin `/media`; the *arrs
    import from `/downloads` (`/mnt/media`) into `/media/tv` and `/media/movies`.

    Services (NodePorts on .81): Sonarr 30089, Radarr 30078, Prowlarr 30069,
    Bazarr 30067 (all ns media); SABnzbd 30082, qBittorrent 30081 (ns downloads);
    Jellyfin 30096 (ns default); media-mcp 30097 (ns media).

    ## Managing the stack (media MCP)

    Use the `media` MCP tool group (preferred over raw curl): `sonarr_series`,
    `sonarr_season_status`, `sonarr_queue`, `sonarr_history`,
    `sonarr_find_releases` (pass indexer_id to stay fast - a full search across
    every indexer can take minutes), `sonarr_season_search`, `sonarr_grab_release`,
    `radarr_movies`, `radarr_queue`, `prowlarr_indexers`, `prowlarr_search`,
    `sabnzbd_queue`, `sabnzbd_history`, `qbittorrent_torrents`, `jellyfin_scan`,
    `jellyfin_users`. API keys come from the `media-setup` Secret (ns media).

    ## Gotchas

    1. qBittorrent 5.x completion gap: Sonarr/Radarr may keep a finished torrent at
       trackedState=downloading (qBittorrent says stalledUP) and never import. Fix:
       `kubectl -n media rollout restart deploy/sonarr deploy/radarr`. Durable fix:
       pin qBittorrent 4.6.x.
    2. Anime back-catalogue: Nyaa posts S1/S2 as COMPLETE/Batch releases that the
       per-season auto-search won't grab - grab the batch via the interactive
       search / sonarr_find_releases + sonarr_grab_release.
    3. Subtitles: BluRay rips often ship only PGS (image) subs the web client
       can't render. Bazarr fetches SRT text subs (use_embedded_subs=false,
       ignore_pgs_subs=true).
    4. Jellyfin scans: mergerfs has no live file-watching, so new media appears on
       the scheduled scan (every 15m). Trigger with `jellyfin_scan`.
    5. Sonarr's delay profile is torrent-first, so anime comes from Nyaa;
       live-action falls back to Usenet.

    Rebuild: `bakuran-infra/scripts/media-stack-setup.sh` (+ media-quality-setup.sh,
    media-bazarr-setup.sh, media-setup-secret.sh, media-usenet-secret.sh).
