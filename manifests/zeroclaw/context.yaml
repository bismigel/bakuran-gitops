       `DisabledForLocalAddresses`); no script change needed. ~~media-stack-setup.sh~~
    8. **Offline copy of the age backup key** (`~/.homelab-backup.agekey`) — required
       to decrypt R2 backups if Bitwarden is unreachable. Currently only in Bitwarden.
    
    ## HA (2026-10-14)
    
    **DONE:**
    - **One 3-node k3s cluster** with **3-member embedded etcd** — `sitaw-amd` (.82),
      `calamansi-intel` (.81, media pinned), `kamatis-mbp` (.83, etcd-only). Media
      re-homed in-cluster; losing any one node no longer breaks the control plane.
    - **k3s join token in SOPS** (`k3s_cluster_token`) — both joining nodes decrypt it
      via sops-nix. Added `kamatis-mbp` + a SOPS **admin age key**
      (`~/.config/sops/age/homelab.txt`) as recipients.
    - **ArgoCD HA (partial)** — `server`/`repo-server`/`applicationSet` ×2 and the
      `application-controller` ×2 (active/standby) with soft anti-affinity, spread
      across `.82`/`.81`. Codified in `scripts/bootstrap-argocd.sh`.
    
    **DONE (continued):**
    - **Longhorn** (distributed storage) installed via ArgoCD — 2-replica StorageClass
      `longhorn`, so stateful volumes can reschedule between nodes. Host prereqs in
      `modules/base.nix` (open-iscsi, `iscsi_tcp`, `/usr/bin/iscsiadm` symlink, ports);
      chart needs `selfHeal: false` (Longhorn mutates its own Settings) and
      `preUpgradeChecker.jobEnabled: false`.
    - **Jellyfin** — disabled the low-power QSV encoders (Kaby Lake GuC not loaded →
      VDENC "ratecontrol mode unsupported"); standard QSV transcoding verified working.
    
    - **Storage migration** — **DONE:** the `grafana`, `prometheus`, and `zeroclaw` PVCs
      moved to **Longhorn** (reschedulable). Media PVCs stay `local-path` on purpose
      (pinned to `.81` for `/mnt/media` + QSV — Longhorn buys nothing there).
    - **Edge lock** — **DONE:** k3s binds NodePorts to **loopback** on all nodes
      (`nodeport-addresses=127.0.0.1/32`), so the Cloudflare tunnel is the only path in;
      LAN clients can no longer bypass Access. ZeroClaw/media use the in-cluster Service.
    
    Remaining (optional):
    - **Redis HA** — **attempted twice, rolled back.** ArgoCD's `redis-ha` (3 Redis +
      sentinel + HAProxy, spread across all 3 nodes) hit three failure modes:
      1. `config-init` deadlocked on the headless `argocd-redis-ha` sentinel DNS
         (chicken-and-egg) → fixed with `publishNotReadyAddresses: true`.
      2. The HAProxy Deployment deadlocked on hard anti-affinity during rollout
         (old RS holds the nodes) → worked around via `Recreate` + deleting the stale RS.
      3. **HAProxy's `redis-master` health checks then time out** (couldn't get
         HAProxy→sentinel routing working — not the NetworkPolicies), so it refused
         connections. Not usable as-is.
