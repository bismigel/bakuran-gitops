    - `root@192.168.2.81` (calamansi-intel), `root@192.168.2.82` (sitaw-amd).
    - **Key-only** now (`PasswordAuthentication=false`, root `prohibit-password`); the
      old `internal-ssh-password` was removed from Bitwarden.
    
    ```bash
    ssh -i ~/.ssh/id_ed25519 root@192.168.2.81   # calamansi-intel (media)
    ssh -i ~/.ssh/id_ed25519 root@192.168.2.82   # sitaw-amd (hosting)
