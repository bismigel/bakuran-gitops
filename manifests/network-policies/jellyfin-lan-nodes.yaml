apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin-lan-nodes
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: jellyfin
  ingress:
    - fromEntities:
        - remote-node
        - host
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
