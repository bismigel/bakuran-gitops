# Ingress-only network policies for the application namespaces.
#
# A pod selected by any NetworkPolicy only accepts the listed ingress. Egress is
# left open for this phase. Infrastructure namespaces (kube-system, argocd,
# longhorn-system, monitoring, cert-manager, external-secrets, observability,
# kepler) are intentionally not managed here.
#
# Each rule starts with same-namespace traffic and ingress-nginx. Cross-namespace
# rules are added only where a real dependency exists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: books
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Jellyfin hostPort 8096 is for LAN TVs and phones. Keep it narrow:
    # only the LAN CIDR, only the Jellyfin HTTP port.
    - from:
        - ipBlock:
            cidr: 192.168.2.0/24
      ports:
        - protocol: TCP
          port: 8096
---

