# Smoke test: pull a secret named "test" from the Bitwarden project into a
# normal k8s Secret. (Or reference it by UUID in remoteRef.key.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bw-smoke-test
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: bw-smoke-test
  data:
    - secretKey: test
      remoteRef:
        key: test
