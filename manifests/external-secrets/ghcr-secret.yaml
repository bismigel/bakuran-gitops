# GHCR pull secret, sourced from Bitwarden Secrets Manager instead of a
# SealedSecret. ESO builds the kubernetes.io/dockerconfigjson from the two
# Bitwarden secrets (ghcr-user, ghcr-token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: ghcr-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: ghcr-user
    - secretKey: token
      remoteRef:
        key: ghcr-token
