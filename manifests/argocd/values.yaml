global:
  domain: argocd.bismigel.dev
configs:
  cm:
    create: false
  secret:
    createSecret: false
  params:
    server.insecure: true
controller:
  replicas: 2
server:
  replicas: 2
  ingress:
    enabled: true
    ingressClassName: nginx-admin
    hostname: argocd.bismigel.dev
    path: /
    tls: false
repoServer:
  replicas: 2
applicationSet:
  replicas: 2
