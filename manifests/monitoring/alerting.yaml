# Prometheus alerting rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: infra
        rules:
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "node-exporter down on {{ $labels.instance }}"
          - alert: TargetDown
            expr: up == 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "target {{ $labels.job }}/{{ $labels.instance }} down"
          - alert: DiskFillingUp
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 85
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "disk {{ $labels.mountpoint }} on {{ $labels.instance }} >85% full"
          - alert: HostMemoryHigh
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "memory on {{ $labels.instance }} >90%"
        # NOTE: BackupFailed alerts are *pushed* to Alertmanager by the systemd
        # OnFailure hooks (see modules/backup*.nix), so there's no rule for them.
---
# Alertmanager
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: telegram
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Login alerts (posted by the access-login-watch CronJob): notify
        # immediately and don't follow up with a "resolved" message.
        - matchers: ['alertname="AppLogin"']
          receiver: telegram-login
          group_by: ["user", "app"]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 24h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secret/bot-token
            chat_id: 607008268
            send_resolved: true
      - name: telegram-login
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secret/bot-token
            chat_id: 607008268
            send_resolved: false
            message: '{{ range .Alerts }}🔐 {{ .Annotations.summary }} ({{ .Annotations.details }}){{ "\n" }}{{ end }}'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target: { name: alertmanager-telegram, template: { data: { bot-token: "{{ .token }}" } } }
  data:
    - secretKey: token
      remoteRef: { key: telegram-bot-token }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      securityContext: { runAsUser: 65534, runAsGroup: 65534 }
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
          ports:
            - containerPort: 9093
              name: web
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: secret, mountPath: /etc/alertmanager/secret, readOnly: true }
            - { name: data, mountPath: /alertmanager }
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: secret
          secret: { secretName: alertmanager-telegram }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports:
    - name: web
      port: 9093
      targetPort: 9093
      nodePort: 30903
