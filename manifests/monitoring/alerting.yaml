# Prometheus alerting rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: infra
        rules:
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "node-exporter down on {{ $labels.instance }}"
          - alert: TargetDown
            expr: up == 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "target {{ $labels.job }}/{{ $labels.instance }} down"
          - alert: DiskFillingUp
            # /mnt/media is excluded here: the media pool is a mergerfs union of
            # four branches across two hosts, so it gets its own pair of alerts.
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!="/mnt/media"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!="/mnt/media"}) * 100 > 85
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "disk {{ $labels.mountpoint }} on {{ $labels.instance }} >85% full"
          - alert: HostMemoryHigh
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "memory on {{ $labels.instance }} >90%"
          # Media pool (/mnt/media on calamansi-intel): the whole media stack and
          # every *arr import dies when this fills, so warn early and loud.
          - alert: MediaPoolFillingUp
            expr: (1 - node_filesystem_avail_bytes{mountpoint="/mnt/media"} / node_filesystem_size_bytes{mountpoint="/mnt/media"}) * 100 > 85
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "media pool (/mnt/media) >85% full"
              description: "{{ $value }}% used — reclaim space (arr cleanup) or add a disk before imports start failing."
          - alert: MediaPoolCritical
            expr: (1 - node_filesystem_avail_bytes{mountpoint="/mnt/media"} / node_filesystem_size_bytes{mountpoint="/mnt/media"}) * 100 > 92
            for: 15m
            labels: { severity: critical }
            annotations:
              summary: "media pool (/mnt/media) >92% full — downloads/imports will fail"
              description: "{{ $value }}% used on the mergerfs pool."
          # NOTE: BackupFailed alerts are *pushed* to Alertmanager by the systemd
          # OnFailure hooks (see modules/backup*.nix), so there's no rule for them.
      - name: etcd
        rules:
          # Metrics come from the etcd-metrics-proxy DaemonSet (node loopback
          # 127.0.0.1:2381 relayed to <node-ip>:9101, scraped by kubernetes-pods),
          # so these selectors deliberately avoid a `job=` filter.
          - alert: EtcdNoLeader
            expr: etcd_server_has_leader == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "etcd {{ $labels.instance }} has no leader"
          - alert: EtcdMemberUnreachable
            expr: count(etcd_server_has_leader) < 3
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "only {{ $value }}/3 etcd members are reporting metrics"
          - alert: EtcdQuorumAtRisk
            expr: sum(etcd_server_has_leader) < 2
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "etcd quorum lost or at risk ({{ $value }}/3 leaders)"
          - alert: EtcdHighFsyncLatency
            expr: histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])) by (le)) > 0.5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "etcd WAL fsync p99 > 500ms — disk is the bottleneck"
          - alert: EtcdDbSizeNearQuota
            expr: max(etcd_mvcc_db_total_size_in_bytes) > 1.5e9
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "etcd DB > 1.5GiB (2GiB quota) — compact/defrag or raise the quota"
      - name: argocd
        rules:
          - alert: ArgoCDAppOutOfSync
            expr: argocd_app_info{sync_status!="Synced"} == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "ArgoCD {{ $labels.name }} is {{ $labels.sync_status }} (drift)"
          - alert: ArgoCDAppUnhealthy
            expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "ArgoCD {{ $labels.name }} health={{ $labels.health_status }}"
---
# Alertmanager
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: telegram
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Login alerts (posted by the access-login-watch CronJob): notify
        # immediately and don't follow up with a "resolved" message.
        - matchers: ['alertname="AppLogin"']
          receiver: telegram-login
          group_by: ["user", "app"]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 24h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secret/bot-token
            chat_id: 607008268
            send_resolved: true
      - name: telegram-login
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secret/bot-token
            chat_id: 607008268
            send_resolved: false
            message: '{{ range .Alerts }}🔐 {{ .Annotations.summary }} ({{ .Annotations.details }}){{ "\n" }}{{ end }}'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target: { name: alertmanager-telegram, template: { data: { bot-token: "{{ .token }}" } } }
  data:
    - secretKey: token
      remoteRef: { key: telegram-bot-token }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      securityContext: { runAsUser: 65534, runAsGroup: 65534 }
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
          ports:
            - containerPort: 9093
              name: web
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: secret, mountPath: /etc/alertmanager/secret, readOnly: true }
            - { name: data, mountPath: /alertmanager }
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: secret
          secret: { secretName: alertmanager-telegram }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports:
    - name: web
      port: 9093
      targetPort: 9093
      nodePort: 30903
