# Managed by GitOps. Edit panels here; Grafana reloads them within 30s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-edge
  namespace: monitoring
data:
  edge.json: |
    {
      "uid": "homelab-edge",
      "title": "Homelab Edge (Cloudflare)",
      "tags": ["homelab","cloudflare","edge"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {"from":"now-24h","to":"now"},
      "templating": {"list":[]},
      "annotations": {"list":[{"builtIn":1,"datasource":{"type":"grafana","uid":"-- Grafana --"},"enable":true,"hide":true,"iconColor":"rgba(0, 211, 255, 1)","name":"Annotations & Alerts","type":"dashboard"}]},
      "editable": true,
      "panels": [
        {"id":1,"type":"stat","title":"Tunnel","gridPos":{"h":5,"w":4,"x":0,"y":0},"targets":[{"expr":"cloudflare_tunnel_up","refId":"A"}],"description":"1 = tunnel reports healthy in Cloudflare. Alert at 0 for 5m.","fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]},"color":{"mode":"thresholds"}}},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","justifyMode":"auto","textMode":"auto","orientation":"auto"}},
        {"id":2,"type":"stat","title":"Connectors","gridPos":{"h":5,"w":4,"x":4,"y":0},"targets":[{"expr":"cloudflare_tunnel_connectors","refId":"A"}],"description":"Connector instances. Two means either host can serve the edge.","fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"yellow","value":1},{"color":"green","value":2}]},"color":{"mode":"thresholds"}}},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","justifyMode":"auto","textMode":"auto","orientation":"auto"}},
        {"id":3,"type":"stat","title":"Edge connections","gridPos":{"h":5,"w":4,"x":8,"y":0},"targets":[{"expr":"cloudflare_tunnel_edge_connections","refId":"A"}],"description":"Live connections from the connectors to Cloudflare's edge.","fieldConfig":{"defaults":{"unit":"short"}},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","justifyMode":"auto","textMode":"auto","orientation":"auto"}},
        {"id":4,"type":"stat","title":"Zones active","gridPos":{"h":5,"w":4,"x":12,"y":0},"targets":[{"expr":"count(cloudflare_zone_up == 1) or vector(0)","refId":"A"}],"description":"Zones reporting status=active.","fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":3}]},"color":{"mode":"thresholds"}}},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","justifyMode":"auto","textMode":"auto","orientation":"auto"}},
        {"id":5,"type":"stat","title":"Access apps","gridPos":{"h":5,"w":4,"x":16,"y":0},"targets":[{"expr":"cloudflare_access_apps_total","refId":"A"}],"description":"Zero Trust applications protecting the lab.","fieldConfig":{"defaults":{"unit":"short"}},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","justifyMode":"auto","textMode":"auto","orientation":"auto"}},
        {"id":6,"type":"stat","title":"Snapshot age","gridPos":{"h":5,"w":4,"x":20,"y":0},"targets":[{"expr":"time() - cloudflare_export_timestamp_seconds","refId":"A"}],"description":"Staleness of the cached Cloudflare snapshot. Red means the exporter is stuck or the token died.","fieldConfig":{"defaults":{"unit":"s","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":180},{"color":"red","value":600}]},"color":{"mode":"thresholds"}}},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","justifyMode":"auto","textMode":"auto","orientation":"auto"}},
        {"id":7,"type":"timeseries","title":"Tunnel connections","gridPos":{"h":8,"w":12,"x":0,"y":5},"targets":[{"expr":"cloudflare_tunnel_connectors","refId":"A","legendFormat":"connectors"},{"expr":"cloudflare_tunnel_edge_connections","refId":"B","legendFormat":"edge connections"}],"description":"A drop to one connector means the edge is running without HA.","fieldConfig":{"defaults":{"unit":"short","custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":true},"min":0}},"options":{"legend":{"displayMode":"list","placement":"bottom","calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}}},
        {"id":8,"type":"timeseries","title":"Edge connections by colo","gridPos":{"h":8,"w":12,"x":12,"y":5},"targets":[{"expr":"cloudflare_tunnel_edges_by_colo","refId":"A","legendFormat":"{{colo}}"}],"description":"Which Cloudflare datacentres the tunnel is pinned to.","fieldConfig":{"defaults":{"unit":"short","custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":true},"min":0}},"options":{"legend":{"displayMode":"list","placement":"bottom","calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}}},
        {"id":9,"type":"table","title":"Zones","gridPos":{"h":8,"w":12,"x":0,"y":13},"targets":[{"expr":"cloudflare_zone_up","refId":"A","format":"table","instant":true}],"description":"zone / plan / status. Value 1 = active.","fieldConfig":{"defaults":{"custom":{"align":"auto","filterable":true}}},"options":{"showHeader":true,"cellHeight":"sm"}},
        {"id":10,"type":"table","title":"DNS records per zone","gridPos":{"h":8,"w":12,"x":12,"y":13},"targets":[{"expr":"cloudflare_zone_dns_records","refId":"A","format":"table","instant":true}],"description":"Record count per zone. A sudden drop means something was deleted.","fieldConfig":{"defaults":{"custom":{"align":"auto","filterable":true}}},"options":{"showHeader":true,"cellHeight":"sm"}},
        {"id":11,"type":"table","title":"Certificates","gridPos":{"h":8,"w":12,"x":0,"y":21},"targets":[{"expr":"cloudflare_zone_certificate_active","refId":"A","format":"table","instant":true}],"description":"Universal SSL status per zone. Value 0 = not active.","fieldConfig":{"defaults":{"custom":{"align":"auto","filterable":true}}},"options":{"showHeader":true,"cellHeight":"sm"}},
        {"id":12,"type":"timeseries","title":"Cloudflare API latency","gridPos":{"h":8,"w":12,"x":12,"y":21},"targets":[{"expr":"cloudflare_api_last_duration_seconds","refId":"A","legendFormat":"{{endpoint}}"}],"description":"Last refresh duration per API call. Creeping latency usually precedes rate limiting.","fieldConfig":{"defaults":{"unit":"s","custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":true},"min":0}},"options":{"legend":{"displayMode":"list","placement":"bottom","calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}}},
        {"id":13,"type":"timeseries","title":"API reachable","gridPos":{"h":6,"w":24,"x":0,"y":29},"targets":[{"expr":"cloudflare_api_up","refId":"A","legendFormat":"api_up"}],"description":"0 = the last refresh failed (token expired, scope lost, outage).","fieldConfig":{"defaults":{"unit":"short","custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never","spanNulls":true},"min":0}},"options":{"legend":{"displayMode":"list","placement":"bottom","calcs":[]},"tooltip":{"mode":"multi","sort":"desc"}}}
      ]
    }
