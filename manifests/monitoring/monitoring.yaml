apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc:9093']
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            action: keep
            regex: kube-system;kube-state-metrics
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']
      - job_name: 'ksm'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: kube-state-metrics
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: node-exporter
          # role: pod leaves __address__ as the pod IP with no port, so Prometheus
          # defaults to :80. Force the node-exporter port explicitly.
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9100'
            target_label: __address__
      - job_name: 'kepler'
        # Power exporter (hostNetwork, so each pod IP is its node IP). Scrape the
        # pods directly — scraping the Service would load-balance across nodes and
        # give each node's series intermittent gaps. honor_labels keeps kepler's
        # own `instance=<node>` label instead of the scrape address.
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: kepler
            - source_labels: [__address__]
              regex: '([^:]+)(?::\d+)?'
              replacement: '$1:9102'
              target_label: __address__
        - job_name: 'argocd'
          # Application controller metrics (argocd_app_info) for drift alerts.
          static_configs:
            - targets: ['argocd-metrics.argocd.svc.cluster.local:8082']
  ---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30909
  selector:
    app: prometheus
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      initContainers:
        # local-path PVs are root-owned; prom/prometheus runs as nobody (65534).
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
          volumeMounts:
            - name: storage
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.size=1GB'
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs:
      - /metrics
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30300
  selector:
    app: grafana
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC: terminate before starting the new pod
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
        # local-path PVs are root-owned; grafana runs as UID 472.
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
              name: web
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: storage
              mountPath: /var/lib/grafana
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            # Admin password from Bitwarden (ExternalSecret `grafana-admin`).
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Per-user auto-login: trust the identity Cloudflare Access injects
            # (each person gets their own Grafana account).
            - name: GF_AUTH_PROXY_ENABLED
              value: "true"
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: Cf-Access-Authenticated-User-Email
            - name: GF_AUTH_PROXY_HEADER_PROPERTY
              value: username
            - name: GF_AUTH_PROXY_AUTO_SIGN_UP
              value: "true"
            - name: GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN
              value: "false"
            - name: GF_AUTH_PROXY_WHITELIST
              value: "10.42.0.0/16,10.43.0.0/16"
            - name: GF_USERS_AUTO_ASSIGN_ORG
              value: "true"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: "Admin"
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
# Grafana dashboard provider + dashboards, provisioned as code.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: homelab
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  homelab-overview.json: |
    {
      "title": "Homelab Overview",
      "uid": "homelab-overview",
      "tags": ["homelab"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id":1,"type":"stat","title":"Nodes up","gridPos":{"h":4,"w":4,"x":0,"y":0},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"count(up{job=\"node-exporter\"} == 1)","legendFormat":"nodes"}],
         "options":{"reduceOptions":{"calcs":["lastNotNull"]}}},
        {"id":2,"type":"stat","title":"Firing alerts","gridPos":{"h":4,"w":4,"x":4,"y":0},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"count(ALERTS{alertstate=\"firing\"})"}],
         "options":{"reduceOptions":{"calcs":["lastNotNull"]}}},
        {"id":3,"type":"stat","title":"Pods running","gridPos":{"h":4,"w":4,"x":8,"y":0},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"count(kube_pod_status_phase{phase=\"Running\"} == 1)"}],
         "options":{"reduceOptions":{"calcs":["lastNotNull"]}}},
        {"id":4,"type":"stat","title":"PVCs bound","gridPos":{"h":4,"w":4,"x":12,"y":0},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"count(kube_persistentvolumeclaim_status_phase{phase=\"Bound\"} == 1)"}],
         "options":{"reduceOptions":{"calcs":["lastNotNull"]}}},
        {"id":5,"type":"stat","title":"Restarts (1h)","gridPos":{"h":4,"w":4,"x":16,"y":0},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum(increase(kube_pod_container_status_restarts_total[1h]))"}],
         "options":{"reduceOptions":{"calcs":["lastNotNull"]}}},
        {"id":6,"type":"timeseries","title":"CPU usage %","gridPos":{"h":8,"w":12,"x":0,"y":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"100 - (avg by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)","legendFormat":"{{instance}}"}]},
        {"id":7,"type":"timeseries","title":"Memory used %","gridPos":{"h":8,"w":12,"x":12,"y":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"(1 - node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes) * 100","legendFormat":"{{instance}}"}]},
        {"id":8,"type":"timeseries","title":"Disk used %","gridPos":{"h":8,"w":12,"x":0,"y":12},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"(1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"}/node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"}) * 100","legendFormat":"{{instance}} {{mountpoint}}"}]},
        {"id":9,"type":"timeseries","title":"Load (1m)","gridPos":{"h":8,"w":12,"x":12,"y":12},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"node_load1","legendFormat":"{{instance}}"}]},
        {"id":10,"type":"table","title":"Firing alerts","gridPos":{"h":8,"w":24,"x":0,"y":20},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"ALERTS{alertstate=\"firing\"}","format":"table","instant":true}]}
      ]
    }
  power.json: |
    {
      "title": "Homelab Power",
      "uid": "homelab-power",
      "tags": ["homelab", "power"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id":1,"type":"stat","title":"Cluster power (W, measured)","description":"Measured RAPL energy (CPU package + DRAM) across all nodes. This is the honest in-software figure; it excludes disks, board and PSU losses.","gridPos":{"h":4,"w":6,"x":0,"y":0},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum(rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])) + sum(rate(kepler_node_dram_joules_total{mode=\"dynamic\"}[5m]))"}],
         "options":{"reduceOptions":{"calcs":["lastNotNull"]}}},
        {"id":2,"type":"stat","title":"Nodes reporting","gridPos":{"h":4,"w":6,"x":6,"y":0},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"count(kepler_node_info)"}],
         "options":{"reduceOptions":{"calcs":["lastNotNull"]}}},
        {"id":3,"type":"stat","title":"Pods tracked","gridPos":{"h":4,"w":6,"x":12,"y":0},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"count(count by (pod_name) (kepler_container_joules_total{mode=\"dynamic\"}))"}],
         "options":{"reduceOptions":{"calcs":["lastNotNull"]}}},
        {"id":4,"type":"timeseries","title":"CPU package power by node (W)","gridPos":{"h":8,"w":12,"x":0,"y":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])","legendFormat":"{{instance}}"}]},
        {"id":5,"type":"timeseries","title":"Node components (W)","gridPos":{"h":8,"w":12,"x":12,"y":4},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])","legendFormat":"package {{instance}}"},
                    {"expr":"rate(kepler_node_dram_joules_total{mode=\"dynamic\"}[5m])","legendFormat":"dram {{instance}}"},
                    {"expr":"rate(kepler_node_uncore_joules_total{mode=\"dynamic\"}[5m])","legendFormat":"uncore {{instance}}"}]},
        {"id":6,"type":"timeseries","title":"Per-node measured total (W)","gridPos":{"h":8,"w":12,"x":0,"y":12},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"sum by (instance) (rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m])) + sum by (instance) (rate(kepler_node_dram_joules_total{mode=\"dynamic\"}[5m]))","legendFormat":"{{instance}}"}]},
        {"id":7,"type":"timeseries","title":"Top pods by power (W)","gridPos":{"h":8,"w":12,"x":12,"y":12},
         "datasource":{"type":"prometheus","uid":"prometheus"},
         "targets":[{"expr":"topk(10, sum by (pod_name) (rate(kepler_container_joules_total{mode=\"dynamic\"}[5m])))","legendFormat":"{{pod_name}}"}]}
      ]
    }

---
# Grafana admin password, synced from Bitwarden (`grafana-admin-password`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-password
