apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    demo: false
    title: "Bakuran Sosyal Dashboard"
  services.yaml: |
    - Cluster Services:
        - Prometheus:
            href: http://192.168.2.82:30909
            description: Metrics and monitoring
            icon: prometheus
        - Grafana:
            href: https://grafana.bismigel.dev
            description: Dashboards
            icon: grafana
        - Kubernetes API:
            href: https://192.168.2.82:6443
            description: k3s API Server
            icon: kubernetes
        - Homepage:
            href: http://192.168.2.82:30080
            description: This dashboard
    - Downloads:
        - qBittorrent:
            href: http://192.168.2.81:30081
            description: Torrent downloads
    - Media:
        - Jellyfin:
            href: http://192.168.2.81:30096
            description: Media server with QSV transcoding
            icon: jellyfin
        - Prowlarr:
            href: http://192.168.2.81:30069
            description: Indexer manager for Sonarr/Radarr
        - Sonarr:
            href: http://192.168.2.81:30089
            description: TV show management
        - Radarr:
            href: http://192.168.2.81:30078
            description: Movie management
        - Bazarr:
            href: http://192.168.2.81:30067
            description: Subtitle management
    - Observability:
        - OTel Collector:
            href: http://192.168.2.82:8889/metrics
            description: OpenTelemetry metrics
            icon: otel
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    showNodes: true
    showPods: true
  resources.yaml: |
    cpu: true
    memory: true
    disk: /
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
  bookmarks.yaml: "[]"
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
  proxmox.yaml: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      initContainers:
        - name: seed-config
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              cp -r /cm/. /config/ 2>/dev/null
              chown -R 1000:1000 /config 2>/dev/null || true
          volumeMounts:
            - { name: cm, mountPath: /cm }
            - { name: config, mountPath: /config }
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "192.168.2.82:30080,localhost:3000,homepage.homepage.svc.cluster.local:3000"
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests: { memory: 64Mi, cpu: 20m }
            limits: { memory: 512Mi }
      volumes:
        - name: cm
          configMap:
            name: homepage
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
