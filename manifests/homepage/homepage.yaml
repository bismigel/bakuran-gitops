apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    demo: false
    title: "Bakuran Sosyal Dashboard"
    theme: dark
    layout:
      Admin:
        icon: mdi-shield-account
        style: row
        columns: 4
      Media:
        icon: mdi-movie-open
        style: row
        columns: 4
      Photos:
        icon: mdi-image-multiple
        style: row
        columns: 2
      Infrastructure:
        icon: mdi-server
        style: row
        columns: 3
  services.yaml: |
    - Admin:
        - ArgoCD:
            href: https://argocd.bismigel.dev
            description: GitOps / cluster apps
            icon: argocd
        - Grafana:
            href: https://grafana.bismigel.dev
            description: Dashboards (incl. Homelab Power)
            icon: grafana
        - Prometheus:
            href: https://prometheus.bismigel.dev
            description: Metrics and alerts
            icon: prometheus
        - Longhorn:
            href: https://longhorn.bismigel.dev
            description: Storage
            icon: longhorn
        - ZeroClaw:
            href: https://agent.bismigel.dev
            description: Homelab AI agent
            icon: robot
    - Media:
        - Jellyfin:
            href: https://jellyfin.bismigel.dev
            description: Media server (QSV transcoding)
            icon: jellyfin
        - Sonarr:
            href: https://sonarr.bismigel.dev
            description: TV show management
            icon: sonarr
        - Radarr:
            href: https://radarr.bismigel.dev
            description: Movie management
            icon: radarr
        - Prowlarr:
            href: https://prowlarr.bismigel.dev
            description: Indexer manager
            icon: prowlarr
        - Bazarr:
            href: https://bazarr.bismigel.dev
            description: Subtitles
            icon: bazarr
        - qBittorrent:
            href: https://qbittorrent.bismigel.dev
            description: Torrent downloads
            icon: qbittorrent
        - SABnzbd:
            href: https://sabnzbd.bismigel.dev
            description: Usenet downloads
            icon: sabnzbd
    - Photos:
        - Immich:
            href: https://immich.bismigel.dev
            description: Photo library (MacBook storage)
            icon: immich
    - Infrastructure:
        - Kubernetes API:
            href: https://192.168.2.82:6443
            description: k3s API server
            icon: kubernetes
        - Homepage:
            href: https://homepage.bismigel.dev
            description: This dashboard
        - Status:
            href: https://status.bismigel.dev
            description: Public status page
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    showNodes: true
    showPods: true
  resources.yaml: |
    cpu: true
    memory: true
    disk: /
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: long
  bookmarks.yaml: |
    - Repos:
        - bakuran-gitops:
            - abbr: BG
              href: https://github.com/bismigel/bakuran-gitops
        - bakuran-infra:
            - abbr: BI
              href: https://github.com/bismigel/bakuran-infra
        - media-mcp:
            - abbr: MM
              href: https://github.com/bismigel/media-mcp
    - Services:
        - Cloudflare Zero Trust:
            - abbr: CF
              href: https://one.dash.cloudflare.com
        - ArgoCD:
            - abbr: AR
              href: https://argocd.bismigel.dev
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
  proxmox.yaml: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      initContainers:
        - name: seed-config
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              cp -r /cm/. /config/ 2>/dev/null
              chown -R 1000:1000 /config 2>/dev/null || true
          volumeMounts:
            - { name: cm, mountPath: /cm }
            - { name: config, mountPath: /config }
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "192.168.2.82:30080,127.0.0.1:30080,localhost:30080,homepage.homepage.svc:3000,homepage.homepage.svc.cluster.local:3000,homepage.bismigel.dev"
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests: { memory: 64Mi, cpu: 20m }
            limits: { memory: 512Mi }
      volumes:
        - name: cm
          configMap:
            name: homepage
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
spec:
  ingressClassName: nginx
  rules:
    - host: homepage.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
