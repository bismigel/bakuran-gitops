# ArgoCD cluster registration for calamansi-intel (.81, Intel). Applied to the
# *sitaw-amd* ArgoCD (the single control plane). Credentials are NOT committed —
# create the service account + token on calamansi-intel, then fill this in and
# apply it on sitaw-amd:
#
#   # on calamansi-intel (.81):
#   kubectl -n kube-system create sa argocd-manager
#   kubectl create clusterrolebinding argocd-manager-role \
#     --clusterrole=cluster-admin --serviceaccount=kube-system:argocd-manager
#   kubectl apply -f - <<'YAML'
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: argocd-manager-token
#     namespace: kube-system
#     annotations: { kubernetes.io/service-account.name: argocd-manager }
#   type: kubernetes.io/service-account-token
#   YAML
#   # token = $(kubectl -n kube-system get secret argocd-manager-token -o jsonpath='{.data.token}' | base64 -d)
#   # ca    = $(kubectl -n kube-system get secret argocd-manager-token -o jsonpath='{.data.ca\.crt}')
#
#   # on sitaw-amd (.82):
#   kubectl -n argocd apply -f clusters/calamansi-intel.yaml   # after filling token/ca
apiVersion: v1
kind: Secret
metadata:
  name: cluster-calamansi-intel
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    lab: calamansi-intel
type: Opaque
stringData:
  name: calamansi-intel
  server: https://192.168.2.81:6443
  config: |
    {"bearerToken":"<REDACTED-see-local-notes>","tlsConfig":{"insecure":true}}
