# Production's root: the app-of-apps for THIS cluster.
#
# Why clusters/<name>/ instead of one shared root: a cluster only sees the paths
# its own root names, so an environment-specific Application can never leak into
# another cluster by sitting in a directory that the other root happens to recurse.
# Before this, the old bootstrap Application recursed all of applications/ and quietly
# deployed a *staging* app (status-api-staging) into production.
#
# Applied once per cluster: kubectl apply -f clusters/<name>/root.yaml
#
# Since 2026-10-29 root has TWO sources, so the AppProjects are GitOps too:
#   * clusters/<name>/apps     - one Application per component (recurse)
#   * clusters/<name>/projects - the AppProject objects themselves
#
# The projects used to be `kubectl apply -f clusters/<name>/projects.yaml` by hand,
# and they drifted from git twice in one day - an AppProject is exactly the kind of
# object that quietly stops matching its file. Putting them in root's second source
# (rather than in a child Application) avoids an ordering hole on a cold bootstrap:
# the children need their project to exist, and a child that creates the project its
# siblings need is a race. root is in project `default` on purpose, so it can create
# them: a project that can create AppProjects could create any project anyway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: http://forgejo.forgejo.svc.cluster.local:3000/bismigel/bakuran-gitops.git
      targetRevision: main
      path: clusters/prod/apps
      directory:
        recurse: true
    - repoURL: http://forgejo.forgejo.svc.cluster.local:3000/bismigel/bakuran-gitops.git
      targetRevision: main
      path: clusters/prod/projects
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # ArgoCD adds `pre-delete-finalizer.argocd.argoproj.io[/cleanup]` finalizers to
  # any child Application whose manifests contain a PreDelete hook (e.g. longhorn).
  # Those finalizers can't be removed by a sync, so without this the app-of-apps
  # sees the child as perpetually OutOfSync and re-syncs it in a loop.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
