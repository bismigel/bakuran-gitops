apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.12.0
    helm:
      # ArgoCD applies a Helm chart's crds/ by default (skipCrds defaults false).
      # NOTE: `includeCrds` is NOT an ArgoCD Application field — it was silently
      # dropped by the controller, which made the `root` app read OutOfSync.
      values: |
        # Bitwarden Secrets Manager provider needs the SDK server as a sidecar
        # service (HTTPS on :9998). It uses cert-manager for its serving cert
        # (cert-manager is installed on this cluster).
        bitwarden-sdk-server:
          enabled: true
        # Requests only, sized from observed usage (2026-10-28).
        resources: { requests: { cpu: 10m, memory: 64Mi } }
        certController: { resources: { requests: { cpu: 10m, memory: 64Mi } } }
        webhook: { resources: { requests: { cpu: 10m, memory: 48Mi } } }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The SecretStore/ClusterSecretStore CRDs are >256KB, which breaks the
      # client-side "last-applied-configuration" annotation. Use SSA.
      - ServerSideApply=true
