apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-crds
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: prod
  source:
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent-crds
    targetRevision: 0.7.9
    helm:
      releaseName: kagent-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      # agents.kagent.dev is larger than 262144 bytes once annotated, which is the limit for client-side
      # apply; the API rejects it and the controller then crashloops because one of its informers never
      # becomes available. Server-side apply has no such limit.
      - ServerSideApply=true
