apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duwende
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: http://forgejo.forgejo.svc.cluster.local:3000/bismigel/bakuran-gitops.git
    targetRevision: main
    path: manifests/base/duwende
  destination:
    server: https://kubernetes.default.svc
    namespace: duwende
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
