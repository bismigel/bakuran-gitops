apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: prod
  sources:
    - repoURL: ghcr.io/kagent-dev/kagent/helm
      chart: kagent
      targetRevision: 0.7.9
      helm:
        releaseName: kagent
        valueFiles:
          - $values/manifests/base/kagent/values.yaml
    - repoURL: https://github.com/bismigel/bakuran-gitops.git
      targetRevision: main
      ref: values
    # The tool server the chart's `kagent-tools` subchart used to render (story 10.14). It is a source of THIS Application
    # on purpose: an object that moves from chart-owned to declared-owned must change owner *inside* one sync, or the app
    # that stops rendering it prunes it before the app that declares it applies it - which is exactly what happened on
    # 2026-11-18, with both apps reporting `Synced` throughout.
    - repoURL: https://github.com/bismigel/bakuran-gitops.git
      targetRevision: main
      path: manifests/base/kagent/tool-server
      # NOT `kustomize: {}`: the API drops an empty map on the round trip, so the live Application never matched this
      # file and `root` reported it OutOfSync for ever - which hides real drift behind a cosmetic one. A non-empty block
      # survives, and the annotation it adds is a real one: it says who owns these four objects.
      kustomize:
        commonAnnotations:
          bakuran.dev/owner: story-10.14
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
