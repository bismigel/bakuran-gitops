apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.13.0
    helm:
      values: |
        # Requests only, sized from observed usage (2026-10-28).
        longhornManager: { resources: { requests: { cpu: 20m, memory: 128Mi } } }
        longhornUI: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
        defaultSettings:
          # Two since 2026-11-24. The written rule was "three, not two", and the incident behind
          # it (2026-11-01: three volumes had BOTH replicas on .80+.82, .82's manager died, then
          # .80 lost power, and every pod was unstartable) is real - but its root cause was
          # placement, not count: with `replica-soft-anti-affinity: false` Longhorn was free to
          # put both replicas on two of the three nodes. That setting is `true` since 2026-11-19,
          # so two replicas now means two different nodes.
          #
          # What forced the change: promised bytes, not written bytes. 33 volumes x 3 replicas =
          # 95 replicas promising 374 GiB on disks whose free space is ~1.1 TB, and
          # `patola-thinkcentre:/mnt/data` sat at 1.81x its free space - over the critical
          # `LonghornDiskSchedulingOverCommitted` line, so the next rebuild larger than the
          # shortfall could not be placed and the alarm could not be cleared by moving replicas
          # (tried: Longhorn's scheduler refills the disk with the most free space every time).
          # Two replicas removes a third of the promise and with it the whole class of alarm.
          #
          # The trade is explicit: any single node loss keeps every volume available, and a
          # second failure before the rebuild finishes loses that volume's data. The Immich
          # volumes (the only dataset whose loss is not accepted) stay at 3, set per volume.
          defaultReplicaCount: 2
        # The chart's pre-upgrade Job is a Helm hook that ArgoCD runs on first
        # install before longhorn-service-account exists -> disable it.
        preUpgradeChecker:
          jobEnabled: false
        persistence:
          # Don't make Longhorn the cluster default; existing PVCs pin
          # storageClassName explicitly and we migrate deliberately.
          defaultClass: false
          # Must match defaultReplicaCount, or a PVC created through the StorageClass gets
          # different redundancy from one created through the UI - the two are one decision in
          # two places, which is why they carry the same comment. Immich does not use this
          # class's default: its claims are created with numberOfReplicas 3 explicitly.
          defaultClassReplicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      # Longhorn mutates its own Setting/ConfigMap resources at runtime;
      # self-heal fights that (API conflicts). Sync on git changes only.
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      # Longhorn CRDs exceed the 262144-byte annotation limit; use SSA.
      - ServerSideApply=true
