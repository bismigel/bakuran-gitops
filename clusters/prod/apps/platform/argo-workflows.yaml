# The runbook execution layer. Installed by Helm, managed by ArgoCD, and independent of it: Argo Workflows does not
# need Argo CD to run, which is why this Application could be replaced by a Flux HelmRelease without touching a
# single WorkflowTemplate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: prod
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 2.0.16
      helm:
        releaseName: argo-workflows
        valueFiles:
          - $values/manifests/base/argo-workflows/values.yaml
    - repoURL: https://github.com/bismigel/bakuran-gitops.git
      targetRevision: main
      ref: values
    # The pane's Role, owned by THIS Application: the chart no longer renders one (server.rbac.create=false), so the
    # replacement must be created and pruned by the same sync that removes the old one - otherwise one app deletes it
    # before the other applies it, which is the failure the kagent tool server had on 2026-11-18.
    - repoURL: https://github.com/bismigel/bakuran-gitops.git
      targetRevision: main
      path: manifests/base/argo-workflows/server-rbac
      kustomize:
        commonAnnotations:
          bakuran.dev/owner: story-7.5
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
