# The runbook execution layer. Installed by Helm, managed by ArgoCD, and independent of it: Argo Workflows does not
# need Argo CD to run, which is why this Application could be replaced by a Flux HelmRelease without touching a
# single WorkflowTemplate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: prod
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 2.0.16
      helm:
        releaseName: argo-workflows
        valueFiles:
          - $values/manifests/base/argo-workflows/values.yaml
    - repoURL: git@github.com:bismigel/bakuran-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
