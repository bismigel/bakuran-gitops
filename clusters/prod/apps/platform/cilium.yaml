apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.20.3
    helm:
      releaseName: cilium
      values: |
        # The API VIP (kube-vip), not a node IP. Cilium uses this only to reach the
        # API for registration and config; with a node IP here, any agent that
        # restarted while that node was down could never reinitialise - even though
        # etcd and the API had survived on the other two.
        # Rehearsed in bakuran-infra/staging 2026-10-28: rollout to Running in ~20s,
        # a running agent tolerates losing the VIP, a cold start waits for it
        # (kube-vip is hostNetwork, so it starts without CNI).
        k8sServiceHost: 192.168.2.100
        k8sServicePort: "6443"
        # Requests only, sized from observed usage (2026-10-28).
        # **Phase A of the egress-gateway work (story 10.10, 2026-11-11).**
        #
        # Cilium's own documentation says the egress gateway feature requires both BPF masquerading and the kube-proxy
        # replacement. This enables them; nothing consumes the feature yet, so this change is judged on one thing only:
        # **every Service behaves exactly as it did under kube-proxy.**
        #
        # Rollback: set this back to "false" and bpf.masquerade back to false, and ArgoCD returns the cluster to IPVS.
        # kube-proxy is still running and still owns NodePort binding, so the two overlap during the transition — which
        # is why the order is Cilium first and kube-proxy removal second, never the other way round.
        kubeProxyReplacement: "true"
        # iptables masquerade -> BPF. Required by the egress gateway, and the reason the LoadBalancer VIP path (8.6) may
        # behave differently afterwards: it is the masquerade step that gave those packets a `world` identity.
        bpf:
          masquerade: true
        # The edge lock, preserved. kube-proxy runs with `nodeport-addresses=127.0.0.1/32` so NodePorts are only
        # reachable from a local cloudflared. Cilium replaces kube-proxy, so it has to inherit the same restriction or
        # the tunnel's NodePort targets silently become LAN-reachable.
        extraConfig:
          nodeport-addresses: "127.0.0.1/32"
        # **No `hostPort` block, deliberately.** This Cilium agent has no hostPort flag at all
        # (`cilium-agent --help | grep -c hostport` = 0): hostPort in this cluster is served by the **portmap CNI
        # plugin** — k3s's CNI multiplexer links it in `bakuran-infra/modules/k3s.nix`, and Jellyfin's LAN path depends
        # on it. Adding a chart key the agent does not know is how agents refuse to start, so the path is verified after
        # the rollout instead of configured here.
        # Chart default is maxUnavailable: 2 - on a 3-node cluster that means two
        # CNI agents down simultaneously. One at a time.
        updateStrategy:
          type: RollingUpdate
          rollingUpdate: { maxUnavailable: 1 }
        routingMode: tunnel
        tunnelProtocol: vxlan
        ipv4:
          enabled: true
        ipv6:
          enabled: false
        ipam:
          mode: kubernetes
        cni:
          customConf: true
          configMap: cilium-cni-config
          confPath: /etc/cni/net.d
          binPath: /opt/cni/bin
        prometheus:
          enabled: true
        # Envoy is a separate DaemonSet. Without its own prometheus endpoint the
        # chart's cilium-envoy Service is still annotated for scraping, so the
        # target sits at up=0 and TargetDown fires forever.
        envoy:
          prometheus:
            enabled: true
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9962"
          prometheus.io/path: "/metrics"
        hubble:
          enabled: true
          relay:
            enabled: true
            # Requests only, sized from observed usage (2026-10-28).
            resources: { requests: { cpu: 10m, memory: 64Mi } }
          ui:
            enabled: false
        operator:
          replicas: 1
          # Requests only, sized from observed usage (2026-10-28).
          resources: { requests: { cpu: 20m, memory: 128Mi } }
          # Operator metrics (:9963). The host firewall must allow the port —
          # see modules/base.nix in bakuran-infra.
          prometheus:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # Apply ignoreDifferences to the *sync* as well, not just the diff. Without it a
      # sync would rewrite the three Secrets with freshly generated certs and leave
      # hubble holding a CA nobody else trusts.
      - RespectIgnoreDifferences=true
  # The Cilium chart generates its own CA and leaf certificates with Helm's
  # `genCA`/`genSignedCert` on every render. `helm template` has no cluster access, so
  # `lookup` cannot find the existing Secret and the chart emits *different random
  # certificates each time* — so the live Secrets never match the rendered ones and the
  # Application sits OutOfSync forever.
  #
  # What that cost (2026-10-30): `homelab-smoke` compares every Application's sync
  # status, so a permanent OutOfSync on `cilium` failed the smoke test and paged
  # "SmokeTestFailed on sitaw-amd" every 15 minutes. The alert was right; the cause was
  # a diff that can never converge.
  #
  # Ignoring `/data` is correct rather than papering over: Cilium's operator performs
  # the actual rotation, and the chart's copy only matters at bootstrap. Metadata still
  # compares, so deleting the Secret is still noticed and recreated.
  ignoreDifferences:
    - group: ""
      kind: Secret
      namespace: kube-system
      name: cilium-ca
      jsonPointers: ["/data"]
    - group: ""
      kind: Secret
      namespace: kube-system
      name: hubble-server-certs
      jsonPointers: ["/data"]
    - group: ""
      kind: Secret
      namespace: kube-system
      name: hubble-relay-client-certs
      jsonPointers: ["/data"]
