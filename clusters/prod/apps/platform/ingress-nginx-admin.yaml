apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-admin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          # Separate trust zone for admin/browser surfaces. The Cloudflare
          # tunnel will point admin hostnames at this loopback NodePort.
          # REQUIRED, not preferred. With a soft rule both replicas landed on
          # sitaw-amd, so 'two replicas' protected against a pod crash and not
          # against losing that node - and the connector on the other host had
          # no endpoint left to reach (found 2026-10-28).
          # maxSurge/maxUnavailable 1 so a rollout still progresses when only
          # two nodes are schedulable: the old pod leaves and frees its node.
          # The class itself is owned by the edge-config app (manifests/base/edge/), so
          # this release must NOT try to create IngressClass/nginx - it would fight
          # the public controller for the same object and sit OutOfSync forever.
          ingressClassResource:
            enabled: false
            # The controller advertises this as --controller-class, and it must match
            # IngressClass/nginx-admin.spec.controller. At the chart default
            # (k8s.io/ingress-nginx) BOTH controllers claimed BOTH classes, so every
            # admin hostname 404'd behind Access (2026-10-28).
            controllerValue: k8s.io/ingress-nginx-admin
          ingressClass: nginx-admin
          replicaCount: 2
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 1
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      # instance, not name: both releases are called 'ingress-nginx', so
                      # matching on name made each controller block the other and left one
                      # replica permanently Pending (4 pods, 3 nodes).
                      app.kubernetes.io/instance: ingress-nginx-admin
                      app.kubernetes.io/component: controller
          config:
            # The origin is loopback-only; cloudflared is the only client.
            use-forwarded-headers: "true"
          service:
            # **Pinned so the tunnel can target it** (2026-11-12, story 10.10). Public hostnames reach the ingress
            # through a NodePort on loopback, which works only because kube-proxy keeps NodePorts off the LAN with
            # `nodeport-addresses=127.0.0.1/32` — and that flag does not translate to Cilium: measured in a throwaway VM,
            # with it set under kube-proxy replacement NodePort answered 000 on loopback *and* on the node address.
            #
            # A pinned ClusterIP takes NodePort out of the tunnel path, so the public edge stops depending on a
            # datapath detail. `clusterIP` is a create-time field, but this is the value it already has — read from the
            # live Service before writing it.
            #
            # **`type: ClusterIP` since 2026-11-12** — the NodePort is gone because nothing uses it any more: both tunnel
            # connectors were retargeted to this address and verified. That removes the last thing kube-proxy
            # replacement would have broken (Cilium does not honour `nodeport-addresses`, measured) and shrinks the
            # surface: no NodePort range listening on any node.
            clusterIP: 10.43.15.7
            type: ClusterIP
            enableHttps: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx-admin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
