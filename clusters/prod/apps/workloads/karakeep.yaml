# Karakeep now renders from base + overlay, like media/books/monitoring: the
# workload definition is cluster-agnostic, the hostname and the Ollama endpoint
# are prod facts. See manifests/overlays/prod/karakeep.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karakeep
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: http://forgejo.forgejo.svc.cluster.local:3000/bismigel/bakuran-gitops.git
    targetRevision: main
    path: manifests/overlays/prod/karakeep
  destination:
    server: https://kubernetes.default.svc
    namespace: karakeep
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
