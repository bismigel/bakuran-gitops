apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-gpu-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: git@github.com:bismigel/bakuran-gitops.git
    targetRevision: main
    path: manifests/intel-gpu-plugin
  destination:
    # The plugin runs on calamansi-intel only (nodeSelector), but device plugins
    # conventionally live in kube-system.
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
