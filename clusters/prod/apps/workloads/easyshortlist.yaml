# EasyShortlist — Phase B: the Application only.
#
# Everything it needs already exists: the namespace with PSA `restricted`
# (manifests/base/namespaces/psa.yaml), the project's source and destination entries
# (clusters/prod/projects/projects.yaml), and ArgoCD's read credential for the private repository
# (manifests/base/external-secrets/argocd-repos.yaml). `root` recurses this directory, so the file
# alone is the change - there is no kustomization to edit.
#
# Deliberately NOT here: the backup CronJob's Barman/ScheduledBackup plugin, a Longhorn recurring
# backup for its volume, or an entry in `bakuran-infra`'s `backup-apps.nix`. The app holds candidate
# PII (CVs), and the estate's generic backup paths would copy candidate rows into every backup target.
# The app carries its own encrypted, non-candidate backup job instead.
#
# Alerts and their runbook page are a follow-up: `gitops` CI requires each alert's runbook_url to
# resolve to a page *and* an anchor, so they land together, not with this.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: easyshortlist
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: http://forgejo.forgejo.svc.cluster.local:3000/bismigel/easyshortlist.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: easyshortlist
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The namespace comes from namespaces/psa.yaml (with its PSA labels), not CreateNamespace.
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # Without this the sync re-applies the ignored fields and the next comparison flips back to OutOfSync.
      - RespectIgnoreDifferences=true

  # The CNPG operator writes ~50 fields into `Cluster.spec` that no manifest declares (webhook defaults: `wal_level`,
  # `enablePDB`, probes, replication slots, the `inherit`/`connectionLimit` of each managed role). ArgoCD holds
  # coarse ownership of the `postgresql`/`managed` maps on this object, so each default read as an undeclared field
  # and the app sat `OutOfSync/Healthy` on `Cluster/easyshortlist-pg` - pods fine, comparison wrong (2026-11-22).
  #
  # Measured, not guessed: flatten `spec` of the rendered overlay (`kubectl kustomize deploy/k8s/overlays/prod`) and
  # of the live object, diff every leaf path - 55 came back. `/resources/*` is excluded because PR #44 reconciles
  # those. A subtree pointer is used only where nothing inside it is ours; `postgresql/parameters` is listed per key
  # because the autovacuum/logging knobs in deploy/k8s/base/postgres.yaml are declared state and must stay comparable.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /affinity
        - /bootstrap/initdb
        - /enablePDB
        - /failoverDelay
        - /logLevel
        - /maxSyncReplicas
        - /minSyncReplicas
        - /monitoring/disableDefaultQueries
        - /postgresGID
        - /postgresUID
        - /postgresql/parameters/archive_mode
        - /postgresql/parameters/archive_timeout
        - /postgresql/parameters/dynamic_shared_memory_type
        - /postgresql/parameters/full_page_writes
        - /postgresql/parameters/log_destination
        - /postgresql/parameters/log_directory
        - /postgresql/parameters/log_filename
        - /postgresql/parameters/log_rotation_age
        - /postgresql/parameters/log_rotation_size
        - /postgresql/parameters/log_truncate_on_rotation
        - /postgresql/parameters/logging_collector
        - /postgresql/parameters/max_parallel_workers
        - /postgresql/parameters/max_replication_slots
        - /postgresql/parameters/max_worker_processes
        - /postgresql/parameters/shared_memory_type
        - /postgresql/parameters/shared_preload_libraries
        - /postgresql/parameters/ssl_max_protocol_version
        - /postgresql/parameters/ssl_min_protocol_version
        - /postgresql/parameters/wal_keep_size
        - /postgresql/parameters/wal_level
        - /postgresql/parameters/wal_log_hints
        - /postgresql/parameters/wal_receiver_timeout
        - /postgresql/parameters/wal_sender_timeout
        - /postgresql/syncReplicaElectionConstraint
        - /primaryUpdateMethod
        - /probes
        - /replicationSlots
        - /smartShutdownTimeout
        - /startDelay
        - /stopDelay
        - /storage/resizeInUseVolumes
        - /switchoverDelay
      # `jsonPointers` does not expand `*`; these four name every element of a list, so they are jq. Using a
      # wildcard pointer here looks right and silently matches nothing - which is how the first attempt at this
      # left the app `OutOfSync` with the ignore list in place (2026-11-22).
      jqPathExpressions:
        - .spec.managed.roles[].connectionLimit
        - .spec.managed.roles[].inherit
        - .spec.monitoring.customQueriesConfigMap[].key
        - .spec.monitoring.customQueriesConfigMap[].name
