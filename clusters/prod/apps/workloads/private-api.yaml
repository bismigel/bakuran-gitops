apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: private-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    # WHY GITHUB, when every other app of ours clones from Forgejo (ADR 0015): the copy of this repository on Forgejo is a
    # **pull-mirror**, read-only, and its sync from GitHub fails ("failed to update mirror repository", forgejo logs, measured
    # 2026-11-17). Pointing this Application at it deployed the pre-PDB revision and an older image - a regression, not a
    # migration. Fixing it properly is story 14.6: make Forgejo the origin for the app repos and delete their GitHub workflows,
    # which is also why PRs on this repository have been happening on the mirror.
    repoURL: git@github.com:bismigel/private-api.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
