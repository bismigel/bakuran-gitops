# The experiment: VictoriaMetrics single-node in front of the same scrape targets Prometheus uses.
# Why single-node and not the cluster version: the cluster version exists for multi-petabyte federation,
# and at 267k active series one process answers every query. Experience first; scale when honest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-victoriametrics
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: prod
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-metrics-single
    targetRevision: 0.51.0
    helm:
      releaseName: lab-vm
      values: |
        server:
          retentionPeriod: 14d
          persistentVolume:
            enabled: true
            size: 10Gi
            storageClassName: local-path
          nodeSelector:
            kubernetes.io/hostname: patola-thinkcentre
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
          # VictoriaMetrics can scrape by itself: the same vmagent code is compiled in, so this one pod
          # is both scraper and store and there is no second component to explain.
          extraArgs:
            promscrape.config: /etc/vm-scrape/scrape.yml
          extraVolumes:
            - name: scrape
              configMap:
                name: vm-scrape-config
          extraVolumeMounts:
            - name: scrape
              mountPath: /etc/vm-scrape
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-metrics
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
