# Image digests and Prometheus rules: a manifest, a script or a workflow. A docs-only PR has nothing to prove here.
name: gitops-ci

on:
  pull_request:
    paths:
      - "manifests/**"
      - "clusters/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "install/**"

permissions:
  contents: read

# No push trigger: a squash merge lands exactly the content the PR already proved, so the post-merge run
# repeated a check that had just passed (story 13.2 measured 61 post-merge runs against 37 PR runs).
# guard-main.yml still runs on every push, so a direct push to main is still caught.
#
# A fixup push cancels the run it superseded instead of paying for both. GitHub bills a minimum of one minute
# per job, so a review conversation with five pushes used to cost five runs of every workflow. Only pull-request
# runs cancel; a push to main always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user yamllint
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          sudo curl -sSfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v2.51.0/prometheus-2.51.0.linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/prometheus-2.51.0.linux-amd64/promtool /usr/local/bin/promtool

      - name: YAML lint
        run: python3 -m yamllint -c .yamllint manifests clusters

      - name: Kubernetes schema validation
        run: |
            find manifests clusters -name '*.yaml' ! -name 'values.yaml' -print0 |
              xargs -0 kubeconform -strict -ignore-missing-schemas -summary

      - name: Prometheus rule validation
        # `promtool check config` also validates files the config refers to, including the
        # in-cluster service-account token used by kubernetes_sd_configs. CI is not in the
        # cluster, so provide a placeholder: we are checking that the config *parses*, not
        # that a token exists.
        run: |
          sudo mkdir -p /var/run/secrets/kubernetes.io/serviceaccount
          echo "ci-placeholder" | sudo tee /var/run/secrets/kubernetes.io/serviceaccount/token >/dev/null
          .github/scripts/check-prometheus-rules.sh

      # Two documents with the same kind/namespace/name are not "an extra rule":
      # the API server keeps the last one and the file still reads as if both apply.
      # That is how the qBittorrent ingress policy vanished when a second
      # `allow-status-api` was added for SABnzbd (2026-11-02) - the file looked
      # correct, the cluster had one policy, and status-api's qBittorrent check
      # timed out with nothing to point at.
      - name: No duplicate kind/namespace/name
        run: .github/scripts/check-duplicate-objects.sh

      # Every overlay must actually RENDER. Linting raw YAML cannot catch the bugs
      # that actually reached the cluster this week: a kustomization-level
      # `namespace:` that rewrote kube-vip out of kube-system, `commonLabels`
      # mutating an immutable Deployment selector, and a volume index that clobbered
      # an init container's emptyDir. All three were found by ArgoCD at sync time —
      # i.e. in production — because CI only ever validated the files as written.
      - name: Render every kustomization (and validate the rendered output)
        run: |
            set -euo pipefail
            curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
              | tar -xz -C /tmp kustomize
            sudo install /tmp/kustomize /usr/local/bin/kustomize

            mapfile -t dirs < <(find manifests clusters -name kustomization.yaml -printf '%h\n' | sort -u)
            # An empty list means the tree moved: fail loudly, never pass silently.
            if [ "${#dirs[@]}" -eq 0 ]; then
              echo "ERROR: no kustomization.yaml found under manifests/ or clusters/ — did the tree move?" >&2
              exit 1
            fi
            echo "rendering ${#dirs[@]} kustomization(s)"
            fail=0
            for d in "${dirs[@]}"; do
              if ! out="$(kustomize build "$d" 2>&1)"; then
                echo "::error::kustomize build failed: $d"
                echo "$out" | sed 's/^/    /'
                fail=1
                continue
              fi
              # Empty output is a broken overlay, not a small one.
              if [ -z "$out" ]; then
                echo "::error::kustomize build produced nothing: $d"
                fail=1
                continue
              fi
              printf '%s\n' "$out" | kubeconform -strict -ignore-missing-schemas -summary -output pretty || fail=1
            done
            exit "$fail"

      # Free, local, and no paid GitHub feature: GitHub's own secret scanning on
      # private repos is Advanced Security; gitleaks is one binary.
      - name: Secret scanning
        run: |
            set -euo pipefail
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
              | tar -xz -C /tmp gitleaks
            sudo install /tmp/gitleaks /usr/local/bin/gitleaks
            gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose

      # A tag is a mutable pointer: the registry can repoint `:3.20` at different
      # code and the next pull runs it. Digests cannot move. On 2026-10-30 44 of 71
      # references in the cluster were tag-only; these manifests were pinned and this
      # check stops them drifting back. Chart-provided images never appear here, so
      # they are out of scope (the chart's appVersion pins them).
      - name: Image digests
        run: .github/scripts/check-image-digests.sh .

      # The check above validates the SHAPE of a digest. A well-formed but wrong one
      # passes it and only fails at pull time as ImagePullBackOff - which on a node whose
      # only egress is the tunnel is indistinguishable from a network outage. Three times
      # in one night (2026-11-03/04) a digest was edited by hand and broke: padded out from
      # a 12-char imageID, mistyped by one character, and prefixed `sha256:sha256:`.
      # The registry is the only authority on whether a digest exists, so ask it:
      # HEAD /v2/<repo>/manifests/<digest>, where 404 is the only hard failure.
      - name: Image digests exist
        run: python3 .github/scripts/verify-image-digests.py .

      # Policy on the RENDERED manifests, encoding mistakes this lab actually made.
      - name: Manifest policy (conftest/OPA)
        run: |
            set -euo pipefail
            curl -sSfL https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz \
              | tar -xz -C /tmp conftest
            sudo install /tmp/conftest /usr/local/bin/conftest
            mapfile -t dirs < <(find manifests clusters -name kustomization.yaml -printf '%h\n' | sort -u)
            [ "${#dirs[@]}" -gt 0 ] || { echo "ERROR: no kustomizations found"; exit 1; }
            fail=0
            for d in "${dirs[@]}"; do
              kustomize build "$d" > /tmp/rendered.yaml 2>/dev/null || { echo "::error::build failed: $d"; fail=1; continue; }
              conftest test /tmp/rendered.yaml --policy policy --all-namespaces || {
                echo "::error::policy check failed for $d"; fail=1; }
            done
            exit "$fail"
