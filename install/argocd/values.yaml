global:
  domain: argocd.bismigel.dev
configs:
  cm:
    create: false
  secret:
    createSecret: false
  params:
    server.insecure: true

# Resource sizing comes from the 6h cAdvisor peak of each workload on this
# cluster, times roughly 2 for headroom. Before this, all 17 pods in the
# namespace were QoS BestEffort: first to be evicted under memory pressure,
# and first to be starved under CPU contention — on the component the whole
# GitOps loop depends on.
#
# One deliberate exception: no CPU limits on the redis-ha pods. See
# "CPU limits and quorum members" in README.md — a CPU limit on a sentinel or
# on the split-brain detector turns scheduling jitter into a failover.
controller:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
        # 1Gi was enough for 42 Applications. Adding the runbook Application (72 WorkflowTemplates) pushed
        # the controller into OOMKilled on 2026-11-15: it holds every object of every app in memory, so this
        # limit tracks the size of the estate, not the size of the cluster.
        memory: 2Gi
server:
  replicas: 2
  # A drain must never take both replicas: with no PDB the eviction API may remove them in
  # one drain, taking down the API the estate is managed through at the exact moment someone
  # is draining a node (found by audit, 2026-11-04).
  pdb:
    enabled: true
    minAvailable: 1
  # Required, not preferred. homelab-context ADR-0008: placement is a preference unless
  # correctness demands a pin; two ArgoCD servers on one node is one server with extra steps.
  # Until now the spread was luck (kubectl get pods -o wide, 2026-11-04).
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
          topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    ingressClassName: nginx-admin
    hostname: argocd.bismigel.dev
    path: /
    tls: false
repoServer:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: repo-server
          topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
applicationSet:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
notifications:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
dex:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

redis-ha:
  enabled: true
  # The redis-ha chart reads tolerations at the top level, not under redis /
  # haproxy. Three replicas with required host anti-affinity on a three-node
  # cluster only fits if the tainted control-plane node is tolerated.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  redis:
    # requests only for CPU: a CFS quota here throttles the server while it is
    # syncing or saving, and a throttled replica reads as a failed replica to
    # sentinel. Memory limits stay, they are what eviction needs.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  sentinel:
    # Sentinel must answer within down-after-milliseconds. Wall-clock fairness
    # from CFS throttling is indistinguishable from a dead master, so it gets
    # requests and a memory limit, never a CPU limit.
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
  splitBrainDetection:
    # This is the container that decides a node should rejoin, and it was at
    # 45-82% throttled periods with a 100m limit while the Redis pods were
    # restarting. Requests raised so the scheduler knows it is not free.
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
  haproxy:
    # Three HAProxy pods have required anti-affinity on three nodes. A surge
    # pod cannot schedule until an old pod leaves, so the default 25% surge
    # deadlocks the rollout. Replace one pod at a time instead.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
