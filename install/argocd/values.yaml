global:
  domain: argocd.bismigel.dev
configs:
  # argocd-cm was bootstrap-owned (raw install.yaml) and its data was hand-patched: nothing in this
  # repository declared `resource.customizations.*` or `resource.exclusions`, so a rebuild reproduced
  # none of it. Helm owns it now because an ArgoCD local account can only be declared there, and an
  # account that exists only after a hand-patch is the drift this estate keeps writing ADRs against.
  # The data below is the live ConfigMap verbatim (verified 2026-11-23, `kubectl -n argocd get cm
  # argocd-cm -o jsonpath='{.data}'`); anything added by hand must move here or the next upgrade drops it.
  cm:
    create: true
    accounts.mcp-readonly: apiKey, login
    # An ExternalSecret that failed to reconcile is NOT an outage and must not read as one.
    # Bitwarden's API stalls roughly 5% of calls (measured 2026-11-27: 237 calls in 40 minutes,
    # ~10s then an error, no burst). ESO retries with backoff and the target Secret keeps its
    # previous values, so the workload keeps running - but ArgoCD's built-in health check reads
    # the Ready condition alone and called the whole Application Degraded, which is how
    # media-setup (18 refs) and easyshortlist-secrets (15 refs) reported false Degraded for days.
    # A stall reads Progressing; only a Ready condition that is false for another reason is
    # Degraded. What replaces the lost signal is ExternalSecretNotSyncing in
    # manifests/base/monitoring/rules/alerting.yaml (2h of a false Ready condition), because
    # "retrying" and "stuck" look identical from here.
    #
    # No standard library: `obj`, `ipairs` and `.status` are all this needs, and enabling
    # resource.customizations.useOpenLibs.* is a separate security decision.
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {}
      if obj.status == nil or obj.status.conditions == nil then
        hs.status = "Progressing"
        hs.message = "waiting for the first sync"
        return hs
      end
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "Ready" then
          if c.status == "True" then
            hs.status = "Healthy"
            hs.message = c.message or "SecretSynced"
            return hs
          end
          if c.reason == "SecretSyncedError" then
            hs.status = "Progressing"
            hs.message = "reconcile failed, retrying; the Secret still holds the last synced values: " .. (c.message or "")
            return hs
          end
          hs.status = "Degraded"
          hs.message = c.message or c.reason
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = "no Ready condition yet"
      return hs
    resource.customizations.ignoreResourceUpdates.all: |
      jsonPointers:
        - /status
    resource.customizations.ignoreResourceUpdates.ConfigMap: |
      jqPathExpressions:
        # Ignore the cluster-autoscaler status
        - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
        # Ignore the annotation of the legacy Leases election
        - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
    resource.customizations.ignoreResourceUpdates.Endpoints: |
      jsonPointers:
        - /metadata
        - /subsets
    resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
      jqPathExpressions:
        - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
        - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
        - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
    resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
      jqPathExpressions:
        - '.metadata.annotations."notified.notifications.argoproj.io"'
        - '.metadata.annotations."argocd.argoproj.io/refresh"'
        - '.metadata.annotations."argocd.argoproj.io/hydrate"'
        - '.operation'
    resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
      jqPathExpressions:
        - '.metadata.annotations."notified.notifications.argoproj.io"'
    resource.customizations.ignoreResourceUpdates.autoscaling_HorizontalPodAutoscaler: |
      jqPathExpressions:
        - '.metadata.annotations."autoscaling.alpha.kubernetes.io/behavior"'
        - '.metadata.annotations."autoscaling.alpha.kubernetes.io/conditions"'
        - '.metadata.annotations."autoscaling.alpha.kubernetes.io/metrics"'
        - '.metadata.annotations."autoscaling.alpha.kubernetes.io/current-metrics"'
    resource.customizations.ignoreResourceUpdates.discovery.k8s.io_EndpointSlice: |
      jsonPointers:
        - /metadata
        - /endpoints
        - /ports
    resource.exclusions: |
      ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
      - apiGroups:
        - ''
        - discovery.k8s.io
        kinds:
        - Endpoints
        - EndpointSlice
      ### Internal Kubernetes resources excluded reduce the number of watched events
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      ### Intermediate Certificate Request excluded reduce the number of watched events
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
  # Read-only RBAC for the MCP server account. `applications, get` is the only
  # verb that earns its place: it covers sync status, health, managed resources
  # and the app's own spec. No `sync`, no `update`, no `delete` — ArgoCD stays a
  # read surface for agents, and a deploy remains a merged pull request. There is
  # deliberately no `accounts, get`: nothing the MCP does needs to read account
  # records, so it does not get the permission.
  rbac:
    policy.csv: |
      p, role:mcp-readonly, applications, get, */*, allow
      p, role:mcp-readonly, applicationsets, get, */*, allow
      p, role:mcp-readonly, clusters, get, *, allow
      p, role:mcp-readonly, repositories, get, *, allow
      p, role:mcp-readonly, projects, get, *, allow
      p, role:mcp-readonly, logs, get, */*, allow
      g, mcp-readonly, role:mcp-readonly
  secret:
    createSecret: false
  params:
    server.insecure: true

# Resource sizing comes from the 6h cAdvisor peak of each workload on this
# cluster, times roughly 2 for headroom. Before this, all 17 pods in the
# namespace were QoS BestEffort: first to be evicted under memory pressure,
# and first to be starved under CPU contention — on the component the whole
# GitOps loop depends on.
#
# One deliberate exception: no CPU limits on the redis-ha pods. See
# "CPU limits and quorum members" in README.md — a CPU limit on a sentinel or
# on the split-brain detector turns scheduling jitter into a failover.
controller:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      # 1Gi fit 42 Applications. The runbook Application added 72 WorkflowTemplates and pushed the
      # controller into OOMKilled (exit 137) on 2026-11-15: it holds every object of every app in
      # memory, so this limit tracks the size of the estate, not the size of the cluster.
      #
      # 2Gi covered 47 Applications but not 47 plus 72 WorkflowTemplates: replica 0 reached 25 restarts, all
      # OOMKilled, and its shard stopped reconciling. That is why the runbooks Application showed "Running"
      # forever with 72 resources OutOfSync while every manifest in it was valid - a crashing controller and a slow
      # sync look identical from outside.
      #
      # 4Gi. If this stops being enough the answer is fewer objects per controller (split the WorkflowTemplates
      # onto their own shard), not another doubling.
      memory: 4Gi
server:
  replicas: 2
  # A drain must never take both replicas: with no PDB the eviction API may remove them in
  # one drain, taking down the API the estate is managed through at the exact moment someone
  # is draining a node (found by audit, 2026-11-04).
  pdb:
    enabled: true
    minAvailable: 1
  # Required, not preferred. homelab-context ADR-0008: placement is a preference unless
  # correctness demands a pin; two ArgoCD servers on one node is one server with extra steps.
  # Until now the spread was luck (kubectl get pods -o wide, 2026-11-04).
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
          topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    # OFF on purpose: the Ingress for argocd.bismigel.dev is owned by manifests/base/argocd-ha/ingress.yaml
    # (the `argocd-ha` Application, selfHeal: true). One owner per object (ADR 0011) - and here the two
    # owners would disagree: a Helm-rendered Ingress would be overwritten by the one in git, and if the Helm
    # one won it could carry `backend-protocol: HTTPS`, which 502s against `server.insecure: true` above.
    # The `argocd-ha` copy is the one that survives a rebuild, so it is the one that stays.
    enabled: false
    ingressClassName: nginx-admin
    hostname: argocd.bismigel.dev
    path: /
    tls: false
repoServer:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: repo-server
          topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
applicationSet:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
notifications:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
dex:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

redis-ha:
  enabled: true
  # The redis-ha chart reads tolerations at the top level, not under redis /
  # haproxy. Three replicas with required host anti-affinity on a three-node
  # cluster only fits if the tainted control-plane node is tolerated.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  redis:
    # requests only for CPU: a CFS quota here throttles the server while it is
    # syncing or saving, and a throttled replica reads as a failed replica to
    # sentinel. Memory limits stay, they are what eviction needs.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  sentinel:
    # Sentinel must answer within down-after-milliseconds. Wall-clock fairness
    # from CFS throttling is indistinguishable from a dead master, so it gets
    # requests and a memory limit, never a CPU limit.
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
  splitBrainDetection:
    # This is the container that decides a node should rejoin, and it was at
    # 45-82% throttled periods with a 100m limit while the Redis pods were
    # restarting. Requests raised so the scheduler knows it is not free.
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
  haproxy:
    # Three HAProxy pods have required anti-affinity on three nodes. A surge
    # pod cannot schedule until an old pod leaves, so the default 25% surge
    # deadlocks the rollout. Replace one pod at a time instead.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
